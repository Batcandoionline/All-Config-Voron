# PRINTER.CFG - Voron 2.4 StealthChanger 5-Tool Production
# Board: Manta M8P V2 + CM4 | Probe: Cartographer V3 fw6.1.0
# Toolheads: 5x EBB36 V1.2 | Connection: CANBUS
