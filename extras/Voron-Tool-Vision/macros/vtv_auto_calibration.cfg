[vtv_z_probe]
pin: ^PF2
zswitch_x_pos: 68.0       # X position of the endstop switch
zswitch_y_pos: -1.0       # Y position of the endstop switch
zswitch_z_pos: 7.0        # Z position + clearance of the endstop switch
lift_z: 2.0               # Amount to lift Z before moving (mm)
move_speed: 100           # XY movement speed (mm/s)
z_move_speed: 15          # Z movement speed (mm/s)
samples: 5                # Number of probe samples
config_file_path: ~/printer_data/config/Voron 5 Tool/config/toolchanger/readonly-configs/tool_offsets.cfg

[vtv_xy_vision]
server_url: http://127.0.0.1:8085
camera_url: http://127.0.0.1:8080/?action=stream
camera_focus: 0           # Do not auto focus.

[gcode_macro VTV_AUTO_ALIGN]
description: Đặt T0 trên Camera rồi chạy lệnh này. Tự động đo đồng thời Z và XY cho toàn bộ Tool bằng Voron Tool Vision.
gcode:
    # --- BƯỚC 0: Kiểm tra vị trí và Homing ---
    {% if 'xy' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        {action_respond_info("LỖI: Máy chưa được Home. Vui lòng Home và di chuyển T0 lên trên Camera trước khi chạy.")}
        CANCEL_MACRO
    {% endif %}

    # Lấy tọa độ hiện tại làm tâm Camera
    {% set cam_x = printer.toolhead.position.x %}
    {% set cam_y = printer.toolhead.position.y %}
    RESPOND MSG="Đã nhận diện vị trí Camera tại X={cam_x}, Y={cam_y}"

    # Kích hoạt Vision Server
    VTV_XY_SEND_SERVER_CFG

    # --- BƯỚC 1: Lấy mốc gốc (Reference) với T0 ---
    RESPOND MSG="Bắt đầu lấy mốc (Reference) cho Z và XY với T0..."
    T0
    
    # 1.a Lấy mốc Z với T0
    MOVE_TO_ZSWITCH
    PROBE_ZSWITCH SAMPLES=3
    
    # 1.b Lấy mốc XY với T0
    G0 X{cam_x} Y{cam_y} F15000 
    VTV_XY_CALIB_CAMERA
    VTV_XY_FIND_NOZZLE_CENTER
    VTV_XY_SET_ORIGIN

    # --- BƯỚC 2: Đo đồng thời Z và XY cho T1-T4 ---
    {% set tools_to_align = [1, 2, 3, 4] %}
    {% for tool in tools_to_align %}
        RESPOND MSG="Đang đo Z và XY Offset cho T{tool}..."
        T{tool}
        
        # 2.a Đo Z Offset
        MOVE_TO_ZSWITCH
        PROBE_ZSWITCH SAMPLES=3
        
        # 2.b Đo XY Offset
        G0 X{cam_x} Y{cam_y} F15000
        VTV_XY_FIND_NOZZLE_CENTER
        VTV_XY_GET_OFFSET
        
        # 2.c Lưu tất cả kết quả vào cấu hình Tool
        _VTV_SAVE_COMBINED_OFFSETS TOOL={tool}
    {% endfor %}

    # --- BƯỚC 3: Kết thúc ---
    T0
    RESPOND MSG="Hoàn tất căn chỉnh Voron Tool Vision! Vui lòng kiểm tra lại Offset và chạy SAVE_CONFIG."


[gcode_macro _VTV_SAVE_COMBINED_OFFSETS]
description: Macro ẩn dùng để lưu cả Z, X, Y Offset trực tiếp vào cấu hình Tool
gcode:
    {% set TOOL = params.TOOL|string %}
    
    # --- 1. Lưu XY Offset ---
    {% if printer.vtv_xy_vision.last_nozzle_center_successful|default("false")|lower == "true" %}
        {% set x_off = printer.vtv_xy_vision.last_calculated_offset[0] %}
        {% set y_off = printer.vtv_xy_vision.last_calculated_offset[1] %}
        
        SET_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_x_offset VALUE="{x_off}"
        SAVE_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_x_offset
        
        SET_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_y_offset VALUE="{y_off}"
        SAVE_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_y_offset
    {% else %}
        RESPOND MSG="LỖI XY: Không tìm thấy lỗ kim phun cho T{TOOL}."
    {% endif %}
    
    # --- 2. Lưu Z Offset ---
    {% set z_result = printer.vtv_z_probe.probe_results.get(TOOL) %}
    {% if z_result is defined and z_result.suggested_gcode_z_offset is not none %}
        {% set z_off = z_result.suggested_gcode_z_offset %}
        
        SET_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_z_offset VALUE="{z_off}"
        SAVE_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_z_offset
        RESPOND MSG="Thành công T{TOOL}: X={x_off|default('ERR')}, Y={y_off|default('ERR')}, Z={z_off}"
    {% else %}
        RESPOND MSG="LỖI Z: Không lấy được kết quả đo Z cho T{TOOL}."
    {% endif %}
