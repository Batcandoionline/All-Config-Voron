# Bambu A1 silicone-brush cleaning at the measured front-bed station.

# Circular scrub moves require native G2/G3 support.
[gcode_arcs]
resolution: 0.1     # Required for G2/G3 circular scrub

# Measured station geometry for this printer:
# bucket X320/Y-8; brush sweep X277..312 near Y-8; contact Z1.2.
# CLEAN_NOZZLE clamps tunable inputs, homes when required, optionally purges,
# flicks across the brush edge, then performs alternating circular scrubs.
# RESTORE_GCODE_STATE intentionally omits MOVE so it never crosses the bed on
# the way back to the caller's previous XY position.
[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle
gcode:
    {% set wipes      = [[params.WIPES|default(5)|int, 1]|max, 20]|min %}
    {% set clean_temp = [[params.TEMP|default(150)|int, 120]|max, 180]|min %}
    {% set purge_mm   = [[params.PURGE|default(0)|int, 0]|max, 100]|min %}
    {% set purge_t    = [[params.PURGE_TEMP|default(0)|int, 0]|max, 290]|min %}

    {% set bucket_x      = 320.0 %}
    {% set brush_cy      =  -8.0 %}
    {% set flick_x       = 307.0 %}
    {% set scrub_start_x = 277.0 %}
    {% set scrub_width   =  32.0 %}
    {% set circle_r      =   1.5 %}
    {% set clean_z       =   1.2 %}
    {% set safe_z        =  15.0 %}

    {% set ns = namespace(step=0.0) %}
    {% if wipes > 1 %}
        {% set ns.step = scrub_width / (wipes - 1) %}
    {% endif %}

    {% set travel_f = 9000 %}
    {% set z_f      = 1500 %}
    {% set flick_f  = 9000 %}
    {% set snap_f   = 13500 %}
    {% set scrub_f  = 3000 %}

    {% set extruder = printer.toolhead.extruder|default("")|string %}

    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90

    {% if extruder == "" %}
        RESPOND TYPE=error MSG="CLEAN_NOZZLE requires an active tool/extruder; skipping"
        RESTORE_GCODE_STATE NAME=clean_nozzle_state
    {% else %}

    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}

    _SET_LED_STATUS_CLEANING
    M117 Moving to bucket...
    G1 Z{[printer.toolhead.position[2], safe_z]|max} F{z_f}
    G1 X{bucket_x} Y{brush_cy} F{travel_f}

    {% if purge_mm > 0 %}
        {% set actual_pt = [purge_t, clean_temp, 200]|max %}
        M117 Heating to {actual_pt}C to purge old filament...
        M104 S{actual_pt}
        M109 S{actual_pt}
        M117 Purging {purge_mm} mm into bucket...
        M83
        G1 E{purge_mm} F300
        G1 E-2 F2100
        M117 Cooling to {clean_temp}C with max fan...
        M104 S{clean_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={clean_temp}
        M107
        G4 P2000

    {% else %}
        {% if printer[extruder].temperature < clean_temp - 5 %}
            M117 Heating nozzle to {clean_temp}C...
            M104 S{clean_temp}
            M109 S{clean_temp}
        {% endif %}
    {% endif %}

    G1 Z{clean_z} F{z_f}

    M117 Flick {wipes}x...
    {% for i in range(wipes) %}
        G1 Z{clean_z - 0.5} F{z_f}
        G1 X{flick_x} F{flick_f}
        G4 P20
        G1 X{bucket_x} F{snap_f}
        G1 Z{clean_z} F{z_f}
    {% endfor %}

    M117 Circular scrub {wipes} pass...
    {% for i in range(wipes) %}
        {% set x_pos = scrub_start_x + (i * ns.step) %}
        G1 X{x_pos} Y{brush_cy} F{travel_f}
        G2 X{x_pos} Y{brush_cy} I{circle_r} J0 F{scrub_f}
        G3 X{x_pos} Y{brush_cy} I{circle_r} J0 F{scrub_f}
    {% endfor %}

    G1 X{bucket_x} F{travel_f}
    G1 Z{safe_z} F{z_f}
    M117 Nozzle clean; ready to probe

    _SET_LED_STATUS_READY
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    {% endif %}

# XY bucket park used during PRINT_START. Call it only after the full G28;
# it retains a Z10 clearance while crossing to the front station.
[gcode_macro _CLEAN_NOZZLE_PARK]
description: Safely park nozzle in the bucket
gcode:
    {% set safe_z = 10 %}
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}
    G0 Z{safe_z} F3000
    G0 X320 Y-8.0 F9000
    M117 Nozzle parked at bucket

# Manual maintenance wrapper. Purge hot, cool to the cleaning temperature,
# then reuse the measured flick-and-scrub sequence.
[gcode_macro PURGE_AND_CLEAN]
description: Purge old filament and clean nozzle: purge -> cool down -> flick -> scrub
gcode:
    {% set purge_mm   = [[params.PURGE|default(15)|int, 0]|max, 100]|min %}
    {% set purge_temp = [[params.PURGE_TEMP|default(200)|int, 0]|max, 290]|min %}
    {% set clean_temp = [[params.TEMP|default(150)|int, 120]|max, 180]|min %}
    {% set wipes      = [[params.WIPES|default(5)|int, 1]|max, 20]|min %}

    _SET_LED_STATUS_CLEANING
    CLEAN_NOZZLE TEMP={clean_temp} WIPES={wipes} PURGE={purge_mm} PURGE_TEMP={purge_temp}
    _SET_LED_STATUS_READY
