# ToolVision — machine-specific report-only XYZ measurement canary
#
# This machine uses both the physical PF2 microswitch and Cartographer Touch for
# report-only Z comparison. Camera XY remains available only after an attended
# setup. ToolVision never writes production offsets automatically.

[tool_vision]
pin: ^PF2
state_file: ~/printer_data/config/Generated-Data/ToolVision/state.json
result_file: ~/printer_data/config/Generated-Data/ToolVision/results.json

# KTC Easy clears active-tool state after a nested G-code error. On this machine
# INITIALIZE_TOOLCHANGER has been verified to recover from the physically
# detected tool without selecting or moving to another tool. ToolVision still
# verifies active state before it attempts to restore T0.
toolchanger_recovery_gcode:
  INITIALIZE_TOOLCHANGER

# The single visible Mainsail entry. All prompt helpers remain hidden.
[gcode_macro TOOL_VISION]
description: Open the ToolVision setup, calibration and result panel
gcode:
  _TOOL_VISION_UI_MAIN

[gcode_macro _TOOL_VISION_UI_MAIN]
gcode:
  {% set tv = printer.tool_vision %}
  {% set switch = "ready" if tv.switch_ready else "not setup" %}
  {% set cartographer = "ready" if tv.cartographer_touch_ready else "not setup" %}
  RESPOND TYPE=command MSG="action:prompt_begin ToolVision Z measurements"
  RESPOND TYPE=command MSG="action:prompt_text Report only | Physical switch: {switch} | Cartographer Touch: {cartographer}"
  RESPOND TYPE=command MSG="action:prompt_button Measure Z - Physical switch|_TOOL_VISION_UI_CONFIRM_Z_SWITCH|warning"
  RESPOND TYPE=command MSG="action:prompt_button Measure Z - Cartographer Touch|_TOOL_VISION_UI_CONFIRM_Z_CARTOGRAPHER|warning"
  RESPOND TYPE=command MSG="action:prompt_button Latest results|_TOOL_VISION_UI_RESULTS|info"
  RESPOND TYPE=command MSG="action:prompt_button Advanced setup|_TOOL_VISION_UI_ADVANCED_SETUP|primary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Close|RESPOND TYPE=command MSG=action:prompt_end|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_ADVANCED_SETUP]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin ToolVision advanced setup"
  RESPOND TYPE=command MSG="action:prompt_text Mount T0 and home XYZ before teaching. Camera calibration and status are advanced actions."
  RESPOND TYPE=command MSG="action:prompt_button Camera XY station|_TOOL_VISION_UI_CONFIRM_CAMERA|primary"
  RESPOND TYPE=command MSG="action:prompt_button Calibrate camera XY|_TOOL_VISION_UI_CONFIRM_XY|warning"
  RESPOND TYPE=command MSG="action:prompt_button Physical switch station|_TOOL_VISION_UI_CONFIRM_SWITCH|warning"
  RESPOND TYPE=command MSG="action:prompt_button Cartographer Touch station|_TOOL_VISION_UI_CONFIRM_CARTOGRAPHER|warning"
  RESPOND TYPE=command MSG="action:prompt_button Status|_TOOL_VISION_UI_RUN ACTION=STATUS|info"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_MAIN|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CALIBRATE]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin ToolVision calibration"
  RESPOND TYPE=command MSG="action:prompt_text Printer must be idle and homed. ToolVision heats each tool to 150 C, measures, repeats T0 for Z drift evidence, then turns all tool heaters off."
  RESPOND TYPE=command MSG="action:prompt_button Camera XY|_TOOL_VISION_UI_CONFIRM_XY|warning"
  RESPOND TYPE=command MSG="action:prompt_button Z - Physical switch|_TOOL_VISION_UI_CONFIRM_Z_SWITCH|warning"
  RESPOND TYPE=command MSG="action:prompt_button Z - Cartographer Touch|_TOOL_VISION_UI_CONFIRM_Z_CARTOGRAPHER|warning"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_MAIN|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_CAMERA]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Confirm camera setup"
  RESPOND TYPE=command MSG="action:prompt_text T0 nozzle must be clean, visibly near image center and have collision-free room for the 0.5 mm learning pattern."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Teach camera|_TOOL_VISION_UI_RUN ACTION=SETUP_CAMERA|warning"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_SWITCH]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Confirm switch setup"
  RESPOND TYPE=command MSG="action:prompt_text T0 must be centered above an open switch, close enough to trigger within 10 mm. Verify pin polarity and the vertical path first."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Teach switch|_TOOL_VISION_UI_RUN ACTION=SETUP_SWITCH|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_CARTOGRAPHER]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Confirm Cartographer setup"
  RESPOND TYPE=command MSG="action:prompt_text Requires the current Cartographer3D plugin, a saved Touch model and one sensor fixed to the shuttle. Verify every tool keeps the documented 2.6-3.0 mm coil-to-nozzle clearance. The printer moves to bed_mesh zero_reference_position."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Teach Cartographer|_TOOL_VISION_UI_RUN ACTION=SETUP_CARTOGRAPHER|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_XY]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Confirm XY calibration"
  RESPOND TYPE=command MSG="action:prompt_text This performs toolchanges, camera motion and automatic heating. Results are not applied."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Run XY|_TOOL_VISION_UI_RUN ACTION=CALIBRATE_XY|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_Z_SWITCH]
gcode:
  {% set tv = printer.tool_vision %}
  {% set tools = "T" ~ (tv.tool_numbers|join(", T")) if tv.tool_numbers else "unavailable" %}
  {% set position = tv.switch_position %}
  RESPOND TYPE=command MSG="action:prompt_begin Confirm Z - Physical switch"
  {% if position %}
    RESPOND TYPE=command MSG="action:prompt_text SWITCH | T{tv.reference_tool} reference | {tools} | 150 C | X{position[0]|round(3)} Y{position[1]|round(3)} Z{position[2]|round(3)} | Ready: {tv.switch_ready} | Report only; values are candidates, not deltas to add."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text SWITCH | T{tv.reference_tool} reference | {tools} | 150 C | Station not setup | Report only; values are candidates, not deltas to add."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_MAIN|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Run Z - Physical switch|_TOOL_VISION_UI_RUN ACTION=CALIBRATE_Z_SWITCH|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_Z_CARTOGRAPHER]
gcode:
  {% set tv = printer.tool_vision %}
  {% set tools = "T" ~ (tv.tool_numbers|join(", T")) if tv.tool_numbers else "unavailable" %}
  {% set position = tv.cartographer_touch_position %}
  RESPOND TYPE=command MSG="action:prompt_begin Confirm Z - Cartographer Touch"
  {% if position %}
    RESPOND TYPE=command MSG="action:prompt_text CARTOGRAPHER_TOUCH | T{tv.reference_tool} reference | {tools} | 150 C | X{position[0]|round(3)} Y{position[1]|round(3)} Z{position[2]|round(3)} | Ready: {tv.cartographer_touch_ready} | Report only; values are candidates, not deltas to add."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text CARTOGRAPHER_TOUCH | T{tv.reference_tool} reference | {tools} | 150 C | Station not setup | Report only; values are candidates, not deltas to add."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_MAIN|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Run Z - Cartographer Touch|_TOOL_VISION_UI_RUN ACTION=CALIBRATE_Z_CARTOGRAPHER|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_CONFIRM_XYZ]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Confirm XYZ calibration"
  RESPOND TYPE=command MSG="action:prompt_text This performs all camera moves, Z contacts, toolchanges and automatic heating. Keep the emergency stop available. Results are not applied."
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Run XYZ|_TOOL_VISION_UI_RUN ACTION=CALIBRATE_XYZ|error"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_RESULTS]
gcode:
  {% set tv = printer.tool_vision %}
  {% set mode = tv.last_result_mode|default('', true)|upper %}
  {% set method = "Physical switch" if tv.last_result_method == "switch" else ("Cartographer Touch" if tv.last_result_method == "cartographer_touch" else "Camera XY") %}
  RESPOND TYPE=command MSG="action:prompt_begin ToolVision latest results"
  {% if tv.results %}
    {% if "Z" in mode %}
      RESPOND TYPE=command MSG="action:prompt_text Mode: {mode} | Method: {method} | Status: {tv.last_session_status} | T{tv.reference_tool} return Z drift: {('%.4f'|format(tv.reference_z_drift)) if tv.reference_z_drift is not none else 'n/a'} mm | NOT APPLIED"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text Mode: {mode} | Method: {method} | Status: {tv.last_session_status} | T{tv.reference_tool} return XY drift: {('%.4f'|format(tv.reference_xy_drift)) if tv.reference_xy_drift is not none else 'n/a'} mm | NOT APPLIED"
    {% endif %}
    {% for number in tv.tool_numbers %}
      {% set result = tv.results.get(number|string) %}
      {% if result %}
        {% set x_value = result.get('x') %}
        {% set y_value = result.get('y') %}
        {% set z_value = result.get('z') %}
        {% if "X" in mode and "Z" in mode %}
          RESPOND TYPE=command MSG="action:prompt_text T{number}: X {('%+.4f'|format(x_value)) if x_value is not none else '-'} | Y {('%+.4f'|format(y_value)) if y_value is not none else '-'} | Z {('%+.4f'|format(z_value)) if z_value is not none else '-'} mm"
        {% elif "X" in mode %}
          RESPOND TYPE=command MSG="action:prompt_text T{number}: X {('%+.4f'|format(x_value)) if x_value is not none else '-'} | Y {('%+.4f'|format(y_value)) if y_value is not none else '-'} mm"
        {% else %}
          RESPOND TYPE=command MSG="action:prompt_text T{number}: Z {('%+.4f'|format(z_value)) if z_value is not none else '-'} mm"
        {% endif %}
      {% endif %}
    {% endfor %}
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_text No result is loaded in this Klipper session. Open the console report to read persisted history."
  {% endif %}
  RESPOND TYPE=command MSG="action:prompt_button Console report and history|_TOOL_VISION_UI_RUN ACTION=HISTORY|info"
  RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_MAIN|secondary"
  RESPOND TYPE=command MSG="action:prompt_show"

[gcode_macro _TOOL_VISION_UI_RUN]
gcode:
  {% set action = params.ACTION|default('')|upper %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if action == "STATUS" %}
    TOOL_VISION_STATUS
  {% elif action == "REPORT" %}
    TOOL_VISION_REPORT
  {% elif action == "HISTORY" %}
    TOOL_VISION_REPORT
    TOOL_VISION_HISTORY
  {% elif action == "SETUP_CAMERA" %}
    TOOL_VISION_SETUP_CAMERA
  {% elif action == "SETUP_SWITCH" %}
    TOOL_VISION_SETUP_Z METHOD=SWITCH
  {% elif action == "SETUP_CARTOGRAPHER" %}
    TOOL_VISION_SETUP_Z METHOD=CARTOGRAPHER
  {% elif action == "CALIBRATE_XY" %}
    TOOL_VISION_CALIBRATE MODE=XY VERBOSITY=QUIET
  {% elif action == "CALIBRATE_Z_SWITCH" %}
    TOOL_VISION_CALIBRATE MODE=Z METHOD=SWITCH VERBOSITY=QUIET
  {% elif action == "CALIBRATE_Z_CARTOGRAPHER" %}
    TOOL_VISION_CALIBRATE MODE=Z METHOD=CARTOGRAPHER_TOUCH VERBOSITY=QUIET
  {% elif action == "CALIBRATE_XYZ" %}
    TOOL_VISION_CALIBRATE MODE=XYZ VERBOSITY=QUIET
  {% else %}
    {action_raise_error("Unknown ToolVision panel action")}
  {% endif %}
