############################################################################
# NOZZLE-CLEAN.CFG - Hệ thống vệ sinh đầu in đa giai đoạn (Silicone Pad + Brush)
#
# Thiết kế dành cho Voron 2.4 StealthChanger 5-Tool:
# - Giai đoạn 1: Miếng silicon (Chà xoay tròn G2 Arc + quét zíc-zắc chậm F200 bám dính nhựa)
# - Giai đoạn 2: Chổi kim loại/lông cước (Quét qua lại tốc độ vừa F2000 + flick nhanh F12000)
#
# TẤT CẢ TỌA ĐỘ VÀ THÔNG SỐ CÓ THỂ CẤU HÌNH QUA BIẾN MACRO HOẶC THAM SỐ GỌI:
#   CLEAN_NOZZLE
#   CLEAN_NOZZLE TEMP=150 WIPES=5
#   CLEAN_NOZZLE PURGE=15 PURGE_TEMP=250 TEMP=150
#   CLEAN_NOZZLE SKIP_PAD=1           ; Chỉ chải qua chổi
#   CLEAN_NOZZLE SKIP_BRUSH=1         ; Chỉ chà qua silicon
#   CLEAN_NOZZLE PAD_Z=0.1 BRUSH_Z=-0.8
############################################################################

[gcode_arcs]
resolution: 0.1     # Bắt buộc để thực thi cung tròn G2/G3

[gcode_macro CLEAN_NOZZLE]
description: He thong ve sinh dau in 2 giai doan (Silicone Pad + Brush 2 cap toc do)

# =========================================================================
# 1. THIẾT LẬP AN TOÀN VÀ TỌA ĐỘ TRẠM VỆ SINH
# =========================================================================
variable_safe_z: 15.0               # Do cao Z an toan khi di chuyen (mm)
variable_travel_speed: 12000        # Toc do di chuyen XY nhanh (mm/min)
variable_z_speed: 1500              # Toc do nang/ha truc Z (mm/min)

# Khay hứng nhựa thải / Purge Bucket
variable_bucket_x: 320.0            # Toa do X vi tri xa nhua / do an toan
variable_bucket_y: -8.0             # Toa do Y vi tri xa nhua / do an toan

# =========================================================================
# 2. VÙNG 1: MIẾNG ĐỆM SILICON (SILICONE PAD - XOAY TRÒN & ZÍC-ZẮC)
# =========================================================================
variable_enable_pad: True           # Bat/tat giai doan cha silicon
variable_pad_start_x: 130.0         # Toa do X bat dau vung silicon
variable_pad_end_x: 140.0           # Toa do X ket thuc vung silicon
variable_pad_y_start: 5.0           # Toa do Y duong quet 1
variable_pad_y_mid: 6.0             # Toa do Y duong quet 2
variable_pad_y_end: 8.0             # Toa do Y duong quet 3
variable_pad_z: 0.1                 # Do cao Z tiep xuc tren be mat silicon
variable_pad_swirl_count: 20        # So vong xoay tron G2 tren silicon
variable_pad_arc_offset_i: 0.5      # Do lech tam I cho lenh G2
variable_pad_arc_offset_j: 0.5      # Do lech tam J cho lenh G2
variable_pad_speed: 200             # Toc do quet zic-zac cham bam nhua (mm/min)
variable_pad_swirl_speed: 600       # Toc do xoay tron G2 (mm/min)

# =========================================================================
# 3. VÙNG 2: CHỔI LÔNG KIM LOẠI/CƯỚC (BRUSH - 2 CẤP TỐC ĐỘ)
# =========================================================================
variable_enable_brush: True         # Bat/tat giai doan chai choi
variable_brush_start_x: 164.0       # Toa do X bat dau choi
variable_brush_end_x: 180.0         # Toa do X ket thuc choi
variable_brush_y_med: 3.0           # Toa do Y duong chai toc do vua
variable_brush_y_fast: 1.0          # Toa do Y duong chai toc do cao (flick)
variable_brush_z: -0.8              # Do sau Z ngap vao long choi
variable_brush_hop_z: 0.5           # Do nhac Z khi chuyen giua 2 duong Y
variable_brush_med_passes: 7        # So luot quet qua lai toc do vua
variable_brush_fast_passes: 7       # So luot quet qua lai toc do cao
variable_brush_med_speed: 2000      # Toc do quet chai vua (mm/min)
variable_brush_fast_speed: 12000    # Toc do gat flick nhanh (mm/min)

gcode:
    # ---------------------------------------------------------------------
    # Đọc tham số gọi hoặc lấy giá trị mặc định từ biến macro
    # ---------------------------------------------------------------------
    {% set clean_temp  = params.TEMP|default(150)|int %}
    {% set purge_mm    = params.PURGE|default(0)|int %}
    {% set purge_t     = params.PURGE_TEMP|default(0)|int %}
    {% set wipes       = params.WIPES|default(variable_brush_med_passes)|int %}
    {% set skip_pad    = params.SKIP_PAD|default(0)|int %}
    {% set skip_brush  = params.SKIP_BRUSH|default(0)|int %}

    # Override tọa độ Z nếu được truyền vào
    {% set pad_contact_z   = params.PAD_Z|default(variable_pad_z)|float %}
    {% set brush_contact_z = params.BRUSH_Z|default(variable_brush_z)|float %}

    # KTC là nguồn chân lý để xác định tool vật lý đang được gắn trên shuttle.
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% set extruder    = printer.toolhead.extruder|default("")|string %}

    {% if active_tool < 0 or extruder == "" %}
        {action_raise_error("CLEAN_NOZZLE requires a KTC active tool. Run INITIALIZE_TOOLCHANGER or select T0-T4 first.")}
    {% else %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90

    # Đảm bảo XYZ đã được Home trước khi di chuyển
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}

    _SET_LED_STATUS_CLEANING

    # =====================================================================
    # BƯỚC 1: NÂNG Z AN TOÀN -> DI CHUYỂN VỀ VỊ TRÍ KHAY PURGE
    # =====================================================================
    G1 Z{[printer.toolhead.position[2], variable_safe_z]|max} F{variable_z_speed}
    G1 X{variable_bucket_x} Y{variable_bucket_y} F{variable_travel_speed}

    # =====================================================================
    # BƯỚC 2: XỬ LÝ PURGE ĐÙN NHỰA (NẾU CÓ PURGE > 0)
    # =====================================================================
    {% if purge_mm > 0 %}
        {% set actual_pt = [purge_t, clean_temp, 200]|max %}
        M117 Heating to {actual_pt}C to purge old filament...
        M104 S{actual_pt}
        M109 S{actual_pt}
        M117 Purging {purge_mm} mm into bucket...
        M83
        G1 E{purge_mm} F300
        G1 E-2 F2100
        M82
        M117 Cooling to {clean_temp}C with max fan...
        M104 S{clean_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={clean_temp}
        M107
        G4 P2000
    {% else %}
        {% if printer[extruder].temperature < clean_temp - 5 %}
            M117 Heating nozzle to {clean_temp}C...
            M104 S{clean_temp}
            M109 S{clean_temp}
        {% endif %}
    {% endif %}

    # =====================================================================
    # BƯỚC 3: GIAI ĐOẠN 1 — CHÀ MIẾNG SILICON (SILICONE PAD SWIRL & ZIGZAG)
    # =====================================================================
    {% if variable_enable_pad and skip_pad == 0 %}
        M117 Silicone pad scrubbing...
        # Tiếp cận điểm đầu miếng silicon ở độ cao an toàn
        G1 Z{variable_safe_z} F{variable_z_speed}
        G1 X{variable_pad_start_x} Y{variable_pad_y_start} F{variable_travel_speed}
        # Hạ xuống độ cao tiếp xúc silicon
        G1 Z1.0 F{variable_z_speed}
        G1 Z{pad_contact_z} F600

        # 3 vòng xoay tròn ban đầu
        {% for _ in range(3) %}
            G2 I{variable_pad_arc_offset_i} J{variable_pad_arc_offset_j} F{variable_pad_swirl_speed}
        {% endfor %}

        # Quét zíc-zắc chậm F200 bám dính nhựa thừa
        G1 X{variable_pad_end_x} F{variable_pad_speed}
        G1 Y{variable_pad_y_mid} F{variable_pad_speed}
        G1 X{variable_pad_start_x} F{variable_pad_speed}
        G1 Y{variable_pad_y_end} F{variable_pad_speed}
        G1 X{variable_pad_end_x} F{variable_pad_speed}

        # Chuỗi xoay tròn G2 đa vòng
        {% for _ in range(variable_pad_swirl_count) %}
            G2 I{variable_pad_arc_offset_i} J{variable_pad_arc_offset_j} F{variable_pad_swirl_speed}
        {% endfor %}

        # Nhấc nhẹ Z lên để thoát khỏi mặt silicon
        G1 Z{pad_contact_z + 0.1} F{variable_z_speed}
    {% endif %}

    # =====================================================================
    # BƯỚC 4: GIAI ĐOẠN 2 — CHẢI QUA CHỔI 2 CẤP TỐC ĐỘ (BRUSH MEDIUM & FAST)
    # =====================================================================
    {% if variable_enable_brush and skip_brush == 0 %}
        M117 Brush scrubbing...
        # Di chuyển tới đầu chổi đường 1 (tốc độ vừa)
        G1 Z{[printer.toolhead.position[2], variable_brush_hop_z + 0.5]|max} F{variable_z_speed}
        G1 X{variable_brush_end_x} Y{variable_brush_y_med} F{variable_travel_speed}
        # Hạ vào lông chổi
        G1 Z{brush_contact_z} F{variable_z_speed}

        # Quét qua lại tốc độ vừa (F2000)
        {% for _ in range(wipes) %}
            G1 X{variable_brush_start_x} F{variable_brush_med_speed}
            G1 X{variable_brush_end_x} F{variable_brush_med_speed}
        {% endfor %}

        # Nhấc nhẹ Z, chuyển sang đường chải 2 (tốc độ cao)
        G1 Z{brush_contact_z + variable_brush_hop_z} F{variable_z_speed}
        G1 X{variable_brush_end_x} Y{variable_brush_y_fast} F{variable_travel_speed}
        G1 Z{brush_contact_z} F{variable_z_speed}

        # Gạt flick nhanh (F12000)
        {% for _ in range(variable_brush_fast_passes) %}
            G1 X{variable_brush_start_x} F{variable_brush_fast_speed}
            G1 X{variable_brush_end_x} F{variable_brush_fast_speed}
        {% endfor %}
    {% endif %}

    # =====================================================================
    # BƯỚC 5: HOÀN TẤT VÀ NÂNG Z AN TOÀN
    # =====================================================================
    M400
    G1 Z{variable_safe_z} F{variable_z_speed}
    G1 X{variable_bucket_x} Y{variable_bucket_y} F{variable_travel_speed}
    M117 Nozzle cleared

    _SET_LED_STATUS_READY
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    {% endif %}

############################################################################
# _CLEAN_NOZZLE_PARK - park nozzle in the bucket without wiping
# Called after G28 XY in PRINT_START so ooze falls into the bucket while waiting for the bed to heat.
# Z is not changed; XY only, safe before Z has been homed.
############################################################################

[gcode_macro _CLEAN_NOZZLE_PARK]
description: Safely park nozzle in the bucket
gcode:
    {% set safe_z = printer["gcode_macro CLEAN_NOZZLE"].safe_z|default(10.0)|float %}
    {% set bucket_x = printer["gcode_macro CLEAN_NOZZLE"].bucket_x|default(320.0)|float %}
    {% set bucket_y = printer["gcode_macro CLEAN_NOZZLE"].bucket_y|default(-8.0)|float %}
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}
    G0 Z{safe_z} F3000
    G0 X{bucket_x} Y{bucket_y} F9000
    M117 Nozzle parked at bucket

############################################################################
# PURGE_AND_CLEAN - purge old filament and clean nozzle
#
# Use when old filament must be purged before wiping; call manually from console or another macro.
# PRINT_START defaults to CLEAN_NOZZLE only: wipe at 150 C without purging.
#
# HOW TO CALL:
#   PURGE_AND_CLEAN                     ; purge 15 mm @ 200 C -> wipe @ 150 C
#   PURGE_AND_CLEAN PURGE_TEMP=260      ; purge 15 mm @ 260 C -> wipe @ 150 C
#   PURGE_AND_CLEAN PURGE=20 PURGE_TEMP=250  ; purge 20 mm @ 250 C
############################################################################

[gcode_macro PURGE_AND_CLEAN]
description: Purge old filament and clean nozzle: purge -> cool down -> pad -> brush
gcode:
    {% set purge_mm   = params.PURGE|default(15)|int %}
    {% set purge_temp = params.PURGE_TEMP|default(200)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set wipes      = params.WIPES|default(7)|int %}

    _SET_LED_STATUS_CLEANING
    CLEAN_NOZZLE TEMP={clean_temp} WIPES={wipes} PURGE={purge_mm} PURGE_TEMP={purge_temp}
    _SET_LED_STATUS_READY
