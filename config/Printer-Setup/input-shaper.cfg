# Input shaper fallback and resonance testing.
# Each tool applies its measured shaper from tools/Tn.cfg after pickup.

[input_shaper]
# Safe fallback used before a tool-specific profile is applied.
shaper_type_x: 3hump_ei
shaper_freq_x: 88.4
damping_ratio_x: 0.078
shaper_type_y: 2hump_ei
shaper_freq_y: 58.4
damping_ratio_y: 0.164

[resonance_tester]
accel_chip: adxl345 T4
probe_points: 180, 168, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 5
keep_raw_data: False
show_macros_in_webui: True
timeout: 900
max_freq: 150
dpi: 150
