# Resumable tool-presence crash detection from cekim-git/tool_crash.
# Cartographer is not an input; the filename is retained for compatibility.

[tool_crash]
watchdog_interval: 0.5
watchdog_threshold: 2
ignore_events: probing
home_timeblock: 1.0
crash_gcode:
  _TOOL_CRASH_SAFE_PAUSE
crash_mintime: 0.1

# Pause and retract only. Never move XYZ automatically after a detected crash:
# the tool may be detached, skewed, or obstructing the motion path.
[gcode_macro _TOOL_CRASH_SAFE_PAUSE]
description: Pause an active print after a tool crash without moving XYZ
gcode:
  {% set is_paused = printer.pause_resume.is_paused|default(false) %}
  {% set is_printing = printer.print_stats.state|default("")|lower == "printing" %}

  {% if is_paused %}
    M117 Tool crash - inspect printer
    RESPOND TYPE=error MSG="Tool crash detected while already paused; inspect and secure the tool before RESUME or CANCEL_PRINT"
  {% elif is_printing %}
    {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
    {% set idle_timeout = client.idle_timeout|default(0)|int %}
    {% set extruder = printer.toolhead.extruder|default("")|string %}
    {% set target = printer[extruder].target|float if extruder else 0.0 %}
    {% set restore = true if extruder else false %}

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': target}}"
    {% if idle_timeout > 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
      SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    {% endif %}

    PAUSE_BASE
    {% if printer["gcode_macro _SET_LED_STATUS_PAUSE"] is defined %}
      _SET_LED_STATUS_PAUSE
    {% endif %}
    {% if printer["gcode_macro _CLIENT_RETRACT"] is defined %}
      _CLIENT_RETRACT
    {% endif %}
    M117 Tool crash - inspect printer
    RESPOND TYPE=error MSG="Tool crash detected; print paused without XYZ parking. Inspect and secure the tool before RESUME or CANCEL_PRINT"
  {% else %}
    M117 Tool crash detected
    RESPOND TYPE=error MSG="Tool crash detected outside an active virtual_sdcard print; no shutdown or motion was requested"
  {% endif %}
