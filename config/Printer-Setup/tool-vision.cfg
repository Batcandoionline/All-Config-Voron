    RESPOND TYPE=command MSG="action:prompt_text Current method -> New method: {current} -> Cartographer Touch. This changes the stored default only after teaching succeeds."
    RESPOND TYPE=command MSG="action:prompt_text Requires the current Cartographer3D plugin, a saved Touch model, and one sensor fixed to the shuttle. Verify every tool keeps the documented 2.6-3.0 mm coil-to-nozzle clearance."
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Teach Cartographer Touch|_TOOL_VISION_UI_RUN ACTION=SETUP_CARTOGRAPHER|error"
