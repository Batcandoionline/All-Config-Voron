############################################################################
# TOOL-CALIBRATOR.CFG - Tool-Klipper-Calibration (TKC) Integration
#
# Module tích hợp hệ thống tự động hiệu chuẩn đa đầu phun qua Computer Vision
# và Cartographer Touch V4 / Z Switch.
# Upstream: https://github.com/IDcrazy123/Tool-Klipper-Calibration
############################################################################

[tool_calibrator]
# Daemon thị giác nền chạy trên máy in (cổng 8090)
service_url: http://127.0.0.1:8090

# Endpoint snapshot ảnh tĩnh từ Crowsnest camera-streamer
camera_stream_url: http://127.0.0.1:8080/snapshot.jpg

# Vị trí lưu offset cách ly trong Generated-Data để bảo vệ cấu hình gốc
offsets_config_path: ~/printer_data/config/Generated-Data/tool_offsets.cfg

# Độ cao hành trình an toàn (Safe Z) vượt mọi chướng ngại vật & dock
safe_z: 40.0

# Vận tốc di chuyển (mm/min)
travel_speed: 6000
approach_speed: 1500
z_speed: 600

# Backend đo Z: 'cartographer' (Touch V4) hoặc 'switch' (công tắc PF2)
z_backend: cartographer
reference_tool: 0

# Tọa độ trạm camera đã căn chỉnh (Z=40 là toạ độ hội tụ an toàn của thấu kính)
camera_target_x: 170.0
camera_target_y: 20.0
camera_target_z: 40.0
camera_approach_x: 170.0
camera_approach_y: 45.0

# Tham số lấy mẫu chùm & chống lóa
tolerance_mm: 0.015
centering_samples: 3
sample_delay: 0.08
wiggle_distance: 0.10
wiggle_on_failure: True
max_camera_temp: 100.0

# Macro hooks điều khiển đèn quang học
camera_led_macro_on: _CALIBRATION_CAMERA_LED_ON
camera_led_macro_off: _CALIBRATION_CAMERA_LED_OFF
nozzle_led_macro_off: _CALIBRATION_NOZZLE_LED_OFF
nozzle_led_macro_on: _CALIBRATION_NOZZLE_LED_ON

############################################################################
# MACRO HOOKS ĐIỀU KHIỂN QUANG HỌC & ĐÈN CHIẾU
############################################################################

[gcode_macro _CALIBRATION_CAMERA_LED_ON]
description: Bật đèn chiếu sáng trạm camera khi hiệu chuẩn
gcode:
    # Trạm camera dùng ánh sáng môi trường / đèn buồng in
    # LIGHTS_ON

[gcode_macro _CALIBRATION_CAMERA_LED_OFF]
description: Tắt đèn chiếu sáng trạm camera sau khi đo xong
gcode:
    # No-op

[gcode_macro _CALIBRATION_NOZZLE_LED_OFF]
description: Tắt đèn LED trên đầu phun đang đo để chống lóa sensor camera
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    SET_LED LED=T{tool}_LED RED=0 GREEN=0 BLUE=0 TRANSMIT=1

[gcode_macro _CALIBRATION_NOZZLE_LED_ON]
description: Bật lại đèn LED đầu phun sau khi hoàn thành đo quang học
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    SET_LED LED=T{tool}_LED RED=0.5 GREEN=0.5 BLUE=0.5 TRANSMIT=1

############################################################################
# MACRO VẬN HÀNH TKC (USER COMMANDS)
############################################################################

[gcode_macro TEST_NOZZLE_VISION]
description: Kiểm tra nhanh nhận diện vòi phun tại vị trí hiện tại mà KHÔNG di chuyển
gcode:
    {% set samples = params.SAMPLES|default(3)|int %}
    CALIBRATION_TEST_VISION SAMPLES={samples}

[gcode_macro CENTER_NOZZLE]
description: Tự động căn tâm vòi phun vào giữa camera qua visual servoing
gcode:
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}
    CALIBRATION_CENTER_NOZZLE SAMPLES={samples} WIGGLE={wiggle}

[gcode_macro GOTO_CAMERA_TARGET]
description: Di chuyển đầu in an toàn về trạm camera theo quỹ đạo 3 tầng
gcode:
    CALIBRATION_NAVIGATE STATION=CAMERA

[gcode_macro LEAVE_CALIBRATION_STATION]
description: Thoát khỏi trạm về độ cao hành trình an toàn (Safe Z=40)
gcode:
    CALIBRATION_NAVIGATE STATION=DEPART

[gcode_macro CALIBRATE_ALL_TOOLS]
description: Hiệu chuẩn toàn bộ đầu in T0-T4 (Khuyến nghị thử nghiệm dùng DRY_RUN=1)
gcode:
    {% set calibrate_xy = params.CALIBRATE_XY|default(1)|int %}
    {% set calibrate_z = params.CALIBRATE_Z|default(1)|int %}
    {% set save_config = params.SAVE_CONFIG|default(0)|int %}
    {% set dry_run = params.DRY_RUN|default(1)|int %}
    {% set clean_nozzle = params.CLEAN_NOZZLE|default(0)|int %}
    {% set order = params.ORDER|default("XY_FIRST")|string %}
    {% set samples = params.SAMPLES|default(3)|int %}
    {% set wiggle = params.WIGGLE|default(1)|int %}
    {% set tools = params.TOOLS|default("")|string %}

    {action_respond_info("=== Bắt đầu chạy đo hiệu chuẩn đa đầu in TKC ===")}
    {% if tools != "" %}
        CALIBRATE_TOOL_OFFSETS TOOLS={tools} CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} SAMPLES={samples} WIGGLE={wiggle}
    {% else %}
        CALIBRATE_TOOL_OFFSETS CALIBRATE_XY={calibrate_xy} CALIBRATE_Z={calibrate_z} SAVE_CONFIG={save_config} DRY_RUN={dry_run} CLEAN_NOZZLE={clean_nozzle} ORDER={order} SAMPLES={samples} WIGGLE={wiggle}
    {% endif %}

[gcode_macro CALIBRATE_CAMERA]
description: Đo tỷ lệ quang học mm/pixel (MPP) và ma trận Affine theo hình sao 4 hướng
gcode:
    {% set dist = params.DISTANCE|default(1.0)|float %}
    {action_respond_info("=== Đo tỷ lệ Camera Scale & Ma trận Affine (±%0.2f mm) ===" % (dist))}
    CALIBRATE_CAMERA_SCALE DISTANCE={dist}
