# CRASH-DETECTION-OVERRIDE.CFG — Override START/STOP_CRASH_DETECTION
# Include SAU readonly-configs/crash-detection.cfg — Klipper merge section cùng tên.
# Hỗ trợ cả tool_crash plugin (mới) và tool_probe_endstop (fallback cũ).

# ─────────────────────────────────────────────────────────────────────────
# Override: STOP_CRASH_DETECTION
# ─────────────────────────────────────────────────────────────────────────
# Macro gốc từ readonly-configs/crash-detection.cfg:
# [gcode_macro STOP_CRASH_DETECTION]
#     gcode:
#         {% if printer["tool_probe_endstop"] is defined %}
#             STOP_TOOL_PROBE_CRASH_DETECTION
#         {% endif %}
#
# Patch: Thêm hỗ trợ tool_crash plugin (Cartographer + SexBall)
# ─────────────────────────────────────────────────────────────────────────

[gcode_macro STOP_CRASH_DETECTION]
gcode: 
    # Tool Crash Detection Plugin (cekim-git/tool_crash)
    # Dùng nếu [tool_crash] section được include trong printer.cfg
    {% if printer["gcode_macro STOP_TOOL_CRASH_DETECTION"] is defined %}
        STOP_TOOL_CRASH_DETECTION
    # Fallback: cấu hình cũ (tool_probe_endstop từ [tool_probe] section)
    {% elif printer["tool_probe_endstop"] is defined  %}
        STOP_TOOL_PROBE_CRASH_DETECTION
    {% endif %}


# ─────────────────────────────────────────────────────────────────────────
# Override: START_CRASH_DETECTION
# ─────────────────────────────────────────────────────────────────────────
# Macro gốc từ readonly-configs/crash-detection.cfg:
# [gcode_macro START_CRASH_DETECTION]
#     gcode:
#         {% if printer["tool_probe_endstop"] is defined %}
#             START_TOOL_PROBE_CRASH_DETECTION
#         {% endif %}
#
# Patch: Thêm hỗ trợ tool_crash plugin (Cartographer + SexBall)
# ─────────────────────────────────────────────────────────────────────────

[gcode_macro START_CRASH_DETECTION]
gcode: 
    # Tool Crash Detection Plugin (cekim-git/tool_crash)
    # Dùng nếu [tool_crash] section được include trong printer.cfg
    {% if printer["gcode_macro START_TOOL_CRASH_DETECTION"] is defined %}
        START_TOOL_CRASH_DETECTION
    # Fallback: cấu hình cũ (tool_probe_endstop từ [tool_probe] section)
    {% elif printer["tool_probe_endstop"] is defined  %}
        START_TOOL_PROBE_CRASH_DETECTION
    {% endif %}


# ─────────────────────────────────────────────────────────────────────────
# Notes:
# ─────────────────────────────────────────────────────────────────────────
# 1. File này được include SAU readonly-configs/crash-detection.cfg
#    → Macro [gcode_macro ...] sẽ override định nghĩa gốc (Klipper ~ Jinja merge)
# 
# 2. Logic kiểm tra tự động:
#    - Nếu [tool_crash] đã cài → gcode_macro START_TOOL_CRASH_DETECTION tồn tại
#      → Dùng plugin mới
#    - Nếu không → fallback sang START_TOOL_PROBE_CRASH_DETECTION (cũ)
#
# 3. Cơ chế hoạt động:
#    - PRINT_START gọi START_CRASH_DETECTION (macro này)
#    - Macro chọn lệnh phù hợp + gửi đi
#    - Plugin hoặc cấu hình cũ xử lý
#
# 4. Nếu cần tắt hoàn toàn phát hiện crash:
#    → Comment/xóa [tool_crash] config hoặc [include tool_crash_cartographer.cfg]
#      → Sẽ fallback sang tool_probe_endstop (cũ)
#    → Hoặc set: ignore_events: all (bỏ qua mọi trigger)
