############################################################################
# NOZZLE-CLEAN.CFG - Clean nozzle with Bambu A1 silicone brush
#
# MEASURED BRUSH COORDINATES:
#   brush_ref_x : 277.0, left corner
#   brush_ref_y : -7.0, front corner
#   Bucket      : X=320 Y=-8.0
#
# HOW TO CALL:
#   CLEAN_NOZZLE
#   CLEAN_NOZZLE WIPES=8 TEMP=230 PURGE=15 PURGE_TEMP=260
############################################################################

[gcode_arcs]
resolution: 0.1     # Required for G2/G3 circular scrub

############################################################################
# CLEAN_NOZZLE
# FLOW:
#   1. Home if needed -> safe Z lift -> travel to bucket (X=320 Y=-8.0).
#   2a. [PURGE>0] Heat to purge_temp -> purge filament -> fan down to clean_temp -> 2 s dwell.
#   2b. [PURGE=0] Heat to clean_temp if the nozzle is not hot enough.
#   3. Lower to Z=1.2 mm -> flick WIPES times (X=307 -> X=320) -> circular scrub WIPES positions.
#   4. Snap back to bucket -> raise to Z=15 mm.
############################################################################

[gcode_macro CLEAN_NOZZLE]
description: Clean nozzle
gcode:
    # Params
    {% set wipes      = params.WIPES|default(5)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set purge_mm   = params.PURGE|default(0)|int %}
    {% set purge_t    = params.PURGE_TEMP|default(0)|int %}

    # Internal coordinates
    {% set bucket_x      = 320.0 %}
    {% set brush_cy      =  -8.0 %}
    {% set flick_x       = 307.0 %}
    {% set scrub_start_x = 277.0 %}
    {% set scrub_width   =  32.0 %}
    {% set circle_r      =   1.5 %}
    {% set clean_z       =   1.2 %}
    {% set safe_z        =  15.0 %}

    # Loop step helper logic
    {% set ns = namespace(step=0.0) %}
    {% if wipes > 1 %}
        {% set ns.step = scrub_width / (wipes - 1) %}
    {% endif %}

    # Speeds
    {% set travel_f = 9000 %}
    {% set z_f      = 1500 %}
    {% set flick_f  = 9000 %}
    {% set snap_f   = 13500 %}
    {% set scrub_f  = 3000 %}

    # Active extruder
    {% set extruder = printer.toolhead.extruder|default("")|string %}

    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90

    {% if extruder == "" %}
        RESPOND TYPE=error MSG="CLEAN_NOZZLE requires an active tool/extruder; skipping"
        RESTORE_GCODE_STATE NAME=clean_nozzle_state
    {% else %}

    # Ensure XYZ has been homed.
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}

    # ====================================================================
    # STEP 1: safe Z lift -> travel to bucket
    # ====================================================================
    _SET_LED_STATUS_CLEANING
    M117 Moving to bucket...
    G1 Z{[printer.toolhead.position[2], safe_z]|max} F{z_f}
    G1 X{bucket_x} Y{brush_cy} F{travel_f}

    # ====================================================================
    # STEP 2A: purge old filament (PURGE > 0), nozzle is already at bucket
    #   actual_purge_temp = max(PURGE_TEMP, TEMP, 200)
    #   After purge: M106 max fan -> TEMPERATURE_WAIT <= clean_temp -> M107 -> G4 2s
    # ====================================================================
    {% if purge_mm > 0 %}
        {% set actual_pt = [purge_t, clean_temp, 200]|max %}
        M117 Heating to {actual_pt}C to purge old filament...
        M104 S{actual_pt}
        M109 S{actual_pt}
        M117 Purging {purge_mm} mm into bucket...
        M83
        G1 E{purge_mm} F300
        G1 E-2 F2100
        M82
        M117 Cooling to {clean_temp}C with max fan...
        M104 S{clean_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={clean_temp}
        M107
        G4 P2000

    # ====================================================================
    # STEP 2B: no purge; heat to clean_temp if not hot enough
    # ====================================================================
    {% else %}
        {% if printer[extruder].temperature < clean_temp - 5 %}
            M117 Heating nozzle to {clean_temp}C...
            M104 S{clean_temp}
            M109 S{clean_temp}
        {% endif %}
    {% endif %}

    # ====================================================================
    # STEP 3: lower to clean_z (Z=1.2 mm) over the brush
    # ====================================================================
    G1 Z{clean_z} F{z_f}

    # ====================================================================
    # STEP 4: flick {wipes}x to knock excess filament into the bucket
    #   Dip Z -0.5 mm -> push to X=307 -> dwell 20 ms -> snap back to X=320 -> restore Z
    # ====================================================================
    M117 Flick {wipes}x...
    {% for i in range(wipes) %}
        G1 Z{clean_z - 0.5} F{z_f}
        G1 X{flick_x} F{flick_f}
        G4 P20
        G1 X{bucket_x} F{snap_f}
        G1 Z{clean_z} F{z_f}
    {% endfor %}

    # ====================================================================
    # STEP 5: circular scrub across {wipes} positions x 2 loops (CW then CCW)
    #   X range 277.0 -> 309.0, evenly stepped; each position gets 1 CW + 1 CCW loop.
    # ====================================================================
    M117 Circular scrub {wipes} pass...
    {% for i in range(wipes) %}
        {% set x_pos = scrub_start_x + (i * ns.step) %}
        G1 X{x_pos} Y{brush_cy} F{travel_f}
        G2 X{x_pos} Y{brush_cy} I{circle_r} J0 F{scrub_f}
        G3 X{x_pos} Y{brush_cy} I{circle_r} J0 F{scrub_f}
    {% endfor %}

    # ====================================================================
    # STEP 6: snap back to bucket -> safe Z lift
    # ====================================================================
    G1 X{bucket_x} F{travel_f}
    G1 Z{safe_z} F{z_f}
    M117 Nozzle clean; ready to probe

    _SET_LED_STATUS_READY
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    {% endif %}

############################################################################
# _CLEAN_NOZZLE_PARK - park nozzle in the bucket without wiping
# Called after G28 XY in PRINT_START so ooze falls into the bucket while waiting for the bed to heat.
# Z is not changed; XY only, safe before Z has been homed.
############################################################################

[gcode_macro _CLEAN_NOZZLE_PARK]
description: Safely park nozzle in the bucket
gcode:
    {% set safe_z = 10 %}
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}
    G0 Z{safe_z} F3000
    G0 X320 Y-8.0 F9000
    M117 Nozzle parked at bucket

############################################################################
# PURGE_AND_CLEAN - purge old filament and clean nozzle
#
# Use when old filament must be purged before wiping; call manually from console or another macro.
# PRINT_START defaults to CLEAN_NOZZLE only: wipe at 150 C without purging.
#
# HOW TO CALL:
#   PURGE_AND_CLEAN                     ; purge 15 mm @ 200 C -> wipe @ 150 C
#   PURGE_AND_CLEAN PURGE_TEMP=260      ; purge 15 mm @ 260 C -> wipe @ 150 C
#   PURGE_AND_CLEAN PURGE=20 PURGE_TEMP=250  ; purge 20 mm @ 250 C
############################################################################

[gcode_macro PURGE_AND_CLEAN]
description: Purge old filament and clean nozzle: purge -> cool down -> flick -> scrub
gcode:
    {% set purge_mm   = params.PURGE|default(15)|int %}
    {% set purge_temp = params.PURGE_TEMP|default(200)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set wipes      = params.WIPES|default(5)|int %}

    _SET_LED_STATUS_CLEANING
    CLEAN_NOZZLE TEMP={clean_temp} WIPES={wipes} PURGE={purge_mm} PURGE_TEMP={purge_temp}
    _SET_LED_STATUS_READY
