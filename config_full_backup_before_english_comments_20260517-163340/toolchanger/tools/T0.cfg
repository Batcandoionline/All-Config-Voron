############################################################################
# T0.cfg - Toolhead 0 (EBB36 V1.2) — KTC-Easy / OrcaSlicer Multi-Color
#
# Board  : BIGTREETECH EBB36 V1.2 (STM32G0B1, CAN bus)
# Hotend : TZ V6 2.0  |  Extruder: WW BMG
# Tool   : T0 — tham chiếu gốc (gcode_x/y/z_offset = 0)
#
# Tài liệu chính thức:
#   https://stealthchanger.com/software/ktc-easy/examples/#ebb36-v12-t0-non-tap
############################################################################

############################################################################
# MCU
############################################################################

[mcu EBB0]
canbus_uuid: 441e1484ac41
canbus_interface: can0

############################################################################
# ADXL345 — Input Shaper
############################################################################

[adxl345 T0]
cs_pin: EBB0:PB12
spi_software_sclk_pin: EBB0:PB10
spi_software_mosi_pin: EBB0:PB11
spi_software_miso_pin: EBB0:PB2
axes_map: x,z,-y

############################################################################
# EXTRUDER — WW BMG + TZ V6 2.0
############################################################################

[extruder]
step_pin: EBB0:PD0
dir_pin: !EBB0:PD1
enable_pin: !EBB0:PD2
heater_pin: EBB0:PB13
sensor_pin: EBB0:PA3
sensor_type: Generic 3950

microsteps: 16
rotation_distance: 22.321
gear_ratio: 50:10
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
max_extrude_only_distance: 101

# PID Parameters — sẽ được SAVE_CONFIG cập nhật sau PID_CALIBRATE
# pressure_advance: 0.03  # Calibrate và bỏ comment sau khi đo

############################################################################
# TMC2209
############################################################################

[tmc2209 extruder]
uart_pin: EBB0:PA15
run_current: 0.65
stealthchop_threshold: 0

############################################################################
# FANS
############################################################################

[heater_fan T0_hotend_fan]
pin: EBB0:PA0
heater: extruder
heater_temp: 50.0

[fan_generic T0_part_fan]
pin: EBB0:PA1

############################################################################
# TOOL DEFINITION — KTC-Easy
############################################################################

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_part_fan
detection_pin: ^!EBB0:PB6

# Vị trí dock (nozzle coordinates) — ⚠️ CẦN CĂNH CHỈNH THỰC TẾ
params_park_x: 30.70
params_park_y: 2.3
params_park_z: 343

# T0 là tool tham chiếu → offset luôn = 0
gcode_x_offset: 0
gcode_y_offset: 0
# gcode_z_offset: KHÔNG khai báo ở đây → SAVE_CONFIG tự ghi sau CALIBRATE_ALL_OFFSETS

# Standby temperature khi parked (KTC quản lý tự động sau mỗi dropoff)
params_standby_temp: 150
params_heater_standby_delay: 0.1

# Input Shaper — đo ngày 2026-04-26 bằng ShakeTune AXES_SHAPER_CALIBRATION
# X axis: Best shaper (3HUMP_EI @ 88.4 Hz)
params_input_shaper_freq_x: 88.4
params_input_shaper_type_x: '3hump_ei'
params_input_shaper_damping_ratio_x: 0.078
# Y axis: Best shaper (2HUMP_EI @ 58.4 Hz)
params_input_shaper_freq_y: 58.4
params_input_shaper_type_y: '2hump_ei'
params_input_shaper_damping_ratio_y: 0.164

############################################################################
# NEOPIXEL — 3x WS2812
############################################################################

[neopixel T0_LED]
pin: EBB0:PD3
color_order: GRB
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

############################################################################
# GCODE MACRO T0
############################################################################

[gcode_macro T0]
description: Gắn đầu in T0
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0

############################################################################
# FILAMENT SENSOR
############################################################################

[filament_switch_sensor filament_sensor_T0]
switch_pin: ^EBB0:PB9
pause_on_runout: False
event_delay: 0.5
pause_delay: 0.5
runout_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T0 DURATION=0.5
    RESPOND MSG="[T0] Cảm biến báo hết nhựa — chờ xác nhận..."
insert_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T0 DURATION=0
    RESPOND MSG="[T0] Cảm biến phục hồi — hủy bộ đếm"

[delayed_gcode _FILTER_RUNOUT_T0]
gcode:
    _FILAMENT_RUNOUT_HANDLE T=0
