############################################################################
# CALIBRATION.CFG — Thông số nhiệt độ và Auto Calibration Offsets
# 
# QUY TRÌNH CALIBRATE:
# 1. G28 → QUAD_GANTRY_LEVEL
# 2. XYZ Offset: CALIBRATE_ALL_OFFSETS (official StealthChanger SexBall/SexBolt Probe)
# 3. FIRMWARE_RESTART after SAVE_TOOL_PARAMETER writes offsets
# 4. SAVE_CONFIG
############################################################################

############################################################################
# THÔNG SỐ NHIỆT ĐỘ CALIBRATION
############################################################################

[gcode_macro _THERMAL_CALIBRATION_PARAMS]
description: Hằng số nhiệt độ calibration
variable_nozzle_temp_pla: 210
variable_nozzle_temp_petg: 235
variable_nozzle_temp_calibration: 150  # An toàn cho probe Cartographer
variable_nozzle_temp_abs: 250

variable_bed_temp_pla: 60
variable_bed_temp_petg: 80
variable_bed_temp_calibration: 60  # Phải khớp nhiệt độ bàn khi in thực tế
variable_bed_temp_abs: 100

variable_thermal_stabilize_time_ms: 180000  # 3 phút — ổn định khối hotend + bề mặt bàn
variable_temp_margin_min: 2
variable_temp_margin_max: 5
variable_cartographer_max_safe_temp: 60   # Nhiệt độ sensor Cartographer V3 tối đa
variable_nozzle_temp_for_probe_max: 150   # Không vượt quá ngưỡng này khi probe
gcode:
    # Macro này lưu hằng số nhiệt độ (chỉ tham chiếu, không có lệnh thực thi)

############################################################################
# CẤU HÌNH NHIỆT ĐỘ THEO VẬT LIỆU
############################################################################

[gcode_macro _SET_CALIBRATION_MATERIAL]
description: Chọn vật liệu
gcode:
    {% set material = params.MATERIAL|default("PLA")|string|upper %}
    {% set params_obj = printer["gcode_macro _THERMAL_CALIBRATION_PARAMS"] %}
    
    {% if material == "PLA" %}
        M117 ✅ Vật liệu: PLA | Bàn {params_obj.bed_temp_pla}°C
        SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={params_obj.bed_temp_pla}
    {% elif material == "PETG" %}
        M117 ✅ Vật liệu: PETG | Bàn {params_obj.bed_temp_petg}°C
        SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={params_obj.bed_temp_petg}
    {% elif material == "ABS" %}
        M117 ✅ Vật liệu: ABS | Bàn {params_obj.bed_temp_abs}°C
        SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={params_obj.bed_temp_abs}
    {% else %}
        M117 ❌ Không nhận diện được: {material}. Dùng: PLA / PETG / ABS
    {% endif %}
    M117 Calibration tiếp theo: Nozzle {params_obj.nozzle_temp_calibration}°C + Bàn {params_obj.bed_temp_calibration}°C

############################################################################
# HƯỚNG DẪN CALIBRATION VỚI SEXBALL PROBE
# Tài liệu gốc: stealthchanger.com/calibration/auto_gcode_offsets/
############################################################################

[gcode_macro _SEXBALL_CALIBRATION_GUIDE]
description: Hướng dẫn calibrate XYZ offset giữa các tool bằng SexBall Probe
gcode:
    RESPOND TYPE=echo MSG="╔══════════════════════════════════════════════════════════╗"
    RESPOND TYPE=echo MSG="║        SEXBALL PROBE — CALIBRATE XYZ OFFSET              ║"
    RESPOND TYPE=echo MSG="║     Tài liệu: stealthchanger.com/calibration/            ║"
    RESPOND TYPE=echo MSG="╚══════════════════════════════════════════════════════════╝"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="─── ĐIỀU KIỆN TRƯỚC KHI BẮT ĐẦU ───────────────────────────"
    RESPOND TYPE=echo MSG=" • Tất cả nozzle đã được lau sạch (bẩn → sai offset)"
    RESPOND TYPE=echo MSG=" • T0 đang trên shuttle"
    RESPOND TYPE=echo MSG=" • Máy chưa home: G28 → QUAD_GANTRY_LEVEL → G28 Z"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="─── BƯỚC 0 (CHỈ LÀM 1 LẦN) — ĐO trigger_to_bottom_z ──────"
    RESPOND TYPE=echo MSG=" Mục đích: xác định pretravel của microswitch SexBall"
    RESPOND TYPE=echo MSG=" 1. G0 Z60 F600"
    RESPOND TYPE=echo MSG=" 2. G0 X254.9 Y324 F3000   → di chuyển đến vị trí ball"
    RESPOND TYPE=echo MSG=" 3. Jog Z xuống 1mm → 0.1mm → 0.01mm từng bước"
    RESPOND TYPE=echo MSG=" 4. Dùng tờ giấy mỏng kẹp giữa nozzle và đỉnh ball"
    RESPOND TYPE=echo MSG="    → Khi giấy không kéo được nữa = Z_contact → ghi lại"
    RESPOND TYPE=echo MSG=" 5. Tiếp tục jog 0.01mm/bước, chạy QUERY_ENDSTOPS mỗi bước"
    RESPOND TYPE=echo MSG="    → Khi PF2 chuyển sang TRIGGERED = Z_trigger → ghi lại"
    RESPOND TYPE=echo MSG=" 6. trigger_to_bottom_z = Z_contact − Z_trigger"
    RESPOND TYPE=echo MSG="    Giá trị đã đo (máy này): Z_contact=52.3, Z_trigger=51.4 → trigger_to_bottom_z=0.9"
    RESPOND TYPE=echo MSG=" 7. Điền vào toolchanger-config.cfg:"
    RESPOND TYPE=echo MSG="      [tools_calibrate]"
    RESPOND TYPE=echo MSG="      trigger_to_bottom_z: 0.XX"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="─── BƯỚC 1 — CALIBRATE XYZ OFFSET TẤT CẢ TOOL ────────────"
    RESPOND TYPE=echo MSG=" Mục đích: đo delta XYZ của T1, T2... so với T0 (tham chiếu)"
    RESPOND TYPE=echo MSG=" Chạy:  CALIBRATE_ALL_OFFSETS"
    RESPOND TYPE=echo MSG=" Macro tự động (lặp từng tool):"
    RESPOND TYPE=echo MSG="   T0 → Di chuyển đến ball → Nung 150°C"
    RESPOND TYPE=echo MSG="        → TOOL_LOCATE_SENSOR : ghi vị trí tâm ball = REFERENCE"
    RESPOND TYPE=echo MSG="   T1 → SELECT_TOOL T=1 → Nung 150°C"
    RESPOND TYPE=echo MSG="        → TOOL_LOCATE_SENSOR : ghi vị trí tâm ball = TOOL_POS"
    RESPOND TYPE=echo MSG="        → TOOL_CALIBRATE_TOOL_OFFSET :"
    RESPOND TYPE=echo MSG="             gcode_x_offset = TOOL_POS.x − REFERENCE.x"
    RESPOND TYPE=echo MSG="             gcode_y_offset = TOOL_POS.y − REFERENCE.y"
    RESPOND TYPE=echo MSG="             gcode_z_offset = TOOL_POS.z − REFERENCE.z"
    RESPOND TYPE=echo MSG="        → SAVE_TOOL_PARAMETER → ghi vào SAVE_CONFIG"
    RESPOND TYPE=echo MSG="   (lặp lại cho T2, T3, T4)"
    RESPOND TYPE=echo MSG="   → Cuối: SELECT_TOOL T=0, tắt heater"
    RESPOND TYPE=echo MSG=" Sau khi chạy xong: FIRMWARE_RESTART"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="─── BƯỚC 2 — KIỂM TRA KẾT QUẢ ─────────────────────────────"
    RESPOND TYPE=echo MSG=" Chạy:  CHECK_OFFSETS"
    RESPOND TYPE=echo MSG=" → In ra gcode_x/y/z_offset hiện tại của tất cả tool"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="─── LƯU Ý SAVE_CONFIG ──────────────────────────────────────"
    RESPOND TYPE=echo MSG=" GIỮ NGUYÊN trong SAVE_CONFIG:"
    RESPOND TYPE=echo MSG="   [cartographer scan_model default]  ← coefficients bed mesh"
    RESPOND TYPE=echo MSG="   [extruder] / [extruder1] pid_kp/ki/kd  ← PID đã calibrate"
    RESPOND TYPE=echo MSG="   [cartographer touch_model default]  ← dùng bởi TOUCH_HOME"
    RESPOND TYPE=echo MSG=" TỰ THÊM sau calibrate:"
    RESPOND TYPE=echo MSG="   [tool T1] gcode_x/y/z_offset = ... ← SAVE_TOOL_PARAMETER"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="─── TÓM TẮT LỆNH ───────────────────────────────────────────"
    RESPOND TYPE=echo MSG=" Lần đầu setup:"
    RESPOND TYPE=echo MSG="   G28 → QUAD_GANTRY_LEVEL → G28 Z"
    RESPOND TYPE=echo MSG="   CALIBRATE_ALL_OFFSETS"
    RESPOND TYPE=echo MSG="   FIRMWARE_RESTART"
    RESPOND TYPE=echo MSG=" Kiểm tra: CHECK_OFFSETS"
    RESPOND TYPE=echo MSG="════════════════════════════════════════════════════════════"

############################################################################
# CHECK_OFFSETS — Kiểm tra nhanh gcode_z_offset hiện tại
############################################################################

[gcode_macro CHECK_OFFSETS]
description: Kiểm tra offset các tool
gcode:
    _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Kiểm tra offset các tool
gcode:
    RESPOND MSG="=== KTC Z-OFFSET CHECK ==="
    {% set tool_list = printer.toolchanger.tool_names %}
    {% for tname in tool_list %}
        RESPOND MSG="{tname}: gcode_z_offset = {printer[tname].gcode_z_offset}"
    {% endfor %}
