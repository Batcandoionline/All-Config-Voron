############################################################################
# INPUT-SHAPER.CFG - Resonance Tester and ShakeTune
# 
# MULTI-TOOL: keep a default [input_shaper] section so Klipper loads the
# input_shaper module. KTC-Easy then applies each tool's measured shaper from
# Tools/Tn.cfg in after_change_gcode during every tool change.
#
# RESONANCE TEST PROCEDURE:
# 1. Install the tool to test, then home the printer.
# 2. Change `accel_chip: adxl345 T1` below to the matching Tn.
# 3. Run `AXES_SHAPER_CALIBRATION` and copy the result into Tools/Tn.cfg.
############################################################################

[input_shaper]
# Calibrated production fallback uses T0 values, confirmed by the operator on
# 2026-09-03. Tool changes override it with the active tool's measured profile.
shaper_type_x: mzv
shaper_freq_x: 46.8
damping_ratio_x: 0.113
shaper_type_y: mzv
shaper_freq_y: 30.6
damping_ratio_y: 0.091

[resonance_tester]
accel_chip: adxl345 T4  # Change Tn when testing another tool (T0/T1/.../T4)
probe_points: 180, 168, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/Generated-Data/ShakeTune
number_of_results_to_keep: 5
keep_raw_data: False
show_macros_in_webui: True
timeout: 900    # Enough time for the CM4 to process the graphs
max_freq: 150   # >= the maximum test frequency used by the macro, 134 Hz
dpi: 150        # Use 150 dpi instead of 300; images are 4x smaller and save RAM
