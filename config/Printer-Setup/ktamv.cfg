# kTAMV temporary supervised XY calibration trial
# Upstream: https://github.com/TypQxQ/kTAMV
# Reviewed commit: 72421f2d54da0de8701c4f84449c6e6b7d060301
#
# kTAMV does not calibrate Z and does not persist camera calibration across a
# Klipper restart. Keep ToolVision/Axiscope/tools_calibrate disabled during the
# trial. Run movement commands only with the camera mounted and an operator at
# the printer, ready to use emergency stop.

[ktamv]
nozzle_cam_url: http://127.0.0.1/webcam/?action=snapshot
server_url: http://127.0.0.1:8086
move_speed: 1800
calib_iterations: 1
calib_value: 1.0
send_frame_to_cloud: false
detection_tolerance: 0

[gcode_macro KTAMV_SETUP]
description: Send the current nozzle-camera settings to the kTAMV server
gcode:
  KTAMV_SEND_SERVER_CFG

[gcode_macro KTAMV_STATUS]
description: Report temporary kTAMV camera calibration state
gcode:
  {% if printer.ktamv is defined %}
    RESPOND MSG="kTAMV active: calibrated={printer.ktamv.is_calibrated}, mm_per_pixel={printer.ktamv.mm_per_pixels}, origin={printer.ktamv.camera_center_coordinates}"
    RESPOND MSG="Server port 8086; cloud upload disabled; XY only; calibration resets after Klipper restart"
  {% else %}
    RESPOND TYPE=error MSG="kTAMV is not loaded"
  {% endif %}
