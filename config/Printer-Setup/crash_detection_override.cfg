# KTC compatibility adapter. KTC's readonly macros call these names, while
# this machine uses cekim-git/tool_crash through each tool's detection_pin.

[gcode_macro STOP_CRASH_DETECTION]
description: Disable the installed tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    STOP_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    STOP_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

[gcode_macro START_CRASH_DETECTION]
description: Enable the installed tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    START_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    START_TOOL_PROBE_CRASH_DETECTION
  {% endif %}
