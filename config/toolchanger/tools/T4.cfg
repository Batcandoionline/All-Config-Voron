# T4: EBB36 V1.2, TZ V6 2.0, WW BMG, and measured dock/shaper values.

# EBB36 V1.2 on CAN. UUID is hardware identity; never copy it from another tool.
[mcu EBB4]
canbus_uuid: 28650279df58
canbus_interface: can0

# Toolboard ADXL345 used only when measuring this tool's resonance profile.
[adxl345 T4]
cs_pin: EBB4:PB12
spi_software_sclk_pin: EBB4:PB10
spi_software_mosi_pin: EBB4:PB11
spi_software_miso_pin: EBB4:PB2
axes_map: x,z,-y

# WW BMG extruder with TZ V6 2.0 hotend. rotation_distance is measured per tool;
# PID values remain in printer.cfg SAVE_CONFIG.
[extruder4]
step_pin: EBB4:PD0
dir_pin: !EBB4:PD1
enable_pin: !EBB4:PD2
heater_pin: EBB4:PB13
sensor_pin: EBB4:PA3
sensor_type: Generic 3950

microsteps: 16
rotation_distance: 22.059
gear_ratio: 50:10
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
max_extrude_only_distance: 101

# Toolboard extruder driver; SpreadCycle is forced with threshold 0.
[tmc2209 extruder4]
uart_pin: EBB4:PA15
run_current: 0.6
stealthchop_threshold: 0

# PA0 is the heatbreak fan; PA1 is the independently controlled part fan.
[heater_fan T4_hotend_fan]
pin: EBB4:PA0
heater: extruder4
heater_temp: 50.0

[fan_generic T4_part_fan]
pin: EBB4:PA1

# KTC definition. detection_pin is the physical tool-presence sensor. Dock
# coordinates and shaper values below were measured on the real machine.
[tool T4]
tool_number: 4
extruder: extruder4
fan: T4_part_fan
detection_pin: ^!EBB4:PB6

params_park_x: 321.5
params_park_y: 2.6
params_park_z: 343

# Production XYZ offsets are stored once in printer.cfg SAVE_CONFIG.
params_standby_temp: 150
params_heater_standby_delay: 0.1

# Apply this tool's measured X/Y resonance profile immediately after pickup.
params_input_shaper_freq_x: 54.0
params_input_shaper_type_x: 'mzv'
params_input_shaper_damping_ratio_x: 0.080
params_input_shaper_freq_y: 35.2
params_input_shaper_type_y: 'mzv'
params_input_shaper_damping_ratio_y: 0.108

# Three WS2812 LEDs: front status pixel plus two hotend illumination pixels.
[neopixel T4_LED]
pin: EBB4:PD3
color_order: GRB
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

# Public slicer/toolchange command. KTC owns the actual selection sequence.
[gcode_macro T4]
description: Mount toolhead T4
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=4

# PB9 filament switch with a two-stage 0.5 s debounce. The delayed handler
# pauses only when this is the currently mounted tool.
[filament_switch_sensor filament_sensor_T4]
switch_pin: ^EBB4:PB9
pause_on_runout: False
event_delay: 0.5
pause_delay: 0.5
runout_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T4 DURATION=0.5
    RESPOND MSG="[T4] Filament sensor reports runout; waiting for confirmation..."
insert_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T4 DURATION=0
    RESPOND MSG="[T4] Filament sensor recovered; canceling debounce counter"

[delayed_gcode _FILTER_RUNOUT_T4]
gcode:
    _FILAMENT_RUNOUT_HANDLE T=4
