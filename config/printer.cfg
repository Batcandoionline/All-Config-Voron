# Mainsail web interface; do not edit.
[include mainsail.cfg]

# StealthChanger KTC-Easy readonly: toolchanger, homing, macros pickup/dropoff
# Do not edit files inside readonly-configs/.
[include toolchanger/readonly-configs/toolchanger-include.cfg]

# Printer-Setup modules. Hardware values and SAVE_CONFIG data are kept in their
# original owners; calibration and crash routing are grouped by workflow.
[include Printer-Setup/calibration-probe.cfg]
[include Printer-Setup/ktamv.cfg]
[include Printer-Setup/tool_calibrator/tool_calibrator_macros.cfg]
[include Printer-Setup/tool_calibrator/safe_staging_macros.cfg]
[include Printer-Setup/tool-calibrator.cfg]
[include Printer-Setup/tool_offsets.cfg]
[include Printer-Setup/hardware.cfg]
[include Printer-Setup/fans-leds.cfg]
[include Printer-Setup/input-shaper.cfg]
[include Printer-Setup/nozzle-clean.cfg]
[include Printer-Setup/prime-lines.cfg]
[include Printer-Setup/print-macros.cfg]
[include Printer-Setup/filament-dryer.cfg]
[include Printer-Setup/test-speed.cfg]
[include Printer-Setup/tool-temp-bench.cfg]

# Tool crash uses each tool's detection_pin. It is included after KTC-Easy so
# its START/STOP compatibility macros override the readonly defaults.
[include Printer-Setup/tool-crash.cfg]

# kTAMV remains available for supervised comparison. TKC is installed with
# Z calibration blocked until its Cartographer workflow is physically validated.
#####################################################################

[printer]
kinematics: corexy
max_velocity: 350
max_accel: 7000
max_z_velocity: 80       # Measured production value; change only with attended toolchange tests.
max_z_accel: 1000        # Measured production value; preserve during config refactors.
square_corner_velocity: 5.0

