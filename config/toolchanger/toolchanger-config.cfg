############################################################################
# TOOLCHANGER-CONFIG.CFG - StealthChanger system configuration
# Include this file last so it can override default settings.
############################################################################

# [rounded_path] - Smooth corners to reduce jerk during tool changes
[rounded_path]
resolution: 0.2   # Arc resolution in mm
replace_g0: False # Do not enable; this can be unsafe for this setup.

# [force_move] - Required by KTC-Easy
[force_move]
enable_force_move: True

############################################################################
# [toolchanger] - Main parameters for tool-change motion
############################################################################
[toolchanger]
t_command_restore_axis: Z

# params_dropoff_path / params_pickup_path:
# Relative path from the dock position (params_park_x/y/z).
# x/y/z are offsets, f is a speed multiplier, verify enables the OptoTap check.

# Dropoff path: place the tool into the dock.
params_dropoff_path: [{'y':9.5 ,'z':3}, {'y':9.5, 'z':1.5}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-12, 'y':0}, {'z':-12, 'y':16}]

# Pickup path: pick the tool up from the dock.
params_pickup_path: [{'z':-12, 'y':16}, {'z':-12, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':1.5}, {'y':9.5 ,'z':3}]

before_change_gcode:
  # Set the LED state to toolchange.
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] is defined %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
  {% endif %}
  _SET_TOOL_LED T={tool.tool_number} STATE=toolchange

# dropoff_gcode: override to update LEDs as soon as the tool clicks into the dock.
dropoff_gcode:
  {% set x = tool.params_park_x|float %}
  {% set y = tool.params_park_y|float %}
  {% set z = tool.params_park_z|float %}
  {% set fast = tool.params_fast_speed|float %}
  {% set path = tool.params_dropoff_path %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  RESPOND TYPE=echo MSG='Dropping off {tool.name}'
  G90
  G0 Z{ [cur_z+1.0, max_z]|min } F{fast}
  ROUNDED_G0 Y={tool.params_safe_y} D=20 F={fast}
  ROUNDED_G0 X={x} D=150 F={fast}
  ROUNDED_G0 Z={z + path[0]['z']|float} D=20 F={fast}
  ROUNDED_G0 Y={y + path[0]['y']|float} D=0 F={fast}
  STOP_CRASH_DETECTION
  {% for pos in path %}
    {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
    G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float}{% endif %} F{speed}
  {% endfor %}
  # Tool clicked into dock; set LED back to standby immediately.
  _SET_TOOL_LED T={tool.tool_number} STATE=standby
  {% if pickup_tool is none %}
    G0 Y{tool.params_safe_y} F{fast}
  {% endif %}

# after_change_gcode: update LEDs and load the active tool input shaper.
after_change_gcode:
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] is defined %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
  {% endif %}
  {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
  {% if ps == "printing" %}
    _SET_TOOL_LED T={tool.tool_number} STATE=printing
    {% if printer["gcode_macro START_CRASH_DETECTION"] is defined %}
      START_CRASH_DETECTION
    {% endif %}
  {% elif ps == "paused" %}
    _SET_TOOL_LED T={tool.tool_number} STATE=pause
  {% else %}
    _SET_TOOL_LED T={tool.tool_number} STATE=ready
  {% endif %}
  _SYNC_INACTIVE_LEDS ACTIVE={tool.tool_number}
  {% if 'input_shaper' in printer.configfile.config %}
    {% set default_x_freq    = printer.configfile.config['input_shaper']['shaper_freq_x']|default(0)|float %}
    {% set default_x_type    = printer.configfile.config['input_shaper']['shaper_type_x']|default('mzv')|string %}
    {% set default_x_damping = printer.configfile.config['input_shaper']['damping_ratio_x']|default(0.1)|float %}
    {% set default_y_freq    = printer.configfile.config['input_shaper']['shaper_freq_y']|default(0)|float %}
    {% set default_y_type    = printer.configfile.config['input_shaper']['shaper_type_y']|default('mzv')|string %}
    {% set default_y_damping = printer.configfile.config['input_shaper']['damping_ratio_y']|default(0.1)|float %}
    SET_INPUT_SHAPER SHAPER_TYPE_X={tool.params_input_shaper_type_x if tool.params_input_shaper_type_x else default_x_type} SHAPER_FREQ_X={tool.params_input_shaper_freq_x if tool.params_input_shaper_freq_x else default_x_freq} SHAPER_TYPE_Y={tool.params_input_shaper_type_y if tool.params_input_shaper_type_y else default_y_type} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y if tool.params_input_shaper_freq_y else default_y_freq} DAMPING_RATIO_X={tool.params_input_shaper_damping_ratio_x if tool.params_input_shaper_damping_ratio_x else default_x_damping} DAMPING_RATIO_Y={tool.params_input_shaper_damping_ratio_y if tool.params_input_shaper_damping_ratio_y else default_y_damping}
  {% endif %}

# params_safe_y: safe Y position before moving sideways across the dock area.
# The gantry must be at Y >= safe_y before moving X toward another dock.
# This avoids colliding with tools parked in the dock.
params_safe_y: 120

# params_close_y: relative distance from safe_y to approach the dock for pickup.
# The gantry stops this many mm before the dock before running the pickup path.
params_close_y: 30

# params_fast_speed: fast travel speed in mm/min outside the dock area.
# Used for moves from the print area to safe_y and then in front of the dock.
params_fast_speed: 15000  # ~250mm/s

# params_path_speed: speed in mm/min while running pickup/dropoff paths.
# This is for fine mechanical moves inside the dock; do not raise it too much.
params_path_speed: 900    # About 15 mm/s; safe for this mechanism.

# require_tool_present: require a tool on the shuttle before allowing moves.
# False when Cartographer/Beacon handles Z probing and a tool is not required for Z home.
require_tool_present: False

############################################################################
# [homing_override_config] - Homing configuration
# KTC-Easy homes Y first to avoid catching the umbilical.
############################################################################
[gcode_macro homing_override_config]
description: Homing configuration: sensorless flags, rebound, and current
variable_sensorless_x: False
variable_sensorless_y: False
variable_homing_rebound_y: 20  # Back off 20 mm after Y home so the gantry does not bind in the corner.
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49  # Reduced current while homing to avoid missed steps.

############################################################################
# [SET_TEMPERATURE_WITH_DEADBAND] - Override M109 with a deadband.
# Instead of waiting for the exact target temperature, KTC accepts +/- deadband/2.
# Example: deadband=4.0 lets M109 S150 continue when the tool reaches 148-152 C.
# Higher deadband makes tool changes faster but temperature control less exact.
############################################################################
[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
description: Set tool temperature and wait until it is inside the configured deadband
variable_default_deadband: 4.0  # Accepted range is +/-2 C around the setpoint.

############################################################################
# [M109] - Override KTC macro without editing readonly-configs.
# The upstream macro only initializes newparameters when T is passed. Several
# standard paths call M109 S... without T, so initialize it before appending.
############################################################################
[gcode_macro M109]
description: Set tool temperature and wait with deadband support
gcode:
  {% set newparameters = "" %}
  {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
  {% if params.T is not defined and active_tool < 0 %}
    M109.9999 {rawparams}
  {% else %}
  {% if params.T is defined %}
    {% set newparameters = " T="~params.T %}
  {% endif %}

  {% if params.S is defined %}
    {% set newparameters = newparameters~" S="~params.S %}
  {% endif %}

  {% if params.D is defined %}
    {% set newparameters = newparameters~" D="~params.D %}
  {% endif %}

  SET_TEMPERATURE_WITH_DEADBAND {newparameters}
  {% endif %}

############################################################################
# [_CALIBRATION_SWITCH] - SexBall/SexBolt probe position
# Pin: M1-STOP/PF4 (GND + PF4 on Manta M8P V2.0)
# Measured position: T0 nozzle centered over the ball.
#
# To re-measure this position:
#   1. Run G28, then QUAD_GANTRY_LEVEL.
#   2. Move the T0 nozzle to the center of the ball.
#   3. Run M114, record X/Y/Z, and update the variables below.
############################################################################
[gcode_macro _CALIBRATION_SWITCH]
variable_x: 257     # X center of SexBolt ball measured with T0 nozzle
variable_y: 327     # Y center of SexBolt ball measured with T0 nozzle
variable_z: 60      # Safe approach Z. Z55 is the estimated ball contact/top height.
                    # Keep above contact height while moving XY over the switch.
gcode:

############################################################################
# [tools_calibrate] - SexBall/SexBolt Probe XY+Z calibration
#
# Enabled for the official StealthChanger calibration workflow.
# Axiscope must remain disabled while this section is active because both
# modules allocate the probe_multi_axis helper.
############################################################################
[tools_calibrate]
pin: ^PF4
travel_speed: 20
spread: 7
lower_z: 1.0
speed: 1
lift_speed: 4
final_lift_z: 6
sample_retract_dist: 2
samples_tolerance: 0.15
samples: 5
samples_result: median
probe: probe
trigger_to_bottom_z: 0.9   # Initial value; re-measure after moving SexBolt to M1-STOP/PF4.

############################################################################
# Description overrides - English labels for readonly KTC macros
# Klipper merges sections with the same name, so only description is declared here.
############################################################################
[gcode_macro _TAP_PROBE_ACTIVATE]
description: Limit nozzle temperature to 150 C or lower before bed probing

[gcode_macro RESUME]
description: Resume printing after initializing the toolchanger and confirming a tool is present

[gcode_macro TOOL_ALIGN_START]
description: Start dock alignment by moving the nozzle in front of the dock

[gcode_macro TOOL_ALIGN_TEST]
description: Test pickup/dropoff at the current coordinates

[gcode_macro TOOL_ALIGN_DONE]
description: Save dock coordinates permanently to the config

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Move the nozzle over the SexBall/SexBolt probe

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Measure and save XYZ offsets for all tools relative to T0

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Calibrate tool_probe z_offset with the SexBall/SexBolt probe

[gcode_macro TOOL_BED_MESH_CALIBRATE]
description: Run bed mesh calibration with tool offsets applied

[gcode_macro START_CRASH_DETECTION]
description: Enable tool crash detection while printing

[gcode_macro STOP_CRASH_DETECTION]
description: Disable crash detection during tool changes or at the end of a print
