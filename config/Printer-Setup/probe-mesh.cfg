# Cartographer, bed mesh, and the Cartographer-mounted ADXL345.

[cartographer]
mcu: cartographer
x_offset: 0
y_offset: 35
verbose: no

[bed_mesh]
zero_reference_position: 174, 168
speed: 600
horizontal_move_z: 3
mesh_min: 20, 45
mesh_max: 320, 325
probe_count: 55, 55
adaptive_margin: 10
mesh_pps: 0, 0

[adxl345]
cs_pin: cartographer:PA3
spi_bus: spi1

[axis_twist_compensation]
# Values generated by AXIS_TWIST_COMPENSATION_CALIBRATE are stored by SAVE_CONFIG.
