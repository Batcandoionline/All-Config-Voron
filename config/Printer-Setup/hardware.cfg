############################################################################
# HARDWARE.CFG - MCU, steppers, extruder, and bed
# Voron 2.4 StealthChanger 5-Tool | Manta M8P V2 + CM4
#
# Split out from printer.cfg for easier maintenance.
# Includes temperature sensors, MCU definitions, all steppers, and TMC drivers.
#           extruder placeholder, heater_bed
############################################################################

#####################################################################
# Temperature sensors - module temperatures
#####################################################################

# MCU and SoC temperatures are shown through [temperature_fan enclosure_fan] and [temperature_fan cm4_fan].
# No separate [temperature_sensor] section is needed; this avoids pin-used-multiple-times errors.

[temperature_sensor cartographer]
sensor_type: temperature_mcu       # Built-in microcontroller temperature sensor
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

# ====================================================================
# Chamber Temperature & Humidity Sensor
# Default: Generic 3950 100K NTC on THB port (PB1)
# Ready for upgrade: DHT22 / AM2302 (Digital Temp + Relative Humidity % RH)
#
# To switch to DHT22 / AM2302:
#   1. Connect Data to a digital GPIO (e.g. PC15 / PD11 or CM4 GPIO), VCC to 3.3V/5V, GND to GND.
#   2. Comment out the Generic 3950 block below and uncomment the DHT22 block.
# ====================================================================

[temperature_sensor chamber]
sensor_type: Generic 3950          # Active: 100K NTC thermistor
sensor_pin: PB1                    # THB port on Manta M8P V2.0
min_temp: 0
max_temp: 100
gcode_id: C                        # Expose to Mainsail & Klipper as chamber sensor C

# --- DHT22 / AM2302 Configuration (Uncomment when installed) ---
#[temperature_sensor chamber]
#sensor_type: DHT22
#sensor_pin: PC15                  # Example digital pin on Manta M8P (or host:gpio4 on CM4)
#min_temp: 0
#max_temp: 80
#gcode_id: C


#####################################################################
# MCU - Manta M8P v2.0 - CAN bus connection
#####################################################################

[mcu]
canbus_uuid: 19b203d75137
canbus_interface: can0

#####################################################################
# MCU - Cartographer v3 - CAN bus connection
#####################################################################

[mcu cartographer]
canbus_uuid: da13d909ce34

#####################################################################
# X/Y Stepper Settings
#####################################################################

## X axis - Motor 1 (Motor B) 0.9 deg
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14             # active low
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400  # 0.9 deg motor
endstop_pin: PF0
position_min: 0
position_endstop: 348
position_max: 348
homing_speed: 100             # max 100mm/s
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0      # Use SpreadCycle (0) instead of StealthChop for better stability

## Y axis - Motor 2 (Motor A) 0.9 deg
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4              # active low
microsteps: 16
rotation_distance: 40
endstop_pin: PF1
full_steps_per_rotation: 400  # 0.9 deg motor
position_min: -10
position_endstop: 336
position_max: 336
homing_speed: 100             # max 100mm/s
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: True
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

#####################################################################
# Z Stepper Settings (CoreXY Z Drive)
#####################################################################

## Z0 - Front Left (MOTOR 3)
[stepper_z]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 32         # Belted Z drive: 2mm pitch GT2 on 16T pulley with 80:16 gear ratio
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 347
position_min: -5              # Allow negative travel to compensate Z offset
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0        # Use 0 with Cartographer

[tmc2209 stepper_z]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z1 - Rear Left (MOTOR4)
[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z2 - Rear Right (MOTOR5)
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

## Z3 - Front Right (MOTOR6)
[stepper_z3]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

