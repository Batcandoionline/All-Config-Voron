# Cooling fans, chamber lighting, toolhead LED state, and Mainsail hooks.

# TMC driver cooling on Manta Fan1/PF9. Keep the one-hour idle cooldown for
# long heat soaks and prints; shorten it only after checking driver temperatures.
[controller_fan tmc_fan]
pin: PF9                           # Fan1 on Manta M8P V2 (VF1 PF9)
kick_start_time: 0.5               # 0.5 s startup pulse to ensure the fan spins
fan_speed: 1.0                     # 100% while steppers are active
idle_speed: 1.0                    # 100% during the idle cooldown period
idle_timeout: 3600                 # Keep cooling for 1 hour after the listed steppers go idle
stepper: stepper_x, stepper_y, stepper_z

# CM4 cooling on Fan2/PF6. Watermark control is intentionally simple and
# reliable; target_temp and max_delta are the normal tuning points.
[temperature_fan cm4_fan]
pin: PF6                           # Fan2 on Manta M8P V2 (VF2 PF6)
sensor_type: temperature_host      # Read temperature from the CM4 SoC
min_temp: 10
max_temp: 100
target_temp: 50.0
control: watermark
max_delta: 3.0

# Manta MCU/electronics cooling on Fan0/PF7.
[temperature_fan enclosure_fan]
pin: PF7                           # Fan0 on Manta M8P V2 (VF0 PF7)
sensor_type: temperature_mcu       # Read temperature from the Manta M8P MCU
min_temp: 10
max_temp: 100
target_temp: 55.0
control: watermark
max_delta: 3.0

# Under-bed chamber circulation on Fan3/PF8. Dryer and print macros share it.
[fan_generic bed_fan]
pin: PF8                           # Fan3 on Manta M8P V2 (VF3 PF8)
kick_start_time: 0.5               # 0.5 s startup pulse to ensure the fan spins

[gcode_macro BED_FAN_ON]
description: Turn on the chamber circulation fan (0-1.0, default 0.5)
gcode:
    {% set speed = [[params.SPEED|default(0.5)|float, 0.0]|max, 1.0]|min %}
    SET_FAN_SPEED FAN=bed_fan SPEED={speed}
    RESPOND TYPE=echo MSG="Bed fan speed: {(speed * 100)|int}%"

[gcode_macro BED_FAN_OFF]
description: Turn off the chamber circulation fan
gcode:
    SET_FAN_SPEED FAN=bed_fan SPEED=0
    RESPOND TYPE=echo MSG="Bed fan off"

[delayed_gcode bed_fan_off_delay]
gcode:
    BED_FAN_OFF

# Forty-LED WS2812B chamber strip on PD15. White output is limited to 30% to
# avoid supply sag and unnecessary heat.
[neopixel chamber_lights]
pin: PD15                  # Chamber LED strip data pin on Manta M8P
chain_count: 40            # 40 WS2812B LEDs chained as one strip
color_order: GRB           # WS2812B uses G-R-B order
initial_RED: 0             # Off at startup
initial_GREEN: 0
initial_BLUE: 0

[gcode_macro LIGHTS_ON]
description: Turn chamber lights on, white 30% (prevent voltage sag)
gcode:
    SET_LED LED=chamber_lights RED=0.3 GREEN=0.3 BLUE=0.3 TRANSMIT=1

[gcode_macro LIGHTS_OFF]
description: Turn chamber lights off
gcode:
    SET_LED LED=chamber_lights RED=0 GREEN=0 BLUE=0 TRANSMIT=1

# Toolhead LED states. LED 1 is the status indicator; LEDs 2-3 illuminate the
# hotend. TRANSMIT is set only on the final LED update to prevent visible flash.
# States: standby, ready, heating, leveling, cleaning, toolchange, calibrating,
# printing, pause, complete, and error.
[gcode_macro _SET_TOOL_LED]
description: Set toolhead LED color by state (internal)
gcode:
    {% set t     = params.T|int %}
    {% set state = params.STATE|default("standby")|string|lower %}
    {% set led   = "T" + t|string + "_LED" %}

    {% if printer["neopixel " ~ led] is defined %}

        {% if state == "standby" %}
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=3 TRANSMIT=1

        {% elif state == "ready" %}
            SET_LED LED={led} RED=0.50 GREEN=0.40 BLUE=0.20 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "heating" %}
            SET_LED LED={led} RED=1.00 GREEN=0.40 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "leveling" %}
            SET_LED LED={led} RED=0.00 GREEN=0.80 BLUE=0.80 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "cleaning" %}
            SET_LED LED={led} RED=0.20 GREEN=0.60 BLUE=1.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "toolchange" %}
            SET_LED LED={led} RED=1.00 GREEN=0.65 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.20 BLUE=0.00 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.20 BLUE=0.00 INDEX=3 TRANSMIT=1

        {% elif state == "calibrating" %}
            SET_LED LED={led} RED=0.50 GREEN=0.00 BLUE=0.90 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "printing" %}
            SET_LED LED={led} RED=0.00 GREEN=0.00 BLUE=1.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "pause" %}
            SET_LED LED={led} RED=0.80 GREEN=0.00 BLUE=0.80 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "complete" %}
            SET_LED LED={led} RED=0.00 GREEN=1.00 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "error" %}
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=3 TRANSMIT=1

        {% else %}
            RESPOND TYPE=error MSG="[LED] Invalid state: '{state}' for T{t}; setting standby"
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=3 TRANSMIT=1

        {% endif %}
    {% else %}
    {% endif %}

# Apply one state to every detected KTC toolhead without saturating the CAN bus.
[gcode_macro _ALL_TOOLHEADS_LED_SET]
description: Set all toolhead LEDs to the same state
gcode:
    {% set state = params.STATE|default("standby")|string|lower %}
    {% for tn in printer.toolchanger.tool_numbers %}
        _SET_TOOL_LED T={tn} STATE={state}
         G4 P10  # Avoid saturating the CAN bus
    {% endfor %}

[gcode_macro _ALL_TOOLHEADS_LED_OFF]
description: Set all toolhead LEDs to standby, very dim dark blue
gcode:
    _ALL_TOOLHEADS_LED_SET STATE=standby

# After a tool change, keep the mounted tool bright and parked tools dim.
[gcode_macro _SYNC_INACTIVE_LEDS]
description: Dim all parked tools to standby after a tool change
gcode:
    {% set active = params.ACTIVE|default(printer.toolchanger.tool_number|default(-1))|int %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% if tn != active %}
            _SET_TOOL_LED T={tn} STATE=standby
             G4 P10  # Avoid saturating the CAN bus
        {% endif %}
    {% endfor %}

[gcode_macro _SET_ACTIVE_TOOL_READY]
description: Set the tool currently on the shuttle to ready at boot or after clearing state
gcode:
    {% set active = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active >= 0 %}
        _SET_TOOL_LED T={active} STATE=ready
    {% endif %}

# KTC state is not immediately available at Klipper startup, so initialize LEDs
# after two seconds and retry if the toolchanger object is still loading.
[delayed_gcode LED_INIT]
initial_duration: 2
gcode:
    {% if printer.toolchanger is defined and printer.toolchanger.tool_numbers is defined %}
        _ALL_TOOLHEADS_LED_SET STATE=standby
        _SET_ACTIVE_TOOL_READY
    {% else %}
        RESPOND TYPE=echo MSG="[LED_INIT] Toolchanger not ready; retrying in 1 s"
        UPDATE_DELAYED_GCODE ID=LED_INIT DURATION=1
    {% endif %}

# Event-driven state shared with toolchanger-config.cfg. Do not infer this from
# print_stats during a tool change; set it only at known lifecycle transitions.
[gcode_macro _PRINT_STATE]
description: Internal variable tracking print state: printing/paused/idle
variable_state: "idle"
gcode:

# The following wrappers translate printer lifecycle events into LED states.
[gcode_macro _SET_LED_STATUS_READY]
description: Warm white LED; printer is ready
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=ready
    {% endif %}

[gcode_macro _SET_LED_STATUS_HEATING]
description: Orange LED; heating
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=heating
    {% endif %}

[gcode_macro _SET_LED_STATUS_LEVELING]
description: Cyan LED; homing, QGL, or Cartographer probe
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=leveling
    {% endif %}

[gcode_macro _SET_LED_STATUS_CALIBRATING]
description: Purple LED; calibrating tool XYZ offsets
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=calibrating
    {% endif %}

[gcode_macro _SET_LED_STATUS_CLEANING]
description: Light blue LED; CLEAN_NOZZLE is running
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=cleaning
    {% endif %}

[gcode_macro _SET_LED_STATUS_TOOLCHANGE]
description: Amber LED; pickup/dropoff is in progress
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=toolchange
    {% endif %}

[gcode_macro _SET_LED_STATUS_PRINTING]
description: Blue LED; printing
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    _SYNC_INACTIVE_LEDS

# Re-assert LED state after RESUME_BASE and KTC callbacks have completed.
[delayed_gcode _RESUME_LED_SYNC]
initial_duration: 0
gcode:
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% if ps == "printing" %}
        {% set t = printer.toolchanger.tool_number|default(-1)|int %}
        {% if t >= 0 %}
            _SET_TOOL_LED T={t} STATE=printing
        {% endif %}
        _SYNC_INACTIVE_LEDS
    {% endif %}
[gcode_macro _LED_RESUME_WRAPPER]
description: RESUME hook wrapper; set printing LED and schedule delayed sync
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    _SYNC_INACTIVE_LEDS
    UPDATE_DELAYED_GCODE ID=_RESUME_LED_SYNC DURATION=1.5

[gcode_macro _SET_LED_STATUS_PAUSE]
description: Magenta LED; print is paused
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'paused'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=pause
    {% endif %}

[gcode_macro _SET_LED_STATUS_COMPLETE]
description: Green LED; print completed
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=complete
    {% endif %}

[gcode_macro _SET_LED_STATUS_ERROR]
description: All-red LED; system error on every tool
gcode:
    _ALL_TOOLHEADS_LED_SET STATE=error

[gcode_macro _SET_LED_STATUS_DRYING]
description: Amber/Orange glow on chamber lights and toolheads during filament drying
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'drying'"
    {% if "neopixel chamber_lights" in printer.configfile.config %}
        SET_LED LED=chamber_lights RED=0.85 GREEN=0.35 BLUE=0.00 TRANSMIT=1
    {% endif %}
    {% if printer.toolchanger is defined and printer.toolchanger.tool_numbers is defined %}
        _ALL_TOOLHEADS_LED_SET STATE=heating
    {% endif %}

[gcode_macro _SET_LED_STATUS_DRYING_COMPLETE]
description: Restore clean white chamber lights and standby toolheads when drying finishes
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"
    {% if "neopixel chamber_lights" in printer.configfile.config %}
        SET_LED LED=chamber_lights RED=0.30 GREEN=0.30 BLUE=0.30 TRANSMIT=1
    {% endif %}
    {% if printer.toolchanger is defined and printer.toolchanger.tool_numbers is defined %}
        _ALL_TOOLHEADS_LED_SET STATE=standby
    {% endif %}

# Final RESUME override. It intentionally combines KTC tool verification with
# the current official Mainsail resume flow (temperature/idle/runout handling).
# Keep rename_existing and all state variables aligned with mainsail.cfg.
[gcode_macro RESUME]
description: Resume print with KTC tool verification and Mainsail safety checks
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  INITIALIZE_TOOLCHANGER
  VERIFY_TOOL_DETECTED

  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""
                    else True if not printer[client.runout_sensor].enabled
                    else printer[client.runout_sensor].filament_detected %}
  {% set can_extrude = True if printer.toolhead.extruder == ''
                  else printer[printer.toolhead.extruder].can_extrude %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}

  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f\u00B0C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}

  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %}
        SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout}
      {% endif %}
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}

  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

# Mainsail client hook configuration. Hook values must be single macro names.
[gcode_macro _CLIENT_VARIABLE]
variable_user_pause_macro  : "_SET_LED_STATUS_PAUSE"
variable_user_resume_macro : "_LED_RESUME_WRAPPER"
variable_user_cancel_macro : "_CUSTOM_CANCEL_CLEANUP"
gcode:

# Cancel cleanup runs after Mainsail has retracted and disabled heaters. Motion
# is allowed only when XYZ is homed; an installed tool is docked and the empty
# shuttle is parked. After a crash, inspect/secure the mechanism before cancel.
[gcode_macro _CUSTOM_CANCEL_CLEANUP]
description: Clean up toolchanger and LEDs when canceling a print through the mainsail CANCEL_PRINT hook
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set th = printer.toolhead %}

        {% set z_now  = th.position.z|float %}
        {% set z_safe = [[z_now + 10.0, 50.0]|max, th.axis_maximum.z|float]|min %}
        G90
        G0 Z{z_safe} F3000

        {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
        {% if active_tool >= 0 %}
            UNSELECT_TOOL
        {% else %}
            RESPOND TYPE=echo MSG="[CANCEL] Toolchanger has no active tool to dock"
        {% endif %}
        {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
            STOP_CRASH_DETECTION
        {% endif %}

        G90
        G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 2} F9000

    {% else %}
        RESPOND TYPE=echo MSG="[CANCEL] XYZ not homed - skipping park/toolchange"
    {% endif %}

    {% for tn in printer.toolchanger.tool_numbers %}
        {% set fan_name = "T" ~ tn|string ~ "_part_fan" %}
        {% if printer["fan_generic " ~ fan_name] is defined %}
            SET_FAN_SPEED FAN={fan_name} SPEED=0
        {% endif %}
        {% set ext_name = "extruder" if tn == 0 else "extruder" ~ tn|string %}
        SET_STEPPER_ENABLE STEPPER={ext_name} ENABLE=0
    {% endfor %}

    BED_MESH_CLEAR
    CLEAR_PAUSE
    SET_GCODE_OFFSET X=0 Y=0 Z=0

    _ALL_TOOLHEADS_LED_SET STATE=standby
    M117 Print canceled.
