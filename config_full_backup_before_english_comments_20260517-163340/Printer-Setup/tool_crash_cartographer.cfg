# ─────────────────────────────────────────────────────────────────────────
# [tool_crash] Plugin Configuration
# ─────────────────────────────────────────────────────────────────────────
# QUAN TRỌNG: Phải include file này SAU khi đã include tất cả toolchanger 
# configs ([tool], [tool_probe], toolchanger-include.cfg, v.v.)

[tool_crash]
# === Watchdog: Kiểm tra định kỳ trạng thái tool ===
watchdog_interval: 0.5           # Kiểm tra mỗi 0.5s (nhanh hơn: 0.2-0.3s, chậm hơn: 1.0s)
watchdog_threshold: 2            # Phải lỗi 2 lần liên tiếp mới báo cáo (tránh false positive)

# === Probing: Bỏ qua khi homing ===
# Dành cho TAP probe + Cartographer: khi G28 Z lực cảm biến TAP hay tự động trigger
# Cho inductive (SexBall): không cần vì không xảy ra TAP trigger khi homing
ignore_events: probing            # THAY ĐỔI thành "all" hoặc "" nếu có false positives

# === Homing timeblock: Thời gian tránh báo cáo sau home ===
home_timeblock: 1.0               # 1 giây sau homing == không báo cáo lỗi tức thì

# === Custom crash gcode (GHI CHÚ) ===
# crash_gcode: CUSTOM_CRASH_HANDLER    # Không dùng mặc định: tắt máy ngay M112
# WARNING: custom crash_gcode DELAY phản ứng từ vài ms đến vài giây,
#          phụ thuộc queue g-code. Loại bỏ dòng này ==> PHẢN ỨNG NHANH NHẤT

# === Thêm các crash mintime tùy chọn (mặc định 0.5s) ===
# crash_mintime: 0.5

# ─────────────────────────────────────────────────────────────────────────
# Ghi chú về cảm biến:
# ───────────────────
# - SexBall probe (^PF2): detection_pin trong [tool 0], [tool 1], ...
#   => tool_crash tự động parse từ [tool] sections
# - Cartographer V3: là probe chính, KHÔNG dùng trong tool_crash
#   (đã skip vì là probe_in_use cho bed mesh, không phải tool detection)
# - Inductive sensor: tương tự SexBall (parse từ [tool] detection_pin)

# ─────────────────────────────────────────────────────────────────────────
# PRINT_START / PRINT_END Integration
# ───────────────────────────────────────────
# Trong print-macros.cfg hoặc PRINT_START:
#   1. START_TOOL_CRASH_DETECTION => bắt đầu phát hiện
#   2. Thực hiện G28, QGL, BED_MESH, ...
#   3. STOP_TOOL_CRASH_DETECTION => kết thúc print
# 
# Macro: STOP_CRASH_DETECTION (crash-detection.cfg) sẽ gọi lại 
#   START_TOOL_CRASH_DETECTION thay vì START_TOOL_PROBE_CRASH_DETECTION
