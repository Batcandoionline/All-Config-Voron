############################################################################
# CRASH_DETECTION_OVERRIDE.CFG - KTC-Easy compatibility adapter
#
# KTC-Easy's readonly macros only call tool_probe_endstop crash commands.
# This printer instead uses cekim-git/tool_crash with each tool's existing
# detection_pin. Keep this adapter included after toolchanger-include.cfg.
# It is still required even when tool_crash_cartographer.cfg is present:
# that file configures the detector; this file routes KTC start/stop calls.
############################################################################

[gcode_macro STOP_CRASH_DETECTION]
description: Disable the configured tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    STOP_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    STOP_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

[gcode_macro START_CRASH_DETECTION]
description: Enable the configured tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    START_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    START_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

# Runtime policy:
# - Detection is stopped during homing, docking, probing, and shutdown cleanup.
# - Detection starts only after a printing tool is mounted.
# - tool_crash runs _TOOL_CRASH_SAFE_PAUSE on failure.
# - Without crash_gcode, upstream tool_crash invokes a Klipper shutdown.
############################################################################
