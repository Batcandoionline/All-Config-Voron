[gcode_macro AUTO_ALIGN_ALL_TOOLS]
description: Đặt T0 trên Camera rồi chạy lệnh này. Tự động đo Z và XY cho 5 Tool.
gcode:
    # --- BƯỚC 0: Kiểm tra vị trí và Homing ---
    {% if 'xy' not in printer.toolhead.homed_axes or 'z' not in printer.toolhead.homed_axes %}
        {action_respond_info("LỖI: Máy chưa được Home. Vui lòng Home và di chuyển T0 lên trên Camera trước khi chạy.")}
        CANCEL_MACRO
    {% endif %}

    # Lấy tọa độ hiện tại làm tâm Camera
    {% set cam_x = printer.toolhead.position.x %}
    {% set cam_y = printer.toolhead.position.y %}
    RESPOND MSG="Đã nhận diện vị trí Camera tại X={cam_x}, Y={cam_y}"

    # Kích hoạt kTAMV
    KTAMV_SEND_SERVER_CFG

    # --- BƯỚC 1: Thiết lập Origin Camera với T0 ---
    RESPOND MSG="Thiết lập Camera Origin với T0..."
    T0
    
    # Quay lại vị trí Camera vừa lưu
    G0 X{cam_x} Y{cam_y} F15000 
    KTAMV_CALIB_CAMERA
    KTAMV_FIND_NOZZLE_CENTER
    KTAMV_SET_ORIGIN

    # --- BƯỚC 2: Đo Z Offset bằng công tắc vi mô ---
    RESPOND MSG="Đang tiến hành đo Z Offset cho tất cả các Tool..."
    # Gọi module Axiscope để đo Z cho mọi tool
    AXISCOPE_CALIBRATE

    # --- BƯỚC 3: Đo XY Offset cho T1-T4 ---
    {% set tools_to_align = [1, 2, 3, 4] %}
    {% for tool in tools_to_align %}
        RESPOND MSG="Đang đo XY Offset cho T{tool}..."
        T{tool}
        
        # Di chuyển ra Camera
        G0 X{cam_x} Y{cam_y} F15000
        
        # kTAMV tính toán
        KTAMV_FIND_NOZZLE_CENTER
        KTAMV_GET_OFFSET
        
        # Lưu XY vào cấu hình
        _KTAMV_SAVE_XY_OFFSET TOOL={tool}
    {% endfor %}

    # --- BƯỚC 4: Kết thúc ---
    T0
    RESPOND MSG="Hoàn tất căn chỉnh! Vui lòng kiểm tra lại Offset và chạy SAVE_CONFIG."


[gcode_macro _KTAMV_SAVE_XY_OFFSET]
description: Macro ẩn dùng để lưu XY Offset trực tiếp vào cấu hình Tool
gcode:
    {% set TOOL = params.TOOL %}
    # Kiểm tra xem kTAMV có tìm thấy tâm thành công hay không
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|lower == "true" %}
        {% set x_off = printer.ktamv.last_calculated_offset[0] %}
        {% set y_off = printer.ktamv.last_calculated_offset[1] %}
        
        # Cập nhật thông số cho hệ thống Toolchanger
        SET_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_x_offset VALUE="{x_off}"
        SAVE_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_x_offset
        
        SET_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_y_offset VALUE="{y_off}"
        SAVE_TOOL_PARAMETER T={TOOL} PARAMETER=gcode_y_offset
        
        RESPOND MSG="Thành công: Đã lưu T{TOOL} X={x_off}, Y={y_off}"
    {% else %}
        RESPOND MSG="LỖI: Không tìm thấy lỗ kim phun cho T{TOOL}. Bỏ qua tool này."
    {% endif %}
