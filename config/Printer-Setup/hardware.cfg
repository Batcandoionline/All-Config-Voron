# Voron 2.4 350 hardware: Manta M8P V2.0, CM4, and Cartographer CAN.

[temperature_sensor cartographer]
sensor_type: temperature_mcu
sensor_mcu: cartographer
min_temp: 5
max_temp: 105

# Generic 3950 100K NTC installed on THB/PB1.
[temperature_sensor chamber]
sensor_type: Generic 3950
sensor_pin: PB1
min_temp: 0
max_temp: 100
gcode_id: C

[mcu]
canbus_uuid: 19b203d75137
canbus_interface: can0

[mcu cartographer]
canbus_uuid: da13d909ce34

# X / Motor B / 0.9 degree
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400
endstop_pin: PF0
position_min: 0
position_endstop: 348
position_max: 348
homing_speed: 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_x]
uart_pin: PC13
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Y / Motor A / 0.9 degree
[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 400
endstop_pin: PF1
position_min: -10
position_endstop: 336
position_max: 336
homing_speed: 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2209 stepper_y]
uart_pin: PE3
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Z0 / front-left / Motor 3
[stepper_z]
step_pin: PG9
dir_pin: PD7
enable_pin: !PG11
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16
endstop_pin: probe:z_virtual_endstop
position_max: 347
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 0

[tmc2209 stepper_z]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Z1 / rear-left / Motor 4
[stepper_z1]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z1]
uart_pin: PB5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Z2 / rear-right / Motor 5
[stepper_z2]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z2]
uart_pin: PG14
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# Z3 / front-right / Motor 6
[stepper_z3]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PE0
rotation_distance: 32
gear_ratio: 80:16
microsteps: 16

[tmc2209 stepper_z3]
uart_pin: PB9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 0

# 1000 W AC silicone bed through SSR on PA1; MGB18 NTC on PB0.
[heater_bed]
heater_pin: PA1
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0
max_power: 1
min_temp: 0
max_temp: 120
smooth_time: 3.0
pwm_cycle_time: 0.2

# Measured response limits for the high-mass 350 mm bed.
[verify_heater heater_bed]
max_error: 200
check_gain_time: 240
hysteresis: 5
heating_gain: 1
