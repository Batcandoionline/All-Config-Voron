############################################################################
# INPUT-SHAPER.CFG - Resonance Tester and ShakeTune
# 
# MULTI-TOOL: do not use a global [input_shaper] section.
# KTC-Easy applies each tool input shaper from Tools/Tn.cfg.
#
# RESONANCE TEST PROCEDURE:
# 1. Install the tool to test, then home the printer.
# 2. Change `accel_chip: adxl345 T1` below to the matching Tn.
# 3. Run `AXES_SHAPER_CALIBRATION` and copy the result into Tools/Tn.cfg.
############################################################################

[resonance_tester]
accel_chip: adxl345 T1  # Change Tn when testing another tool (T0/T1/.../T4)
probe_points: 180, 168, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 5
keep_raw_data: False
show_macros_in_webui: True
timeout: 900    # Enough time for the CM4 to process the graphs
max_freq: 150   # >= the maximum test frequency used by the macro, 134 Hz
dpi: 150        # Use 150 dpi instead of 300; images are 4x smaller and save RAM
