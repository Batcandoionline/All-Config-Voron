############################################################################
# T4.cfg - Toolhead 4 (EBB46 V1.2) — KTC-Easy / OrcaSlicer Multi-Color
#
# Board  : BIGTREETECH EBB46 V1.2 (STM32G0B1, CAN bus)
# Hotend : TZ V6 2.0  |  Extruder: WW BMG
# Tool   : T4 — offset calibrate bằng CALIBRATE_ALL_OFFSETS (SexBall)
#
# Tài liệu chính thức:
#   https://stealthchanger.com/software/ktc-easy/examples/#EBB46-v12-T4-non-tap
############################################################################

############################################################################
# MCU
############################################################################

[mcu EBB4]
canbus_uuid: 4ad9d622a836
canbus_interface: can0

############################################################################
# ADXL345 — Input Shaper
############################################################################

[adxl345 T4]
cs_pin: EBB4:PB12
spi_software_sclk_pin: EBB4:PB10
spi_software_mosi_pin: EBB4:PB11
spi_software_miso_pin: EBB4:PB2
axes_map: x,z,-y

############################################################################
# extruder4 — WW BMG + TZ V6 2.0
############################################################################

[extruder4]
step_pin: EBB4:PD0
dir_pin: !EBB4:PD1
enable_pin: !EBB4:PD2
heater_pin: EBB4:PB13
sensor_pin: EBB4:PA3
sensor_type: Generic 3950

microsteps: 16
rotation_distance: 22.277
gear_ratio: 50:10
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
max_extrude_only_distance: 101

# pressure_advance: 0.03  # Calibrate và bỏ comment sau khi đo
# control/pid_kp/ki/kd: KHÔNG khai báo ở đây → SAVE_CONFIG tự ghi sau PID_CALIBRATE

############################################################################
# TMC2209
############################################################################

[tmc2209 extruder4]
uart_pin: EBB4:PA15
run_current: 0.65
stealthchop_threshold: 0

############################################################################
# FANS
############################################################################

[heater_fan T4_hotend_fan]
pin: EBB4:PA0
heater: extruder4
heater_temp: 50.0

[fan_generic T4_part_fan]
pin: EBB4:PA1

############################################################################
# TOOL DEFINITION — KTC-Easy
############################################################################

[tool T4]
tool_number: 4
extruder: extruder4
fan: T4_part_fan
detection_pin: ^!EBB4:PB6

# Vị trí dock (nozzle coordinates) — ⚠️ CẦN CĂNH CHỈNH THỰC TẾ
params_park_x: 321
params_park_y: 3.3
params_park_z: 343

# Standby temperature khi parked (KTC quản lý tự động sau mỗi dropoff)
params_standby_temp: 150
params_heater_standby_delay: 0.1

# Input Shaper — đo ngày 2026-04-26 bằng ShakeTune AXES_SHAPER_CALIBRATION
# X axis: For performance (EI) / For low vibrations (2HUMP_EI @ 71.2 Hz)
params_input_shaper_freq_x: 67.0
params_input_shaper_type_x: 'ei'
params_input_shaper_damping_ratio_x: 0.068
# Y axis: For performance (EI) / For low vibrations (3HUMP_EI @ 66.8 Hz)
params_input_shaper_freq_y: 45.8
params_input_shaper_type_y: 'ei'
params_input_shaper_damping_ratio_y: 0.151

############################################################################
# NEOPIXEL — 3x WS2812
############################################################################

[neopixel T4_LED]
pin: EBB4:PD3
color_order: GRB
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

############################################################################
# GCODE MACRO T4 — KTC-Easy (đừng thay đổi cấu trúc variable)
############################################################################

[gcode_macro T4]
description: Gắn đầu in T4
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=4

############################################################################
# FILAMENT SENSOR — Lọc nhiễu 3 lớp
#
# Lớp 1: event_delay 0.5s  — Klipper chặn spam event
# Lớp 2: delayed_gcode 0.5s — đợi xác nhận thêm 0.5s
# Lớp 3: recheck trong _FILAMENT_RUNOUT_HANDLE — đọc lại cảm biến thực tế
############################################################################

[filament_switch_sensor filament_sensor_T4]
switch_pin: ^EBB4:PB9
pause_on_runout: False
event_delay: 0.5
pause_delay: 0.5
runout_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T4 DURATION=0.5
    RESPOND MSG="[T4] Cảm biến báo hết nhựa — chờ xác nhận..."
insert_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T4 DURATION=0
    RESPOND MSG="[T4] Cảm biến phục hồi — hủy bộ đếm"

[delayed_gcode _FILTER_RUNOUT_T4]
gcode:
    _FILAMENT_RUNOUT_HANDLE T=4
