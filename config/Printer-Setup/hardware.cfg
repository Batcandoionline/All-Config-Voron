[extruder2]

[extruder3]

[extruder4]

#####################################################################
# 	Bed Heater - 1000W AC Silicone Pad + SSR
#####################################################################

[heater_bed]
heater_pin: PA1                # SSR control pin on Manta M8P V2.0 (1000W AC Silicone Pad)
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PB0                # TH0 thermistor port
max_power: 1
min_temp: 0
max_temp: 120
smooth_time: 3.0           # Filter out momentary ADC noise spikes
pwm_cycle_time: 0.2        # Reduce SSR switching EMI noise (5Hz instead of 10Hz)

[verify_heater heater_bed]
max_error: 200
check_gain_time: 240          # Large bed heater needs a longer response window (increased from 120s to 240s)
hysteresis: 5
heating_gain: 1
