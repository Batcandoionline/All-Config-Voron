# TOOL_VISION.CFG - Machine-specific production config for Tool Vision 2
# Project: https://github.com/IDcrazy123/Tool-Vision
#
# ACTIVE, NOT COMMISSIONED: the Klipper extra and host service are installed,
# and Axiscope is disabled so Tool Vision owns probe_multi_axis. The removable
# magnetic camera station is still deliberately unconfigured; manually measure
# it and review every motion value with a person at the printer before running
# any camera-station calibration.

[tool_vision]
#####################################################################
# Toolchanger integration
#####################################################################

reference_tool: 0
# This machine has five physical tools. Keep the production list explicit so
# config validation does not depend on the KTC connect-time discovery order.
tool_numbers: 0, 1, 2, 3, 4
toolchanger_object: toolchanger
tool_select_command: T{tool}

#####################################################################
# Vision service and native-resolution camera input
#####################################################################

server_url: http://127.0.0.1:8085

# Crowsnest uses the verified Moonraker/nginx reverse-proxy route on this
# printer. Raw port 8080 is intentionally not exposed to the LAN while
# `no_proxy: false`. Tool Vision reads the actual frame dimensions and never
# assumes 640x480. Browser test URL: http://192.168.1.43/webcam/stream
camera_source: http://192.168.1.43/webcam/stream
camera_mode: auto                 # auto | http | opencv
camera_rotation: 0                # 0 | 90 | 180 | 270
camera_flip_x: false
camera_flip_y: false

# Zero requests the native/default camera mode. Non-zero values are optional
# device requests for direct OpenCV/V4L2 inputs, not processing dimensions.
camera_width: 0
camera_height: 0
camera_fps: 0
camera_connect_timeout: 2.0
camera_read_timeout: 5.0
camera_max_frame_bytes: 8388608
camera_warmup_frames: 0

#####################################################################
# Removable magnetic camera station - REQUIRED before any station move
#####################################################################

# The MF-500 normally watches the chamber. When calibrating, place it on the
# keyed magnetic bed mount, check that it cannot rock or vibrate, jog T0 by
# hand, and enter the measured nozzle coordinates. Do not copy values from a
# different printer. Tool Vision refuses station motion while these stay absent.
# camera_x_pos: 0.0               # T0 nozzle X over the upward camera.
# camera_y_pos: 0.0               # T0 nozzle Y over the upward camera.
# camera_z_pos: 0.0               # Optical focus/measurement Z.
# camera_safe_z: 15.0             # Clearance before every XY station move.

# Ratios are evaluated against the transformed native frame, so the ROI and
# target remain resolution-independent.
camera_target_x_ratio: 0.5
camera_target_y_ratio: 0.5
camera_roi_x_min: 0.10
camera_roi_y_min: 0.10
camera_roi_x_max: 0.90
camera_roi_y_max: 0.90

#####################################################################
# Nozzle detector sensitivity
#####################################################################

detector_polarity: auto           # auto | dark | light
detector_gamma: 1.0
detector_sensitivity: 1.0         # 0.25 strict .. 4.0 permissive
detector_min_area_ratio: 0.0002
detector_max_area_ratio: 0.08
detector_min_circularity: 0.55
detector_min_convexity: 0.45
detector_min_inertia: 0.35
detector_min_confidence: 0.35
detector_adaptive_block_size: 35  # Odd number; even values round upward.
detector_adaptive_c: 3.0
detector_blur_size: 5             # Odd number; even values round upward.

# Accept a nozzle position only after several stable native-frame detections.
detection_stable_frames: 3
detection_stability_px: 2.0
detection_stability_ratio: 0.0
detection_timeout: 12.0
detection_frame_interval_ms: 120

#####################################################################
# Camera calibration and iterative centering
#####################################################################

camera_model: affine              # affine recommended | quadratic
camera_calibration_radius: 0.6
camera_calibration_points: 10
camera_max_rms_error: 0.08
camera_center_tolerance: 0.01
camera_center_max_iterations: 12
camera_center_max_correction: 2.0
camera_center_max_step: 0.6
camera_center_damping: 0.8

#####################################################################
# Motion - mm/s unless the option explicitly states another unit
#####################################################################

xy_travel_speed: 100
z_travel_speed: 10
camera_move_speed: 20
camera_fine_speed: 5
camera_settle_ms: 350

#####################################################################
# Physical Z switch - measured production values; do not infer new values
#####################################################################

pin: ^PF2
zswitch_x_pos: 68.0
zswitch_y_pos: -10.0
zswitch_z_pos: 7.0
zswitch_safe_z: 15.0
zswitch_lift_z: 2.0
probe_speed_ratio: 0.5
probe_max_distance: 10.0
probe_samples: 10

#####################################################################
# Safety, output, and machine-specific hooks
#####################################################################

allow_during_print: false
# Measurement output is separate; Tool Vision never edits production offsets.
result_file: ~/printer_data/config/tool_vision_results.json

# Keep staging hooks motion- and heat-free. Add controlled nozzle heating or
# cleaning here only during attended commissioning, then document the values.
start_gcode:
  M117 Tool Vision calibration

finish_gcode:
  M117 Tool Vision complete - review report

abort_gcode:
  M117 Tool Vision aborted
