# Tool Vision - Unified XYZ Tool Alignment for Klipper
# This file combines all config from kTAMV (XY) and Axiscope (Z)
#
# Rename TV_ commands:
#   TV_CALIB_CAMERA         = KTAMV_CALIB_CAMERA
#   TV_FIND_NOZZLE_CENTER   = KTAMV_FIND_NOZZLE_CENTER
#   TV_SET_ORIGIN           = KTAMV_SET_ORIGIN
#   TV_GET_OFFSET           = KTAMV_GET_OFFSET
#   TV_SIMPLE_NOZZLE_POSITION = KTAMV_SIMPLE_NOZZLE_POSITION
#   TV_SEND_SERVER_CFG      = KTAMV_SEND_SERVER_CFG
#   TV_START_PREVIEW        = KTAMV_START_PREVIEW
#   TV_STOP_PREVIEW         = KTAMV_STOP_PREVIEW
#   TV_MOVE_TO_ZSWITCH      = MOVE_TO_ZSWITCH
#   TV_PROBE_ZSWITCH        = PROBE_ZSWITCH
#   TV_CALIBRATE_ALL_Z      = CALIBRATE_ALL_Z_OFFSETS
#   TV_CALIBRATE_ALL_XY     = (new combined XY calibration)
#   TV_CALIBRATE_ALL        = (new combined XYZ calibration)
#   TV_SAVE_TOOL_OFFSET     = AXISCOPE_SAVE_TOOL_OFFSET
#   TV_SET_ENDSTOP_POSITION = AXISCOPE_SET_ENDSTOP_POSITION

[tool_vision]
# ─── Z Switch (from Axiscope) ───
pin: ^PF2
zswitch_x_pos: 68.0
zswitch_y_pos: -10.0
zswitch_z_pos: 7.0
lift_z: 1
z_move_speed: 10
samples: 10

# ─── Camera (from kTAMV) ───
nozzle_cam_url: http://127.0.0.1:8080/?action=stream
server_url: http://127.0.0.1:8085
move_speed: 1800
detection_tolerance: 0
send_frame_to_cloud: False

# ─── Config File for Saving Offsets ───
config_file_path: ~/printer_data/config/tool_vision.offsets

# ─── Custom GCode Templates (optional, leave empty to skip) ───
# start_gcode:
# before_pickup_gcode:
# after_pickup_gcode:
# finish_gcode:
