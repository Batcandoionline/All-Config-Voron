############################################################################
# FILAMENT DRYER MACROS - HEATED BUILD PLATE WITH CHAMBER REGULATION
# Voron 2.4 StealthChanger 5-Tool
#
# Optimized with empirical test data (1000W AC silicone bed, ~15C bed-to-chamber delta).
# Features:
# - Multi-zone dynamic airflow: Fast warm-up boost (65-85%), steady active moisture sweep (40-50%), and overheat guard.
# - Periodic Moisture Flush Pulse: 30-second high airflow pulse every 20 minutes to evacuate trapped humid air.
# - Optional humidity telemetry when an installed sensor extension exposes `.humidity`.
# - Automatic toolhead parking / tool docking (Z>=200mm, X:175, Y:310).
# - Amber/Orange Neopixel visual indication.
############################################################################

[gcode_macro _DRYER_HANDOFF_TO_PRINT]
description: Internal safety handoff that stops the dryer timer without changing print-owned heaters or fans
gcode:
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=0
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0
    RESPOND TYPE=echo MSG="[DRYER] Dryer timer stopped; PRINT_START now owns the bed heater and circulation fan."


[gcode_macro START_DRYER]
description: Start filament drying cycle with material preset or custom parameters
gcode:
    # Params (displayed in Mainsail macro form, matching CLEAN_NOZZLE style)
    {% set material        = params.MATERIAL|default("PETG")|string|upper %}
    {% set custom_bed      = params.BED|default(0.0)|float %}
    {% set custom_chamber  = params.CHAMBER|default(0.0)|float %}
    {% set time_mins       = params.TIME|default(0)|int %}
    {% set time_hours      = params.TIME_HOURS|default(0.0)|float %}
    {% set custom_fan      = params.FAN|default(0.0)|float %}
    {% set humidity_target = params.TARGET_HUMIDITY|default(params.HUMIDITY|default(0.0))|float %}
    {% set park_head       = params.PARK|default(1)|int %}

    # Material presets calibrated for the 1000W AC bed and enclosure airflow.
    {% if "PLA" in material %}
        {% set material_name = "PLA" %}
        {% set preset_bed = 50.0 %}
        {% set preset_chamber = 40.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.40 %}
    {% elif "TPU" in material or "TPE" in material %}
        {% set material_name = "TPU" %}
        {% set preset_bed = 60.0 %}
        {% set preset_chamber = 45.0 %}
        {% set preset_time = 300 %}
        {% set preset_fan = 0.40 %}
    {% elif "PETG" in material or "PET" in material %}
        {% set material_name = "PETG" %}
        {% set preset_bed = 70.0 %}
        {% set preset_chamber = 55.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.50 %}
    {% elif "ABS" in material %}
        {% set material_name = "ABS" %}
        {% set preset_bed = 90.0 %}
        {% set preset_chamber = 65.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.60 %}
    {% elif "ASA" in material %}
        {% set material_name = "ASA" %}
        {% set preset_bed = 90.0 %}
        {% set preset_chamber = 65.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.60 %}
    {% elif "NYLON" in material or "PA" in material %}
        {% set material_name = "NYLON" %}
        {% set preset_bed = 100.0 %}
        {% set preset_chamber = 70.0 %}
        {% set preset_time = 360 %}
        {% set preset_fan = 0.70 %}
    {% elif "PC" in material or "POLYCARBONATE" in material %}
        {% set material_name = "PC" %}
        {% set preset_bed = 105.0 %}
        {% set preset_chamber = 75.0 %}
        {% set preset_time = 360 %}
        {% set preset_fan = 0.70 %}
    {% elif material == "CUSTOM" or material == "" %}
        {% set material_name = "CUSTOM" %}
        {% set preset_bed = 55.0 %}
        {% set preset_chamber = 0.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.40 %}
    {% else %}
        {action_raise_error("[DRYER] Unsupported MATERIAL='%s'. Use PLA, TPU, PETG, ABS, ASA, NYLON, or PC." % material)}
    {% endif %}

    # Explicit parameters override the selected material preset (if > 0).
    {% set bed_temp = custom_bed if custom_bed > 0.0 else preset_bed %}
    {% set chamber_target = custom_chamber if custom_chamber > 0.0 else preset_chamber %}
    {% set fan_speed = custom_fan if custom_fan > 0.0 else preset_fan %}

    # Calculate total duration in minutes
    {% if time_hours > 0.0 %}
        {% set total_mins = (time_hours * 60)|int %}
    {% elif time_mins > 0 %}
        {% set total_mins = time_mins %}
    {% else %}
        {% set total_mins = preset_time %}
    {% endif %}
    {% set total_seconds = total_mins * 60 %}

    # Reject invalid advanced overrides before homing, moving, or heating.
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|float %}
    {% if bed_temp <= 0 or bed_temp >= bed_max %}
        {action_raise_error("[DRYER] BED must be above 0C and below the configured heater_bed max_temp of %.1fC." % bed_max)}
    {% elif chamber_target < 0 or chamber_target > 100 %}
        {action_raise_error("[DRYER] CHAMBER must be between 0C and 100C.")}
    {% elif humidity_target < 0 or humidity_target > 100 %}
        {action_raise_error("[DRYER] TARGET_HUMIDITY must be between 0 and 100 percent.")}
    {% elif total_seconds <= 0 %}
        {action_raise_error("[DRYER] TIME or TIME_HOURS must produce a duration greater than zero.")}
    {% elif fan_speed < 0 or fan_speed > 1 %}
        {action_raise_error("[DRYER] FAN must be between 0.0 and 1.0.")}
    {% elif park_head not in [0, 1] %}
        {action_raise_error("[DRYER] PARK must be 0 or 1.")}
    {% endif %}

    # Safety check: printer cannot be starting, printing, paused, or already drying.
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% set print_active = printer.print_stats.state|default("")|lower in ["printing", "paused"] or printer.pause_resume.is_paused or ps in ["starting", "printing", "paused"] %}
    {% set is_drying = printer["gcode_macro _DRYER_STATUS"].is_drying|default(0)|int %}
    {% if print_active %}
        RESPOND TYPE=error MSG="[DRYER] Cannot start filament dryer: Printer is currently printing or paused!"
    {% elif is_drying == 1 %}
        RESPOND TYPE=error MSG="[DRYER] Filament dryer is already running! Use STOP_DRYER to stop it first."
    {% else %}
        # Cancel any delayed shutdown left by PRINT_END before taking ownership
        # of the chamber circulation fan.
        UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=0

        # Safe toolhead parking & tool docking
        {% if park_head == 1 %}
            {% if "xyz" not in printer.toolhead.homed_axes %}
                M117 Homing XYZ before parking
                G28
            {% endif %}
            # Raise above a spool/part on the build plate before KTC traverses
            # toward a dock. KTC's dropoff path only adds a 1 mm local hop.
            G90
            {% set safe_z = [[printer.toolhead.position.z|float, 200.0]|max, printer.toolhead.axis_maximum.z|float]|min %}
            G0 Z{safe_z} F3000
            {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
            {% if active_tool >= 0 %}
                M117 Docking active tool T{active_tool}
                UNSELECT_TOOL
            {% endif %}
            G0 X175 Y310 F6000
        {% endif %}

        # Turn off all hotends during filament drying to save power and protect tool docks.
        {% for tn in printer.toolchanger.tool_numbers %}
            M104 S0 T{tn}
        {% endfor %}

        # Set LED indicator - warm amber/orange glow
        _SET_LED_STATUS_DRYING

        # Read chamber temperature and an optional extension-provided humidity field.
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(25.0)|float if has_chamber else 25.0 %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else -1.0 %}

        # Initial under-bed fan speed: boost if chamber is cold
        {% set initial_fan = fan_speed %}
        {% if chamber_target > 0 and cur_chamber < (chamber_target - 2.0) %}
            {% set initial_fan = [fan_speed + 0.25, 0.85]|min %}
            RESPOND TYPE=echo MSG="[DRYER] Chamber cold ({cur_chamber|round(1)}C < target {chamber_target}C). Boosting under-bed fan to {(initial_fan*100)|int}% for fast warm-up."
        {% endif %}

        # Turn on bed heater & under-bed circulation fan
        M140 S{bed_temp}
        {% if initial_fan > 0 %}
            SET_FAN_SPEED FAN=bed_fan SPEED={initial_fan}
        {% else %}
            SET_FAN_SPEED FAN=bed_fan SPEED=0
        {% endif %}

        # Initialize dryer state variables
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE={total_seconds}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=total_time VALUE={total_seconds}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=chamber_target VALUE={chamber_target}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=humidity_target VALUE={humidity_target}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=base_fan_speed VALUE={fan_speed}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=current_fan_speed VALUE={initial_fan}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=material VALUE='"{material_name}"'
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=1

        # Start 10-second timer loop
        UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=1

        {% if has_humidity and cur_humidity >= 0 %}
            M117 Dryer: B:{bed_temp|int}C C:{cur_chamber|int}C H:{cur_humidity|int}%
            RESPOND TYPE=echo MSG="[DRYER] Started {material_name}: Bed={bed_temp}C, Target Ch={chamber_target}C (Cur: {cur_chamber|round(1)}C, Humidity: {cur_humidity}%), Time={total_mins}m, Fan={(initial_fan * 100)|int}%"
        {% else %}
            M117 Dryer: Bed {bed_temp|int}C | Ch {cur_chamber|int}C
            RESPOND TYPE=echo MSG="[DRYER] Started {material_name}: Bed={bed_temp}C, Target Chamber={chamber_target}C (Current: {cur_chamber|round(1)}C), Time={total_mins}m ({(total_mins / 60)|round(1)}h), Fan={(initial_fan * 100)|int}%"
        {% endif %}
    {% endif %}


[gcode_macro STOP_DRYER]
description: Stop filament drying cycle and turn off heaters/fans
gcode:
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% set print_active = printer.print_stats.state|default("")|lower in ["printing", "paused"] or ps in ["starting", "printing", "paused"] %}
    {% if print_active %}
        # Never let a stale/manual dryer stop command turn off print-owned heat.
        _DRYER_HANDOFF_TO_PRINT
        RESPOND TYPE=echo MSG="[DRYER] Print is active; dryer state cleared without changing heaters, fans, or LEDs."
    {% else %}
        # Turn off bed heater and under-bed fan
        M140 S0
        SET_FAN_SPEED FAN=bed_fan SPEED=0

        # Reset dryer state and cancel every pending dryer/fan callback.
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE=0
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=0
        UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0
        UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=0

        # Restore LED status
        _SET_LED_STATUS_DRYING_COMPLETE

        M117 Dryer Stopped
        RESPOND TYPE=echo MSG="[DRYER] Stopped. Bed heater and under-bed fan turned off."
    {% endif %}


[gcode_macro DRYER_STATUS]
description: Print current filament dryer and chamber thermal statistics
gcode:
    {% set s = printer["gcode_macro _DRYER_STATUS"] %}
    {% if s.is_drying == 1 %}
        {% set elapsed_sec = s.total_time - s.time_remaining %}
        {% set el_hours = (elapsed_sec // 3600)|int %}
        {% set el_mins = ((elapsed_sec % 3600) // 60)|int %}
        {% set rem_hours = (s.time_remaining // 3600)|int %}
        {% set rem_mins = ((s.time_remaining % 3600) // 60)|int %}
        {% set progress = ((elapsed_sec / s.total_time) * 100)|round(1) %}
        {% set cur_bed = printer.heater_bed.temperature|round(1) %}
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(0)|round(1) if has_chamber else 'N/A' %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else 'N/A' %}
        RESPOND TYPE=echo MSG="=== FILAMENT DRYER STATUS ==="
        RESPOND TYPE=echo MSG="Material: {s.material}"
        RESPOND TYPE=echo MSG="Progress: {el_hours}h {el_mins}m / {(s.total_time / 3600)|round(1)}h ({progress}%) | Remaining: {rem_hours}h {rem_mins}m"
        RESPOND TYPE=echo MSG="Bed Temp: {cur_bed}°C / Target: {s.bed_temp}°C"
        RESPOND TYPE=echo MSG="Chamber Temp: {cur_chamber}°C / Target: {s.chamber_target}°C"
        {% if has_humidity and cur_humidity != 'N/A' %}
            RESPOND TYPE=echo MSG="Chamber Humidity: {cur_humidity}% RH{(' / Target: ' ~ s.humidity_target|string ~ '%') if s.humidity_target > 0 else ''}"
        {% endif %}
        RESPOND TYPE=echo MSG="Under-bed Fan: {(s.current_fan_speed * 100)|int}% (Base: {(s.base_fan_speed * 100)|int}%)"
    {% else %}
        RESPOND TYPE=echo MSG="[DRYER] Filament dryer is currently idle / OFF."
    {% endif %}


[gcode_macro _DRYER_STATUS]
description: Internal periodic status handler for filament dryer
variable_time_remaining: 0
variable_total_time: 0
variable_bed_temp: 0.0
variable_chamber_target: 0.0
variable_humidity_target: 0.0
variable_base_fan_speed: 0.0
variable_current_fan_speed: 0.0
variable_material: "CUSTOM"
variable_is_drying: 0
gcode:
    {% set tick_interval = 10 %}
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% set print_active = printer.print_stats.state|default("")|lower in ["printing", "paused"] or ps in ["starting", "printing", "paused"] %}
    {% if is_drying == 1 and print_active %}
        # A print has priority over a stale dryer callback. Do not touch heat,
        # fans, or LEDs because PRINT_START/PAUSE owns those resources now.
        _DRYER_HANDOFF_TO_PRINT
        RESPOND TYPE=echo MSG="[DRYER] Active print detected; stale dryer callback canceled safely."
    {% elif is_drying == 1 and time_remaining > 0 %}
        # Read live temperatures and optional extension-provided humidity.
        {% set cur_bed = printer.heater_bed.temperature|float %}
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(25.0)|float if has_chamber else 25.0 %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else -1.0 %}

        # Elapsed time in seconds
        {% set elapsed_sec = total_time - time_remaining %}

        # Multi-Zone Adaptive Regulation
        {% set target_fan = base_fan_speed %}
        {% set active_bed = bed_temp %}
        {% set mode_label = "Active Drying" %}

        {% if chamber_target > 0 %}
            # Zone 1: Cold Chamber Warm-up Boost (more than 2C below target)
            {% if cur_chamber < (chamber_target - 2.0) %}
                {% set target_fan = [base_fan_speed + 0.25, 0.85]|min %}
                {% set mode_label = "Warmup Boost" %}
            # Zone 2: Optimal Drying Window (target - 2C up to target + 3.5C)
            {% elif cur_chamber >= (chamber_target - 2.0) and cur_chamber <= (chamber_target + 3.5) %}
                # Every 20 minutes, increase airflow for 30 seconds, capped at 70%.
                {% if (elapsed_sec > 900) and (elapsed_sec % 1200 < 30) %}
                    {% set target_fan = [base_fan_speed + 0.25, 0.70]|min %}
                    {% set mode_label = "Moisture Flush" %}
                {% else %}
                    {% set target_fan = base_fan_speed %}
                    {% set mode_label = "Active Drying" %}
                {% endif %}
            # Zone 3: Warm Chamber (target + 3.5C to target + 6.0C)
            {% elif cur_chamber > (chamber_target + 3.5) and cur_chamber <= (chamber_target + 6.0) %}
                {% set target_fan = [base_fan_speed - 0.10, 0.30]|max %}
                {% set mode_label = "Gentle Sweep" %}
            # Zone 4: Overheat Safety (exceeds target + 6.0C)
            {% elif cur_chamber > (chamber_target + 6.0) %}
                {% set target_fan = [base_fan_speed - 0.20, 0.20]|max %}
                {% set active_bed = [bed_temp - 4.0, 45.0]|max %}
                {% set mode_label = "Overheat Guard" %}
            {% endif %}
        {% endif %}

        # Keep bed target alive (prevents idle_timeout) and update fan speed
        M140 S{active_bed}
        # Always send the target, including zero, so a previous non-zero fan
        # command cannot remain active after the requested speed drops to zero.
        SET_FAN_SPEED FAN=bed_fan SPEED={target_fan}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=current_fan_speed VALUE={target_fan}

        # Decrement remaining time
        {% set next_time = [time_remaining - tick_interval, 0]|max %}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE={next_time}

        {% set hours = (next_time // 3600)|int %}
        {% set mins = ((next_time % 3600) // 60)|int %}

        # Real-time LCD / Mainsail status display (shows time, bed, chamber, and humidity if available)
        {% if has_humidity and cur_humidity >= 0 %}
            M117 Dry {hours}h{mins}m | B:{cur_bed|int}C C:{cur_chamber|int}C H:{cur_humidity|int}%
        {% else %}
            M117 Dry {hours}h{mins}m | B:{cur_bed|int}C C:{cur_chamber|int}C
        {% endif %}

        # Periodic telemetry log every 10 minutes (600 seconds)
        {% if (next_time % 600 == 0) and (next_time > 0) %}
            {% set el_h = ((total_time - next_time) // 3600)|int %}
            {% set el_m = (((total_time - next_time) % 3600) // 60)|int %}
            {% set prog_pct = (((total_time - next_time) / total_time) * 100)|int %}
            {% if has_humidity and cur_humidity >= 0 %}
                RESPOND TYPE=echo MSG="[DRYER] {el_h}h {el_m}m / {(total_time / 3600)|round(1)}h ({prog_pct}%) | Bed: {cur_bed|round(1)}/{bed_temp}C | Chamber: {cur_chamber|round(1)}C (RH: {cur_humidity}%){('/' ~ chamber_target|string ~ 'C') if chamber_target > 0 else ''} | Fan: {(target_fan * 100)|int}% [{mode_label}]"
            {% else %}
                RESPOND TYPE=echo MSG="[DRYER] {el_h}h {el_m}m / {(total_time / 3600)|round(1)}h ({prog_pct}%) | Bed: {cur_bed|round(1)}/{bed_temp}C | Chamber: {cur_chamber|round(1)}{('/' ~ chamber_target|string ~ 'C') if chamber_target > 0 else 'C'} | Fan: {(target_fan * 100)|int}% [{mode_label}]"
            {% endif %}
        {% endif %}

        # Auto-complete when target humidity is reached (optional smart stopping with 1-hour minimum soak)
        {% set elapsed = total_time - next_time %}
        {% if humidity_target > 0 and has_humidity and cur_humidity <= humidity_target and elapsed >= 3600 %}
            RESPOND TYPE=echo MSG="[DRYER] Target humidity reached ({cur_humidity}% <= {humidity_target}%)! Filament is completely dry."
            STOP_DRYER
            M117 Drying Complete (Target RH)
        {% else %}
            # Schedule next tick or finish
            {% if next_time > 0 %}
                UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION={tick_interval}
            {% else %}
                STOP_DRYER
                RESPOND TYPE=echo MSG="[DRYER] Drying cycle complete! Bed cooling down."
                M117 Drying Complete
            {% endif %}
        {% endif %}
    {% elif is_drying == 1 %}
        STOP_DRYER
    {% endif %}


[delayed_gcode DRYER_TIMER]
gcode:
    _DRYER_STATUS


############################################################################
# FILAMENT DRYER
# Run from Mainsail macro panel (with inline parameter drawer) or console:
#   START_DRYER MATERIAL=PLA
#   START_DRYER MATERIAL=PETG TIME=180 BED=70
############################################################################


