############################################################################
# TOOLCHANGER-CONFIG.CFG — Cấu hình hệ thống StealthChanger
# Include sau cùng để override các settings mặc định.
############################################################################

# [rounded_path] - Bo tròn góc (Giảm jerk khi đổi tool)
[rounded_path]
resolution: 0.2   # Độ phân giải cung tròn (mm)
replace_g0: False # KHÔNG bật - Nguy hiểm

# [force_move] - Bắt buộc cho KTC-Easy
[force_move]
enable_force_move: True

############################################################################
# [toolchanger] - Tham số chính điều khiển quá trình đổi tool
############################################################################
[toolchanger]

# params_dropoff_path / params_pickup_path:
# Đường dẫn tương đối từ dock (params_park_x/y/z)
# x/y/z: offset, f: speed multiplier, verify: OptoTap check

# Đường dropoff (Bỏ tool vào dock)
params_dropoff_path: [{'y':9.5 ,'z':3}, {'y':9.5, 'z':1.5}, {'y':5.5, 'z':0}, {'z':0, 'y':0, 'f':0.5}, {'z':-12, 'y':0}, {'z':-12, 'y':16}]

# Đường pickup (Lấy tool từ dock)
params_pickup_path: [{'z':-12, 'y':16}, {'z':-12, 'y':0}, {'z':0, 'y':0, 'f':0.5, 'verify':1}, {'y':5.5, 'z':0}, {'y':9.5, 'z':1.5}, {'y':9.5 ,'z':3}]

before_change_gcode:
  # Đổi màu LED thành toolchange
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] is defined %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="''"
  {% endif %}
  _SET_TOOL_LED T={tool.tool_number} STATE=toolchange

# dropoff_gcode: Override để cập nhật LED ngay khi click tool vào dock
dropoff_gcode:
  {% set x = tool.params_park_x|float %}
  {% set y = tool.params_park_y|float %}
  {% set z = tool.params_park_z|float %}
  {% set fast = tool.params_fast_speed|float %}
  {% set path = tool.params_dropoff_path %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
  {% set cur_z = printer.toolhead.position[2]|float %}
  RESPOND TYPE=echo MSG='Dropping off {tool.name}'
  G90
  G0 Z{ [cur_z+1.0, max_z]|min } F{fast}
  ROUNDED_G0 Y={tool.params_safe_y} D=20 F={fast}
  ROUNDED_G0 X={x} D=150 F={fast}
  ROUNDED_G0 Z={z + path[0]['z']|float} D=20 F={fast}
  ROUNDED_G0 Y={y + path[0]['y']|float} D=0 F={fast}
  STOP_CRASH_DETECTION
  {% for pos in path %}
    {% set speed = tool.params_path_speed|float * (pos.get('f', 1.0)|float) %}
    G0 {% if 'x' in pos %}X{x + pos['x']|float}{% endif %} {% if 'y' in pos %}Y{y + pos['y']|float}{% endif %} {% if 'z' in pos %}Z{z + pos['z']|float}{% endif %} F{speed}
  {% endfor %}
  # Tool đã click vào dock — tắt LED về standby ngay lập tức
  _SET_TOOL_LED T={tool.tool_number} STATE=standby
  {% if pickup_tool is none %}
    G0 Y{tool.params_safe_y} F{fast}
  {% endif %}

# after_change_gcode: Cập nhật LED theo trạng thái và load Input Shaper
after_change_gcode:
  {% set tn = "T"+(tool.tool_number|string) %}
  {% if printer["gcode_macro " + tn ] is defined %}
     SET_GCODE_VARIABLE MACRO={tn} VARIABLE=color VALUE="'c44'"
  {% endif %}
  {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
  {% if ps == "printing" %}
    _SET_TOOL_LED T={tool.tool_number} STATE=printing
  {% elif ps == "paused" %}
    _SET_TOOL_LED T={tool.tool_number} STATE=pause
  {% else %}
    _SET_TOOL_LED T={tool.tool_number} STATE=ready
  {% endif %}
  _SYNC_INACTIVE_LEDS ACTIVE={tool.tool_number}
  {% if 'input_shaper' in printer.configfile.config %}
    {% set default_x_freq    = printer.configfile.config['input_shaper']['shaper_freq_x']|default(0)|float %}
    {% set default_x_type    = printer.configfile.config['input_shaper']['shaper_type_x']|default('mzv')|string %}
    {% set default_x_damping = printer.configfile.config['input_shaper']['damping_ratio_x']|default(0.1)|float %}
    {% set default_y_freq    = printer.configfile.config['input_shaper']['shaper_freq_y']|default(0)|float %}
    {% set default_y_type    = printer.configfile.config['input_shaper']['shaper_type_y']|default('mzv')|string %}
    {% set default_y_damping = printer.configfile.config['input_shaper']['damping_ratio_y']|default(0.1)|float %}
    SET_INPUT_SHAPER SHAPER_TYPE_X={tool.params_input_shaper_type_x if tool.params_input_shaper_type_x else default_x_type} SHAPER_FREQ_X={tool.params_input_shaper_freq_x if tool.params_input_shaper_freq_x else default_x_freq} SHAPER_TYPE_Y={tool.params_input_shaper_type_y if tool.params_input_shaper_type_y else default_y_type} SHAPER_FREQ_Y={tool.params_input_shaper_freq_y if tool.params_input_shaper_freq_y else default_y_freq} DAMPING_RATIO_X={tool.params_input_shaper_damping_ratio_x if tool.params_input_shaper_damping_ratio_x else default_x_damping} DAMPING_RATIO_Y={tool.params_input_shaper_damping_ratio_y if tool.params_input_shaper_damping_ratio_y else default_y_damping}
  {% endif %}

# params_safe_y: Vị trí Y an toàn khi di chuyển ngang qua khu vực dock
# Gantry phải ở Y >= safe_y trước khi di chuyển X sang dock tiếp theo
# (tránh va chạm với các tool đang nằm trong dock)
params_safe_y: 120

# params_close_y: Khoảng cách relative từ safe_y để áp vào dock khi pickup
# Gantry dừng cách dock params_close_y mm trước khi thực hiện pickup path
params_close_y: 30

# params_fast_speed: Tốc độ di chuyển nhanh (mm/min) bên ngoài khu vực dock
# Di chuyển từ vị trí in → safe_y → trước dock
params_fast_speed: 10000  # ~167mm/s

# params_path_speed: Tốc độ (mm/min) khi thực hiện pickup/dropoff path
# Tốc độ này dùng cho các bước tinh chỉnh trong dock - KHÔNG tăng quá cao
params_path_speed: 900    # ~15mm/s - an toàn cho cơ khí

# require_tool_present: Yêu cầu có tool trên shuttle mới cho phép move
# False khi dùng Cartographer/Beacon làm Z probe (không cần tool để home Z)
require_tool_present: False

############################################################################
# [homing_override_config] — Cấu hình homing
# KTC-Easy home Y trước (tránh kẹt cáp umbilical)
############################################################################
[gcode_macro homing_override_config]
description: Cấu hình homing (sensorless, rebound, dòng điện)
variable_sensorless_x: False
variable_sensorless_y: False
variable_homing_rebound_y: 20  # lùi 20mm sau home Y — gàntry không kẹt góc
variable_stepper_driver: "tmc2209"
variable_homing_current: 0.49  # dòng giảm khi home — tránh miss step

############################################################################
# [SET_TEMPERATURE_WITH_DEADBAND] - Override M109 với deadband
# Thay vì chờ đúng chính xác nhiệt độ, KTC cho phép sai số ± deadband/2
# VD: deadband=4.0 → M109 S150 sẽ tiếp tục khi đạt 148-152°C
# Tăng deadband → toolchange nhanh hơn nhưng nhiệt độ kém chính xác hơn
############################################################################
[gcode_macro SET_TEMPERATURE_WITH_DEADBAND]
description: Set nhiệt tool và chờ đạt trong khoảng ±deadband
variable_default_deadband: 4.0  # Dải chấp nhận = ±2°C quanh setpoint

############################################################################
# [_CALIBRATION_SWITCH] - Vị trí SexBall Probe (nozzle ~1mm trên đỉnh ball)
# Pin: PF2 (GND và PF2 — giống X/Y endstop PF0/PF1)
# Tọa độ đã đo thực tế: nozzle T0 cách 1mm trên đỉnh ball
#
# Để đo lại tọa độ:
#   1. G28 → QUAD_GANTRY_LEVEL → G28 Z
#   2. Di chuyển nozzle T0 đến ~1mm trên đỉnh ball
#   3. M114 → ghi lại X, Y, Z → điền vào đây
############################################################################
[gcode_macro _CALIBRATION_SWITCH]
variable_x: 254.9   # X tâm ball — cập nhật từ TOOL_LOCATE_SENSOR: (251.4+258.325)/2 = 254.86
variable_y: 324     # Y tâm ball — đã đo thực tế
variable_z: 60      # Z tiếp cận an toàn — 7mm trên đỉnh ball (Z_contact=52.3)
                    # Tăng từ 53→60: tránh kích hoạt switch khi nozzle di chuyển XY vào vị trí
gcode:

############################################################################
# [tools_calibrate] — SexBall Probe XY calibration
#
# ⚠️  ĐANG TẪT — hiện dùng AXISCOPE (probe-mesh.cfg) để calibrate XY offset.
#     Bỏ comment section này nếu muốn dùng SexBall để đo XY+Z cổ điển.
############################################################################
# [tools_calibrate]
# pin: ^PF2
# travel_speed: 20
# spread: 7
# lower_z: 1.0
# speed: 1
# lift_speed: 4
# final_lift_z: 6
# sample_retract_dist: 2
# samples_tolerance: 0.15
# samples: 5
# samples_result: median
# probe: probe
# trigger_to_bottom_z: 0.9   # Z_contact(52.3) − Z_trigger(51.4) = 0.9mm

############################################################################
# Description overrides — tiếng Việt cho các macro KTC readonly
# Klipper merge cùng tên section → chỉ cần khai báo description, gcode giữ nguyên
############################################################################
[gcode_macro _TAP_PROBE_ACTIVATE]
description: Giới hạn nozzle ≤150°C trước khi probe bàn

[gcode_macro RESUME]
description: Tiếp tục in — khởi tạo toolchanger và xác nhận có tool

[gcode_macro TOOL_ALIGN_START]
description: Bắt đầu căn chỉnh dock — di chuyển nozzle vào trước dock

[gcode_macro TOOL_ALIGN_TEST]
description: Thử pickup/dropoff tại tọa độ hiện tại

[gcode_macro TOOL_ALIGN_DONE]
description: Lưu vĩnh viễn tọa độ dock vào config

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Di chuyển nozzle đến trên SexBall probe

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Đo và lưu XYZ offset tất cả tool so với T0

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Calibrate z_offset của tool_probe bằng SexBall

[gcode_macro TOOL_BED_MESH_CALIBRATE]
description: Quét bed mesh có tính tool offset

[gcode_macro START_CRASH_DETECTION]
description: Bật giám sát va chạm tool trong lúc in

[gcode_macro STOP_CRASH_DETECTION]
description: Tắt giám sát va chạm (khi đổi tool hoặc kết thúc in)

