# Supervised TKC experiment, pinned to 780a492bad45399698491a355ab62db6954da9d7.
# Install outside the production config payload; see README.md in this folder.
# Do not include generated station/offset data in printer.cfg or apply offsets.

[tool_calibrator]
service_url: http://127.0.0.1:8090
camera_stream_url: http://127.0.0.1:8080/snapshot.jpg
offsets_config_path: /home/voron/printer_data/tkc-experiment/station-data.cfg
reference_tool: 0
tools: 0,1,2,3,4
safe_z: 40
# Camera region previously measured on this machine (2026-08-31).
camera_target_x: 170
camera_target_y: 20
camera_target_z: 40
# Speeds explicitly in mm/s; do not use the upstream ambiguous unit heuristic.
travel_speed: 30
approach_speed: 10
z_speed: 10
wiggle_on_failure: false
# Required backend object, but Z operations are blocked for this XY experiment.
z_backend: cartographer
touch_home_gcode: _TKC_Z_DISABLED
touch_probe_gcode: _TKC_Z_DISABLED
nozzle_led_macro_off: _TKC_NOZZLE_LED_OFF
nozzle_led_macro_on: _TKC_NOZZLE_LED_KEEP_OFF
before_pickup_gcode:
  _TKC_SAFE_TOOLCHANGE

[gcode_macro _TKC_Z_DISABLED]
gcode:
  {action_raise_error("TKC Z backend has not been validated in this experiment")}

[gcode_macro _TKC_SAFE_TOOLCHANGE]
gcode:
  {% if printer.toolhead.homed_axes != 'xyz' %}
    {action_raise_error("Home XYZ before TKC tool changes")}
  {% endif %}
  {% if printer.toolchanger.status != 'ready' or printer.toolchanger.tool_number|int != printer.toolchanger.detected_tool_number|int %}
    {action_raise_error("Active and detected tool must match")}
  {% endif %}
  G90
  {% set clearance = 40.0 + [printer.gcode_move.homing_origin.z|float, 0.0]|max %}
  {% if printer.gcode_move.gcode_position.z|float < clearance %}
    G0 Z{clearance} F600
  {% endif %}
  M400

[gcode_macro _TKC_NOZZLE_LED_OFF]
gcode:
  {% for tool in printer.toolchanger.tool_numbers %}
    SET_LED LED=T{tool}_LED RED=0 GREEN=0 BLUE=0 TRANSMIT=1
  {% endfor %}

[gcode_macro _TKC_NOZZLE_LED_KEEP_OFF]
gcode:
  # Keep tool LEDs off between frames; use the camera's built-in illumination.

[gcode_macro TKC_TEST_XY]
description: Supervised XY measurement with no offset write or Z probing
gcode:
  {% if printer.print_stats.state in ['printing', 'paused'] %}
    {action_raise_error("Finish or cancel the print before TKC experiments")}
  {% endif %}
  {% for heater in printer.heaters.available_heaters %}
    {% if printer[heater].target|float != 0 %}
      {action_raise_error("Turn off heater targets before the cold TKC experiment")}
    {% endif %}
  {% endfor %}
  _TKC_SAFE_TOOLCHANGE
  CALIBRATE_TOOL_OFFSETS TOOLS={params.TOOLS|default('0,1,2,3,4')} CALIBRATE_XY=1 CALIBRATE_Z=0 SAVE_CONFIG=0 DRY_RUN=0 CLEAN_NOZZLE=0 SAMPLES=3 WIGGLE=0
