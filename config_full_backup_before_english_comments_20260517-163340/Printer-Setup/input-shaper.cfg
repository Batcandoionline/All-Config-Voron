############################################################################
# INPUT-SHAPER.CFG — Resonance Tester & ShakeTune
# 
# ⚠️ MULTI-TOOL: KHÔNG dùng [input_shaper] toàn cục.
# KTC-Easy tự áp dụng input shaper của từng tool (khai báo tại Tools/Tn.cfg).
#
# CÁCH ĐO RUNG:
# 1. Gắn tool cần đo, home.
# 2. Sửa `accel_chip: adxl345 T1` bên dưới thành Tn tương ứng.
# 3. Chạy `AXES_SHAPER_CALIBRATION`. Cập nhật kết quả vào Tools/Tn.cfg.
############################################################################

[resonance_tester]
accel_chip: adxl345 T1  # ← đổi Tn khi đo tool khác (T0/T1/.../T4)
probe_points: 180, 168, 20
sweeping_accel: 400
sweeping_period: 0

[shaketune]
result_folder: ~/printer_data/config/ShakeTune_results
number_of_results_to_keep: 5
keep_raw_data: False
show_macros_in_webui: True
timeout: 900    # Đủ thời gian cho CM4 xử lý đồ thị
max_freq: 150   # >= max tần số macro test (134Hz)
dpi: 150        # 150dpi thay vì 300 — ảnh nhỏ 4x, tiết kiệm RAM
