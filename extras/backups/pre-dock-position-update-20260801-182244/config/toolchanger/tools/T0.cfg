############################################################################
# T0.cfg - Toolhead 0 (EBB36 V1.2) - KTC-Easy / OrcaSlicer Multi-Color
#
# Board  : BIGTREETECH EBB36 V1.2 (STM32G0B1, CAN bus)
# Hotend : TZ V6 2.0  |  Extruder: WW BMG
# Tool   : T0, reference tool (gcode_x/y/z_offset = 0)
#
# Official documentation:
#   https://stealthchanger.com/software/ktc-easy/examples/#ebb36-v12-t0-non-tap
############################################################################

############################################################################
# MCU
############################################################################

[mcu EBB0]
canbus_uuid: 441e1484ac41
canbus_interface: can0

############################################################################
# ADXL345 - Input Shaper
############################################################################

[adxl345 T0]
cs_pin: EBB0:PB12
spi_software_sclk_pin: EBB0:PB10
spi_software_mosi_pin: EBB0:PB11
spi_software_miso_pin: EBB0:PB2
axes_map: x,z,-y

############################################################################
# EXTRUDER - WW BMG + TZ V6 2.0
############################################################################

[extruder]
step_pin: EBB0:PD0
dir_pin: !EBB0:PD1
enable_pin: !EBB0:PD2
heater_pin: EBB0:PB13
sensor_pin: EBB0:PA3
sensor_type: Generic 3950

microsteps: 16
rotation_distance: 22.321
gear_ratio: 50:10
full_steps_per_rotation: 200

nozzle_diameter: 0.400
filament_diameter: 1.750
min_temp: 0
max_temp: 290
max_extrude_only_distance: 101

# PID parameters are updated by SAVE_CONFIG after PID_CALIBRATE.
# pressure_advance: 0.03  # Calibrate and uncomment after measuring.

############################################################################
# TMC2209
############################################################################

[tmc2209 extruder]
uart_pin: EBB0:PA15
run_current: 0.6
stealthchop_threshold: 0

############################################################################
# FANS
############################################################################

[heater_fan T0_hotend_fan]
pin: EBB0:PA0
heater: extruder
heater_temp: 50.0

[fan_generic T0_part_fan]
pin: EBB0:PA1

############################################################################
# TOOL DEFINITION - KTC-Easy
############################################################################

[tool T0]
tool_number: 0
extruder: extruder
fan: T0_part_fan
detection_pin: ^!EBB0:PB6

# Dock position in nozzle coordinates; must be aligned on the real machine.
params_park_x: 30.70
params_park_y: 1.8
params_park_z: 343

# T0 is the reference tool, so offsets are always 0.
gcode_x_offset: 0
gcode_y_offset: 0
# gcode_z_offset is not declared here; SAVE_CONFIG writes it after CALIBRATE_ALL_OFFSETS.

# Standby temperature while parked; KTC manages this automatically after each dropoff.
params_standby_temp: 150
params_heater_standby_delay: 0.1

# Input Shaper measured on 2026-04-26 with ShakeTune AXES_SHAPER_CALIBRATION.
# X axis: Best shaper (3HUMP_EI @ 88.4 Hz)
params_input_shaper_freq_x: 98.6
params_input_shaper_type_x: '3hump_ei'
params_input_shaper_damping_ratio_x: 0.081
# Y axis: Best shaper (2HUMP_EI @ 58.4 Hz)
params_input_shaper_freq_y: 35
params_input_shaper_type_y: 'mzv'
params_input_shaper_damping_ratio_y: 0.076

############################################################################
# NEOPIXEL - 3x WS2812
############################################################################

[neopixel T0_LED]
pin: EBB0:PD3
color_order: GRB
chain_count: 3
initial_RED: 0.5
initial_GREEN: 0.5
initial_BLUE: 0.5

############################################################################
# GCODE MACRO T0
############################################################################

[gcode_macro T0]
description: Mount toolhead T0
variable_active: 0
variable_color: ""
gcode:
    SELECT_TOOL T=0

############################################################################
# FILAMENT SENSOR
############################################################################

[filament_switch_sensor filament_sensor_T0]
switch_pin: ^EBB0:PB9
pause_on_runout: False
event_delay: 0.5
pause_delay: 0.5
runout_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T0 DURATION=0.5
    RESPOND MSG="[T0] Filament sensor reports runout; waiting for confirmation..."
insert_gcode:
    UPDATE_DELAYED_GCODE ID=_FILTER_RUNOUT_T0 DURATION=0
    RESPOND MSG="[T0] Filament sensor recovered; canceling debounce counter"

[delayed_gcode _FILTER_RUNOUT_T0]
gcode:
    _FILAMENT_RUNOUT_HANDLE T=0
