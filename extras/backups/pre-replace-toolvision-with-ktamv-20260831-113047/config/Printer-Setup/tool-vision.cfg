[gcode_macro _TOOL_VISION_UI_RESULTS_DIAGNOSTICS]
gcode:
  {% set tv = printer.tool_vision %}
  {% set environment = tv.last_environment %}
  {% set failure = tv.last_failure_evidence %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Result diagnostics"
    RESPOND TYPE=command MSG="action:prompt_text Validation: {('thresholds not configured' if tv.last_session_classification == 'COMPLETED_NO_THRESHOLDS' else tv.last_session_status)} | Compare: {tv.last_production_comparison.assessment|default('NOT_EVALUATED')}"
    {% if tv.last_result_primary_error|default('', true) and failure.kind|default('') != "cartographer_sample_window" %}
      RESPOND TYPE=command MSG="action:prompt_text Primary: {tv.last_result_primary_error}"
    {% endif %}
    {% if tv.last_result_cleanup_summary|default('', true) %}
      RESPOND TYPE=command MSG="action:prompt_text Cleanup: {tv.last_result_cleanup_summary}"
    {% endif %}
    {% if tv.last_cleanup_recovery|default([])|length > 0 %}
      {% set recovery = tv.last_cleanup_recovery[-1] %}
      {% set recovery_state = recovery.restored_original_state|default(recovery.recovery_state|default({})) %}
      RESPOND TYPE=command MSG="action:prompt_text Recovery: {tv.last_cleanup_recovery|length} hook run(s) | {recovery_state.status|default('unknown')} | active T{recovery_state.active_tool|default('?')} | detected T{recovery_state.detected_tool|default('?')}"
    {% endif %}
    {% if failure.kind|default('') == "cartographer_sample_window" %}
      RESPOND TYPE=command MSG="action:prompt_text Sampling T{failure.tool}: {failure.attempted_touches} touches | need {failure.required_samples} in {failure.window_touches} | tolerance {failure.acceptance_spread_mm} mm"
      {% if failure.raw_touch_samples|default(none) is not none %}
        RESPOND TYPE=command MSG="action:prompt_text Public raw: {failure.raw_touch_sample_count}/{failure.attempted_touches} | spread {('%.4f'|format(failure.observed_spread_mm))} mm | descriptive only"
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_text Raw rejected touches unavailable from the reviewed public error contract."
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_text Clean contact surfaces and verify seating/rigidity/model before one attended retry. No auto-retry or relaxed tolerance."
    {% endif %}
    {% if environment.bed is defined and environment.bed.end is defined %}
      RESPOND TYPE=command MSG="action:prompt_text Bed {environment.bed.end.actual_c|default('n/a')}/{environment.bed.end.target_c|default('n/a')} C - {environment.bed.end.stability|default('unknown')} | Nozzle request {environment.nozzle.requested_c|default('n/a')} C"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_RESULTS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

