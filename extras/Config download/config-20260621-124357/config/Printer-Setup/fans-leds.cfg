############################################################################
# FANS-LEDS.CFG - Electronics bay fans, chamber lights, toolhead LEDs
# Voron 2.4 StealthChanger | Manta M8P V2 + CM4
#
# Includes:
#   - controller_fan and temperature_fan for electronics cooling
#   - neopixel chamber_lights + LIGHTS_ON/OFF
#   - LED state machine for toolheads, T0-Tn, dynamic
#   - Mainsail client hooks (PAUSE/RESUME/CANCEL_PRINT)
############################################################################

############################################################################
# ELECTRONICS BAY FANS
############################################################################

# TMC2209 cooling fan: runs while steppers are active, then stays on for a
# long cooldown period. This protects the drivers during heat soak and after
# long prints without requiring a permanently forced fan.
[controller_fan tmc_fan]
pin: PF9                           # Fan1 on Manta M8P V2 (VF1 PF9)
kick_start_time: 0.5               # 0.5 s startup pulse to ensure the fan spins
fan_speed: 1.0                     # 100% while steppers are active
idle_speed: 1.0                    # 100% during the idle cooldown period
idle_timeout: 3600                 # Keep cooling for 1 hour after the listed steppers go idle
stepper: stepper_x, stepper_y, stepper_z

# CM4 SoC cooling fan: turns on when SoC temperature is above 50 C
[temperature_fan cm4_fan]
pin: PF6                           # Fan2 on Manta M8P V2 (VF2 PF6)
sensor_type: temperature_host      # Read temperature from the CM4 SoC
min_temp: 10
max_temp: 100
target_temp: 50.0
control: watermark
max_delta: 3.0
# --- PID tuning: comment the watermark/max_delta lines above and uncomment below ---
# control: pid
# pid_Kp: 1.0
# pid_Ki: 0.5
# pid_Kd: 2.0
# pid_deriv_time: 2.0
# min_speed: 0.2
# max_speed: 1.0

# Electronics bay cooling fan: turns on when Manta MCU is above 55 C
[temperature_fan enclosure_fan]
pin: PF7                           # Fan0 on Manta M8P V2 (VF0 PF7)
sensor_type: temperature_mcu       # Read temperature from the Manta M8P MCU
min_temp: 10
max_temp: 100
target_temp: 55.0
control: watermark
max_delta: 3.0
# --- PID tuning: comment the watermark/max_delta lines above and uncomment below ---
# control: pid
# pid_Kp: 1.0
# pid_Ki: 0.5
# pid_Kd: 2.0
# pid_deriv_time: 2.0
# min_speed: 0.2
# max_speed: 1.0

############################################################################
# BED FAN / CHAMBER CIRCULATION (similar to Nevermore)
############################################################################

# Chamber circulation fan connected to Fan3
[fan_generic bed_fan]
pin: PF8                           # Fan3 on Manta M8P V2 (VF3 PF8)
kick_start_time: 0.5               # 0.5 s startup pulse to ensure the fan spins

[gcode_macro BED_FAN_ON]
description: Turn on the chamber circulation fan (0-1.0, default 0.5)
gcode:
    {% set speed = [[params.SPEED|default(0.5)|float, 0.0]|max, 1.0]|min %}
    SET_FAN_SPEED FAN=bed_fan SPEED={speed}
    RESPOND TYPE=echo MSG="Bed fan speed: {(speed * 100)|int}%"

[gcode_macro BED_FAN_OFF]
description: Turn off the chamber circulation fan
gcode:
    SET_FAN_SPEED FAN=bed_fan SPEED=0
    RESPOND TYPE=echo MSG="Bed fan off"

[delayed_gcode bed_fan_off_delay]
gcode:
    BED_FAN_OFF



############################################################################
# CHAMBER LIGHTING - Neopixel 40 LED
############################################################################

[neopixel chamber_lights]
pin: PD15                  # Chamber LED strip data pin on Manta M8P
chain_count: 40            # 40 WS2812B LEDs chained as one strip
color_order: GRB           # WS2812B uses G-R-B order
initial_RED: 0             # Off at startup
initial_GREEN: 0
initial_BLUE: 0

[gcode_macro LIGHTS_ON]
description: Turn chamber lights on, white 100%
gcode:
    SET_LED LED=chamber_lights RED=1 GREEN=1 BLUE=1 TRANSMIT=1

[gcode_macro LIGHTS_OFF]
description: Turn chamber lights off
gcode:
    SET_LED LED=chamber_lights RED=0 GREEN=0 BLUE=0 TRANSMIT=1

############################################################################
# TOOLHEAD LED CONFIGURATION - State Machine
#
# HARDWARE ARCHITECTURE:
#   - Each toolhead has [neopixel Tx_LED] with 3 WS2812 LEDs: T0_LED, T1_LED, ...
#   - LED 1, INDEX=1, front: status indicator with state-dependent color
#   - LED 2 and 3, INDEX=2&3, rear: print-zone and hotend lighting
#
# STATE TABLE (10 STATES):
# STATE       | LED 1 status color          | LED 2 & 3  | Activated by
# standby     | filament color / dark blue  | dark blue  | Tool parked, inactive
# ready       | warm white (0.50,0.40,0.20) | bright white | Active, printer waiting
# heating     | orange (1.00,0.40,0.00)    | bright white | Heating in PRINT_START
# toolchange  | amber (1.00,0.65,0.00)     | pale yellow | before_change_gcode pickup/dropoff
# leveling    | cyan (0.00,0.80,0.80)      | bright white | G28 / QGL / Cartographer probe
# calibrating | purple (0.50,0.00,0.90)    | bright white | CALIBRATE_ALL_OFFSETS with SexBall
# cleaning    | light blue (0.20,0.60,1.00)| bright white | CLEAN_NOZZLE running
# printing    | blue (0.00,0.00,1.00)      | bright white | After PRINT_START, printing
# pause       | magenta (0.80,0.00,0.80)   | bright white | PAUSE
# complete    | green (0.00,1.00,0.00)     | bright white | PRINT_END
# error       | red (1.00,0.00,0.00)       | all red      | System error, all tools red
#
#
#
#
# PRIORITY ORDER (no polling; event-driven):
#   error > toolchange > leveling > calibrating > cleaning > heating > printing > pause > complete > ready > standby
#
# EVENT-DRIVEN ARCHITECTURE:
#   Each state is set directly when its event happens; no delayed_gcode polling.
#   Zero overhead and immediate response.
#
#   _SET_LED_STATUS_HEATING    -> PRINT_START step 1, before M190
#   _SET_LED_STATUS_LEVELING   -> G32 / G28 / QUAD_GANTRY_LEVEL
#   _SET_LED_STATUS_TOOLCHANGE -> before_change_gcode in toolchanger-config.cfg
#   _SET_LED_STATUS_CALIBRATING-> CALIBRATE_ALL_OFFSETS wrapper
#   _SET_LED_STATUS_CLEANING   -> CLEAN_NOZZLE
#   _SET_LED_STATUS_PRINTING   -> final PRINT_START step, after prime line
#   _SET_LED_STATUS_PAUSE      -> user_pause_macro hook in _CLIENT_VARIABLE
#   _SET_LED_STATUS_COMPLETE   -> PRINT_END
#   _SET_LED_STATUS_ERROR      -> called manually when needed
#   _SET_LED_STATUS_READY      -> after each step finishes: leveling, clean, etc.
############################################################################

############################################################################
# BASE MACRO: _SET_TOOL_LED T=<n> STATE=<state>
#
# Klipper Jinja does not allow variable assignment inside if/else branches due to scoping.
# Each branch must call SET_LED directly; do not use namespace here
# because g-code commands are executed inside each branch, not variable assignments.
#
# TRANSMIT=0 for LED 1 & 2, TRANSMIT=1 implicit for LED 3:
# Klipper batches the three LED updates and transmits one SPI frame when TRANSMIT=1.
# Reversing this order causes visible flashing.
############################################################################

[gcode_macro _SET_TOOL_LED]
description: Set toolhead LED color by state (internal)
gcode:
    {% set t     = params.T|int %}
    {% set state = params.STATE|default("standby")|string|lower %}
    {% set led   = "T" + t|string + "_LED" %}

    # Skip if the tool is not connected to avoid errors.
    {% if printer["neopixel " ~ led] is defined %}

        {% if state == "standby" %}
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=3 TRANSMIT=1

        {% elif state == "ready" %}
            SET_LED LED={led} RED=0.50 GREEN=0.40 BLUE=0.20 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "heating" %}
            SET_LED LED={led} RED=1.00 GREEN=0.40 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "leveling" %}
            SET_LED LED={led} RED=0.00 GREEN=0.80 BLUE=0.80 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "cleaning" %}
            SET_LED LED={led} RED=0.20 GREEN=0.60 BLUE=1.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "toolchange" %}
            # Amber: indicates pickup/dropoff is in progress.
            # LED 2&3 are pale yellow, not white, to reduce glare while mechanics are moving.
            SET_LED LED={led} RED=1.00 GREEN=0.65 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.20 BLUE=0.00 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.20 BLUE=0.00 INDEX=3 TRANSMIT=1

        {% elif state == "calibrating" %}
            # Purple: calibrating XYZ offsets with the SexBall probe.
            SET_LED LED={led} RED=0.50 GREEN=0.00 BLUE=0.90 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "printing" %}
            SET_LED LED={led} RED=0.00 GREEN=0.00 BLUE=1.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "pause" %}
            SET_LED LED={led} RED=0.80 GREEN=0.00 BLUE=0.80 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "complete" %}
            SET_LED LED={led} RED=0.00 GREEN=1.00 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "error" %}
            # All red: use all 3 LEDs so the error is visible from far away.
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=3 TRANSMIT=1

        {% else %}
            # Fallback: invalid state; warn and set standby to fail safe.
            RESPOND TYPE=error MSG="[LED] Invalid state: '{state}' for T{t}; setting standby"
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=3 TRANSMIT=1

        {% endif %}
    {% else %}
        # LED does not exist; this is not an error, only log when debugging is needed.
        # RESPOND TYPE=echo MSG="[LED] {led} not found in printer; skipping"
    {% endif %}

############################################################################
# UTILITIES: manage all toolheads at once
############################################################################

# Set all toolhead LEDs to the same state.
# Example: _ALL_TOOLHEADS_LED_SET STATE=standby
#         _ALL_TOOLHEADS_LED_SET STATE=error
[gcode_macro _ALL_TOOLHEADS_LED_SET]
description: Set all toolhead LEDs to the same state
gcode:
    {% set state = params.STATE|default("standby")|string|lower %}
    {% for tn in printer.toolchanger.tool_numbers %}
        _SET_TOOL_LED T={tn} STATE={state}
         G4 P10  # Avoid saturating the CAN bus
    {% endfor %}

# Short alias: set all toolheads to standby, dim dark blue.
[gcode_macro _ALL_TOOLHEADS_LED_OFF]
description: Set all toolhead LEDs to standby, very dim dark blue
gcode:
    _ALL_TOOLHEADS_LED_SET STATE=standby

############################################################################
# CONTRAST MANAGEMENT: active tool bright, parked tools dim
#
# _SYNC_INACTIVE_LEDS: dim every non-active tool to standby.
#   - Called from after_change_gcode after every tool change.
#   - ACTIVE parameter: active tool number passed from after_change_gcode.
#   - Fallback: read printer.toolchanger.tool_number when called manually.
#
# _SET_ACTIVE_TOOL_READY: set the tool currently on the shuttle to ready.
#   - Called at boot by LED_INIT or after clearing state.
############################################################################

[gcode_macro _SYNC_INACTIVE_LEDS]
description: Dim all parked tools to standby after a tool change
gcode:
    {% set active = params.ACTIVE|default(printer.toolchanger.tool_number|default(-1))|int %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% if tn != active %}
            _SET_TOOL_LED T={tn} STATE=standby
             G4 P10  # Avoid saturating the CAN bus
        {% endif %}
    {% endfor %}

[gcode_macro _SET_ACTIVE_TOOL_READY]
description: Set the tool currently on the shuttle to ready at boot or after clearing state
gcode:
    {% set active = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active >= 0 %}
        _SET_TOOL_LED T={active} STATE=ready
    {% endif %}

############################################################################
# POST-BOOT INITIALIZATION - one-shot delayed_gcode
#
# Run 2 s after boot so the toolchanger has finished initializing.
# Do not reduce below 1.5 s; printer.toolchanger needs time to load.
############################################################################

[delayed_gcode LED_INIT]
initial_duration: 2
gcode:
    # Check that the toolchanger has initialized before accessing tool_numbers.
    {% if printer.toolchanger is defined and printer.toolchanger.tool_numbers is defined %}
        _ALL_TOOLHEADS_LED_SET STATE=standby
        _SET_ACTIVE_TOOL_READY
    {% else %}
        # Toolchanger is not ready yet; retry after 1 s.
        RESPOND TYPE=echo MSG="[LED_INIT] Toolchanger not ready; retrying in 1 s"
        UPDATE_DELAYED_GCODE ID=LED_INIT DURATION=1
    {% endif %}

############################################################################
# PRINT STATE TRACKING VARIABLE - used by after_change_gcode
#
# Fix: use _PRINT_STATE instead of printer.print_stats.state.
# print_stats.state is not reliable during tool changes.
# Solution: use a private variable and set/clear it at known points:
#   PRINT_START step 14 -> "printing"
#   PAUSE hook          -> "paused"
#   RESUME hook         -> "printing"
#   PRINT_END           -> "idle"
#   CANCEL_PRINT        -> "idle"
############################################################################

[gcode_macro _PRINT_STATE]
description: Internal variable tracking print state: printing/paused/idle
variable_state: "idle"
gcode:
    # No gcode; this macro only stores a variable.

############################################################################
# WRAPPER MACROS - call at state transition points in other macros
#
# Rule: only set the active tool LED.
# Parked tools are not changed; they are already set to standby by after_change_gcode.
############################################################################

[gcode_macro _SET_LED_STATUS_READY]
description: Warm white LED; printer is ready
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=ready
    {% endif %}

[gcode_macro _SET_LED_STATUS_HEATING]
description: Orange LED; heating
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=heating
    {% endif %}

[gcode_macro _SET_LED_STATUS_LEVELING]
description: Cyan LED; homing, QGL, or Cartographer probe
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=leveling
    {% endif %}

[gcode_macro _SET_LED_STATUS_CALIBRATING]
description: Purple LED; calibrating XYZ offsets with the SexBall probe
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=calibrating
    {% endif %}

[gcode_macro _SET_LED_STATUS_CLEANING]
description: Light blue LED; CLEAN_NOZZLE is running
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=cleaning
    {% endif %}

[gcode_macro _SET_LED_STATUS_TOOLCHANGE]
description: Amber LED; pickup/dropoff is in progress
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=toolchange
    {% endif %}

[gcode_macro _SET_LED_STATUS_PRINTING]
description: Blue LED; printing
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    # Protection: reset all non-active tools to standby.
    # Fix cyan LED: if a tool is stuck in leveling/heating during PRINT_START,
    # this command clears it before printing actually begins.
    _SYNC_INACTIVE_LEDS

# Delayed sync after RESUME: make sure printing LED is set after
# RESUME_BASE and KTC after_change_gcode have finished.
# Called from user_resume_macro hook or _FILAMENT_RUNOUT_PAUSE.
[delayed_gcode _RESUME_LED_SYNC]
initial_duration: 0
gcode:
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% if ps == "printing" %}
        {% set t = printer.toolchanger.tool_number|default(-1)|int %}
        {% if t >= 0 %}
            _SET_TOOL_LED T={t} STATE=printing
        {% endif %}
        _SYNC_INACTIVE_LEDS
    {% endif %}
# _LED_RESUME_WRAPPER - hook for user_resume_macro during RESUME
# Runs before RESUME_BASE according to the mainsail.cfg flow.
# 1. Set _PRINT_STATE to "printing" immediately so KTC after_change_gcode
#    reads the correct state when resume moves the toolhead.
# 2. Set printing LED immediately.
# 3. Trigger _RESUME_LED_SYNC after 1.5 s as a safety net to ensure LEDs are correct
#    after RESUME_BASE and all after_change_gcode handlers have finished.
[gcode_macro _LED_RESUME_WRAPPER]
description: RESUME hook wrapper; set printing LED and schedule delayed sync
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    _SYNC_INACTIVE_LEDS
    # Safety net: run LED sync again after 1.5 s so after_change_gcode has finished.
    UPDATE_DELAYED_GCODE ID=_RESUME_LED_SYNC DURATION=1.5

[gcode_macro _SET_LED_STATUS_PAUSE]
description: Magenta LED; print is paused
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'paused'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=pause
    {% endif %}

[gcode_macro _SET_LED_STATUS_COMPLETE]
description: Green LED; print completed
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=complete
    {% endif %}

[gcode_macro _SET_LED_STATUS_ERROR]
description: All-red LED; system error on every tool
gcode:
    _ALL_TOOLHEADS_LED_SET STATE=error

############################################################################
# MAINSAIL CLIENT HOOKS AND RESUME OVERRIDE
#
# INTEGRATION STRATEGY:
#   mainsail.cfg declares full PAUSE / RESUME / CANCEL_PRINT behavior.
#   KTC-Easy readonly also declares RESUME to initialize and verify the
#   toolchanger before calling RESUME_BASE.
#
#   Because same-named sections are merged and later gcode can replace earlier
#   gcode, this file provides the final RESUME implementation. It intentionally
#   combines both requirements:
#     1. KTC-Easy: INITIALIZE_TOOLCHANGER + VERIFY_TOOL_DETECTED.
#     2. Mainsail: idle timeout restore, temperature restore, runout check,
#        user_resume_macro hook, client unretract, and RESUME_BASE velocity.
#
#   PAUSE and CANCEL_PRINT remain the Mainsail implementations. Their hooks are
#   configured through _CLIENT_VARIABLE:
#     variable_user_pause_macro  -> runs immediately after PAUSE_BASE to set pause LED
#     variable_user_resume_macro -> runs before _CLIENT_EXTRUDE/RESUME_BASE to set printing LED
#     variable_user_cancel_macro -> runs before CANCEL_PRINT_BASE to clean up the toolchanger
#
#   All hooks are single-line macro names; mainsail calls "{macro_name}".
#   For multiple commands, create a wrapper macro and set that macro name in the variable.
#
# CANCEL_PRINT FLOW (mainsail.cfg:63):
#   restore idle_timeout -> _TOOLHEAD_PARK_PAUSE_CANCEL -> _CLIENT_RETRACT
#   -> TURN_OFF_HEATERS -> M106 S0 -> {user_cancel_macro} <- HERE
#   -> SET_GCODE_VARIABLE idle_state=False -> CANCEL_PRINT_BASE
#
# PAUSE FLOW (mainsail.cfg:93):
#   PAUSE_BASE -> {user_pause_macro} <- HERE -> _TOOLHEAD_PARK_PAUSE_CANCEL
#
# RESUME FLOW (mainsail.cfg:114):
#   idle check -> temp restore -> {user_resume_macro=_LED_RESUME_WRAPPER} <- HERE
#   -> _CLIENT_EXTRUDE -> RESUME_BASE
#   -> 1.5 s -> _RESUME_LED_SYNC, safety net to ensure LED is correct after after_change_gcode
############################################################################

[gcode_macro RESUME]
description: Resume print with KTC tool verification and Mainsail safety checks
rename_existing: RESUME_BASE
variable_last_extruder_temp: {'restore': False, 'temp': 0}
variable_restore_idle_timeout: 0
variable_idle_state: False
gcode:
  # KTC-Easy requirement: refresh toolchanger state and confirm that the
  # currently active tool is still detected before motion/extrusion resumes.
  INITIALIZE_TOOLCHANGER
  VERIFY_TOOL_DETECTED

  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE']|default({}) %}
  {% set velocity = printer.configfile.settings.pause_resume.recover_velocity %}
  {% set sp_move = client.speed_move|default(velocity) %}
  {% set runout_resume = True if client.runout_sensor|default("") == ""
                    else True if not printer[client.runout_sensor].enabled
                    else printer[client.runout_sensor].filament_detected %}
  {% set can_extrude = True if printer.toolhead.extruder == ''
                  else printer[printer.toolhead.extruder].can_extrude %}
  {% set do_resume = False %}
  {% set prompt_txt = [] %}
  ##### end of definitions #####

  #### Printer coming from timeout idle state ####
  {% if printer.idle_timeout.state|upper == "IDLE" or idle_state %}
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=idle_state VALUE=False
    {% if last_extruder_temp.restore %}
      RESPOND TYPE=echo MSG='{"Restoring \"%s\" temperature to %3.1f\u00B0C, this may take some time" % (printer.toolhead.extruder, last_extruder_temp.temp) }'
      M109 S{last_extruder_temp.temp}
      {% set do_resume = True %}
    {% elif can_extrude %}
      {% set do_resume = True %}
    {% else %}
      RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
      {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
    {% endif %}
  #### Printer coming out of regular PAUSE state ####
  {% elif can_extrude %}
    {% set do_resume = True %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder}'
    {% set _d = prompt_txt.append("\"%s\" not hot enough, please heat up again and press RESUME" % printer.toolhead.extruder) %}
  {% endif %}

  {% if runout_resume %}
    {% if do_resume %}
      {% if restore_idle_timeout > 0 %}
        SET_IDLE_TIMEOUT TIMEOUT={restore_idle_timeout}
      {% endif %}
      {client.user_resume_macro|default("")}
      _CLIENT_EXTRUDE
      RESUME_BASE VELOCITY={params.VELOCITY|default(sp_move)}
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG='{"Resume aborted !!! \"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]}'
    {% set _d = prompt_txt.append("\"%s\" detects no filament, please load filament and press RESUME" % (client.runout_sensor.split(" "))[1]) %}
  {% endif %}

  ##### Generate User Information box in case of abort #####
  {% if not (runout_resume and do_resume) %}
    RESPOND TYPE=command MSG="action:prompt_begin RESUME aborted !!!"
    {% for element in prompt_txt %}
      RESPOND TYPE=command MSG='{"action:prompt_text %s" % element}'
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Ok|RESPOND TYPE=command MSG=action:prompt_end|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _CLIENT_VARIABLE]
# Pause park position
# variable_use_custom_pos  : False        # Use custom park coordinates
# variable_custom_park_x   : 170.0        # X park when paused, bed center
# variable_custom_park_y   : 10.0         # Y park when paused, front
# variable_custom_park_dz  : 5.0          # Additional Z lift in mm when parking
# Retract/Unretract
# variable_retract         : 1.0          # Retract distance during PAUSE, in mm
# variable_cancel_retract  : 5.0          # Retract distance during CANCEL_PRINT, in mm
# variable_speed_retract   : 35.0         # Retract speed in mm/s
# variable_unretract       : 1.0          # Unretract distance during RESUME, in mm
# variable_speed_unretract : 35.0         # Unretract speed in mm/s
# Speed
# variable_speed_hop       : 15.0         # Z-hop speed in mm/s
# variable_speed_move      : 100.0        # XY move speed in mm/s
# Idle timeout during PAUSE
# variable_idle_timeout    : 0            # 0 = do not change idle_timeout
# Runout sensor, full config name
# variable_runout_sensor   : ""           # Example: "filament_switch_sensor runout"
# Hooks; only single macro names are supported
variable_user_pause_macro  : "_SET_LED_STATUS_PAUSE"
variable_user_resume_macro : "_LED_RESUME_WRAPPER"
variable_user_cancel_macro : "_CUSTOM_CANCEL_CLEANUP"
gcode:
    # No gcode; this section only stores config variables.

############################################################################
# _CUSTOM_CANCEL_CLEANUP - clean up toolchanger when canceling a print
#
# Called by mainsail CANCEL_PRINT through variable_user_cancel_macro hook.
# Timing: after _CLIENT_RETRACT + TURN_OFF_HEATERS, before CANCEL_PRINT_BASE.
# Heaters are already off, so picking up T0 is instant and does not wait for cooldown.
# No extra M104 S0 is needed here because mainsail already ran TURN_OFF_HEATERS.
#
# Safety: every G0/G1 move checks that "xyz" is present in homed_axes first.
############################################################################

[gcode_macro _CUSTOM_CANCEL_CLEANUP]
description: Clean up toolchanger and LEDs when canceling a print through the mainsail CANCEL_PRINT hook
gcode:
    # Mark the print idle before any toolchange so after_change_gcode cannot
    # restore printing LEDs or restart crash detection during cancel cleanup.
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    # Reset flow, speed, and pressure.
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    # Only move if XYZ has been homed.
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set th = printer.toolhead %}

        # Safe Z lift: at least 50 mm, never above max_z.
        {% set z_now  = th.position.z|float %}
        {% set z_safe = [[z_now + 10.0, 50.0]|max, th.axis_maximum.z|float]|min %}
        G90
        G0 Z{z_safe} F3000

        # Switch back to T0 if another real tool is active.
        # Heaters are already off, so KTC pickup is instant and does not wait for temperature.
        {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
        {% if active_tool > 0 %}
            T0
        {% elif active_tool < 0 %}
            RESPOND TYPE=echo MSG="[CANCEL] Toolchanger has no active tool - skipping T0 pickup"
        {% endif %}
        {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
            STOP_CRASH_DETECTION
        {% endif %}

        # Park at the rear center of the bed.
        G90
        G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 2} F9000

    {% else %}
        # XYZ is not homed: skip toolchange because dropoff/pickup needs a valid Z-hop position.
        RESPOND TYPE=echo MSG="[CANCEL] XYZ not homed - skipping park/toolchange"
    {% endif %}

    # Turn off part fan and disable each tool stepper.
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set fan_name = "T" ~ tn|string ~ "_part_fan" %}
        {% if printer["fan_generic " ~ fan_name] is defined %}
            SET_FAN_SPEED FAN={fan_name} SPEED=0
        {% endif %}
        {% set ext_name = "extruder" if tn == 0 else "extruder" ~ tn|string %}
        SET_STEPPER_ENABLE STEPPER={ext_name} ENABLE=0
    {% endfor %}

    # Clean up print state.
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SET_GCODE_OFFSET X=0 Y=0 Z=0

    # Reset print state and LEDs: all tools back to standby.
    _ALL_TOOLHEADS_LED_SET STATE=standby
    M117 Print canceled.
