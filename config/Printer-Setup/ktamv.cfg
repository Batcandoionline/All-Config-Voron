# kTAMV supervised XY calibration comparison
# Upstream: https://github.com/TypQxQ/kTAMV
# Reviewed commit: 72421f2d54da0de8701c4f84449c6e6b7d060301
#
# kTAMV does not calibrate Z, does not save tool offsets, and does not persist
# camera calibration or origin across a Klipper restart. Movement commands must
# be run only with an operator at the printer and emergency stop available.

[ktamv]
nozzle_cam_url: http://127.0.0.1/webcam/?action=snapshot
server_url: http://127.0.0.1:8086
move_speed: 1800
calib_iterations: 1
calib_value: 1.0
send_frame_to_cloud: false
detection_tolerance: 0
measurement_z: 40
measurement_samples: 3
measurement_max_spread: 0.12

[gcode_macro KTAMV_SETUP]
description: Send the configured nozzle-camera settings to the kTAMV server
gcode:
  KTAMV_SEND_SERVER_CFG

[gcode_macro KTAMV_STATUS]
description: Report kTAMV camera calibration and origin state without motion
gcode:
  {% if printer.ktamv is defined %}
    RESPOND MSG="kTAMV active: calibrated={printer.ktamv.is_calibrated}, mm_per_pixel={printer.ktamv.mm_per_pixels}, origin={printer.ktamv.camera_center_coordinates}"
    RESPOND MSG="Server port 8086; cloud upload disabled; XY only; calibration and origin reset after Klipper restart"
    {% if printer.ktamv.last_offset_average is not none %}
      RESPOND MSG="Last XY measurement: tool={printer.ktamv.last_measured_tool_number}, samples={printer.ktamv.last_offset_samples}, mean={printer.ktamv.last_offset_average}, spread={printer.ktamv.last_offset_spread}"
    {% endif %}
  {% else %}
    RESPOND TYPE=error MSG="kTAMV is not loaded"
  {% endif %}

[gcode_macro KTAMV_MEASURE_ACTIVE_TOOL_XY]
description: Center the active tool three times and report its mean XY residual
gcode:
  {% set samples = params.SAMPLES|default(3)|int %}
  {% set max_spread = params.MAX_SPREAD|default(0.12)|float %}
  {% if not printer.ktamv.is_calibrated %}
    {action_raise_error("Run KTAMV_CALIB_CAMERA successfully before measuring XY")}
  {% elif printer.ktamv.camera_center_coordinates is none %}
    {action_raise_error("Center T0 and run KTAMV_SET_ORIGIN before measuring XY")}
  {% elif printer.toolchanger.status != "ready" %}
    {action_raise_error("Toolchanger is not ready")}
  {% elif printer.toolchanger.tool_number is none %}
    {action_raise_error("No active tool is selected")}
  {% elif printer.toolchanger.detected_tool_number|int != printer.toolchanger.tool_number|int %}
    {action_raise_error("Detected tool does not match the active tool")}
  {% else %}
    {% set tool_number = printer.toolchanger.tool_number|int %}
    SET_LED LED=T{tool_number}_LED RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    KTAMV_MEASURE_TOOL_XY SAMPLES={samples} Z=40 MAX_SPREAD={max_spread}
  {% endif %}

[gcode_macro KTAMV_APPLY_ACTIVE_TOOL_XY]
description: Stage the last averaged kTAMV XY residual for the active non-reference tool
gcode:
  {% set tool_number = printer.toolchanger.tool_number|int %}
  {% set result = printer.ktamv.last_offset_average %}
  {% set spread = printer.ktamv.last_offset_spread %}
  {% if printer.toolchanger.status != "ready" %}
    {action_raise_error("Toolchanger is not ready")}
  {% elif printer.toolchanger.detected_tool_number|int != tool_number %}
    {action_raise_error("Detected tool does not match the active tool")}
  {% elif tool_number == 0 %}
    {action_raise_error("T0 is the kTAMV reference and must keep X/Y offset zero")}
  {% elif result is none or spread is none %}
    {action_raise_error("No completed kTAMV XY measurement is available")}
  {% elif printer.ktamv.last_measured_tool_number|int != tool_number %}
    {action_raise_error("The last kTAMV result belongs to a different tool")}
  {% elif spread[0]|float > 0.12 or spread[1]|float > 0.12 %}
    {action_raise_error("The last kTAMV result exceeds the 0.12 mm spread limit")}
  {% else %}
    {% set tool = printer[printer.toolchanger.tool] %}
    {% set new_x = ((tool.gcode_x_offset|float) + (result[0]|float))|round(3) %}
    {% set new_y = ((tool.gcode_y_offset|float) + (result[1]|float))|round(3) %}
    SET_TOOL_PARAMETER T={tool_number} PARAMETER=gcode_x_offset VALUE={new_x}
    SET_TOOL_PARAMETER T={tool_number} PARAMETER=gcode_y_offset VALUE={new_y}
    SAVE_TOOL_PARAMETER T={tool_number} PARAMETER=gcode_x_offset
    SAVE_TOOL_PARAMETER T={tool_number} PARAMETER=gcode_y_offset
    RESPOND MSG="Staged T{tool_number} XY offset X={new_x} Y={new_y}; run SAVE_CONFIG only after all tools are reviewed"
  {% endif %}
