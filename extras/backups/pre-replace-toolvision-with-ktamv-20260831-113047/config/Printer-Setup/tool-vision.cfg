    RESPOND TYPE=command MSG="action:prompt_begin Choose camera"
    RESPOND TYPE=command MSG="action:prompt_text Page {page + 1}/{last_page + 1} | Changing camera marks profile/transform not ready | URLs hidden"
    {% for camera in tv.camera_candidates[start:end] %}
      {% set camera_name = camera.name if camera.name|length <= 36 else (camera.name[:33] ~ '...') %}
      {% set camera_location = camera.location if camera.location|length <= 16 else (camera.location[:13] ~ '...') %}
      RESPOND TYPE=command MSG="action:prompt_button #{start + loop.index} {camera_name} - {camera_location}|_TOOL_VISION_UI_RUN ACTION=CAMERA_SELECT INDEX={start + loop.index0}|primary"
    {% endfor %}
    {% if page > 0 %}
      RESPOND TYPE=command MSG="action:prompt_button Previous cameras|_TOOL_VISION_UI_CAMERA_SELECT PAGE={page - 1}|info"
    {% endif %}
    {% if end < tv.camera_candidates|length %}
      RESPOND TYPE=command MSG="action:prompt_button Next cameras|_TOOL_VISION_UI_CAMERA_SELECT PAGE={page + 1}|info"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_CAMERA_SETUP|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

