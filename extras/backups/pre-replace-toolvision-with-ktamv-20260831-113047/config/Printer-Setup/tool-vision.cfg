# ToolVision — report-only calibration with three direct Mainsail macros
#
# Add only `[include tool_vision.cfg]` to the config that contains printer.cfg.
#
# Routine workflow:
#   1. TOOL_VISION_Z starts one Cartographer Touch Z run immediately.
#   2. TOOL_VISION_Z_X3 starts three Cartographer Touch Z runs immediately.
#   3. Both commands home and move the printer; there is no modal confirmation.
#   4. They fast-ACK and continue as tracked Klippy jobs. Use
#      TOOL_VISION_RESULTS for the latest console summary.
#   5. Measurement offsets are never applied and ToolVision never writes
#      production offsets.
#
# Camera/sensor stations, detector profile, transform, rotation, pixel scale and
# tool list are taught/discovered state, not normal cfg inputs. Camera XY/XYZ,
# switch Z and setup remain advanced console commands documented in the README.
# Do not enable [axiscope] or [tools_calibrate] sections at the same time.

[tool_vision]
# Set pin only when using the physical-switch Z method. Inversion/pull-up follow
# normal Klipper pin syntax. Verify it with QUERY_ENDSTOPS before first probing.
# Switch mode also needs tools_calibrate.py from klipper-toolchanger installed;
# the [tools_calibrate] section itself must remain disabled.
pin: ^PF2

# Normally omit both camera fields. ToolVision discovers enabled webcams through
# Moonraker. When several cameras exist, the setup wizard asks for a choice.
# camera_name: nozzle

# Use an explicit source only when the camera is not registered in Moonraker.
# Accepted examples: snapshot/MJPEG/RTSP URL, /dev/video0, or OpenCV index 0.
# camera_source: http://127.0.0.1:8080/?action=snapshot

# Routine calibration temperature. The default follows the 150 C Axiscope/
# Cartographer-compatible workflow. TEMP=0 remains an explicit cold-run override.
# calibration_temperature: 150

# Rare compatibility/path overrides; leave commented on normal installations.
# reference_tool: 0
# server_url: http://127.0.0.1:8085
# moonraker_url: http://127.0.0.1:7125
# tool_select_command: T{tool}
# State/result files default to the directory containing the main printer.cfg.
# state_file: /absolute/path/to/tool_vision_state.json
# result_file: /absolute/path/to/tool_vision_results.json
state_file: ~/printer_data/config/Generated-Data/ToolVision/state.json
result_file: ~/printer_data/config/Generated-Data/ToolVision/results.json

# Optional machine-specific validation gates. Do not copy limits from another
# printer. Missing limits keep a successful measurement at WARNING.
# max_reference_xy_drift: <limit from your XY repeatability study>
# max_reference_z_drift: <limit from your Z repeatability study>
# max_reference_z_drift_switch: <switch-specific limit; overrides global>
# max_reference_z_drift_cartographer_touch: <Touch-specific limit; overrides global>
# max_transform_rms: <held-out RMS limit from your camera corpus/HIL>
# max_transform_max_error: <held-out maximum limit from your camera corpus/HIL>
# max_xy_uncertainty: <limit from your camera corpus/HIL>

# Optional review-only comparison with configured relative production offsets.
# These limits never validate the estimator and never apply an offset. A breach
# is labeled REVIEW / PRINT TEST REQUIRED. Leave unset until your own repeated
# measurements and print evidence justify a limit.
# max_production_x_delta: <review limit in mm>
# max_production_y_delta: <review limit in mm>
# max_production_z_delta: <review limit in mm>
# Per-tool/axis overrides use comma-separated Tn.AXIS=mm entries:
# production_delta_overrides: T3.Z=0.050,T1.X=0.030

# Advanced bed evidence policy. ToolVision never heats the bed. With no
# tolerance, bed stability is recorded as not_evaluated. A measured per-machine
# tolerance may warn or block an unstable run.
# bed_stability_tolerance: <C from your machine study>
# bed_unstable_policy: warn

# KTC Easy can publish a delayed uninitialized state after nested command
# errors. ToolVision waits this long before final restore verification. The
# default 0.5 s exceeds KTC Easy's own 0.2 s detection settle; override only
# with machine evidence. Values above 5 s are rejected so heater cleanup is not
# held behind an unbounded state-verification delay.
# toolchanger_verify_settle: 0.5

# Optional machine-specific hooks: start_gcode, before_tool_gcode,
# after_select_gcode, after_tool_gcode, finish_gcode, abort_gcode.
# after_select_gcode is the place for a reviewed nozzle scrubber path.
# after_select_gcode:
#   CLEAN_NOZZLE TEMP=150

# Optional failure recovery for toolchangers that clear active-tool state after
# a nested G-code error. Initialization may move hardware; configure this only
# after machine-specific review/HIL proves it safe at failure positions. The
# hook may run before original-tool restore and at most once more if bounded
# post-restore verification observes a delayed lost/incoherent state.
# toolchanger_recovery_gcode:
#   <reviewed toolchanger recovery command>
toolchanger_recovery_gcode:
  INITIALIZE_TOOLCHANGER

# Advanced clearance overrides remain available from the console:
#   TOOL_VISION_CAMERA_STATION SAFE_Z=25
#   TOOL_VISION_SETUP_CAMERA SAFE_Z=25
#   TOOL_VISION_SETUP_Z METHOD=SWITCH SAFE_Z=25
#   TOOL_VISION_SETUP_Z METHOD=CARTOGRAPHER SAFE_Z=25

[gcode_macro TOOL_VISION_Z]
description: Start Z x1 now - homes and moves - report only
gcode:
  TOOL_VISION_CALIBRATE MODE=Z METHOD=CARTOGRAPHER_TOUCH BATCH=1 HOME=1 ASYNC=1 VERBOSITY=QUIET

[gcode_macro TOOL_VISION_Z_X3]
description: Start Z x3 now - homes and moves - report only
gcode:
  TOOL_VISION_CALIBRATE MODE=Z METHOD=CARTOGRAPHER_TOUCH BATCH=3 HOME=1 ASYNC=1 VERBOSITY=QUIET

[gcode_macro TOOL_VISION_RESULTS]
description: Print the latest ToolVision result to the console
gcode:
  TOOL_VISION_REPORT

[gcode_macro _TOOL_VISION_UI_CLOSE]
gcode:
  # One idempotent protocol action; no nested RESPOND payload.
  RESPOND TYPE=command MSG="action:prompt_end"

[gcode_macro _TOOL_VISION_UI_Z_METHOD]
gcode:
  {% set tv = printer.tool_vision %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% else %}
    {% set switch = "Ready" if tv.switch_ready else "Needs setup" %}
    {% set carto = "Ready" if tv.cartographer_touch_ready else "Needs setup" %}
    {% set carto_target = "_TOOL_VISION_UI_BATCH MODE=Z METHOD=CARTOGRAPHER_TOUCH" if tv.cartographer_touch_ready else "_TOOL_VISION_UI_Z_SETUP_PROVIDER METHOD=CARTOGRAPHER_TOUCH" %}
    {% set switch_target = "_TOOL_VISION_UI_BATCH MODE=Z METHOD=SWITCH" if tv.switch_ready else "_TOOL_VISION_UI_Z_SETUP_PROVIDER METHOD=SWITCH" %}
    RESPOND TYPE=command MSG="action:prompt_begin Choose Z sensor"
    RESPOND TYPE=command MSG="action:prompt_text Select explicitly for this run. No automatic fallback."
    RESPOND TYPE=command MSG="action:prompt_button Cartographer - Recommended - {carto}|{carto_target}|primary"
    RESPOND TYPE=command MSG="action:prompt_button Switch - Cross-check - {switch}|{switch_target}|warning"
    RESPOND TYPE=command MSG="action:prompt_button Close|_TOOL_VISION_UI_CLOSE|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _TOOL_VISION_UI_XYZ_METHOD]
gcode:
  {% set tv = printer.tool_vision %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% else %}
    {% set switch = "Ready" if tv.switch_ready else "Needs setup" %}
    {% set carto = "Ready" if tv.cartographer_touch_ready else "Needs setup" %}
    {% set carto_target = "_TOOL_VISION_UI_BATCH MODE=XYZ METHOD=CARTOGRAPHER_TOUCH" if tv.cartographer_touch_ready else "_TOOL_VISION_UI_Z_SETUP_PROVIDER METHOD=CARTOGRAPHER_TOUCH" %}
    {% set switch_target = "_TOOL_VISION_UI_BATCH MODE=XYZ METHOD=SWITCH" if tv.switch_ready else "_TOOL_VISION_UI_Z_SETUP_PROVIDER METHOD=SWITCH" %}
    {% if not tv.camera_ready %}
      _TOOL_VISION_UI_CAMERA_SETUP
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_begin Choose XYZ Z sensor"
      RESPOND TYPE=command MSG="action:prompt_text Camera XY is ready. Select Z explicitly for this run."
      RESPOND TYPE=command MSG="action:prompt_button Cartographer - Recommended - {carto}|{carto_target}|primary"
      RESPOND TYPE=command MSG="action:prompt_button Switch - Cross-check - {switch}|{switch_target}|warning"
      RESPOND TYPE=command MSG="action:prompt_button Close|_TOOL_VISION_UI_CLOSE|info"
      RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
  {% endif %}

[gcode_macro _TOOL_VISION_UI_BATCH]
gcode:
  {% set tv = printer.tool_vision %}
  {% set mode = params.MODE|default('')|upper %}
  {% set method = params.METHOD|default('')|upper %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% elif mode not in ["Z", "XYZ"] or method not in ["SWITCH", "CARTOGRAPHER_TOUCH"] %}
    RESPOND TYPE=echo MSG="ToolVision attempt selector ignored: invalid mode or sensor."
  {% else %}
    {% set provider = "Cartographer Touch" if method == "CARTOGRAPHER_TOUCH" else "Physical switch" %}
    {% set ready = tv.cartographer_touch_ready if method == "CARTOGRAPHER_TOUCH" else tv.switch_ready %}
    {% set action = ("CHOOSE_" ~ mode ~ "_CARTOGRAPHER") if method == "CARTOGRAPHER_TOUCH" else ("CHOOSE_" ~ mode ~ "_SWITCH") %}
    {% set back = "_TOOL_VISION_UI_Z_METHOD" if mode == "Z" else "_TOOL_VISION_UI_XYZ_METHOD" %}
    RESPOND TYPE=command MSG="action:prompt_begin Choose attempts"
    RESPOND TYPE=command MSG="action:prompt_text {mode} | {provider}: {('Ready' if ready else 'Needs setup')} | Stop on first invalid attempt"
    RESPOND TYPE=command MSG="action:prompt_button 1 attempt|_TOOL_VISION_UI_RUN ACTION={action} BATCH=1|primary"
    RESPOND TYPE=command MSG="action:prompt_button 3 attempts|_TOOL_VISION_UI_RUN ACTION={action} BATCH=3|primary"
    RESPOND TYPE=command MSG="action:prompt_button 5 attempts|_TOOL_VISION_UI_RUN ACTION={action} BATCH=5|primary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|{back}|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _TOOL_VISION_UI_CONFIRM_XY]
gcode:
  {% set tv = printer.tool_vision %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% else %}
    {% set bed = tv.bed %}
    {% set bed_text = ((bed.actual_c|round(1)) ~ '/' ~ (bed.target_c|round(1)) ~ ' C - ' ~ bed.stability) if bed.available else 'unavailable' %}
    {% set estimate = ((tv.last_duration_seconds / 60.0)|round(1) ~ ' min from latest run') if tv.last_result_mode == 'XY' and tv.last_duration_seconds else 'no comparable run yet' %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm XY"
    RESPOND TYPE=command MSG="action:prompt_text Camera: Ready | 1 attempt | Full G28"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {tv.calibration_temperature|round(1)} C | Bed {bed_text} | Estimate {estimate}"
    RESPOND TYPE=command MSG="action:prompt_text REPORT ONLY | T{tv.reference_tool}-relative XY | NOT APPLIED"
    RESPOND TYPE=command MSG="action:prompt_button Close|_TOOL_VISION_UI_CLOSE|info"
    RESPOND TYPE=command MSG="action:prompt_footer_button Start measurement|_TOOL_VISION_UI_RUN ACTION=CALIBRATE_XY|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _TOOL_VISION_UI_CONFIRM_Z_SWITCH]
gcode:
  {% set tv = printer.tool_vision %}
  {% set batch = params.BATCH|default(1)|int %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% else %}
    {% set bed = tv.bed %}
    {% set bed_text = ((bed.actual_c|round(1)) ~ '/' ~ (bed.target_c|round(1)) ~ ' C - ' ~ bed.stability) if bed.available else 'unavailable' %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm Z - Switch"
    RESPOND TYPE=command MSG="action:prompt_text Switch: {('Ready' if tv.switch_ready else 'Needs setup')} | {batch} attempt(s) | Full G28 each"
    RESPOND TYPE=command MSG="action:prompt_text Nozzle {tv.calibration_temperature|round(1)} C | Bed {bed_text} | Estimate {((((tv.last_duration_seconds * batch) / 60.0)|round(1)) ~ ' min') if tv.last_result_mode == 'Z' and tv.last_result_method == 'switch' and tv.last_duration_seconds else 'unknown'}"
    RESPOND TYPE=command MSG="action:prompt_text REPORT ONLY | T{tv.reference_tool}-relative Z | NOT APPLIED"
    RESPOND TYPE=command MSG="action:prompt_footer_button Start measurement|_TOOL_VISION_UI_RUN ACTION=CALIBRATE_Z_SWITCH BATCH={batch}|warning"
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_BATCH MODE=Z METHOD=SWITCH|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

