# Production print, runout, leveling, and filament-dryer macros.

# OrcaSlicer contract for PRINT_START:
#   TOOL=<initial tool> TOOL_TEMP=<initial first-layer temperature>
#   T0_TEMP=... through T4_TEMP=... only for tools used by the file
#   BED_TEMP=<first-layer bed temperature> MATERIAL=<filament type>
# Optional: SOAK=<seconds>, AUTO_SOAK=0/1, and FULL_BED=0/1.
[idle_timeout]
timeout: 1800

[exclude_object]

# Home, clear any mesh, and run the production two-stage QGL wrapper.
[gcode_macro G32]
description: Home all axes and level gantry
gcode:
    _SET_LED_STATUS_LEVELING
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G0 X180 Y180 Z30 F3600
    _SET_LED_STATUS_READY

# First pass removes large gantry error; the second uses the measured 0.0075 mm
# production tolerance. Z is re-homed after QGL for Cartographer consistency.
[gcode_macro QUAD_GANTRY_LEVEL]
description: Quad gantry level (QGL)
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    _SET_LED_STATUS_LEVELING
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        _QUAD_GANTRY_LEVEL horizontal_move_z=10 retry_tolerance=1
    {% endif %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=2
    G28 Z
    RESTORE_GCODE_STATE NAME=STATE_QGL
    _SET_LED_STATUS_READY

[quad_gantry_level]
gantry_corners:
    -10, -10
    353, 350
points:
    20, 0
    20, 280
    330, 280
    330, 0
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

# Tool changes require a valid Z position. This helper is called only after the
# full initial G28 and safe Z lift in PRINT_START.
[gcode_macro _PRINT_START_SELECT_T0]
description: Select T0 during PRINT_START after full homing
gcode:
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active_tool > 0 %}
        M117 Select T0 after full home
        T0
    {% elif active_tool < 0 %}
        M117 Pick up T0 after full home
        T0
    {% endif %}

# Soak policy: an explicit SOAK wins. Otherwise cold beds use the full material
# delay, warm beds use 20%, and beds within 5 C of target skip the delay.
[gcode_macro _PRINT_START_HEAT_SOAK]
description: Internal PRINT_START heat soak before Cartographer QGL and mesh
gcode:
    {% set BED_TEMP   = params.BED_TEMP|default(0)|int %}
    {% set BED_START  = params.BED_START|default(printer.heater_bed.temperature)|float %}
    {% set SOAK_TIME  = params.SOAK|default(0)|int %}
    {% set MATERIAL   = params.MATERIAL|default("")|string|upper %}
    {% set AUTO_SOAK  = params.AUTO_SOAK|default(1)|int %}
    {% set FULL_BED   = params.FULL_BED|default(0)|int %}
    {% set PLA_SOAK = 30 %}
    {% set PETG_SOAK = 60 %}
    {% set ABS_SOAK = 90 %}
    {% set HOT_BED_SOAK = 90 %}
    {% set material_soak = 0 %}
    {% if "PLA" in MATERIAL or "TPU" in MATERIAL %}
        {% set material_soak = PLA_SOAK %}
    {% elif "PETG" in MATERIAL %}
        {% set material_soak = PETG_SOAK %}
    {% elif "ABS" in MATERIAL or "ASA" in MATERIAL or "PC" in MATERIAL or "NYLON" in MATERIAL or "PA" in MATERIAL %}
        {% set material_soak = ABS_SOAK %}
    {% endif %}
    {% if FULL_BED > 0 and material_soak > 0 and material_soak < PETG_SOAK %}
        {% set material_soak = PETG_SOAK %}
    {% endif %}

    {% if SOAK_TIME > 0 %}
        M117 Heat soak {SOAK_TIME}s
        RESPOND TYPE=echo MSG="Heat soak: manual SOAK={SOAK_TIME}s before QGL/mesh"
        G4 P{SOAK_TIME * 1000}
    {% elif AUTO_SOAK > 0 %}
        {% set temp_diff = BED_TEMP - BED_START %}
        {% if material_soak > 0 %}
            {% if temp_diff > 15 %}
                M117 {MATERIAL} soak {material_soak}s
                RESPOND TYPE=echo MSG="Heat soak: MATERIAL={MATERIAL}, waiting {material_soak}s before QGL/mesh"
                G4 P{material_soak * 1000}
            {% elif temp_diff > 5 %}
                {% set short_soak = (material_soak * 0.2)|int %}
                M117 {MATERIAL} soak {short_soak}s (warm bed)
                RESPOND TYPE=echo MSG="Heat soak: Warm bed detected (diff={temp_diff|round(1)}C), reducing {MATERIAL} soak to {short_soak}s before QGL/mesh"
                G4 P{short_soak * 1000}
            {% else %}
                RESPOND TYPE=echo MSG="Heat soak: Bed already hot (diff={temp_diff|round(1)}C), skipping {MATERIAL} soak before QGL/mesh"
            {% endif %}
        {% elif MATERIAL == "" and BED_TEMP >= 90 %}
            {% if temp_diff > 15 %}
                M117 Hot bed soak {HOT_BED_SOAK}s
                RESPOND TYPE=echo MSG="Heat soak: material not provided, hot bed fallback {HOT_BED_SOAK}s before QGL/mesh"
                G4 P{HOT_BED_SOAK * 1000}
            {% elif temp_diff > 5 %}
                {% set short_soak = (HOT_BED_SOAK * 0.2)|int %}
                M117 Hot bed soak {short_soak}s (warm bed)
                RESPOND TYPE=echo MSG="Heat soak: Warm bed detected (diff={temp_diff|round(1)}C), reducing hot bed fallback soak to {short_soak}s before QGL/mesh"
                G4 P{short_soak * 1000}
            {% else %}
                RESPOND TYPE=echo MSG="Heat soak: Bed already hot (diff={temp_diff|round(1)}C), skipping fallback soak before QGL/mesh"
            {% endif %}
        {% endif %}
    {% endif %}

# Safe production sequence:
# initialize -> async preheat -> full G28 -> select/clean T0 -> bed/soak ->
# QGL -> clean/touch-home -> adaptive mesh -> prime every used tool.
# Never dock, pick up, or move to the front bucket before the initial full G28.
[gcode_macro PRINT_START]
description: Start print - safe homing first for StealthChanger
gcode:
    {% set TOOL       = params.TOOL|default(0)|int %}
    {% set TOOL_TEMP  = params.TOOL_TEMP|default(0)|int %}
    {% set BED_TEMP   = params.BED_TEMP|default(0)|int %}
    {% set SOAK_TIME  = params.SOAK|default(0)|int %}
    {% set MATERIAL   = params.MATERIAL|default("")|string|upper %}
    {% set AUTO_SOAK  = params.AUTO_SOAK|default(1)|int %}
    {% set FULL_BED   = params.FULL_BED|default(0)|int %}
    {% set PROBE_TEMP = 150 %}
    {% set SAFE_Z     = 10 %}
    {% set START_TEMP_KEY = "T" ~ TOOL ~ "_TEMP" %}
    {% set START_TOOL_TEMP = params[START_TEMP_KEY]|int if START_TEMP_KEY in params else TOOL_TEMP %}
    {% set bed_start = printer.heater_bed.temperature|default(0)|float %}
    {% set first_prime = namespace(t=TOOL, temp=START_TOOL_TEMP, found=0) %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set tool_temp = params[temp_key]|default(0)|int %}
        {% if tn != TOOL and tool_temp > 0 and first_prime.found == 0 %}
            {% set first_prime.t = tn %}
            {% set first_prime.temp = tool_temp %}
            {% set first_prime.found = 1 %}
        {% endif %}
    {% endfor %}

    {% if TOOL not in printer.toolchanger.tool_numbers %}
        RESPOND TYPE=error MSG="PRINT_START invalid TOOL={TOOL}; tool does not exist"
        CANCEL_PRINT
    {% elif START_TOOL_TEMP <= 0 or BED_TEMP <= 0 %}
        RESPOND TYPE=error MSG="PRINT_START missing temperature: T{TOOL}={START_TOOL_TEMP} BED={BED_TEMP}; check Orca Start G-code"
        CANCEL_PRINT
    {% else %}

    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    M83
    INITIALIZE_TOOLCHANGER
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'starting'"
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}
    _SET_LED_STATUS_LEVELING

    _SET_LED_STATUS_HEATING
    M117 Heat async bed/tools
    M140 S{BED_TEMP}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set tool_temp = params[temp_key]|default(0)|int %}
        {% if tn == 0 %}
            M104 T0 S{PROBE_TEMP}
        {% elif tool_temp > 0 %}
            M104 T{tn} S{PROBE_TEMP}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Full G28 with Cartographer shuttle

    G28
    G90
    G0 Z{SAFE_Z} F3000

    _PRINT_START_SELECT_T0
    G90
    G0 Z{SAFE_Z} F3000
    _CLEAN_NOZZLE_PARK

    _SET_LED_STATUS_CLEANING
    M117 Clean T0
    M109 T0 S{PROBE_TEMP}
    CLEAN_NOZZLE TEMP={PROBE_TEMP} WIPES=5

    {% if bed_start < BED_TEMP %}
        M117 Heating bed to {BED_TEMP}C
        M190 S{BED_TEMP}
    {% else %}
        M117 Bed already at temperature
        RESPOND TYPE=echo MSG="Bed {bed_start|int}C >= target {BED_TEMP}C; not waiting for cooldown"
    {% endif %}
    BED_FAN_ON SPEED=0.5

    _PRINT_START_HEAT_SOAK BED_TEMP={BED_TEMP} BED_START={bed_start} SOAK={SOAK_TIME} AUTO_SOAK={AUTO_SOAK} FULL_BED={FULL_BED}{% if MATERIAL != "" %} MATERIAL={MATERIAL}{% endif %}

    _SET_LED_STATUS_LEVELING
    M117 Stable-temp QGL
    QUAD_GANTRY_LEVEL
    G0 Z{SAFE_Z} F3000

    _SET_LED_STATUS_CLEANING
    M117 Clean T0 before touch
    M104 T0 S{PROBE_TEMP}
    M109 T0 S{PROBE_TEMP}
    CLEAN_NOZZLE TEMP={PROBE_TEMP} WIPES=5
    _SET_LED_STATUS_LEVELING
    M117 Cartographer touch home
    CARTOGRAPHER_TOUCH_HOME
    G0 Z{SAFE_Z} F3000

    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set tool_temp = params[temp_key]|default(START_TOOL_TEMP if tn == TOOL else 0)|int %}
        {% set tool_section = "tool T" ~ tn|string %}
        {% set standby_temp = printer[tool_section].params_standby_temp|default(PROBE_TEMP)|int %}
        {% if tool_temp > 0 %}
            {% if tn == first_prime.t %}
                M104 T{tn} S{first_prime.temp}
            {% else %}
                M104 T{tn} S{standby_temp}
            {% endif %}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Bed mesh adaptive
    BED_MESH_CALIBRATE ADAPTIVE=1
    M400

    _SET_LED_STATUS_HEATING
    M117 Prime tools
    PRIME_LINES INITIAL_TOOL={TOOL} TOOL_TEMP={START_TOOL_TEMP}{% for tn in printer.toolchanger.tool_numbers %}{% set temp_key = "T" ~ tn|string ~ "_TEMP" %}{% if params[temp_key]|default(0)|int > 0 %} T{tn}_TEMP={params[temp_key]|int}{% endif %}{% endfor %}
    {% if printer["gcode_macro START_CRASH_DETECTION"] is defined %}
        START_CRASH_DETECTION
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    _SET_LED_STATUS_PRINTING
    M117 Printing

    {% endif %} ; end validate params

# Raise to at least Z50, disable heaters before KTC motion, dock the active
# tool, and park the empty shuttle. Skip every XYZ move if not fully homed.
[gcode_macro PRINT_END]
description: End print
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    {% set th = printer.toolhead %}
    {% set z_safe = [[th.position.z + 10, 50]|max, th.axis_maximum.z]|min %}

    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    {% set xyz_homed = "xyz" in th.homed_axes %}
    {% if xyz_homed %}
    {% set active_extruder = printer.toolhead.extruder|default("")|string %}
    {% if active_extruder != "" and printer[active_extruder].can_extrude %}
        G92 E0
        G91
        G1 E-2.0 F2700              ; Fast 2 mm retract to release pressure
        G1 Z5 E-8.0 F12000          ; Raise Z 5 mm and retract 8 mm at the same time to break the string
        G90
    {% endif %}
    M400
    G90
    G0 Z{z_safe} F3000

    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
    {% endfor %}
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active_tool >= 0 %}
        UNSELECT_TOOL
    {% else %}
        RESPOND TYPE=echo MSG="[PRINT_END] Toolchanger has no active tool to drop off"
    {% endif %}

    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 20} F9000
    {% else %}
        RESPOND TYPE=echo MSG="[PRINT_END] XYZ not homed - skipping retract/Z-hop/toolchange/park"
    {% endif %}

    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
        {% set fan_section = "fan_generic T" ~ tn|string ~ "_part_fan" %}
        {% if fan_section in printer.configfile.config %}
            SET_FAN_SPEED FAN=T{tn}_part_fan SPEED=0
        {% endif %}
        {% set ext_name = "extruder" if tn == 0 else "extruder" ~ tn|string %}
        SET_STEPPER_ENABLE STEPPER={ext_name} ENABLE=0
    {% endfor %}
    M140 S0

    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=180

    BED_MESH_CLEAR
    CLEAR_PAUSE

    _SET_LED_STATUS_COMPLETE
    M117 Complete

# Sensors use delayed confirmation. Only the mounted tool can pause a print;
# changes reported by a parked tool are logged without stopping motion.
[gcode_macro _FILAMENT_RUNOUT_HANDLE]
description: Handle filament runout with debounce
gcode:
    {% set T = params.T|int %}
    {% set sensor_name = "filament_sensor_T" ~ T %}

    {% if not printer["filament_switch_sensor " ~ sensor_name].filament_detected %}

        {% set active_tool_number = printer.toolchanger.tool_number|default(-1)|int %}

        {% if active_tool_number == T %}
            RESPOND PREFIX="RUNOUT" MSG="T{T}: confirmed after debounce; pausing print"
            _FILAMENT_RUNOUT_PAUSE T={T}
        {% else %}
            RESPOND PREFIX="WARNING" MSG="T{T}: runout on parked tool; active tool is T{active_tool_number}; not pausing"
        {% endif %}

    {% else %}
        RESPOND MSG="[T{T}] Noise filtered successfully; sensor is normal"
    {% endif %}

[gcode_macro _FILAMENT_RUNOUT_PAUSE]
description: Pause when filament runs out
gcode:
    {% set T = params.T|int %}
    _SET_LED_STATUS_PAUSE
    PAUSE X=180 Y=10 Z_MIN=30
    M117 T{T}: Filament runout! Load filament and press RESUME

# The dryer uses the 1000 W bed and PF8 circulation fan. User parameters are
# clamped. Humidity is optional and read only when an installed integration
# exposes a humidity field on the chamber object.
[gcode_macro START_DRYER]
description: Start filament drying cycle (BED temp, CHAMBER target, HUMIDITY target, TIME/TIME_HOURS, FAN speed 0-1.0)
gcode:
    {% set bed_temp = [[params.BED|default(55.0)|float, 0.0]|max, 115.0]|min %}
    {% set chamber_target = [[params.CHAMBER|default(0.0)|float, 0.0]|max, 100.0]|min %}
    {% set humidity_target = [[params.TARGET_HUMIDITY|default(params.HUMIDITY|default(0.0))|float, 0.0]|max, 100.0]|min %}
    {% set time_hours = [params.TIME_HOURS|default(0.0)|float, 0.0]|max %}
    {% set time_mins = [params.TIME|default(240)|float, 1.0]|max %}
    {% set fan_speed = [[params.FAN|default(0.40)|float, 0.0]|max, 1.0]|min %}
    {% set park_head = 1 if params.PARK|default(1)|int > 0 else 0 %}

    {% if time_hours > 0 %}
        {% set total_mins = (time_hours * 60)|int %}
    {% else %}
        {% set total_mins = time_mins|int %}
    {% endif %}
    {% set total_seconds = total_mins * 60 %}

    {% if printer.idle_timeout.state == "Printing" or printer.pause_resume.is_paused %}
        RESPOND TYPE=error MSG="[DRYER] Cannot start filament dryer: Printer is currently printing or paused!"
    {% else %}
        {% if park_head == 1 %}
            {% if "xyz" not in printer.toolhead.homed_axes %}
                M117 Homing XYZ before parking
                G28
            {% endif %}
            {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
            {% if active_tool >= 0 %}
                M117 Docking active tool T{active_tool}
                UNSELECT_TOOL
            {% endif %}
            G90
            {% set safe_z = [[printer.toolhead.position.z, 200.0]|max, 320.0]|min %}
            G0 Z{safe_z} F3000
            G0 X175 Y310 F6000
        {% endif %}

        _SET_LED_STATUS_DRYING

        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(25.0)|float if has_chamber else 25.0 %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else -1.0 %}

        {% set initial_fan = fan_speed %}
        {% if chamber_target > 0 and cur_chamber < (chamber_target - 2.0) %}
            {% set initial_fan = [fan_speed + 0.25, 0.85]|min %}
            RESPOND TYPE=echo MSG="[DRYER] Chamber cold ({cur_chamber|round(1)}C < target {chamber_target}C). Boosting under-bed fan to {(initial_fan*100)|int}% for fast warm-up."
        {% endif %}

        M140 S{bed_temp}
        {% if initial_fan > 0 %}
            SET_FAN_SPEED FAN=bed_fan SPEED={initial_fan}
        {% else %}
            SET_FAN_SPEED FAN=bed_fan SPEED=0
        {% endif %}

        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE={total_seconds}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=total_time VALUE={total_seconds}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=chamber_target VALUE={chamber_target}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=humidity_target VALUE={humidity_target}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=base_fan_speed VALUE={fan_speed}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=current_fan_speed VALUE={initial_fan}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=1

        UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=1

        {% if has_humidity and cur_humidity >= 0 %}
            M117 Dryer: B:{bed_temp|int}C C:{cur_chamber|int}C H:{cur_humidity|int}%
            RESPOND TYPE=echo MSG="[DRYER] Started: Bed={bed_temp}C, Target Ch={chamber_target}C (Cur: {cur_chamber|round(1)}C, Humidity: {cur_humidity}%), Time={total_mins}m, Fan={(initial_fan * 100)|int}%"
        {% else %}
            M117 Dryer: Bed {bed_temp|int}C | Ch {cur_chamber|int}C
            RESPOND TYPE=echo MSG="[DRYER] Started: Bed={bed_temp}C, Target Chamber={chamber_target}C (Current: {cur_chamber|round(1)}C), Time={total_mins}m ({(total_mins / 60)|round(1)}h), Fan={(initial_fan * 100)|int}%"
        {% endif %}
    {% endif %}

# Idempotent shutdown for manual stop, target humidity, or timer completion.
[gcode_macro STOP_DRYER]
description: Stop filament drying cycle and turn off heaters/fans
gcode:
    M140 S0
    SET_FAN_SPEED FAN=bed_fan SPEED=0

    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=0
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0

    _SET_LED_STATUS_DRYING_COMPLETE

    M117 Dryer Stopped
    RESPOND TYPE=echo MSG="[DRYER] Stopped. Bed heater and under-bed fan turned off."

[gcode_macro DRYER_STATUS]
description: Print current filament dryer and chamber thermal statistics
gcode:
    {% set s = printer["gcode_macro _DRYER_STATUS"] %}
    {% if s.is_drying == 1 %}
        {% set elapsed_sec = s.total_time - s.time_remaining %}
        {% set el_hours = (elapsed_sec // 3600)|int %}
        {% set el_mins = ((elapsed_sec % 3600) // 60)|int %}
        {% set rem_hours = (s.time_remaining // 3600)|int %}
        {% set rem_mins = ((s.time_remaining % 3600) // 60)|int %}
        {% set progress = ((elapsed_sec / s.total_time) * 100)|round(1) %}
        {% set cur_bed = printer.heater_bed.temperature|round(1) %}
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(0)|round(1) if has_chamber else 'N/A' %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else 'N/A' %}
        RESPOND TYPE=echo MSG="=== FILAMENT DRYER STATUS ==="
        RESPOND TYPE=echo MSG="Progress: {el_hours}h {el_mins}m / {(s.total_time / 3600)|round(1)}h ({progress}%) | Remaining: {rem_hours}h {rem_mins}m"
        RESPOND TYPE=echo MSG="Bed Temp: {cur_bed}°C / Target: {s.bed_temp}°C"
        RESPOND TYPE=echo MSG="Chamber Temp: {cur_chamber}°C / Target: {s.chamber_target}°C"
        {% if has_humidity and cur_humidity != 'N/A' %}
            RESPOND TYPE=echo MSG="Chamber Humidity: {cur_humidity}% RH{(' / Target: ' ~ s.humidity_target|string ~ '%') if s.humidity_target > 0 else ''}"
        {% endif %}
        RESPOND TYPE=echo MSG="Under-bed Fan: {(s.current_fan_speed * 100)|int}% (Base: {(s.base_fan_speed * 100)|int}%)"
    {% else %}
        RESPOND TYPE=echo MSG="[DRYER] Filament dryer is currently idle / OFF."
    {% endif %}

# Ten-second control loop: warm-up boost, steady circulation, a capped
# 30-second moisture flush every 20 minutes, and an over-temperature guard
# that also reduces the commanded bed target by 4 C.
[gcode_macro _DRYER_STATUS]
description: Internal periodic status handler for filament dryer
variable_time_remaining: 0
variable_total_time: 0
variable_bed_temp: 0.0
variable_chamber_target: 0.0
variable_humidity_target: 0.0
variable_base_fan_speed: 0.0
variable_current_fan_speed: 0.0
variable_is_drying: 0
gcode:
    {% set tick_interval = 10 %}
    {% if is_drying == 1 and time_remaining > 0 %}
        {% set cur_bed = printer.heater_bed.temperature|float %}
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(25.0)|float if has_chamber else 25.0 %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else -1.0 %}

        {% set elapsed_sec = total_time - time_remaining %}

        {% set target_fan = base_fan_speed %}
        {% set active_bed = bed_temp %}
        {% set mode_label = "Active Drying" %}

        {% if chamber_target > 0 %}
            {% if cur_chamber < (chamber_target - 2.0) %}
                {% set target_fan = [base_fan_speed + 0.25, 0.85]|min %}
                {% set mode_label = "Warmup Boost" %}
            {% elif cur_chamber >= (chamber_target - 2.0) and cur_chamber <= (chamber_target + 3.5) %}
                {% if (elapsed_sec > 900) and (elapsed_sec % 1200 <= 30) %}
                    {% set target_fan = [base_fan_speed + 0.25, 0.70]|min %}
                    {% set mode_label = "Moisture Flush" %}
                {% else %}
                    {% set target_fan = base_fan_speed %}
                    {% set mode_label = "Active Drying" %}
                {% endif %}
            {% elif cur_chamber > (chamber_target + 3.5) and cur_chamber <= (chamber_target + 6.0) %}
                {% set target_fan = [base_fan_speed - 0.10, 0.30]|max %}
                {% set mode_label = "Gentle Sweep" %}
            {% elif cur_chamber > (chamber_target + 6.0) %}
                {% set target_fan = [base_fan_speed - 0.20, 0.20]|max %}
                {% set active_bed = [bed_temp - 4.0, 45.0]|max %}
                {% set mode_label = "Overheat Guard" %}
            {% endif %}
        {% endif %}

        M140 S{active_bed}
        {% if target_fan > 0 %}
            SET_FAN_SPEED FAN=bed_fan SPEED={target_fan}
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=current_fan_speed VALUE={target_fan}

        {% set next_time = [time_remaining - tick_interval, 0]|max %}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE={next_time}

        {% set hours = (next_time // 3600)|int %}
        {% set mins = ((next_time % 3600) // 60)|int %}

        {% if has_humidity and cur_humidity >= 0 %}
            M117 Dry {hours}h{mins}m | B:{cur_bed|int}C C:{cur_chamber|int}C H:{cur_humidity|int}%
        {% else %}
            M117 Dry {hours}h{mins}m | B:{cur_bed|int}C C:{cur_chamber|int}C
        {% endif %}

        {% if (next_time % 600 == 0) and (next_time > 0) %}
            {% set el_h = ((total_time - next_time) // 3600)|int %}
            {% set el_m = (((total_time - next_time) % 3600) // 60)|int %}
            {% set prog_pct = (((total_time - next_time) / total_time) * 100)|int %}
            {% if has_humidity and cur_humidity >= 0 %}
                RESPOND TYPE=echo MSG="[DRYER] {el_h}h {el_m}m / {(total_time / 3600)|round(1)}h ({prog_pct}%) | Bed: {cur_bed|round(1)}/{bed_temp}C | Chamber: {cur_chamber|round(1)}C (RH: {cur_humidity}%){('/' ~ chamber_target|string ~ 'C') if chamber_target > 0 else ''} | Fan: {(target_fan * 100)|int}% [{mode_label}]"
            {% else %}
                RESPOND TYPE=echo MSG="[DRYER] {el_h}h {el_m}m / {(total_time / 3600)|round(1)}h ({prog_pct}%) | Bed: {cur_bed|round(1)}/{bed_temp}C | Chamber: {cur_chamber|round(1)}{('/' ~ chamber_target|string ~ 'C') if chamber_target > 0 else 'C'} | Fan: {(target_fan * 100)|int}% [{mode_label}]"
            {% endif %}
        {% endif %}

        {% set elapsed = total_time - next_time %}
        {% if humidity_target > 0 and has_humidity and cur_humidity <= humidity_target and elapsed >= 3600 %}
            RESPOND TYPE=echo MSG="[DRYER] Target humidity reached ({cur_humidity}% <= {humidity_target}%)! Filament is completely dry."
            STOP_DRYER
            M117 Drying Complete (Target RH)
        {% else %}
            {% if next_time > 0 %}
                UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION={tick_interval}
            {% else %}
                STOP_DRYER
                RESPOND TYPE=echo MSG="[DRYER] Drying cycle complete! Bed cooling down."
                M117 Drying Complete
            {% endif %}
        {% endif %}
    {% else %}
        STOP_DRYER
    {% endif %}

[delayed_gcode DRYER_TIMER]
gcode:
    _DRYER_STATUS

# Measured presets for this bed/enclosure. They are process settings, not
# universal filament limits; tune them only after observing spool temperature.
[gcode_macro DRY_PLA]
description: Dry PLA filament (Bed 50C, Chamber Target 40C, 4 hours, Fan 40%)
gcode:
    START_DRYER BED=50 CHAMBER=40 TIME=240 FAN=0.40

[gcode_macro DRY_TPU]
description: Dry TPU filament (Bed 60C, Chamber Target 45C, 5 hours, Fan 40%)
gcode:
