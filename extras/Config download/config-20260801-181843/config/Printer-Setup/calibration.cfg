############################################################################
# CALIBRATION.CFG - Temperature parameters and auto calibration offsets
#
# CALIBRATION WORKFLOW:
# 1. G28 -> QUAD_GANTRY_LEVEL
# 2. XYZ offsets: CALIBRATE_ALL_OFFSETS using the official StealthChanger
#    SexBall/SexBolt probe workflow.
# 3. Run FIRMWARE_RESTART after SAVE_TOOL_PARAMETER writes offsets.
# 4. Run SAVE_CONFIG only when Klipper asks for it.
############################################################################

############################################################################
# CALIBRATION TEMPERATURE PARAMETERS
############################################################################

[gcode_macro _THERMAL_CALIBRATION_PARAMS]
description: Calibration temperature constants
variable_nozzle_temp_pla: 210
variable_nozzle_temp_petg: 235
variable_nozzle_temp_calibration: 150  # Safe for Cartographer probing.
variable_nozzle_temp_abs: 250

variable_bed_temp_pla: 60
variable_bed_temp_petg: 80
variable_bed_temp_calibration: 60  # Match the bed temperature used for the real print.
variable_bed_temp_abs: 100

variable_thermal_stabilize_time_ms: 180000  # 3 minutes for hotend mass and bed surface to stabilize.
variable_temp_margin_min: 2
variable_temp_margin_max: 5
variable_cartographer_max_safe_temp: 60   # Maximum safe Cartographer V3 sensor temperature.
variable_nozzle_temp_for_probe_max: 150   # Do not exceed this nozzle temperature while probing.
gcode:
    # This macro stores calibration constants only; it does not execute motion.

############################################################################
# MATERIAL TEMPERATURE SELECTION
############################################################################

[gcode_macro _SET_CALIBRATION_MATERIAL]
description: Select calibration material temperature profile
gcode:
    {% set material = params.MATERIAL|default("PLA")|string|upper %}
    {% set params_obj = printer["gcode_macro _THERMAL_CALIBRATION_PARAMS"] %}

    {% if material == "PLA" %}
        M117 Material: PLA | Bed {params_obj.bed_temp_pla}C
        SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={params_obj.bed_temp_pla}
    {% elif material == "PETG" %}
        M117 Material: PETG | Bed {params_obj.bed_temp_petg}C
        SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={params_obj.bed_temp_petg}
    {% elif material == "ABS" %}
        M117 Material: ABS | Bed {params_obj.bed_temp_abs}C
        SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={params_obj.bed_temp_abs}
    {% else %}
        M117 Unknown material: {material}. Use PLA / PETG / ABS
    {% endif %}
    M117 Next calibration: Nozzle {params_obj.nozzle_temp_calibration}C + Bed {params_obj.bed_temp_calibration}C

############################################################################
# SEXBALL / SEXBOLT CALIBRATION GUIDE
# Source: stealthchanger.com/calibration/auto_gcode_offsets/
############################################################################

[gcode_macro _SEXBALL_CALIBRATION_GUIDE]
description: Guide for calibrating XYZ tool offsets with the SexBall/SexBolt probe
gcode:
    RESPOND TYPE=echo MSG="=== SEXBALL / SEXBOLT PROBE - CALIBRATE XYZ OFFSETS ==="
    RESPOND TYPE=echo MSG="Source: stealthchanger.com/calibration/auto_gcode_offsets/"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="--- BEFORE STARTING ---"
    RESPOND TYPE=echo MSG=" - Clean all nozzles. Dirt on the nozzle will corrupt offsets."
    RESPOND TYPE=echo MSG=" - T0 should be installed on the shuttle."
    RESPOND TYPE=echo MSG=" - If the printer is not homed: run G28, then QUAD_GANTRY_LEVEL."
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="--- STEP 0, ONE-TIME: MEASURE trigger_to_bottom_z ---"
    RESPOND TYPE=echo MSG="Goal: measure the SexBall/SexBolt microswitch pretravel."
    RESPOND TYPE=echo MSG=" 1. G0 Z60 F600"
    RESPOND TYPE=echo MSG=" 2. G0 X257 Y327 F3000     -> move to the M1-STOP/PF4 ball center"
    RESPOND TYPE=echo MSG="    Note: Z55 is the estimated ball contact/top height; the macro uses Z60 as the safe approach height."
    RESPOND TYPE=echo MSG=" 3. Jog Z down in 1 mm, then 0.1 mm, then 0.01 mm steps."
    RESPOND TYPE=echo MSG=" 4. Put thin paper between the nozzle and the top of the ball."
    RESPOND TYPE=echo MSG="    When the paper can no longer move, record this as Z_contact."
    RESPOND TYPE=echo MSG=" 5. Note: QUERY_ENDSTOPS may not show this pin because PF4 is owned by [tools_calibrate], not by a stepper endstop."
    RESPOND TYPE=echo MSG=" 6. For the first test, keep trigger_to_bottom_z at 0.9 and validate by running TOOL_LOCATE_SENSOR from the safe centered position."
    RESPOND TYPE=echo MSG="    If the switch logic is inverted, TOOL_LOCATE_SENSOR will usually trigger immediately or fail to trigger; then change ^PF4 to ^!PF4."
    RESPOND TYPE=echo MSG=" 7. For exact tuning, measure the switch pretravel electrically or temporarily expose PF4 as a test input, then set:"
    RESPOND TYPE=echo MSG="      [tools_calibrate]"
    RESPOND TYPE=echo MSG="      trigger_to_bottom_z: 0.XX"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="--- STEP 1: CALIBRATE XYZ OFFSETS FOR ALL TOOLS ---"
    RESPOND TYPE=echo MSG="Goal: measure the XYZ delta of T1, T2, ... relative to T0."
    RESPOND TYPE=echo MSG="Run: CALIBRATE_ALL_OFFSETS"
    RESPOND TYPE=echo MSG="Macro behavior:"
    RESPOND TYPE=echo MSG="   T0 -> move to ball -> heat to 150 C"
    RESPOND TYPE=echo MSG="      -> TOOL_LOCATE_SENSOR records the ball center as REFERENCE"
    RESPOND TYPE=echo MSG="   T1 -> SELECT_TOOL T=1 -> heat to 150 C"
    RESPOND TYPE=echo MSG="      -> TOOL_LOCATE_SENSOR records the ball center as TOOL_POS"
    RESPOND TYPE=echo MSG="      -> TOOL_CALIBRATE_TOOL_OFFSET computes:"
    RESPOND TYPE=echo MSG="           gcode_x_offset = TOOL_POS.x - REFERENCE.x"
    RESPOND TYPE=echo MSG="           gcode_y_offset = TOOL_POS.y - REFERENCE.y"
    RESPOND TYPE=echo MSG="           gcode_z_offset = TOOL_POS.z - REFERENCE.z"
    RESPOND TYPE=echo MSG="      -> SAVE_TOOL_PARAMETER writes the result to SAVE_CONFIG"
    RESPOND TYPE=echo MSG="   Repeat for T2, T3, and T4."
    RESPOND TYPE=echo MSG="   Final step: SELECT_TOOL T=0 and turn heaters off."
    RESPOND TYPE=echo MSG="After calibration finishes, run FIRMWARE_RESTART."
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="--- STEP 2: CHECK RESULTS ---"
    RESPOND TYPE=echo MSG="Run: CHECK_OFFSETS"
    RESPOND TYPE=echo MSG="This prints the current gcode_x/y/z_offset values for every tool."
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="--- SAVE_CONFIG NOTES ---"
    RESPOND TYPE=echo MSG="Keep these sections in SAVE_CONFIG:"
    RESPOND TYPE=echo MSG="   [cartographer scan_model default]  <- bed mesh coefficients"
    RESPOND TYPE=echo MSG="   [extruder] / [extruder1] pid_kp/ki/kd  <- calibrated PID values"
    RESPOND TYPE=echo MSG="   [cartographer touch_model default]  <- used by TOUCH_HOME"
    RESPOND TYPE=echo MSG="Expected after calibration:"
    RESPOND TYPE=echo MSG="   [tool T1] gcode_x/y/z_offset = ... <- SAVE_TOOL_PARAMETER"
    RESPOND TYPE=echo MSG=""
    RESPOND TYPE=echo MSG="--- COMMAND SUMMARY ---"
    RESPOND TYPE=echo MSG="First setup:"
    RESPOND TYPE=echo MSG="   G28 -> QUAD_GANTRY_LEVEL"
    RESPOND TYPE=echo MSG="   CALIBRATE_ALL_OFFSETS"
    RESPOND TYPE=echo MSG="   FIRMWARE_RESTART"
    RESPOND TYPE=echo MSG="Check: CHECK_OFFSETS"

############################################################################
# CHECK_OFFSETS - Quick check of current tool offsets
############################################################################

[gcode_macro CHECK_OFFSETS]
description: Check current tool offsets
gcode:
    _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Check current tool offsets
gcode:
    RESPOND MSG="=== KTC Z-OFFSET CHECK ==="
    {% set tool_list = printer.toolchanger.tool_names %}
    {% for tname in tool_list %}
        RESPOND MSG="{tname}: gcode_z_offset = {printer[tname].gcode_z_offset}"
    {% endfor %}

