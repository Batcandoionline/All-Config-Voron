############################################################################
# CALIBRATION.CFG - Five-tool offset calibration policy
#
# ACTIVE NOW: Axiscope for manual camera XY alignment and PF2 switch Z probing.
# PLANNED: Tool Vision after its service and magnetic camera station are
# commissioned. [axiscope], [tools_calibrate], and [tool_vision] are mutually
# exclusive because they allocate the same probe_multi_axis resource.
############################################################################

############################################################################
# Calibration temperatures
############################################################################

[gcode_macro _THERMAL_CALIBRATION_PARAMS]
description: Calibration temperature constants
variable_nozzle_temp_pla: 210
variable_nozzle_temp_petg: 235
variable_nozzle_temp_calibration: 150
variable_nozzle_temp_abs: 250
variable_bed_temp_pla: 60
variable_bed_temp_petg: 80
variable_bed_temp_calibration: 60
variable_bed_temp_abs: 100
variable_thermal_stabilize_time_ms: 180000
variable_temp_margin_min: 2
variable_temp_margin_max: 5
variable_cartographer_max_safe_temp: 60
variable_nozzle_temp_for_probe_max: 150
gcode:
  {% set _noop = 0 %}

[gcode_macro _SET_CALIBRATION_MATERIAL]
description: Select the bed temperature used during calibration
gcode:
  {% set material = params.MATERIAL|default("PLA")|string|upper %}
  {% set values = printer["gcode_macro _THERMAL_CALIBRATION_PARAMS"] %}
  {% if material == "PLA" %}
    {% set bed = values.bed_temp_pla %}
  {% elif material == "PETG" %}
    {% set bed = values.bed_temp_petg %}
  {% elif material == "ABS" %}
    {% set bed = values.bed_temp_abs %}
  {% else %}
    {action_raise_error("Unknown MATERIAL. Use PLA, PETG, or ABS.")}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_THERMAL_CALIBRATION_PARAMS VARIABLE=bed_temp_calibration VALUE={bed}
  RESPOND MSG="Calibration profile {material}: nozzle {values.nozzle_temp_calibration} C, bed {bed} C"

############################################################################
# Read-only status helpers
############################################################################

[gcode_macro CALIBRATION_STATUS]
description: Show the active calibration method and physical station workflow
gcode:
  RESPOND MSG="Calibration backend: Axiscope (active); Tool Vision (staged)"
  RESPOND MSG="Camera: MF-500 normally monitors the chamber"
  RESPOND MSG="For XY calibration: install the camera on its keyed magnetic bed mount, then manually measure and configure the camera station"
  RESPOND MSG="Switch values are also user-measured per machine; this machine currently uses X=68.0 Y=-10.0 Z=7.0"
  RESPOND MSG="Never enable axiscope, tools_calibrate, and tool_vision together"

[gcode_macro CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  RESPOND MSG="=== FIVE-TOOL XYZ OFFSETS ==="
  {% for tname in printer.toolchanger.tool_names %}
    {% set tool = printer[tname] %}
    RESPOND MSG="{tname}: X={tool.gcode_x_offset|float|round(4)} Y={tool.gcode_y_offset|float|round(4)} Z={tool.gcode_z_offset|float|round(4)}"
  {% endfor %}

############################################################################
# Disable stale KTC SexBolt commands while tools_calibrate is not configured.
# These overrides prevent the old readonly macros from accessing a missing
# printer.tools_calibrate object. Axiscope remains the production fallback.
############################################################################

[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Disabled legacy SexBolt command; use the active calibration backend
gcode:
  {action_raise_error("tools_calibrate is disabled. Use Axiscope now, or Tool Vision after the controlled cutover.")}

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Disabled legacy SexBolt command; use Axiscope or Tool Vision
gcode:
  {action_raise_error("CALIBRATE_ALL_OFFSETS requires inactive tools_calibrate. Use the Axiscope UI now; after cutover use TV_CALIBRATE_ALL MODE=XYZ.")}

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Disabled legacy SexBolt command for this fixed Cartographer setup
gcode:
  {action_raise_error("No tool_probe_endstop is configured. Cartographer is fixed to the shuttle; use the selected tool-offset backend.")}

[gcode_macro _SEXBALL_CALIBRATION_GUIDE]
description: Explain why the legacy SexBolt workflow is disabled
gcode:
  RESPOND MSG="SexBolt/tools_calibrate is inactive on this printer"
  RESPOND MSG="Current backend: Axiscope. Planned backend: Tool Vision camera XY plus PF2 switch Z"
  RESPOND MSG="Run CALIBRATION_STATUS and CHECK_OFFSETS for the current state"

############################################################################
# Axiscope - active fallback until Tool Vision is commissioned
#
# The same MF-500 camera normally monitors the chamber. For XY work it is
# placed on the keyed magnetic bed mount as an upward camera. The user measures
# all station coordinates and stores them in the selected backend's .cfg.
############################################################################

[axiscope]
pin: ^PF2
zswitch_x_pos: 68.0
zswitch_y_pos: -10.0
zswitch_z_pos: 7.0
lift_z: 2.0
move_speed: 100
z_move_speed: 5
start_gcode:
  M117 Axiscope Z calibration
  {% for tool in printer.toolchanger.tool_numbers %}
    M104 T{tool} S150
  {% endfor %}
finish_gcode:
  {% for tool in printer.toolchanger.tool_numbers %}
    M104 T{tool} S0
  {% endfor %}
  T0
  M117 Axiscope calibration complete
