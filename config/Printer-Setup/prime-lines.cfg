############################################################################
# PRIME-LINES.CFG - Multi-tool prime lines for StealthChanger
#
# PRINT_START calls:
#   PRIME_LINES INITIAL_TOOL=<first printed tool> T0_TEMP=... T1_TEMP=...
#
# Only tools with Tn_TEMP > 0 are primed. Non-initial tools are primed first;
# the initial printing tool is primed last and remains mounted for layer 1.
############################################################################

[gcode_macro PRIME_LINES]
description: Prime every slicer-used tool near the front-center, leaving the initial print tool active
variable_line_x_end_margin: 30.0
variable_line_length: 50.0
variable_line_gap: 6.0
variable_line_y_start: 0.0
variable_line_y_spacing: 0.0
variable_line_passes: 3
variable_pass_y_spacing: 3.0
variable_prime_z: 0.28
variable_travel_z: 5.0
variable_prime_amount: 8.0
variable_prime_feedrate: 1200
variable_travel_feedrate: 9000
variable_z_feedrate: 3000
variable_retract_amount: 1.8
variable_final_retract_amount: 0.6
variable_retract_feedrate: 3600
variable_wipe_distance: 12.0
gcode:
    {% set cfg = printer["gcode_macro PRIME_LINES"] %}
    {% set initial_tool = params.INITIAL_TOOL|default(-1)|int %}
    {% set used = namespace(count=0) %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% if params[temp_key]|default(0)|int > 0 %}
            {% set used.count = used.count + 1 %}
        {% endif %}
    {% endfor %}
    {% if used.count == 0 and params.TOOL_TEMP|default(0)|int > 0 %}
        {% set used.count = 1 %}
    {% endif %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="PRIME_LINES requires XYZ homed; skipping prime to avoid unsafe movement"
    {% elif initial_tool not in printer.toolchanger.tool_numbers %}
        RESPOND TYPE=error MSG="PRIME_LINES invalid INITIAL_TOOL={initial_tool}; skipping prime"
    {% else %}
        {% set slot = namespace(index=0) %}
        SAVE_GCODE_STATE NAME=STATE_PRIME_LINES
        G90
        M83
        G0 Z{cfg.travel_z} F{cfg.z_feedrate}

        {% for tn in printer.toolchanger.tool_numbers %}
            {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
            {% set temp = params[temp_key]|default(0)|int %}
            {% if tn != initial_tool and temp > 0 %}
                _PRIME_LINES_TOOL T={tn} TEMP={temp} SLOT={slot.index} COUNT={used.count} FINAL=0
                {% set slot.index = slot.index + 1 %}
            {% endif %}
        {% endfor %}

        {% set initial_temp_key = "T" ~ initial_tool|string ~ "_TEMP" %}
        {% set initial_temp = params[initial_temp_key]|default(params.TOOL_TEMP|default(0))|int %}
        {% if initial_temp > 0 %}
            _PRIME_LINES_TOOL T={initial_tool} TEMP={initial_temp} SLOT={slot.index} COUNT={used.count} FINAL=1
        {% else %}
            RESPOND TYPE=error MSG="PRIME_LINES missing T{initial_tool}_TEMP; initial tool was not primed"
        {% endif %}

        RESTORE_GCODE_STATE NAME=STATE_PRIME_LINES MOVE=0
    {% endif %}

[gcode_macro _PRIME_LINES_TOOL]
description: Prime one tool at its assigned bed slot
gcode:
    {% set cfg = printer["gcode_macro PRIME_LINES"] %}
    {% set t = params.T|int %}
    {% set temp = params.TEMP|int %}
    {% set slot = params.SLOT|int %}
    {% set prime_count = [params.COUNT|default(1)|int, 1]|max %}
    {% set passes = [cfg.line_passes|int, 1]|max %}
    {% set final_tool = params.FINAL|default(0)|int %}
    {% set retract = cfg.final_retract_amount|float if final_tool else cfg.retract_amount|float %}
    {% set th = printer.toolhead %}
    {% set x_min = th.axis_minimum.x|float %}
    {% set x_max = th.axis_maximum.x|float %}
    {% set y_min = th.axis_minimum.y|float %}
    {% set y_max = th.axis_maximum.y|float %}
    {% set usable_x_min = x_min + cfg.line_x_end_margin|float %}
    {% set usable_x_max = x_max - cfg.line_x_end_margin|float %}
    {% set usable_x_width = [usable_x_max - usable_x_min, 5.0]|max %}
    {% set max_gap_total = cfg.line_gap|float * ([prime_count - 1, 0]|max) %}
    {% set auto_line_len = [(usable_x_width - max_gap_total) / prime_count, 5.0]|max %}
    {% set line_len = [cfg.line_length|float, auto_line_len]|min %}
    {% set total_width = (line_len * prime_count) + max_gap_total %}
    {% set group_x_start = usable_x_min + ((usable_x_width - total_width) / 2.0) %}
    {% set x_start = group_x_start + (slot * (line_len + cfg.line_gap|float)) %}
    {% set x_end = x_start + line_len %}
    {% set wipe_x = [x_end + cfg.wipe_distance|float, usable_x_max]|min %}
    {% set y_span = [y_max - cfg.line_y_start|float - 5.0, 1.0]|max %}
    {% set auto_y_spacing = y_span / ([prime_count - 1, 1]|max) %}
    {% set y_spacing = [cfg.line_y_spacing|float, auto_y_spacing]|min %}
    {% set raw_y = cfg.line_y_start|float + (slot * y_spacing) %}
    {% set y = [[raw_y, y_min + 1.0]|max, y_max - 5.0]|min %}

    M117 Prime T{t}
    T{t}
    # Wait for this tool to reach its first-layer temperature before drawing.
    M109 T{t} S{temp}
    G90
    M83
    G0 Z{cfg.travel_z} F{cfg.z_feedrate}
    G0 X{x_start} Y{y} F{cfg.travel_feedrate}
    G0 Z{cfg.prime_z} F{cfg.z_feedrate}
    G92 E0
    {% for p in range(passes) %}
        {% set pass_y = [[y + (p * cfg.pass_y_spacing|float), y_min + 1.0]|max, y_max - 5.0]|min %}
        {% if p % 2 == 0 %}
            G0 X{x_start} Y{pass_y} F{cfg.travel_feedrate}
            G1 X{x_end} E{cfg.prime_amount} F{cfg.prime_feedrate}
        {% else %}
            G0 X{x_end} Y{pass_y} F{cfg.travel_feedrate}
            G1 X{x_start} E{cfg.prime_amount} F{cfg.prime_feedrate}
        {% endif %}
    {% endfor %}
    # Depressurize before lifting or docking, then wipe sideways at low Z to break the string.
    G1 E-{retract} F{cfg.retract_feedrate}
    G92 E0
    {% if passes % 2 == 0 %}
        G0 X{[x_start - cfg.wipe_distance|float, usable_x_min]|max} F{cfg.travel_feedrate}
    {% else %}
        G0 X{wipe_x} F{cfg.travel_feedrate}
    {% endif %}
    G0 Z{cfg.travel_z} F{cfg.z_feedrate}
