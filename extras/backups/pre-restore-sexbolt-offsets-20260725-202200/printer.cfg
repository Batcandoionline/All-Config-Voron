# Mainsail web interface; do not edit.
[include mainsail.cfg]

# StealthChanger KTC-Easy readonly: toolchanger, homing, macros pickup/dropoff
# Do not edit files inside readonly-configs/.
[include toolchanger/readonly-configs/toolchanger-include.cfg]

# Crash Detection Override - Tool_Crash Plugin Support
# Must be included after toolchanger-include.cfg so this can override the macro.
[include Printer-Setup/crash_detection_override.cfg]

# Printer-Setup/ split out from printer.cfg for easier maintenance.
# calibration.cfg must be included before probe-mesh.cfg.
# _THERMAL_CALIBRATION_PARAMS must be declared before probe-mesh.cfg loads.
[include Printer-Setup/calibration.cfg]
[include Printer-Setup/hardware.cfg]
[include Printer-Setup/probe-mesh.cfg]
[include Printer-Setup/fans-leds.cfg]
[include Printer-Setup/input-shaper.cfg]
[include Printer-Setup/nozzle-clean.cfg]
[include Printer-Setup/prime-lines.cfg]
[include Printer-Setup/print-macros.cfg]
# Tool Crash Detection - Cartographer + SexBall Probe
# Must be included after all [tool] sections, already loaded by toolchanger-include.cfg.
[include Printer-Setup/tool_crash_cartographer.cfg]
#####################################################################

[printer]
kinematics: corexy
max_velocity: 300
max_accel: 4000
max_z_velocity: 60       # Raised from 15; StealthChanger needs faster Z moves for tool changes
max_z_accel: 700         # Raised from 350; increase by 100-200 and test tool changes after each step
square_corner_velocity: 5.0

