# Production calibration backend: Axiscope camera XY plus PF2 switch Z.
# Tool Vision is staged but must remain disabled until its controlled cutover.
# axiscope, tools_calibrate, and tool_vision all own probe_multi_axis and are
# therefore mutually exclusive.

[gcode_macro CALIBRATION_STATUS]
description: Report the active tool-offset calibration workflow
gcode:
  RESPOND MSG="Calibration backend: Axiscope (active); Tool Vision (staged)"
  RESPOND MSG="Move the MF-500 from chamber view to its keyed magnetic bed mount for XY calibration"
  RESPOND MSG="User-measured PF2 switch position: X=68.0 Y=-10.0 Z=7.0"
  RESPOND MSG="Never enable axiscope, tools_calibrate, and tool_vision together"

[gcode_macro CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  _CHECK_OFFSETS

[gcode_macro _CHECK_OFFSETS]
description: Report XYZ offsets for every configured tool
gcode:
  RESPOND MSG="=== FIVE-TOOL XYZ OFFSETS ==="
  {% for tname in printer.toolchanger.tool_names %}
    {% set tool = printer[tname] %}
    RESPOND MSG="{tname}: X={tool.gcode_x_offset|float|round(4)} Y={tool.gcode_y_offset|float|round(4)} Z={tool.gcode_z_offset|float|round(4)}"
  {% endfor %}

# KTC readonly files still expose the legacy SexBolt commands. Override them
# while tools_calibrate is absent so they cannot access an undefined object.
[gcode_macro CALIBRATE_MOVE_OVER_PROBE]
description: Disabled legacy SexBolt command
gcode:
  {action_raise_error("tools_calibrate is disabled. Use Axiscope until the Tool Vision cutover is commissioned.")}

[gcode_macro CALIBRATE_ALL_OFFSETS]
description: Disabled legacy SexBolt command
gcode:
  {action_raise_error("tools_calibrate is disabled. Use Axiscope until the Tool Vision cutover is commissioned.")}

[gcode_macro CALIBRATE_NOZZLE_PROBE_OFFSET]
description: Disabled legacy SexBolt command
gcode:
  {action_raise_error("No tool_probe_endstop is configured. Cartographer is fixed to the shuttle.")}

[gcode_macro _SEXBALL_CALIBRATION_GUIDE]
description: Report why the legacy SexBolt workflow is disabled
gcode:
  RESPOND MSG="SexBolt/tools_calibrate is inactive"
  RESPOND MSG="Current backend: Axiscope; planned backend: Tool Vision camera XY plus PF2 switch Z"
  RESPOND MSG="Run CALIBRATION_STATUS and CHECK_OFFSETS for the current state"

[axiscope]
pin: ^PF2
zswitch_x_pos: 68.0
zswitch_y_pos: -10.0
zswitch_z_pos: 7.0
lift_z: 2.0
move_speed: 100
z_move_speed: 5
start_gcode:
  M117 Axiscope Z calibration
  {% for tool in printer.toolchanger.tool_numbers %}
    M104 T{tool} S150
  {% endfor %}
finish_gcode:
  {% for tool in printer.toolchanger.tool_numbers %}
    M104 T{tool} S0
  {% endfor %}
  T0
  M117 Axiscope calibration complete
