############################################################################
# NOZZLE-CLEAN.CFG - Vệ sinh đầu in trực tiếp trên tấm PEI (PEI Bed Rub & Edge Wipe)
#
# Thiết kế dành cho Voron 2.4 StealthChanger 5-Tool:
# - Giai đoạn 1: Ép dính & xoay tròn cung G2 + zíc-zắc chậm F200 trên mặt tấm PEI
# - Giai đoạn 2: Miết mép tấm PEI tốc độ vừa F2000 + gạt flick tốc độ cao F12000
#
# CÁCH GỌI:
#   CLEAN_NOZZLE                       ; Chạy chu trình tiêu chuẩn (hoặc gọi CLEAR_NOZZLE)
#   CLEAN_NOZZLE TEMP=150              ; Gia nhiệt đến 150 C trước khi chà
#   CLEAN_NOZZLE RUB_Z=0.1 FLICK_Z=-0.8 ; Ghi đè độ cao Z tiếp xúc
#   CLEAN_NOZZLE SKIP_SWIRL=1          ; Bỏ qua xoay tròn, chỉ gạt mép
#   CLEAN_NOZZLE SKIP_FLICK=1          ; Bỏ qua gạt mép, chỉ xoay tròn trên PEI
############################################################################

[gcode_arcs]
resolution: 0.1     # Bắt buộc để thực thi cung tròn G2/G3

[gcode_macro CLEAN_NOZZLE]
description: Ve sinh dau in bang phuong phap cha miet truc tiep tren tam PEI (PEI Bed Rub)

# =========================================================================
# 1. THIẾT LẬP AN TOÀN & TỐC ĐỘ DI CHUYỂN
# =========================================================================
variable_safe_z: 10.0               # Do cao Z an toan khi di chuyen (mm)
variable_travel_speed: 12000        # Toc do di chuyen XY nhanh (mm/min)
variable_z_speed: 1500              # Toc do nang/ha truc Z (mm/min)

# =========================================================================
# 2. VÙNG 1: ÉP DÍNH & XOAY TRÒN G2 TRÊN MẶT TẤM PEI
# =========================================================================
variable_enable_swirl: True         # Bat/tat giai doan xoay tron tren PEI
variable_approach_x: 125.0          # Toa do X tiep can ban dau
variable_rub_start_x: 130.0         # Toa do X bat dau vung cha PEI
variable_rub_end_x: 140.0           # Toa do X ket thuc vung cha PEI
variable_rub_y1: 5.0                # Toa do Y duong quet 1
variable_rub_y2: 6.0                # Toa do Y duong quet 2
variable_rub_y3: 8.0                # Toa do Y duong quet 3
variable_rub_z: 0.1                 # Do cao Z tiep xuc tren be mat PEI (mm)
variable_rub_swirl_count: 21        # So vong xoay tron G2 sau khi quet zic-zac
variable_arc_offset_i: 0.5          # Do lech tam I cho lenh G2
variable_arc_offset_j: 0.5          # Do lech tam J cho lenh G2
variable_rub_slow_speed: 200        # Toc do quet zic-zac cham bam nhua (mm/min)
variable_rub_swirl_speed: 600       # Toc do xoay tron G2 (mm/min)

# =========================================================================
# 3. VÙNG 2: MIẾT MÉP TẤM PEI & GIẬT TƠ NHỰA TỐC ĐỘ CAO (FLICK)
# =========================================================================
variable_enable_flick: True         # Bat/tat giai doan gat mep cat to nhua
variable_flick_start_x: 164.0       # Toa do X bat dau duong gat mep
variable_flick_end_x: 180.0         # Toa do X ket thuc duong gat mep
variable_flick_y_med: 3.0           # Toa do Y duong gat 1 (toc do vua)
variable_flick_y_fast: 1.0          # Toa do Y duong gat 2 (toc do cao)
variable_flick_z: -0.8              # Do cao Z miet mep ban/tam PEI (mm)
variable_flick_hop_z: 0.5           # Do nhac Z khi chuyen giua 2 duong Y (mm)
variable_flick_med_passes: 7        # So luot gat toc do vua
variable_flick_fast_passes: 7       # So luot gat flick toc do cao
variable_flick_med_speed: 2000      # Toc do miet vua (mm/min)
variable_flick_fast_speed: 12000    # Toc do gat flick nhanh (mm/min)

gcode:
    # ---------------------------------------------------------------------
    # Đọc tham số gọi hoặc lấy giá trị mặc định từ biến macro
    # ---------------------------------------------------------------------
    {% set clean_temp  = params.TEMP|default(150)|int %}
    {% set purge_mm    = params.PURGE|default(0)|int %}
    {% set purge_t     = params.PURGE_TEMP|default(0)|int %}
    {% set skip_swirl  = params.SKIP_SWIRL|default(0)|int %}
    {% set skip_flick  = params.SKIP_FLICK|default(0)|int %}

    # Override độ cao Z nếu được truyền vào
    {% set rub_contact_z   = params.RUB_Z|default(variable_rub_z)|float %}
    {% set flick_contact_z = params.FLICK_Z|default(variable_flick_z)|float %}

    # KTC là nguồn chân lý để xác định tool vật lý đang được gắn trên shuttle.
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% set extruder    = printer.toolhead.extruder|default("")|string %}

    {% if active_tool < 0 or extruder == "" %}
        {action_raise_error("CLEAN_NOZZLE requires a KTC active tool. Run INITIALIZE_TOOLCHANGER or select T0-T4 first.")}
    {% else %}
    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90

    # Đảm bảo XYZ đã được Home trước khi di chuyển
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}

    _SET_LED_STATUS_CLEANING

    # =====================================================================
    # BƯỚC 1: GIA NHIỆT LÀM MỀM NHỰA (NẾU CẦN)
    # =====================================================================
    {% if printer[extruder].temperature < clean_temp - 5 %}
        M117 Heating nozzle to {clean_temp}C...
        M104 S{clean_temp}
        M109 S{clean_temp}
    {% endif %}

    # =====================================================================
    # BƯỚC 2: TIẾP CẬN VÙNG CHÀ PEI
    # =====================================================================
    G1 Z{[printer.toolhead.position[2], variable_safe_z]|max} F{variable_z_speed}
    G1 X{variable_approach_x} F{variable_travel_speed}
    G1 X{variable_rub_start_x} Y{variable_rub_y1} F6000
    G1 Z1.0 F600

    # =====================================================================
    # BƯỚC 3: GIAI ĐOẠN 1 — ÉP DÍNH, XOAY CUNG G2 & QUÉT ZÍC-ZẮC TRÊN PEI
    # =====================================================================
    {% if variable_enable_swirl and skip_swirl == 0 %}
        M117 PEI bed scrubbing...
        G1 Z{rub_contact_z} F600

        # 3 vòng xoay tròn ban đầu để ép dính nhựa vào mặt PEI
        {% for _ in range(3) %}
            G2 I{variable_arc_offset_i} J{variable_arc_offset_j} F{variable_rub_swirl_speed}
        {% endfor %}

        # Quét zíc-zắc chậm F200 kéo màng nhựa bám chắc vào PEI
        G1 X{variable_rub_end_x} F{variable_rub_slow_speed}
        G1 Y{variable_rub_y2} F{variable_rub_slow_speed}
        G1 X{variable_rub_start_x} F{variable_rub_slow_speed}
        G1 Y{variable_rub_y3} F{variable_rub_slow_speed}
        G1 X{variable_rub_end_x} F{variable_rub_slow_speed}

        # Chuỗi 21 vòng xoay G2 liên tục để bóc sạch nhựa quanh vát nozzle
        {% for _ in range(variable_rub_swirl_count) %}
            G2 I{variable_arc_offset_i} J{variable_arc_offset_j} F{variable_rub_swirl_speed}
        {% endfor %}
    {% endif %}

    # =====================================================================
    # BƯỚC 4: GIAI ĐOẠN 2 — MIẾT MÉP & GẠT FLICK NHANH CẮT TƠ NHỰA
    # =====================================================================
    {% if variable_enable_flick and skip_flick == 0 %}
        M117 Edge wiping & flicking...
        # Nhấc nhẹ Z, di chuyển nhanh sang đầu đường gạt 1 (Y=3)
        G1 Z0.2 F{variable_z_speed}
        G1 X{variable_flick_end_x} Y{variable_flick_y_med} F{variable_travel_speed}
        # Hạ xuống mép tấm PEI
        G1 Z{flick_contact_z} F{variable_z_speed}

        # Quét qua lại tốc độ vừa (F2000)
        {% for _ in range(variable_flick_med_passes) %}
            G1 X{variable_flick_start_x} F{variable_flick_med_speed}
            G1 X{variable_flick_end_x} F{variable_flick_med_speed}
        {% endfor %}

        # Nhấc nhẹ Z, chuyển sang đường gạt 2 (Y=1)
        G1 Z{variable_flick_hop_z} F{variable_z_speed}
        G1 X{variable_flick_end_x} Y{variable_flick_y_fast} F{variable_travel_speed}
        G1 Z{flick_contact_z} F{variable_z_speed}

        # Gạt flick nhanh tốc độ cao (F12000) giật đứt tơ nhựa thừa
        {% for _ in range(variable_flick_fast_passes) %}
            G1 X{variable_flick_start_x} F{variable_flick_fast_speed}
            G1 X{variable_flick_end_x} F{variable_flick_fast_speed}
        {% endfor %}
    {% endif %}

    # =====================================================================
    # BƯỚC 5: HOÀN TẤT VÀ NÂNG Z AN TOÀN
    # =====================================================================
    M400
    G1 Z{variable_safe_z} F{variable_z_speed}
    M118 Nozzle cleared
    M117 Nozzle cleared

    _SET_LED_STATUS_READY
    RESTORE_GCODE_STATE NAME=clean_nozzle_state
    {% endif %}

############################################################################
# CLEAR_NOZZLE - Alias tiện ích để gọi cùng hành vi vệ sinh
############################################################################

[gcode_macro CLEAR_NOZZLE]
description: Alias cho CLEAN_NOZZLE (Ve sinh dau in tren tam PEI)
gcode:
    CLEAN_NOZZLE {rawparams}

############################################################################
# _CLEAN_NOZZLE_PARK - Đỗ đầu in an toàn tại mép bàn
############################################################################

[gcode_macro _CLEAN_NOZZLE_PARK]
description: Safely park nozzle at PEI wipe area
gcode:
    {% set safe_z = printer["gcode_macro CLEAN_NOZZLE"].safe_z|default(10.0)|float %}
    {% set park_x = printer["gcode_macro CLEAN_NOZZLE"].approach_x|default(125.0)|float %}
    {% set park_y = printer["gcode_macro CLEAN_NOZZLE"].rub_y1|default(5.0)|float %}
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}
    G0 Z{safe_z} F3000
    G0 X{park_x} Y{park_y} F9000
    M117 Nozzle parked at PEI wipe area

############################################################################
# PURGE_AND_CLEAN - Purge và vệ sinh đầu in trên tấm PEI
############################################################################

[gcode_macro PURGE_AND_CLEAN]
description: Purge old filament and clean nozzle on PEI plate
gcode:
    {% set purge_mm   = params.PURGE|default(15)|int %}
    {% set purge_temp = params.PURGE_TEMP|default(200)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}

    _SET_LED_STATUS_CLEANING
    CLEAN_NOZZLE TEMP={clean_temp} PURGE={purge_mm} PURGE_TEMP={purge_temp}
    _SET_LED_STATUS_READY
