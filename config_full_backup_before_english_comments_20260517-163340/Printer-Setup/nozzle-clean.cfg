############################################################################
# NOZZLE-CLEAN.CFG — Vệ sinh nozzle với brush silicon Bambu A1
#
# TỌA ĐỘ ĐO THỰC TẾ (Brush):
#   brush_ref_x : 275.0 (góc trái)
#   brush_ref_y : -6.0  (góc trước)
#   Bucket      : X=320 Y=-8
#
# CÁCH GỌI:
#   CLEAN_NOZZLE
#   CLEAN_NOZZLE WIPES=8 TEMP=230 PURGE=15 PURGE_TEMP=260
############################################################################

[gcode_arcs]
resolution: 0.1     # Bắt buộc cho G2/G3 circular scrub

############################################################################
# CLEAN_NOZZLE
# LUỒNG:
#   1. Home nếu cần → Nâng Z an toàn → Travel đến bucket (X=320 Y=-8)
#   2a. [PURGE>0] Nung purge_temp → Xả nhựa → Quạt hạ về clean_temp → 2s dwell
#   2b. [PURGE=0] Nung lên clean_temp nếu chưa đủ nhiệt
#   3. Hạ Z=2mm → Flick WIPES lần (X=307 → X=320) → Circular scrub WIPES vị trí
#   4. Snap về bucket → Nâng Z=15mm
############################################################################

[gcode_macro CLEAN_NOZZLE]
description: Vệ sinh nozzle
gcode:
    # ── Params ───────────────────────────────────────────────────────────
    {% set wipes      = params.WIPES|default(5)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set purge_mm   = params.PURGE|default(0)|int %}
    {% set purge_t    = params.PURGE_TEMP|default(0)|int %}

    # ── Tọa độ nội bộ ────────
    {% set bucket_x      = 320.0 %}
    {% set brush_cy      =  -8.0 %}
    {% set flick_x       = 307.0 %}
    {% set scrub_start_x = 279.5 %}
    {% set scrub_width   =  31.0 %}
    {% set circle_r      =   2.0 %}
    {% set clean_z       =   2.0 %}
    {% set safe_z        =  15.0 %}

    # ── Hỗ trợ logic bước lặp ──
    {% set ns = namespace(step=0.0) %}
    {% if wipes > 1 %}
        {% set ns.step = scrub_width / (wipes - 1) %}
    {% endif %}

    # ── Tốc độ ───────────────────────────────────────────────────────────
    {% set travel_f = 9000 %}
    {% set z_f      = 1500 %}
    {% set flick_f  = 9000 %}
    {% set snap_f   = 13500 %}
    {% set scrub_f  = 3000 %}

    # ── Active extruder ───────────────────────────────────────────────────
    {% set extruder = printer.toolhead.extruder %}

    SAVE_GCODE_STATE NAME=clean_nozzle_state
    G90

    # ── Đảm bảo XYZ đã homed ────────────────────────────────────────
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 1: Nâng Z an toàn → Travel đến bucket
    # ════════════════════════════════════════════════════════════════════
    _SET_LED_STATUS_CLEANING
    M117 Di chuyển đến bucket...
    G1 Z{[printer.toolhead.position[2], safe_z]|max} F{z_f}
    G1 X{bucket_x} Y{brush_cy} F{travel_f}

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 2A: Purge nhựa cũ (PURGE > 0) — nozzle đang ở bucket
    #   actual_purge_temp = max(PURGE_TEMP, TEMP, 200)
    #   Sau purge: M106 quạt tối đa → TEMPERATURE_WAIT ≤ clean_temp → M107 → G4 2s
    # ════════════════════════════════════════════════════════════════════
    {% if purge_mm > 0 %}
        {% set actual_pt = [purge_t, clean_temp, 200]|max %}
        M117 Nung {actual_pt}°C để xả nhựa cũ...
        M104 S{actual_pt}
        M109 S{actual_pt}
        M117 Xả {purge_mm}mm vào bucket...
        M83
        G1 E{purge_mm} F300
        G1 E-2 F2100
        M82
        M117 Hạ về {clean_temp}°C (quạt tối đa)...
        M104 S{clean_temp}
        M106 S255
        TEMPERATURE_WAIT SENSOR={extruder} MAXIMUM={clean_temp}
        M107
        G4 P2000

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 2B: Không purge — nung lên clean_temp nếu chưa đủ nhiệt
    # ════════════════════════════════════════════════════════════════════
    {% else %}
        {% if printer[extruder].temperature < clean_temp - 5 %}
            M117 Nung nozzle {clean_temp}°C...
            M104 S{clean_temp}
            M109 S{clean_temp}
        {% endif %}
    {% endif %}

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 3: Hạ Z=2mm xuống brush
    # ════════════════════════════════════════════════════════════════════
    G1 Z{clean_z} F{z_f}

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 4: Flick {wipes}x — bật nhựa thừa vào bucket
    #   Dip Z –0.5mm → Đâm X=307 → Dwell 20ms → Snap về X=320 → Restore Z
    # ════════════════════════════════════════════════════════════════════
    M117 Flick {wipes}x...
    {% for i in range(wipes) %}
        G1 Z{clean_z - 0.5} F{z_f}
        G1 X{flick_x} F{flick_f}
        G4 P20
        G1 X{bucket_x} F{snap_f}
        G1 Z{clean_z} F{z_f}
    {% endfor %}

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 5: Circular Scrub — {wipes} vị trí × 2 vòng (CW→CCW)
    #   Dải X=279.5→305.5, bước đều — mỗi vị trí 1 vòng CW + 1 vòng CCW
    # ════════════════════════════════════════════════════════════════════
    M117 Circular scrub {wipes} pass...
    {% for i in range(wipes) %}
        {% set x_pos = scrub_start_x + (i * ns.step) %}
        G1 X{x_pos} Y{brush_cy} F{travel_f}
        G2 X{x_pos} Y{brush_cy} I{circle_r} J0 F{scrub_f}
        G3 X{x_pos} Y{brush_cy} I{circle_r} J0 F{scrub_f}
    {% endfor %}

    # ════════════════════════════════════════════════════════════════════
    # BƯỚC 6: Snap về bucket → Nâng Z an toàn
    # ════════════════════════════════════════════════════════════════════
    G1 X{bucket_x} F{travel_f}
    G1 Z{safe_z} F{z_f}
    M117 Nozzle sạch — sẵn sàng probe

    _SET_LED_STATUS_READY
    RESTORE_GCODE_STATE NAME=clean_nozzle_state

############################################################################
# _CLEAN_NOZZLE_PARK — Park nozzle vào bucket (không lau)
# Gọi sau G28 XY trong PRINT_START — ooze rơi vào bucket khi chờ bàn nóng
# Z KHÔNG thay đổi — chỉ XY — an toàn khi Z chưa home
############################################################################

[gcode_macro _CLEAN_NOZZLE_PARK]
description: Park nozzle vào bucket an toàn
gcode:
    {% set safe_z = 10 %}
    G90
    {% if "xyz" not in printer.toolhead.homed_axes %}
        _SET_LED_STATUS_LEVELING
        G28
    {% endif %}
    G0 Z{safe_z} F3000
    G0 X320 Y-8 F9000
    M117 Nozzle parked tại bucket

############################################################################
# PURGE_AND_CLEAN — Xả nhựa cũ + vệ sinh nozzle (macro riêng)
#
# Dùng khi cần xả nhựa trước khi lau — gọi thủ công từ console hoặc macro.
# PRINT_START mặc định chỉ gọi CLEAN_NOZZLE (lau 150°C, không xả).
#
# CÁCH GỌI:
#   PURGE_AND_CLEAN                     ; xả 15mm @ 200°C → lau @ 150°C
#   PURGE_AND_CLEAN PURGE_TEMP=260      ; xả 15mm @ 260°C → lau @ 150°C
#   PURGE_AND_CLEAN PURGE=20 PURGE_TEMP=250  ; xả 20mm @ 250°C
############################################################################

[gcode_macro PURGE_AND_CLEAN]
description: Xả nhựa cũ + vệ sinh nozzle (purge → hạ nhiệt → flick → scrub)
gcode:
    {% set purge_mm   = params.PURGE|default(15)|int %}
    {% set purge_temp = params.PURGE_TEMP|default(200)|int %}
    {% set clean_temp = params.TEMP|default(150)|int %}
    {% set wipes      = params.WIPES|default(5)|int %}

    _SET_LED_STATUS_CLEANING
    CLEAN_NOZZLE TEMP={clean_temp} WIPES={wipes} PURGE={purge_mm} PURGE_TEMP={purge_temp}
    _SET_LED_STATUS_READY
