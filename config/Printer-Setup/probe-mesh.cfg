############################################################################
# PROBE-MESH.CFG - Cartographer, ADXL345, Bed Mesh
# Cartographer probe configuration and bed mesh interpolation features.
# Include this file after calibration.cfg.
############################################################################

#####################################################################
# Cartographer (CAN bus)
#####################################################################

[cartographer]
mcu: cartographer
x_offset: 0                # Coil X offset relative to the nozzle.
y_offset: 35               # Coil Y offset relative to the nozzle.
verbose: no

#####################################################################
# Bed Mesh
#####################################################################

[bed_mesh]
# Mesh coordinates are probe coordinates, not nozzle coordinates.
# Zero reference is at the center of the bed.
zero_reference_position: 170, 203
speed: 600
horizontal_move_z: 3
mesh_min: 20, 45           # Avoid probing too close to the bed edge.
mesh_max: 320, 325
probe_count: 55, 55
adaptive_margin: 10
mesh_pps: 0,0

#####################################################################
# ADXL345 (Cartographer)
#####################################################################

[adxl345]
cs_pin: cartographer:PA3                # ADXL345 chip select.
spi_bus: spi1                           # Internal Cartographer SPI bus.
