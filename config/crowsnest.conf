# crowsnest 4.2 configuration for the installed MF-500 USB camera.
# Mainsail stream: /webcam/webrtc | snapshot: /webcam/?action=snapshot
[crowsnest]
log_path: ~/printer_data/logs/crowsnest.log
log_level: verbose
delete_log: false
no_proxy: false

[cam 1]
mode: camera-streamer
port: 8080
# Stable by-id path for the installed MF-500. For replacement hardware, read
# crowsnest.log or run v4l2-ctl --list-formats-ext and select a supported native
# resolution/FPS pair; 1280x720@30 is the verified mode for this camera only.
device: /dev/v4l/by-id/usb-BC-250612-ZW_MF500_camera_01.00.00-video-index0
resolution: 1280x720
max_fps: 30
custom_flags: --camera-format=MJPEG
v4l2ctl: power_line_frequency=1
