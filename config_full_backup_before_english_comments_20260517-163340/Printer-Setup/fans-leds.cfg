############################################################################
# FANS-LEDS.CFG — Quạt hộp điện, Chamber Lights, LED Toolhead
# Voron 2.4 StealthChanger | Manta M8P V2 + CM4
#
# Bao gồm:
#   - controller_fan, temperature_fan (quạt hộp điện)
#   - neopixel chamber_lights + LIGHTS_ON/OFF
#   - LED state machine cho toolhead (T0–Tn, dynamic)
#   - Mainsail client hooks (PAUSE/RESUME/CANCEL_PRINT)
############################################################################

############################################################################
# QUẠT HỘP ĐIỆN
############################################################################

# Quạt làm mát dàn TMC2209 — Luôn chạy khi stepper hoạt động hoặc idle
[controller_fan tmc_fan]
pin: PF9                           # Fan1 trên Manta M8P V2 (VF1 PF9)
kick_start_time: 0.5               # Xung khởi động 0.5s đảm bảo quạt quay
fan_speed: 1.0                     # 100% khi stepper đang chạy
idle_speed: 1.0                    # 100% kể cả khi idle — TMC luôn cần mát
idle_timeout: 0                    # Không bao giờ tắt (0 = tắt ngay khi idle, dùng 300 nếu muốn delay)
stepper: stepper_x, stepper_y, stepper_z

# Quạt làm mát SoC CM4 — Bật khi nhiệt độ SoC > 50°
[temperature_fan cm4_fan]
pin: PF6                           # Fan2 trên Manta M8P V2 (VF2 PF6)
sensor_type: temperature_host      # Đọc nhiệt độ từ SoC CM4
min_temp: 10
max_temp: 100
target_temp: 50.0
control: watermark
max_delta: 3.0
# --- Bắt PID: comment watermark/max_delta trên, bỏ comment dưới ---
# control: pid
# pid_Kp: 1.0
# pid_Ki: 0.5
# pid_Kd: 2.0
# pid_deriv_time: 2.0
# min_speed: 0.2
# max_speed: 1.0

# Quạt làm mát buồng điện — Bật khi MCU Manta > 55°C
[temperature_fan enclosure_fan]
pin: PF7                           # Fan0 trên Manta M8P V2 (VF0 PF7)
sensor_type: temperature_mcu       # Đọc nhiệt độ từ MCU Manta M8P
min_temp: 10
max_temp: 100
target_temp: 55.0
control: watermark
max_delta: 3.0
# --- Bắt PID: comment watermark/max_delta trên, bỏ comment dưới ---
# control: pid
# pid_Kp: 1.0
# pid_Ki: 0.5
# pid_Kd: 2.0
# pid_deriv_time: 2.0
# min_speed: 0.2
# max_speed: 1.0

############################################################################
# BED FAN / CHAMBER CIRCULATION (Tương tự Nevermore)
############################################################################

# Quạt tuần hoàn buồng in cắm vào Fan3
[fan_generic bed_fan]
pin: PF8                           # Fan3 trên Manta M8P V2 (VF3 PF8)
kick_start_time: 0.5               # Xung khởi động 0.5s đảm bảo quạt quay

[gcode_macro BED_FAN_ON]
description: Bật quạt tuần hoàn buồng in (0-1.0, mặc định 0.5)
gcode:
    {% set speed = [[params.SPEED|default(0.5)|float, 0.0]|max, 1.0]|min %}
    SET_FAN_SPEED FAN=bed_fan SPEED={speed}
    RESPOND TYPE=echo MSG="Bed fan speed: {(speed * 100)|int}%"

[gcode_macro BED_FAN_OFF]
description: Tắt quạt tuần hoàn buồng in
gcode:
    SET_FAN_SPEED FAN=bed_fan SPEED=0
    RESPOND TYPE=echo MSG="Bed fan tắt"

[delayed_gcode bed_fan_off_delay]
gcode:
    BED_FAN_OFF



############################################################################
# CHAMBER LIGHTING — Neopixel 40 LED
############################################################################

[neopixel chamber_lights]
pin: PD15                  # Chân tín hiệu data của dải LED buồng in (Manta M8P)
chain_count: 40            # 40 LED WS2812B nối tiếp thành một dải
color_order: GRB           # WS2812B dùng thứ tự G-R-B
initial_RED: 0             # Tắt khi khởi động
initial_GREEN: 0
initial_BLUE: 0

[gcode_macro LIGHTS_ON]
description: Bật đèn buồng in (trắng 100%)
gcode:
    SET_LED LED=chamber_lights RED=1 GREEN=1 BLUE=1 TRANSMIT=1

[gcode_macro LIGHTS_OFF]
description: Tắt đèn buồng in
gcode:
    SET_LED LED=chamber_lights RED=0 GREEN=0 BLUE=0 TRANSMIT=1

############################################################################
# CẤU HÌNH LED TOOLHEAD — State Machine
#
# KIẾN TRÚC PHẦN CỨNG:
#   - Mỗi toolhead có [neopixel Tx_LED] với 3 LED WS2812 (T0_LED, T1_LED, ...)
#   - LED 1 (INDEX=1, phía trước): Chỉ thị trạng thái (màu thay đổi theo state)
#   - LED 2 & 3 (INDEX=2&3, phía sau): Chiếu sáng vùng in + hotend
#
# BẢNG TRẠNG THÁI (10 STATE):
# ┌─────────────┬────────────────────────────┬─────────────┬─────────────────────────────────────┐
# │  STATE      │  LED 1 (trạng thái)        │  LED 2 & 3  │  Kích hoạt bởi                      │
# ├─────────────┼────────────────────────────┼─────────────┼─────────────────────────────────────┤
# │  standby    │ Màu nhựa (fallback xanh đêm) │  Xanh đêm  │  Tool parked, không hoạt động       │
# │  ready      │  Trắng ấm (0.50,0.40,0.20) │  Trắng sáng│  Active, máy đang chờ lệnh          │
# │  heating    │  Cam      (1.00,0.40,0.00) │  Trắng sáng│  Đang gia nhiệt (PRINT_START)        │
# │  toolchange │  Vàng     (1.00,0.65,0.00) │  Vàng nhạt │  before_change_gcode (pickup/dropoff)│
# │  leveling   │  Cyan     (0.00,0.80,0.80) │  Trắng sáng│  G28 / QGL / Cartographer probe     │
# │  calibrating│  Tím      (0.50,0.00,0.90) │  Trắng sáng│  CALIBRATE_ALL_OFFSETS (SexBall)    │
# │  cleaning   │  Xanh nhạt(0.20,0.60,1.00) │  Trắng sáng│  CLEAN_NOZZLE đang chạy             │
# │  printing   │  Xanh dương(0.00,0.00,1.00)│  Trắng sáng│  Sau PRINT_START, đang in           │
# │  pause      │  Tím hồng (0.80,0.00,0.80) │  Trắng sáng│  PAUSE                              │
# │  complete   │  Xanh lá  (0.00,1.00,0.00) │  Trắng sáng│  PRINT_END                          │
# │  error      │  Đỏ       (1.00,0.00,0.00) │  Đỏ toàn bộ│  Lỗi hệ thống — tất cả tool đỏ     │
# └─────────────┴────────────────────────────┴─────────────┴─────────────────────────────────────┘
#
# THỨ TỰ ƯU TIÊN (không dùng polling — event-driven):
#   error > toolchange > leveling > calibrating > cleaning > heating > printing > pause > complete > ready > standby
#
# KIẾN TRÚC EVENT-DRIVEN:
#   Mỗi state được set trực tiếp khi event xảy ra — không có delayed_gcode poll.
#   Zero overhead, phản hồi tức thì.
#
#   _SET_LED_STATUS_HEATING    → PRINT_START bước 1 (trước M190)
#   _SET_LED_STATUS_LEVELING   → G32 / G28 / QUAD_GANTRY_LEVEL
#   _SET_LED_STATUS_TOOLCHANGE → before_change_gcode (toolchanger-config.cfg)
#   _SET_LED_STATUS_CALIBRATING→ wrapper CALIBRATE_ALL_OFFSETS
#   _SET_LED_STATUS_CLEANING   → CLEAN_NOZZLE
#   _SET_LED_STATUS_PRINTING   → PRINT_START bước cuối (sau prime line)
#   _SET_LED_STATUS_PAUSE      → hook user_pause_macro trong _CLIENT_VARIABLE
#   _SET_LED_STATUS_COMPLETE   → PRINT_END
#   _SET_LED_STATUS_ERROR      → gọi thủ công khi cần
#   _SET_LED_STATUS_READY      → sau kết thúc mỗi bước (leveling, clean, v.v.)
############################################################################

############################################################################
# MACRO CƠ SỞ: _SET_TOOL_LED T=<n> STATE=<state>
#
# ⚠️  Klipper Jinja không cho phép gán biến trong if/else (scoping issue).
#     Mỗi branch phải gọi SET_LED trực tiếp — không dùng namespace ở đây
#     vì chúng ta gọi lệnh gcode trong branch (không gán biến).
#
# ⚠️  TRANSMIT=0 cho LED 1 & 2, TRANSMIT=1 (implicit) cho LED 3:
#     Klipper gom lại và truyền cả 3 LED trong một SPI frame khi TRANSMIT=1.
#     Đảo ngược sẽ gây flash nhìn thấy được.
############################################################################

[gcode_macro _SET_TOOL_LED]
description: Đặt màu LED toolhead theo trạng thái (Nội bộ)
gcode:
    {% set t     = params.T|int %}
    {% set state = params.STATE|default("standby")|string|lower %}
    {% set led   = "T" + t|string + "_LED" %}

    # Bỏ qua nếu tool chưa cắm (tránh lỗi)
    {% if ("neopixel " + led) in printer %}

        {% if state == "standby" %}
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=3 TRANSMIT=1

        {% elif state == "ready" %}
            SET_LED LED={led} RED=0.50 GREEN=0.40 BLUE=0.20 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "heating" %}
            SET_LED LED={led} RED=1.00 GREEN=0.40 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "leveling" %}
            SET_LED LED={led} RED=0.00 GREEN=0.80 BLUE=0.80 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "cleaning" %}
            SET_LED LED={led} RED=0.20 GREEN=0.60 BLUE=1.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "toolchange" %}
            # Vàng amber — báo hiệu pickup/dropoff đang diễn ra
            # LED 2&3 cũng vàng nhạt (không trắng) — tránh lóa khi cơ khí đang chuyển động
            SET_LED LED={led} RED=1.00 GREEN=0.65 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.20 BLUE=0.00 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.20 BLUE=0.00 INDEX=3 TRANSMIT=1

        {% elif state == "calibrating" %}
            # Tím — đang calibrate XYZ offset với SexBall probe
            SET_LED LED={led} RED=0.50 GREEN=0.00 BLUE=0.90 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "printing" %}
            SET_LED LED={led} RED=0.00 GREEN=0.00 BLUE=1.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "pause" %}
            SET_LED LED={led} RED=0.80 GREEN=0.00 BLUE=0.80 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "complete" %}
            SET_LED LED={led} RED=0.00 GREEN=1.00 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.30 GREEN=0.30 BLUE=0.30 INDEX=3 TRANSMIT=1

        {% elif state == "error" %}
            # Đỏ toàn bộ — cả 3 LED để dễ nhận ra từ xa
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=1.00 GREEN=0.00 BLUE=0.00 INDEX=3 TRANSMIT=1

        {% else %}
            # Fallback: state không hợp lệ → warn và set standby để fail safe
            RESPOND TYPE=error MSG="[LED] State không hợp lệ: '{state}' cho T{t} — đặt về standby"
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=1 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=2 TRANSMIT=0
            SET_LED LED={led} RED=0.05 GREEN=0.05 BLUE=0.25 INDEX=3 TRANSMIT=1

        {% endif %}
    {% else %}
        # LED không tồn tại — không phải lỗi, chỉ log nếu debug cần
        # RESPOND TYPE=echo MSG="[LED] {led} không tìm thấy trong printer — bỏ qua"
    {% endif %}

############################################################################
# TIỆN ÍCH: Quản lý tất cả toolhead cùng lúc
############################################################################

# Đặt tất cả LED toolhead về cùng một state.
# Ví dụ: _ALL_TOOLHEADS_LED_SET STATE=standby
#         _ALL_TOOLHEADS_LED_SET STATE=error
[gcode_macro _ALL_TOOLHEADS_LED_SET]
description: Đặt tất cả LED toolhead cùng một state
gcode:
    {% set state = params.STATE|default("standby")|string|lower %}
    {% for tn in printer.toolchanger.tool_numbers %}
        _SET_TOOL_LED T={tn} STATE={state}
         G4 P10  # Chống nghẽn CAN Bus
    {% endfor %}

# Alias ngắn gọn — đưa tất cả về standby (xanh đêm mờ)
[gcode_macro _ALL_TOOLHEADS_LED_OFF]
description: Đưa tất cả LED toolhead về standby (xanh đêm rất mờ)
gcode:
    _ALL_TOOLHEADS_LED_SET STATE=standby

############################################################################
# QUẢN LÝ ĐỘ TƯƠNG PHẢN: active tool sáng — parked tools mờ
#
# _SYNC_INACTIVE_LEDS: Dim tất cả tool KHÔNG active về standby.
#   - Gọi từ after_change_gcode (toolchanger-config.cfg) sau mỗi toolchange
#   - ACTIVE param: số tool đang active (truyền từ after_change_gcode)
#   - Fallback: đọc printer.toolchanger.tool_number nếu gọi thủ công
#
# _SET_ACTIVE_TOOL_READY: Set tool đang trên shuttle về ready.
#   - Gọi khi boot (LED_INIT) hoặc sau khi clear state
############################################################################

[gcode_macro _SYNC_INACTIVE_LEDS]
description: Dim tất cả tool parked về standby (gọi sau toolchange)
gcode:
    {% set active = params.ACTIVE|default(printer.toolchanger.tool_number|default(-1))|int %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% if tn != active %}
            _SET_TOOL_LED T={tn} STATE=standby
             G4 P10  # Chống nghẽn CAN Bus
        {% endif %}
    {% endfor %}

[gcode_macro _SET_ACTIVE_TOOL_READY]
description: Set tool đang trên shuttle về ready (dùng khi boot hoặc clear state)
gcode:
    {% set active = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active >= 0 %}
        _SET_TOOL_LED T={active} STATE=ready
    {% endif %}

############################################################################
# KHỞI TẠO SAU BOOT — one-shot delayed_gcode
#
# Chạy 2s sau boot để đảm bảo toolchanger đã init xong.
# Không được giảm < 1.5s — printer.toolchanger cần thời gian load.
############################################################################

[delayed_gcode LED_INIT]
initial_duration: 2
gcode:
    # Kiểm tra toolchanger đã init trước khi truy cập tool_numbers
    {% if printer.toolchanger is defined and printer.toolchanger.tool_numbers is defined %}
        _ALL_TOOLHEADS_LED_SET STATE=standby
        _SET_ACTIVE_TOOL_READY
    {% else %}
        # Toolchanger chưa sẵn sàng — thử lại sau 1s
        RESPOND TYPE=echo MSG="[LED_INIT] Toolchanger chưa sẵn sàng — retry sau 1s"
        UPDATE_DELAYED_GCODE ID=LED_INIT DURATION=1
    {% endif %}

############################################################################
# BIẾN TRACK TRẠNG THÁI IN — dùng bởi after_change_gcode
#
# Khắc phục: Dùng biến _PRINT_STATE thay vì printer.print_stats.state
# (do print_stats.state không chính xác trong quá trình đổi tool).
# Giải pháp: dùng biến riêng, set/clear tại các điểm xác định:
#   PRINT_START bước 14 → "printing"
#   PAUSE hook         → "paused"
#   RESUME hook        → "printing"
#   PRINT_END          → "idle"
#   CANCEL_PRINT       → "idle"
############################################################################

[gcode_macro _PRINT_STATE]
description: Biến nội bộ track trạng thái in (printing/paused/idle)
variable_state: "idle"
gcode:
    # Không có gcode — chỉ lưu biến

############################################################################
# WRAPPER MACROS — Gọi tại điểm chuyển state trong các macro khác
#
# Quy tắc: chỉ set LED của tool ĐANG ACTIVE.
# Tool parked: không thay đổi (đã là standby từ after_change_gcode).
############################################################################

[gcode_macro _SET_LED_STATUS_READY]
description: LED trắng ấm — máy sẵn sàng
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=ready
    {% endif %}

[gcode_macro _SET_LED_STATUS_HEATING]
description: LED cam — đang gia nhiệt
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=heating
    {% endif %}

[gcode_macro _SET_LED_STATUS_LEVELING]
description: LED cyan — homing / QGL / Cartographer probe
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=leveling
    {% endif %}

[gcode_macro _SET_LED_STATUS_CALIBRATING]
description: LED tím — calibrate XYZ offset với SexBall probe
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=calibrating
    {% endif %}

[gcode_macro _SET_LED_STATUS_CLEANING]
description: LED xanh nhạt — CLEAN_NOZZLE đang chạy
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=cleaning
    {% endif %}

[gcode_macro _SET_LED_STATUS_TOOLCHANGE]
description: LED vàng — pickup / dropoff đang diễn ra
gcode:
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=toolchange
    {% endif %}

[gcode_macro _SET_LED_STATUS_PRINTING]
description: LED xanh dương — đang in
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    # Bảo vệ: reset tất cả tool không active về standby
    # Fix LED cyan: nếu tool bị stuck ở leveling/heating trong PRINT_START,
    # lệnh này sẽ dọn sạch trước khi in bắt đầu thực sự
    _SYNC_INACTIVE_LEDS

# Delayed sync sau RESUME — đảm bảo LED printing được set SAU khi
# RESUME_BASE và after_change_gcode của KTC đã chạy xong.
# Gọi từ user_resume_macro hook hoặc _FILAMENT_RUNOUT_PAUSE.
[delayed_gcode _RESUME_LED_SYNC]
initial_duration: 0
gcode:
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% if ps == "printing" %}
        {% set t = printer.toolchanger.tool_number|default(-1)|int %}
        {% if t >= 0 %}
            _SET_TOOL_LED T={t} STATE=printing
        {% endif %}
        _SYNC_INACTIVE_LEDS
    {% endif %}
# _LED_RESUME_WRAPPER — Hook cho user_resume_macro khi RESUME
# Chạy TRƯỚC RESUME_BASE (per mainsail.cfg luồng).
# 1. Set _PRINT_STATE về "printing" NGAY LẬP TỨC để after_change_gcode
#    của KTC toolchanger đọc đúng state khi resume di chuyển đầu in.
# 2. Set LED printing ngay lập tức.
# 3. Trigger _RESUME_LED_SYNC sau 1.5s — safety net đảm bảo LED đúng
#    sau khi RESUME_BASE + mọi after_change_gcode đã hoàn tất.
[gcode_macro _LED_RESUME_WRAPPER]
description: Wrapper RESUME hook — set LED printing + schedule delayed sync
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=printing
    {% endif %}
    _SYNC_INACTIVE_LEDS
    # Safety net: chạy lại LED sync sau 1.5s để đảm bảo after_change_gcode đã xong
    UPDATE_DELAYED_GCODE ID=_RESUME_LED_SYNC DURATION=1.5

[gcode_macro _SET_LED_STATUS_PAUSE]
description: LED tím hồng — in đang tạm dừng
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'paused'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=pause
    {% endif %}

[gcode_macro _SET_LED_STATUS_COMPLETE]
description: LED xanh lá — in hoàn tất
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"
    {% set t = printer.toolchanger.tool_number|default(-1)|int %}
    {% if t >= 0 %}
        _SET_TOOL_LED T={t} STATE=complete
    {% endif %}

[gcode_macro _SET_LED_STATUS_ERROR]
description: LED đỏ toàn bộ — lỗi hệ thống (tất cả tool)
gcode:
    _ALL_TOOLHEADS_LED_SET STATE=error

############################################################################
# MAINSAIL CLIENT HOOKS
#
# CHIẾN LƯỢC TÍCH HỢP:
#   mainsail.cfg (readonly) khai báo PAUSE / RESUME / CANCEL_PRINT đầy đủ.
#   Klipper merge section cùng tên → writer sau ghi đè writer trước.
#
#   ⚠️  KHÔNG override PAUSE, RESUME, CANCEL_PRINT ở đây.
#       Lý do: mainsail có logic phức tạp (runout check, can_extrude check,
#       idle_timeout restore, velocity, prompt box) — override sẽ mất hết.
#
#   GIẢI PHÁP: Dùng hook variables trong _CLIENT_VARIABLE:
#     variable_user_pause_macro  → chạy NGAY SAU PAUSE_BASE (set LED pause)
#     variable_user_resume_macro → chạy TRƯỚC _CLIENT_EXTRUDE/RESUME_BASE (set LED printing)
#     variable_user_cancel_macro → chạy TRƯỚC CANCEL_PRINT_BASE (cleanup toolchanger)
#
#   Tất cả hook là single-line macro name — mainsail gọi "{macro_name}"
#   Nếu cần nhiều lệnh → tạo macro wrapper, khai báo tên đó vào variable.
#
# LUỒNG CANCEL_PRINT (mainsail.cfg:63):
#   restore idle_timeout → _TOOLHEAD_PARK_PAUSE_CANCEL → _CLIENT_RETRACT
#   → TURN_OFF_HEATERS → M106 S0 → {user_cancel_macro} ← ĐÂY
#   → SET_GCODE_VARIABLE idle_state=False → CANCEL_PRINT_BASE
#
# LUỒNG PAUSE (mainsail.cfg:93):
#   PAUSE_BASE → {user_pause_macro} ← ĐÂY → _TOOLHEAD_PARK_PAUSE_CANCEL
#
# LUỒNG RESUME (mainsail.cfg:114):
#   idle check → temp restore → {user_resume_macro=_LED_RESUME_WRAPPER} ← ĐÂY
#   → _CLIENT_EXTRUDE → RESUME_BASE
#   → 1.5s → _RESUME_LED_SYNC (safety net, đảm bảo LED đúng sau after_change_gcode)
############################################################################

[gcode_macro _CLIENT_VARIABLE]
# ── Vị trí park khi PAUSE ──────────────────────────────────────────────
# variable_use_custom_pos  : False        # Dùng tọa độ park tự chọn
# variable_custom_park_x   : 170.0        # X park khi pause (giữa bàn)
# variable_custom_park_y   : 10.0         # Y park khi pause (phía trước)
# variable_custom_park_dz  : 5.0          # Nâng Z thêm bao nhiêu mm khi park
# ── Retract/Unretract ──────────────────────────────────────────────────
# variable_retract         : 1.0          # Retract mm khi PAUSE
# variable_cancel_retract  : 5.0          # Retract mm khi CANCEL_PRINT
# variable_speed_retract   : 35.0         # Tốc độ retract mm/s
# variable_unretract       : 1.0          # Unretract mm khi RESUME
# variable_speed_unretract : 35.0         # Tốc độ unretract mm/s
# ── Speed ──────────────────────────────────────────────────────────────
# variable_speed_hop       : 15.0         # Tốc độ nâng Z mm/s
# variable_speed_move      : 100.0        # Tốc độ di chuyển XY mm/s
# ── Idle timeout khi PAUSE ────────────────────────────────────────────
# variable_idle_timeout    : 0            # 0 = không thay đổi idle_timeout
# ── Runout sensor (tên config đầy đủ) ─────────────────────────────────
# variable_runout_sensor   : ""           # VD: "filament_switch_sensor runout"
# ── Hooks (chỉ hỗ trợ single macro name) ──────────────────────────────
variable_user_pause_macro  : "_SET_LED_STATUS_PAUSE"
variable_user_resume_macro : "_LED_RESUME_WRAPPER"
variable_user_cancel_macro : "_CUSTOM_CANCEL_CLEANUP"
gcode:
    # Không có gcode — section này chỉ lưu biến config

############################################################################
# _CUSTOM_CANCEL_CLEANUP — Dọn dẹp toolchanger khi huỷ in
#
# Được gọi bởi mainsail CANCEL_PRINT qua variable_user_cancel_macro hook.
# Thời điểm: SAU _CLIENT_RETRACT + TURN_OFF_HEATERS, TRƯỚC CANCEL_PRINT_BASE.
# → Heater đã tắt → pickup T0 là instant (không chờ nguội).
# → Không cần M104 S0 thêm ở đây vì mainsail đã TURN_OFF_HEATERS.
#
# ⚠️  An toàn: mọi G0/G1 đều có check "xyz" in homed_axes trước.
############################################################################

[gcode_macro _CUSTOM_CANCEL_CLEANUP]
description: Dọn dẹp toolchanger + LED khi huỷ in (hook mainsail CANCEL_PRINT)
gcode:
    # ── Reset flow / speed / pressure ────────────────────────────────────
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    # ── Chỉ thực hiện move nếu XYZ đã được home ─────────────────────────
    {% if "xyz" in printer.toolhead.homed_axes %}
        {% set th = printer.toolhead %}

        # Nâng Z an toàn (min 50mm, không vượt max_z)
        {% set z_now  = th.position.z|float %}
        {% set z_safe = [[z_now + 10.0, 50.0]|max, th.axis_maximum.z|float]|min %}
        G90
        G0 Z{z_safe} F3000

        # Chuyển về T0 nếu đang dùng tool khác
        # Heater đã tắt → KTC pickup instant, không chờ nhiệt
        {% if printer.toolchanger.tool_number|default(-1)|int != 0 %}
            T0
        {% endif %}

        # Park giữa-sau bàn in
        G90
        G0 X{th.axis_maximum.x // 2} Y{th.axis_maximum.y - 2} F9000

    {% else %}
        # Chua home XYZ: khong toolchange, vi dropoff/pickup can toa do Z hop le.
        RESPOND TYPE=echo MSG="[CANCEL] Chua home XYZ - bo qua park/toolchange"
    {% endif %}

    # ── Tắt part fan + disable stepper từng tool ─────────────────────────
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set fan_name = "T" ~ tn|string ~ "_part_fan" %}
        {% if ("fan_generic " ~ fan_name) in printer %}
            SET_FAN_SPEED FAN={fan_name} SPEED=0
        {% endif %}
        {% set ext_name = "extruder" if tn == 0 else "extruder" ~ tn|string %}
        SET_STEPPER_ENABLE STEPPER={ext_name} ENABLE=0
    {% endfor %}

    # ── Dọn dẹp state in ─────────────────────────────────────────────────
    BED_MESH_CLEAR
    CLEAR_PAUSE
    SET_GCODE_OFFSET X=0 Y=0 Z=0

    # ── Reset print state + LED: tất cả về standby ──────────────────────
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"
    _ALL_TOOLHEADS_LED_SET STATE=standby
    M117 In đã huỷ.
