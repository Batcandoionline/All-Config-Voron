  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm camera setup"
    RESPOND TYPE=command MSG="action:prompt_text The reference nozzle must be clean, visibly near image center, and have collision-free room for the 0.5 mm learning pattern. Teaching does not run calibration."
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Teach camera|_TOOL_VISION_UI_RUN ACTION=SETUP_CAMERA|warning"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _TOOL_VISION_UI_CONFIRM_SWITCH]
gcode:
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=command MSG="action:prompt_end"
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% else %}
    {% set tv = printer.tool_vision %}
    {% set current = "Physical switch" if tv.z_method == "switch" else ("Cartographer Touch" if tv.z_method == "cartographer_touch" else "not selected") %}
    RESPOND TYPE=command MSG="action:prompt_begin Confirm Physical switch setup"
    RESPOND TYPE=command MSG="action:prompt_text Current method -> New method: {current} -> Physical switch. This changes the stored default only after teaching succeeds."
    RESPOND TYPE=command MSG="action:prompt_text The reference nozzle must be centered above an open switch and close enough to trigger within 10 mm. Verify pin polarity and the vertical path first."
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_ADVANCED_SETUP|secondary"
    RESPOND TYPE=command MSG="action:prompt_footer_button Teach Physical switch|_TOOL_VISION_UI_RUN ACTION=SETUP_SWITCH|error"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

