############################################################################
# PRINT-MACROS.CFG - Main print macros
# Voron 2.4 StealthChanger - KTC-Easy / OrcaSlicer Multi-Color
#
# PRINT_START receives all parameters from OrcaSlicer:
#   TOOL_TEMP  - first-layer temperature for the first active tool
#   T0_TEMP    - T0 first-layer temperature, only sent if T0 is used
#   T1_TEMP    - T1 first-layer temperature, only sent if T1 is used
#   ...T4_TEMP
#   BED_TEMP   - first-layer bed temperature
#   TOOL       - first printed tool number
#   SOAK       - optional exact heat soak time in seconds before QGL/mesh
#   MATERIAL   - optional material name from slicer, for automatic soak
#   AUTO_SOAK  - optional 1/0 flag; set 0 to skip automatic material soak
#
# OrcaSlicer Start G-code; paste into Machine G-code -> Machine start G-code:
#   PRINT_START TOOL_TEMP={first_layer_temperature[initial_tool]}
#     {if is_extruder_used[0]}T0_TEMP={first_layer_temperature[0]}{endif}
#     {if is_extruder_used[1]}T1_TEMP={first_layer_temperature[1]}{endif}
#     {if is_extruder_used[2]}T2_TEMP={first_layer_temperature[2]}{endif}
#     {if is_extruder_used[3]}T3_TEMP={first_layer_temperature[3]}{endif}
#     {if is_extruder_used[4]}T4_TEMP={first_layer_temperature[4]}{endif}
#     BED_TEMP=[first_layer_bed_temperature] TOOL=[initial_tool] MATERIAL={filament_type[initial_tool]}
#   Manual override examples:
#     SOAK=300       ; force 5 min soak
#     AUTO_SOAK=0    ; skip material auto soak
############################################################################

#####################################################################
# System settings
#####################################################################

[idle_timeout]
timeout: 1800

[exclude_object]

#####################################################################
# Macros
#####################################################################

[gcode_macro G32]
description: Home all axes and level gantry
gcode:
    _SET_LED_STATUS_LEVELING
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    # BUG-01 FIX: QGL wrapper already includes G28 Z; skip the extra G28 Z, about 30 s.
    G0 X180 Y180 Z30 F3600
    _SET_LED_STATUS_READY


# BUG-06 FIX: removed BED_MESH_CALIBRATE wrapper that turned off M140.
# M140 S0 during scan is not needed for Cartographer; the bed heater does not
# disturb eddy-current scan. Turning it off/on cools the bed slightly and shifts offset.
# Cartographer docs do not require turning the bed heater off during scan.
#
# [gcode_macro BED_MESH_CALIBRATE] <- removed this wrapper
# Use _BED_MESH_CALIBRATE directly; rename_existing has been removed.


[gcode_macro QUAD_GANTRY_LEVEL]
description: Quad gantry level (QGL)
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    _SET_LED_STATUS_LEVELING
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        _QUAD_GANTRY_LEVEL horizontal_move_z=10 retry_tolerance=1
    {% endif %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=2
    G28 Z
    RESTORE_GCODE_STATE NAME=STATE_QGL
    _SET_LED_STATUS_READY


[quad_gantry_level]
gantry_corners:
    -10, -10
    353, 350
points:
    20, 0
    20, 280
    330, 280
    330, 0
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0075
max_adjust: 10

[gcode_macro _PRINT_START_SELECT_T0]
description: Select T0 during PRINT_START after full homing
gcode:
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active_tool > 0 %}
        M117 Select T0 after full home
        T0
    {% elif active_tool < 0 %}
        M117 Pick up T0 after full home
        T0
    {% endif %}

############################################################################
# PRINT START - StealthChanger / Cartographer safe-homing flow
#
# Important rule: do not toolchange, dock, or park at the bucket before full G28.
# If the printer is holding T1/T2/T3/T4, the dropoff path needs a valid Z hop;
# therefore PRINT_START must complete full G28 first, raise to a safe Z,
# and only then switch back to T0.
#
# Flow:
#   1. Validate + init + stop crash detection
#   2. Start bed/tool heat async, run full G28 at the start, raise to safe Z
#   3. Heat tools from Tn_TEMP parameters: T0 limited to probe temp until touch-home
#   4. Select T0, park bucket, and clean T0 at 150C while bed continues heating
#   5. Wait bed/soak
#   6. QGL at stable bed temp, then touch home
#   7. Adaptive mesh, then prime all used tools with the initial print tool last
#
# Heat soak notes:
#   - SOAK=<seconds> has highest priority and forces an exact soak time.
#   - Dynamic scaling based on bed pre-heat temperature difference (BED_TEMP - BED_START):
#       - Cold bed (diff > 15C): Full soak time (PLA/TPU: 30s, PETG: 60s, ABS/ASA/PC/NYLON/PA: 90s).
#       - Warm bed (5C < diff <= 15C): Soak time is scaled down to 20% of default (e.g. 18s for ABS).
#       - Hot bed (diff <= 5C): Soak is skipped entirely.
#   - If MATERIAL is not passed, only high bed temperatures get a fallback soak (90s).
############################################################################
[gcode_macro _PRINT_START_HEAT_SOAK]
description: Internal PRINT_START heat soak before Cartographer QGL and mesh
gcode:
    {% set BED_TEMP   = params.BED_TEMP|default(0)|int %}
    {% set BED_START  = params.BED_START|default(printer.heater_bed.temperature)|float %}
    {% set SOAK_TIME  = params.SOAK|default(0)|int %}
    {% set MATERIAL   = params.MATERIAL|default("")|string|upper %}
    {% set AUTO_SOAK  = params.AUTO_SOAK|default(1)|int %}
    # Backward-compatible hint; no fixed 90s soak.
    {% set FULL_BED   = params.FULL_BED|default(0)|int %}
    {% set PLA_SOAK = 30 %}
    {% set PETG_SOAK = 60 %}
    {% set ABS_SOAK = 90 %}
    {% set HOT_BED_SOAK = 90 %}
    {% set material_soak = 0 %}
    {% if "PLA" in MATERIAL or "TPU" in MATERIAL %}
        {% set material_soak = PLA_SOAK %}
    {% elif "PETG" in MATERIAL %}
        {% set material_soak = PETG_SOAK %}
    {% elif "ABS" in MATERIAL or "ASA" in MATERIAL or "PC" in MATERIAL or "NYLON" in MATERIAL or "PA" in MATERIAL %}
        {% set material_soak = ABS_SOAK %}
    {% endif %}
    {% if FULL_BED > 0 and material_soak > 0 and material_soak < PETG_SOAK %}
        {% set material_soak = PETG_SOAK %}
    {% endif %}

    {% if SOAK_TIME > 0 %}
        M117 Heat soak {SOAK_TIME}s
        RESPOND TYPE=echo MSG="Heat soak: manual SOAK={SOAK_TIME}s before QGL/mesh"
        G4 P{SOAK_TIME * 1000}
    {% elif AUTO_SOAK > 0 %}
        {% set temp_diff = BED_TEMP - BED_START %}
        {% if material_soak > 0 %}
            {% if temp_diff > 15 %}
                M117 {MATERIAL} soak {material_soak}s
                RESPOND TYPE=echo MSG="Heat soak: MATERIAL={MATERIAL}, waiting {material_soak}s before QGL/mesh"
                G4 P{material_soak * 1000}
            {% elif temp_diff > 5 %}
                {% set short_soak = (material_soak * 0.2)|int %}
                M117 {MATERIAL} soak {short_soak}s (warm bed)
                RESPOND TYPE=echo MSG="Heat soak: Warm bed detected (diff={temp_diff|round(1)}C), reducing {MATERIAL} soak to {short_soak}s before QGL/mesh"
                G4 P{short_soak * 1000}
            {% else %}
                RESPOND TYPE=echo MSG="Heat soak: Bed already hot (diff={temp_diff|round(1)}C), skipping {MATERIAL} soak before QGL/mesh"
            {% endif %}
        {% elif MATERIAL == "" and BED_TEMP >= 90 %}
            {% if temp_diff > 15 %}
                M117 Hot bed soak {HOT_BED_SOAK}s
                RESPOND TYPE=echo MSG="Heat soak: material not provided, hot bed fallback {HOT_BED_SOAK}s before QGL/mesh"
                G4 P{HOT_BED_SOAK * 1000}
            {% elif temp_diff > 5 %}
                {% set short_soak = (HOT_BED_SOAK * 0.2)|int %}
                M117 Hot bed soak {short_soak}s (warm bed)
                RESPOND TYPE=echo MSG="Heat soak: Warm bed detected (diff={temp_diff|round(1)}C), reducing hot bed fallback soak to {short_soak}s before QGL/mesh"
                G4 P{short_soak * 1000}
            {% else %}
                RESPOND TYPE=echo MSG="Heat soak: Bed already hot (diff={temp_diff|round(1)}C), skipping fallback soak before QGL/mesh"
            {% endif %}
        {% endif %}
    {% endif %}

[gcode_macro PRINT_START]
description: Start print - safe homing first for StealthChanger
gcode:
    {% set TOOL       = params.TOOL|default(0)|int %}
    {% set TOOL_TEMP  = params.TOOL_TEMP|default(0)|int %}
    {% set BED_TEMP   = params.BED_TEMP|default(0)|int %}
    {% set SOAK_TIME  = params.SOAK|default(0)|int %}
    {% set MATERIAL   = params.MATERIAL|default("")|string|upper %}
    {% set AUTO_SOAK  = params.AUTO_SOAK|default(1)|int %}
    {% set FULL_BED   = params.FULL_BED|default(0)|int %}
    {% set PROBE_TEMP = 150 %}
    {% set SAFE_Z     = 10 %}
    {% set START_TEMP_KEY = "T" ~ TOOL ~ "_TEMP" %}
    {% set START_TOOL_TEMP = params[START_TEMP_KEY]|int if START_TEMP_KEY in params else TOOL_TEMP %}
    {% set bed_start = printer.heater_bed.temperature|default(0)|float %}
    {% set first_prime = namespace(t=TOOL, temp=START_TOOL_TEMP, found=0) %}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set tool_temp = params[temp_key]|default(0)|int %}
        {% if tn != TOOL and tool_temp > 0 and first_prime.found == 0 %}
            {% set first_prime.t = tn %}
            {% set first_prime.temp = tool_temp %}
            {% set first_prime.found = 1 %}
        {% endif %}
    {% endfor %}

    {% if TOOL not in printer.toolchanger.tool_numbers %}
        {action_raise_error("PRINT_START invalid TOOL=%d; tool does not exist" % TOOL)}
    {% elif START_TOOL_TEMP <= 0 or BED_TEMP <= 0 %}
        {action_raise_error("PRINT_START missing temperature: T%d=%d BED=%d; check Orca Start G-code" % (TOOL, START_TOOL_TEMP, BED_TEMP))}
    {% else %}

    # A previous print-end cooldown must not turn the circulation fan off during
    # this print. If a dryer cycle is active, transfer heater/fan ownership to
    # PRINT_START without briefly switching the bed off.
    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=0
    {% if printer["gcode_macro _DRYER_STATUS"] is defined and printer["gcode_macro _DRYER_STATUS"].is_drying|int == 1 %}
        _DRYER_HANDOFF_TO_PRINT
    {% endif %}

    # 1) Init only. Never toolchange before Z has been homed.
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    M83
    INITIALIZE_TOOLCHANGER
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'starting'"
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}
    _SET_LED_STATUS_LEVELING

    # 2) Heat asynchronously before G28 to save time.
    # Cartographer is fixed on the shuttle, so G28/QGL does not depend on which tool is mounted.
    # Preheat slicer-used tools only to standby. T0 stays at probe temp until
    # Cartographer touch-home is complete; other tools do not need more than 150 C here.
    _SET_LED_STATUS_HEATING
    M117 Heat async bed/tools
    M140 S{BED_TEMP}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set tool_temp = params[temp_key]|default(0)|int %}
        {% if tn == 0 %}
            M104 T0 S{PROBE_TEMP}
        {% elif tool_temp > 0 %}
            M104 T{tn} S{PROBE_TEMP}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Full G28 with Cartographer shuttle

    # 3) Full home first. If the printer is holding T1/T2/T3/T4,
    # homing/QGL still runs with Cartographer on the shuttle.
    G28
    G90
    G0 Z{SAFE_Z} F3000

    # 4) Only switch back to T0 after full G28 and a safe Z raise.
    # QGL waits until bed heat/soak is stable to avoid Cartographer thermal drift.
    _PRINT_START_SELECT_T0
    G90
    G0 Z{SAFE_Z} F3000
    _CLEAN_NOZZLE_PARK

    # 5) Clean T0 while the bed continues heating. Touch-home waits until
    # bed and T0 temperatures are stable later.
    _SET_LED_STATUS_CLEANING
    M117 Clean T0
    M109 T0 S{PROBE_TEMP}
    CLEAN_NOZZLE TEMP={PROBE_TEMP} WIPES=5

    # 6) Wait for bed + soak after useful prep work is done.
    {% if bed_start < BED_TEMP %}
        M117 Heating bed to {BED_TEMP}C
        M190 S{BED_TEMP}
    {% else %}
        M117 Bed already at temperature
        RESPOND TYPE=echo MSG="Bed {bed_start|int}C >= target {BED_TEMP}C; not waiting for cooldown"
    {% endif %}
    BED_FAN_ON SPEED=0.5

    _PRINT_START_HEAT_SOAK BED_TEMP={BED_TEMP} BED_START={bed_start} SOAK={SOAK_TIME} AUTO_SOAK={AUTO_SOAK} FULL_BED={FULL_BED}{% if MATERIAL != "" %} MATERIAL={MATERIAL}{% endif %}

    # 7) QGL after bed heat/soak so Cartographer leveling is based on stable
    # bed temperature, not the earlier warm-up state.
    _SET_LED_STATUS_LEVELING
    M117 Stable-temp QGL
    QUAD_GANTRY_LEVEL
    G0 Z{SAFE_Z} F3000

    # 8) Touch home must use stable bed temperature and T0/extruder at <=150 C.
    # Wiping nozzle immediately before touch removes any soft plastic blob oozed during QGL/soak,
    # preventing plastic buffer compression and StealthChanger shuttle latch flex.
    _SET_LED_STATUS_CLEANING
    M117 Clean T0 before touch
    M104 T0 S{PROBE_TEMP}
    M109 T0 S{PROBE_TEMP}
    CLEAN_NOZZLE TEMP={PROBE_TEMP} WIPES=5
    _SET_LED_STATUS_LEVELING
    M117 Cartographer touch home
    CARTOGRAPHER_TOUCH_HOME
    G0 Z{SAFE_Z} F3000

    # 9) Touch-home is complete. Keep used tools at standby except the first
    # tool that PRIME_LINES will purge, which heats during adaptive mesh.
    {% for tn in printer.toolchanger.tool_numbers %}
        {% set temp_key = "T" ~ tn|string ~ "_TEMP" %}
        {% set tool_temp = params[temp_key]|default(START_TOOL_TEMP if tn == TOOL else 0)|int %}
        {% set tool_section = "tool T" ~ tn|string %}
        {% set standby_temp = printer[tool_section].params_standby_temp|default(PROBE_TEMP)|int %}
        {% if tool_temp > 0 %}
            {% if tn == first_prime.t %}
                M104 T{tn} S{first_prime.temp}
            {% else %}
                M104 T{tn} S{standby_temp}
            {% endif %}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Bed mesh adaptive
    BED_MESH_CALIBRATE ADAPTIVE=1
    M400

    # 10) Prime every slicer-used tool. The initial tool is purged last, so it
    # remains mounted and ready for the first move from the sliced file.
    _SET_LED_STATUS_HEATING
    M117 Prime tools
    PRIME_LINES INITIAL_TOOL={TOOL} TOOL_TEMP={START_TOOL_TEMP}{% for tn in printer.toolchanger.tool_numbers %}{% set temp_key = "T" ~ tn|string ~ "_TEMP" %}{% if params[temp_key]|default(0)|int > 0 %} T{tn}_TEMP={params[temp_key]|int}{% endif %}{% endfor %}
    {% if printer["gcode_macro START_CRASH_DETECTION"] is defined %}
        START_CRASH_DETECTION
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    _SET_LED_STATUS_PRINTING
    M117 Printing

    {% endif %} ; end validate params
############################################################################
# PRINT END - StealthChanger KTC-Easy
############################################################################

[gcode_macro PRINT_END]
description: End print
gcode:
    # ====== RESET PRINT STATE before anything else ======
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    # ====== STEP 1: SAFE POSITION ======
    {% set th = printer.toolhead %}
    # BUG-D FIX: raise Z by at least 10 mm or to Z=50 to avoid crashes during low-layer toolchanges.
    # Old behavior: z + 2 meant layer 1 at Z=0.28 only raised to 2.28 mm, too low.
    {% set z_safe = [[th.position.z + 10, 50]|max, th.axis_maximum.z]|min %}

    # ====== STEP 2: RESET SPEED AND FLOW ======
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    {% set xyz_homed = "xyz" in th.homed_axes %}
    {% if xyz_homed %}
    # ====== STEP 3: RETRACT + Z LIFT ======
    # BUG-08 FIX: printer.extruder is always T0/extruder; use the active extruder instead.
    # printer[printer.toolhead.extruder] returns the active extruder, T0 or T1.
    # Two-stage technique from the single-tool Voron 2.4 baseline:
    #   Stage 1: -2 mm immediately to reduce hotend pressure.
    #   Stage 2: -8 mm plus 5 mm Z lift at high speed to break the string cleanly, total -10 mm.
    {% set active_extruder = printer.toolhead.extruder|default("")|string %}
    {% if active_extruder != "" and printer[active_extruder].can_extrude %}
        G92 E0
        G91
        G1 E-2.0 F2700              ; Fast 2 mm retract to release pressure
        G1 Z5 E-8.0 F12000          ; Raise Z 5 mm and retract 8 mm at the same time to break the string
        G90
    {% endif %}
    M400
    # BUG-09 FIX: raise Z to z_safe before tool swap.
    # Old behavior: dropoff_gcode only raised Z by 1 mm; at Z=0.28 the dock approach was Z=1.28 and could crash.
    # New behavior: raise to min 50 mm before swapping tools so dock approach is safe.
    G90
    G0 Z{z_safe} F3000

    # ====== STEP 4: DROP ACTIVE TOOL (UNSELECT TOOL) ======
    # Turn off heaters for all tools before dropoff.
    # pickup_gcode contains M109 S{target}; if T0 target > 0 it waits for temperature at the dock.
    # Set target to 0 first so pickup is instant and does not wait.
    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
    {% endfor %}
    # If a tool is active (including T0), drop it off to leave the shuttle empty.
    {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
    {% if active_tool >= 0 %}
        UNSELECT_TOOL
    {% else %}
        RESPOND TYPE=echo MSG="[PRINT_END] Toolchanger has no active tool to drop off"
    {% endif %}

    # ====== STEP 5: PARK AT THE REAR OF THE BED ======
    # After Z raise and tool dropoff, the head is clear of the print; move empty shuttle directly to park.
    # Park 20 mm away from Y-max to ensure enough room for subsequent Y homing.
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 20} F9000
    {% else %}
        RESPOND TYPE=echo MSG="[PRINT_END] XYZ not homed - skipping retract/Z-hop/toolchange/park"
    {% endif %}

    # ====== STEP 6: RESET OFFSET ======
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

    # ====== STEP 7: TURN OFF HEATERS / FAN / STEPPERS ======
    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
        {% set fan_section = "fan_generic T" ~ tn|string ~ "_part_fan" %}
        {% if fan_section in printer.configfile.config %}
            SET_FAN_SPEED FAN=T{tn}_part_fan SPEED=0
        {% endif %}
        {% set ext_name = "extruder" if tn == 0 else "extruder" ~ tn|string %}
        SET_STEPPER_ENABLE STEPPER={ext_name} ENABLE=0
    {% endfor %}
    M140 S0

    # Schedule chamber circulation fan shutdown after 3 minutes, similar to a Nevermore filter.
    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=180

    # ====== STEP 8: CLEANUP ======
    BED_MESH_CLEAR
    CLEAR_PAUSE

    # ====== STEP 9: DONE - all tools are docked, so mark every tool complete ======
    _SET_LED_STATUS_COMPLETE
    M117 Complete

############################################################################
# FILAMENT RUNOUT HANDLER
############################################################################

[gcode_macro _FILAMENT_RUNOUT_HANDLE]
description: Handle filament runout with debounce
gcode:
    {% set T = params.T|int %}
    {% set sensor_name = "filament_sensor_T" ~ T %}

    {% if not printer["filament_switch_sensor " ~ sensor_name].filament_detected %}

        # BUG-07 FIX: use printer.toolchanger.tool_number instead of variable_active.
        # KTC-Easy tracks the active tool through printer.toolchanger.tool_number.
        # variable_active in gcode_macro T0/T1 is not updated automatically by KTC-Easy.
        {% set active_tool_number = printer.toolchanger.tool_number|default(-1)|int %}

        {% set is_printing = printer.print_stats.state|default("")|lower == "printing" %}
        {% if active_tool_number == T and is_printing %}
            RESPOND PREFIX="RUNOUT" MSG="T{T}: confirmed after debounce; pausing print"
            _FILAMENT_RUNOUT_PAUSE T={T}
        {% elif active_tool_number == T %}
            RESPOND PREFIX="WARNING" MSG="T{T}: runout detected outside an active print; not pausing"
        {% else %}
            RESPOND PREFIX="WARNING" MSG="T{T}: runout on parked tool; active tool is T{active_tool_number}; not pausing"
        {% endif %}

    {% else %}
        RESPOND MSG="[T{T}] Noise filtered successfully; sensor is normal"
    {% endif %}


[gcode_macro _FILAMENT_RUNOUT_PAUSE]
description: Pause when filament runs out
gcode:
    {% set T = params.T|int %}
    _SET_LED_STATUS_PAUSE
    PAUSE X=180 Y=10 Z_MIN=30
    M117 T{T}: Filament runout! Load filament and press RESUME

############################################################################
# FILAMENT DRYER MACROS - HEATED BUILD PLATE WITH CHAMBER REGULATION
# Voron 2.4 StealthChanger 5-Tool
#
# Optimized with empirical test data (1000W AC silicone bed, ~15C bed-to-chamber delta).
# Features:
# - Multi-zone dynamic airflow: Fast warm-up boost (65-85%), steady active moisture sweep (40-50%), and overheat guard.
# - Periodic Moisture Flush Pulse: 30-second high airflow pulse every 20 minutes to evacuate trapped humid air.
# - Optional humidity telemetry when an installed sensor extension exposes `.humidity`.
# - Automatic toolhead parking / tool docking (Z>=200mm, X:175, Y:310).
# - Amber/Orange Neopixel visual indication.
############################################################################

[gcode_macro _DRYER_HANDOFF_TO_PRINT]
description: Internal safety handoff that stops the dryer timer without changing print-owned heaters or fans
gcode:
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE=0
    SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=0
    UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0
    RESPOND TYPE=echo MSG="[DRYER] Dryer timer stopped; PRINT_START now owns the bed heater and circulation fan."


[gcode_macro START_DRYER]
description: Start filament drying cycle with material preset or custom parameters
gcode:
    # Params (displayed in Mainsail macro form, matching CLEAN_NOZZLE style)
    {% set material        = params.MATERIAL|default("PETG")|string|upper %}
    {% set custom_bed      = params.BED|default(0.0)|float %}
    {% set custom_chamber  = params.CHAMBER|default(0.0)|float %}
    {% set time_mins       = params.TIME|default(0)|int %}
    {% set time_hours      = params.TIME_HOURS|default(0.0)|float %}
    {% set custom_fan      = params.FAN|default(0.0)|float %}
    {% set humidity_target = params.TARGET_HUMIDITY|default(params.HUMIDITY|default(0.0))|float %}
    {% set park_head       = params.PARK|default(1)|int %}

    # Material presets calibrated for the 1000W AC bed and enclosure airflow.
    {% if "PLA" in material %}
        {% set material_name = "PLA" %}
        {% set preset_bed = 50.0 %}
        {% set preset_chamber = 40.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.40 %}
    {% elif "TPU" in material or "TPE" in material %}
        {% set material_name = "TPU" %}
        {% set preset_bed = 60.0 %}
        {% set preset_chamber = 45.0 %}
        {% set preset_time = 300 %}
        {% set preset_fan = 0.40 %}
    {% elif "PETG" in material or "PET" in material %}
        {% set material_name = "PETG" %}
        {% set preset_bed = 70.0 %}
        {% set preset_chamber = 55.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.50 %}
    {% elif "ABS" in material %}
        {% set material_name = "ABS" %}
        {% set preset_bed = 90.0 %}
        {% set preset_chamber = 65.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.60 %}
    {% elif "ASA" in material %}
        {% set material_name = "ASA" %}
        {% set preset_bed = 90.0 %}
        {% set preset_chamber = 65.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.60 %}
    {% elif "NYLON" in material or "PA" in material %}
        {% set material_name = "NYLON" %}
        {% set preset_bed = 100.0 %}
        {% set preset_chamber = 70.0 %}
        {% set preset_time = 360 %}
        {% set preset_fan = 0.70 %}
    {% elif "PC" in material or "POLYCARBONATE" in material %}
        {% set material_name = "PC" %}
        {% set preset_bed = 105.0 %}
        {% set preset_chamber = 75.0 %}
        {% set preset_time = 360 %}
        {% set preset_fan = 0.70 %}
    {% elif material == "CUSTOM" or material == "" %}
        {% set material_name = "CUSTOM" %}
        {% set preset_bed = 55.0 %}
        {% set preset_chamber = 0.0 %}
        {% set preset_time = 240 %}
        {% set preset_fan = 0.40 %}
    {% else %}
        {action_raise_error("[DRYER] Unsupported MATERIAL='%s'. Use PLA, TPU, PETG, ABS, ASA, NYLON, or PC." % material)}
    {% endif %}

    # Explicit parameters override the selected material preset (if > 0).
    {% set bed_temp = custom_bed if custom_bed > 0.0 else preset_bed %}
    {% set chamber_target = custom_chamber if custom_chamber > 0.0 else preset_chamber %}
    {% set fan_speed = custom_fan if custom_fan > 0.0 else preset_fan %}

    # Calculate total duration in minutes
    {% if time_hours > 0.0 %}
        {% set total_mins = (time_hours * 60)|int %}
    {% elif time_mins > 0 %}
        {% set total_mins = time_mins %}
    {% else %}
        {% set total_mins = preset_time %}
    {% endif %}
    {% set total_seconds = total_mins * 60 %}

    # Reject invalid advanced overrides before homing, moving, or heating.
    {% set bed_max = printer.configfile.settings.heater_bed.max_temp|float %}
    {% if bed_temp <= 0 or bed_temp >= bed_max %}
        {action_raise_error("[DRYER] BED must be above 0C and below the configured heater_bed max_temp of %.1fC." % bed_max)}
    {% elif chamber_target < 0 or chamber_target > 100 %}
        {action_raise_error("[DRYER] CHAMBER must be between 0C and 100C.")}
    {% elif humidity_target < 0 or humidity_target > 100 %}
        {action_raise_error("[DRYER] TARGET_HUMIDITY must be between 0 and 100 percent.")}
    {% elif total_seconds <= 0 %}
        {action_raise_error("[DRYER] TIME or TIME_HOURS must produce a duration greater than zero.")}
    {% elif fan_speed < 0 or fan_speed > 1 %}
        {action_raise_error("[DRYER] FAN must be between 0.0 and 1.0.")}
    {% elif park_head not in [0, 1] %}
        {action_raise_error("[DRYER] PARK must be 0 or 1.")}
    {% endif %}

    # Safety check: printer cannot be starting, printing, paused, or already drying.
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% set print_active = printer.print_stats.state|default("")|lower in ["printing", "paused"] or printer.pause_resume.is_paused or ps in ["starting", "printing", "paused"] %}
    {% set is_drying = printer["gcode_macro _DRYER_STATUS"].is_drying|default(0)|int %}
    {% if print_active %}
        RESPOND TYPE=error MSG="[DRYER] Cannot start filament dryer: Printer is currently printing or paused!"
    {% elif is_drying == 1 %}
        RESPOND TYPE=error MSG="[DRYER] Filament dryer is already running! Use STOP_DRYER to stop it first."
    {% else %}
        # Cancel any delayed shutdown left by PRINT_END before taking ownership
        # of the chamber circulation fan.
        UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=0

        # Safe toolhead parking & tool docking
        {% if park_head == 1 %}
            {% if "xyz" not in printer.toolhead.homed_axes %}
                M117 Homing XYZ before parking
                G28
            {% endif %}
            # Raise above a spool/part on the build plate before KTC traverses
            # toward a dock. KTC's dropoff path only adds a 1 mm local hop.
            G90
            {% set safe_z = [[printer.toolhead.position.z|float, 200.0]|max, printer.toolhead.axis_maximum.z|float]|min %}
            G0 Z{safe_z} F3000
            {% set active_tool = printer.toolchanger.tool_number|default(-1)|int %}
            {% if active_tool >= 0 %}
                M117 Docking active tool T{active_tool}
                UNSELECT_TOOL
            {% endif %}
            G0 X175 Y310 F6000
        {% endif %}

        # Turn off all hotends during filament drying to save power and protect tool docks.
        {% for tn in printer.toolchanger.tool_numbers %}
            M104 S0 T{tn}
        {% endfor %}

        # Set LED indicator - warm amber/orange glow
        _SET_LED_STATUS_DRYING

        # Read chamber temperature and an optional extension-provided humidity field.
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(25.0)|float if has_chamber else 25.0 %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else -1.0 %}

        # Initial under-bed fan speed: boost if chamber is cold
        {% set initial_fan = fan_speed %}
        {% if chamber_target > 0 and cur_chamber < (chamber_target - 2.0) %}
            {% set initial_fan = [fan_speed + 0.25, 0.85]|min %}
            RESPOND TYPE=echo MSG="[DRYER] Chamber cold ({cur_chamber|round(1)}C < target {chamber_target}C). Boosting under-bed fan to {(initial_fan*100)|int}% for fast warm-up."
        {% endif %}

        # Turn on bed heater & under-bed circulation fan
        M140 S{bed_temp}
        {% if initial_fan > 0 %}
            SET_FAN_SPEED FAN=bed_fan SPEED={initial_fan}
        {% else %}
            SET_FAN_SPEED FAN=bed_fan SPEED=0
        {% endif %}

        # Initialize dryer state variables
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE={total_seconds}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=total_time VALUE={total_seconds}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=bed_temp VALUE={bed_temp}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=chamber_target VALUE={chamber_target}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=humidity_target VALUE={humidity_target}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=base_fan_speed VALUE={fan_speed}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=current_fan_speed VALUE={initial_fan}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=material VALUE='"{material_name}"'
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=1

        # Start 10-second timer loop
        UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=1

        {% if has_humidity and cur_humidity >= 0 %}
            M117 Dryer: B:{bed_temp|int}C C:{cur_chamber|int}C H:{cur_humidity|int}%
            RESPOND TYPE=echo MSG="[DRYER] Started {material_name}: Bed={bed_temp}C, Target Ch={chamber_target}C (Cur: {cur_chamber|round(1)}C, Humidity: {cur_humidity}%), Time={total_mins}m, Fan={(initial_fan * 100)|int}%"
        {% else %}
            M117 Dryer: Bed {bed_temp|int}C | Ch {cur_chamber|int}C
            RESPOND TYPE=echo MSG="[DRYER] Started {material_name}: Bed={bed_temp}C, Target Chamber={chamber_target}C (Current: {cur_chamber|round(1)}C), Time={total_mins}m ({(total_mins / 60)|round(1)}h), Fan={(initial_fan * 100)|int}%"
        {% endif %}
    {% endif %}


[gcode_macro STOP_DRYER]
description: Stop filament drying cycle and turn off heaters/fans
gcode:
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% set print_active = printer.print_stats.state|default("")|lower in ["printing", "paused"] or ps in ["starting", "printing", "paused"] %}
    {% if print_active %}
        # Never let a stale/manual dryer stop command turn off print-owned heat.
        _DRYER_HANDOFF_TO_PRINT
        RESPOND TYPE=echo MSG="[DRYER] Print is active; dryer state cleared without changing heaters, fans, or LEDs."
    {% else %}
        # Turn off bed heater and under-bed fan
        M140 S0
        SET_FAN_SPEED FAN=bed_fan SPEED=0

        # Reset dryer state and cancel every pending dryer/fan callback.
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE=0
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=is_drying VALUE=0
        UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION=0
        UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=0

        # Restore LED status
        _SET_LED_STATUS_DRYING_COMPLETE

        M117 Dryer Stopped
        RESPOND TYPE=echo MSG="[DRYER] Stopped. Bed heater and under-bed fan turned off."
    {% endif %}


[gcode_macro DRYER_STATUS]
description: Print current filament dryer and chamber thermal statistics
gcode:
    {% set s = printer["gcode_macro _DRYER_STATUS"] %}
    {% if s.is_drying == 1 %}
        {% set elapsed_sec = s.total_time - s.time_remaining %}
        {% set el_hours = (elapsed_sec // 3600)|int %}
        {% set el_mins = ((elapsed_sec % 3600) // 60)|int %}
        {% set rem_hours = (s.time_remaining // 3600)|int %}
        {% set rem_mins = ((s.time_remaining % 3600) // 60)|int %}
        {% set progress = ((elapsed_sec / s.total_time) * 100)|round(1) %}
        {% set cur_bed = printer.heater_bed.temperature|round(1) %}
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(0)|round(1) if has_chamber else 'N/A' %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else 'N/A' %}
        RESPOND TYPE=echo MSG="=== FILAMENT DRYER STATUS ==="
        RESPOND TYPE=echo MSG="Material: {s.material}"
        RESPOND TYPE=echo MSG="Progress: {el_hours}h {el_mins}m / {(s.total_time / 3600)|round(1)}h ({progress}%) | Remaining: {rem_hours}h {rem_mins}m"
        RESPOND TYPE=echo MSG="Bed Temp: {cur_bed}°C / Target: {s.bed_temp}°C"
        RESPOND TYPE=echo MSG="Chamber Temp: {cur_chamber}°C / Target: {s.chamber_target}°C"
        {% if has_humidity and cur_humidity != 'N/A' %}
            RESPOND TYPE=echo MSG="Chamber Humidity: {cur_humidity}% RH{(' / Target: ' ~ s.humidity_target|string ~ '%') if s.humidity_target > 0 else ''}"
        {% endif %}
        RESPOND TYPE=echo MSG="Under-bed Fan: {(s.current_fan_speed * 100)|int}% (Base: {(s.base_fan_speed * 100)|int}%)"
    {% else %}
        RESPOND TYPE=echo MSG="[DRYER] Filament dryer is currently idle / OFF."
    {% endif %}


[gcode_macro _DRYER_STATUS]
description: Internal periodic status handler for filament dryer
variable_time_remaining: 0
variable_total_time: 0
variable_bed_temp: 0.0
variable_chamber_target: 0.0
variable_humidity_target: 0.0
variable_base_fan_speed: 0.0
variable_current_fan_speed: 0.0
variable_material: "CUSTOM"
variable_is_drying: 0
gcode:
    {% set tick_interval = 10 %}
    {% set ps = printer["gcode_macro _PRINT_STATE"].state|default("idle")|string %}
    {% set print_active = printer.print_stats.state|default("")|lower in ["printing", "paused"] or ps in ["starting", "printing", "paused"] %}
    {% if is_drying == 1 and print_active %}
        # A print has priority over a stale dryer callback. Do not touch heat,
        # fans, or LEDs because PRINT_START/PAUSE owns those resources now.
        _DRYER_HANDOFF_TO_PRINT
        RESPOND TYPE=echo MSG="[DRYER] Active print detected; stale dryer callback canceled safely."
    {% elif is_drying == 1 and time_remaining > 0 %}
        # Read live temperatures and optional extension-provided humidity.
        {% set cur_bed = printer.heater_bed.temperature|float %}
        {% set has_chamber = 'temperature_sensor chamber' in printer %}
        {% set cur_chamber = printer['temperature_sensor chamber'].temperature|default(25.0)|float if has_chamber else 25.0 %}
        {% set has_humidity = has_chamber and (printer['temperature_sensor chamber'].humidity is defined) and (printer['temperature_sensor chamber'].humidity is not none) %}
        {% set cur_humidity = printer['temperature_sensor chamber'].humidity|round(1) if has_humidity else -1.0 %}

        # Elapsed time in seconds
        {% set elapsed_sec = total_time - time_remaining %}

        # Multi-Zone Adaptive Regulation
        {% set target_fan = base_fan_speed %}
        {% set active_bed = bed_temp %}
        {% set mode_label = "Active Drying" %}

        {% if chamber_target > 0 %}
            # Zone 1: Cold Chamber Warm-up Boost (more than 2C below target)
            {% if cur_chamber < (chamber_target - 2.0) %}
                {% set target_fan = [base_fan_speed + 0.25, 0.85]|min %}
                {% set mode_label = "Warmup Boost" %}
            # Zone 2: Optimal Drying Window (target - 2C up to target + 3.5C)
            {% elif cur_chamber >= (chamber_target - 2.0) and cur_chamber <= (chamber_target + 3.5) %}
                # Every 20 minutes, increase airflow for 30 seconds, capped at 70%.
                {% if (elapsed_sec > 900) and (elapsed_sec % 1200 < 30) %}
                    {% set target_fan = [base_fan_speed + 0.25, 0.70]|min %}
                    {% set mode_label = "Moisture Flush" %}
                {% else %}
                    {% set target_fan = base_fan_speed %}
                    {% set mode_label = "Active Drying" %}
                {% endif %}
            # Zone 3: Warm Chamber (target + 3.5C to target + 6.0C)
            {% elif cur_chamber > (chamber_target + 3.5) and cur_chamber <= (chamber_target + 6.0) %}
                {% set target_fan = [base_fan_speed - 0.10, 0.30]|max %}
                {% set mode_label = "Gentle Sweep" %}
            # Zone 4: Overheat Safety (exceeds target + 6.0C)
            {% elif cur_chamber > (chamber_target + 6.0) %}
                {% set target_fan = [base_fan_speed - 0.20, 0.20]|max %}
                {% set active_bed = [bed_temp - 4.0, 45.0]|max %}
                {% set mode_label = "Overheat Guard" %}
            {% endif %}
        {% endif %}

        # Keep bed target alive (prevents idle_timeout) and update fan speed
        M140 S{active_bed}
        # Always send the target, including zero, so a previous non-zero fan
        # command cannot remain active after the requested speed drops to zero.
        SET_FAN_SPEED FAN=bed_fan SPEED={target_fan}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=current_fan_speed VALUE={target_fan}

        # Decrement remaining time
        {% set next_time = [time_remaining - tick_interval, 0]|max %}
        SET_GCODE_VARIABLE MACRO=_DRYER_STATUS VARIABLE=time_remaining VALUE={next_time}

        {% set hours = (next_time // 3600)|int %}
        {% set mins = ((next_time % 3600) // 60)|int %}

        # Real-time LCD / Mainsail status display (shows time, bed, chamber, and humidity if available)
        {% if has_humidity and cur_humidity >= 0 %}
            M117 Dry {hours}h{mins}m | B:{cur_bed|int}C C:{cur_chamber|int}C H:{cur_humidity|int}%
        {% else %}
            M117 Dry {hours}h{mins}m | B:{cur_bed|int}C C:{cur_chamber|int}C
        {% endif %}

        # Periodic telemetry log every 10 minutes (600 seconds)
        {% if (next_time % 600 == 0) and (next_time > 0) %}
            {% set el_h = ((total_time - next_time) // 3600)|int %}
            {% set el_m = (((total_time - next_time) % 3600) // 60)|int %}
            {% set prog_pct = (((total_time - next_time) / total_time) * 100)|int %}
            {% if has_humidity and cur_humidity >= 0 %}
                RESPOND TYPE=echo MSG="[DRYER] {el_h}h {el_m}m / {(total_time / 3600)|round(1)}h ({prog_pct}%) | Bed: {cur_bed|round(1)}/{bed_temp}C | Chamber: {cur_chamber|round(1)}C (RH: {cur_humidity}%){('/' ~ chamber_target|string ~ 'C') if chamber_target > 0 else ''} | Fan: {(target_fan * 100)|int}% [{mode_label}]"
            {% else %}
                RESPOND TYPE=echo MSG="[DRYER] {el_h}h {el_m}m / {(total_time / 3600)|round(1)}h ({prog_pct}%) | Bed: {cur_bed|round(1)}/{bed_temp}C | Chamber: {cur_chamber|round(1)}{('/' ~ chamber_target|string ~ 'C') if chamber_target > 0 else 'C'} | Fan: {(target_fan * 100)|int}% [{mode_label}]"
            {% endif %}
        {% endif %}

        # Auto-complete when target humidity is reached (optional smart stopping with 1-hour minimum soak)
        {% set elapsed = total_time - next_time %}
        {% if humidity_target > 0 and has_humidity and cur_humidity <= humidity_target and elapsed >= 3600 %}
            RESPOND TYPE=echo MSG="[DRYER] Target humidity reached ({cur_humidity}% <= {humidity_target}%)! Filament is completely dry."
            STOP_DRYER
            M117 Drying Complete (Target RH)
        {% else %}
            # Schedule next tick or finish
            {% if next_time > 0 %}
                UPDATE_DELAYED_GCODE ID=DRYER_TIMER DURATION={tick_interval}
            {% else %}
                STOP_DRYER
                RESPOND TYPE=echo MSG="[DRYER] Drying cycle complete! Bed cooling down."
                M117 Drying Complete
            {% endif %}
        {% endif %}
    {% elif is_drying == 1 %}
        STOP_DRYER
    {% endif %}


[delayed_gcode DRYER_TIMER]
gcode:
    _DRYER_STATUS


############################################################################
# FILAMENT DRYER
# Run from Mainsail macro panel (with inline parameter drawer) or console:
#   START_DRYER MATERIAL=PLA
#   START_DRYER MATERIAL=PETG TIME=180 BED=70
############################################################################


############################################################################
# TEST_SPEED - Andrew Ellis Print Tuning Guide (Adapted for StealthChanger)
# Procedure: Home -> ReadPositionFromMCU -> MovesToolhead@Vel&Accel -> Home -> ReadPositionFromMCU
# Test runs at low Z height (Z=bound+10=30mm), safely underneath high tool docks (Z>=200mm).
############################################################################

[gcode_macro TEST_SPEED]
description: Test max velocity and acceleration parameters without skipping steps
gcode:
    # Speed & Accel parameters
    {% set speed            = params.SPEED|default(printer.configfile.settings.printer.max_velocity)|int %}
    {% set accel            = params.ACCEL|default(printer.configfile.settings.printer.max_accel)|int %}
    {% set iterations       = params.ITERATIONS|default(5)|int %}
    {% set min_cruise_ratio = params.MIN_CRUISE_RATIO|default(0.5)|float %}
    {% set bound            = params.BOUND|default(20)|int %}
    {% set smallpatternsize = params.SMALLPATTERNSIZE|default(20)|int %}

    # Temporarily disable tool crash detection to prevent false-positive trigger under high G-force
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    # Large pattern boundary limits
    {% set x_min = [printer.toolhead.axis_minimum.x, 0]|max + bound %}
    {% set x_max = printer.toolhead.axis_maximum.x - bound %}
    {% set y_min = [printer.toolhead.axis_minimum.y, 0]|max + bound %}
    {% set y_max = printer.toolhead.axis_maximum.y - bound %}

    # Small pattern at center
    {% set x_center = (printer.toolhead.axis_minimum.x|float + printer.toolhead.axis_maximum.x|float) / 2 %}
    {% set y_center = (printer.toolhead.axis_minimum.y|float + printer.toolhead.axis_maximum.y|float) / 2 %}
    {% set x_center_min = x_center - (smallpatternsize / 2) %}
    {% set x_center_max = x_center + (smallpatternsize / 2) %}
    {% set y_center_min = y_center - (smallpatternsize / 2) %}
    {% set y_center_max = y_center + (smallpatternsize / 2) %}

    SAVE_GCODE_STATE NAME=TEST_SPEED
    { action_respond_info("TEST_SPEED: Starting %d iterations at Speed=%d mm/s, Accel=%d mm/s^2" % (iterations, speed, accel)) }

    # Home and get reference position for comparison later
    M400
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if printer.quad_gantry_level and not printer.quad_gantry_level.applied %}
        QUAD_GANTRY_LEVEL
    {% endif %}

    # Read reference microsteps at physical endstops
    G90
    G1 X{printer.toolhead.axis_maximum.x - 50} Y{printer.toolhead.axis_maximum.y - 50} F1800
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
    G4 P1000
    GET_POSITION

    # Go to starting position (low Z height Z=bound+10=30mm, safely underneath high tool docks)
    G0 X{x_min} Y{y_min} Z{bound + 10} F{speed * 60}

    # Set new test velocity and acceleration limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} MINIMUM_CRUISE_RATIO={min_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={speed} ACCEL={accel} ACCEL_TO_DECEL={accel / 2}
    {% endif %}

    {% for i in range(iterations) %}
        # Large pattern diagonals
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}

        # Large pattern box
        G0 X{x_min} Y{y_min} F{speed * 60}
        G0 X{x_min} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_max} F{speed * 60}
        G0 X{x_max} Y{y_min} F{speed * 60}

        # Small pattern diagonals
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60}
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}

        # Small pattern box
        G0 X{x_center_min} Y{y_center_min} F{speed * 60}
        G0 X{x_center_min} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_max} F{speed * 60}
        G0 X{x_center_max} Y{y_center_min} F{speed * 60}
    {% endfor %}

    # Restore default limits
    {% if printer.configfile.settings.printer.minimum_cruise_ratio is defined %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} MINIMUM_CRUISE_RATIO={printer.configfile.settings.printer.minimum_cruise_ratio}
    {% else %}
        SET_VELOCITY_LIMIT VELOCITY={printer.configfile.settings.printer.max_velocity} ACCEL={printer.configfile.settings.printer.max_accel} ACCEL_TO_DECEL={printer.configfile.settings.printer.max_accel / 2}
    {% endif %}

    # Re-home and get post-test position for microstep comparison
    M400
    G28 X Y
    G0 X{printer.toolhead.axis_maximum.x - 1} Y{printer.toolhead.axis_maximum.y - 1} F1800
    G4 P1000
    GET_POSITION

    RESTORE_GCODE_STATE NAME=TEST_SPEED
