# TOOL-CRASH.CFG - Five-tool presence crash detection and safe pause routing
# Source: https://github.com/cekim-git/tool_crash
#
# Include this file after KTC-Easy has loaded every [tool] section. The plugin
# reads each tool's detection_pin; Cartographer and the PF2 calibration switch
# are not crash inputs.

[tool_crash]
# Poll the active-tool state every 0.5 s and require two consecutive failures.
watchdog_interval: 0.5
watchdog_threshold: 2

# Ignore sensor edges produced by probing/homing and suppress an immediate
# post-home report for one second. Upstream treats "all" only as an alias for
# "probing", so it is not a global disable switch.
ignore_events: probing
home_timeblock: 1.0

# Upstream invokes a Klipper shutdown when crash_gcode is absent. This machine
# instead queues a resumable PAUSE handler. The plugin disables its own detector
# before calling this handler, so the same crash is not reported repeatedly.
crash_gcode:
  _TOOL_CRASH_SAFE_PAUSE
crash_mintime: 0.1

# KTC's readonly macros call START/STOP_CRASH_DETECTION. These user-owned
# definitions are loaded later and route those names to the installed detector.
# The legacy tool_probe_endstop branch remains as a compatibility fallback.
[gcode_macro STOP_CRASH_DETECTION]
description: Disable the installed tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    STOP_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    STOP_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

[gcode_macro START_CRASH_DETECTION]
description: Enable the installed tool-presence crash detector
gcode:
  {% if "tool_crash" in printer.configfile.config %}
    START_TOOL_CRASH_DETECTION
  {% elif printer["tool_probe_endstop"] is defined %}
    START_TOOL_PROBE_CRASH_DETECTION
  {% endif %}

# Safe crash response:
# - PAUSE_BASE preserves a resumable print state.
# - Only the normal Mainsail E retract is allowed.
# - No X/Y/Z park move is requested because a detached or skewed tool may make
#   any recovery travel unsafe.
# - Outside an active print, the handler reports the event without shutdown or
#   motion.
#
# The custom handler is queued behind motion already accepted by Klipper. This
# delay is an upstream limitation documented by tool_crash and cannot be removed
# while retaining a G-code pause response.
[gcode_macro _TOOL_CRASH_SAFE_PAUSE]
description: Pause after a tool crash without moving X, Y, or Z
gcode:
  {% set is_paused = printer.pause_resume.is_paused|default(false) %}
  {% set is_printing = printer.print_stats.state|default("")|lower == "printing" %}

  {% if is_paused %}
    M117 Tool crash - inspect printer
    RESPOND TYPE=error MSG="Tool crash detected while already paused; inspect and secure the tool before RESUME or CANCEL_PRINT"
  {% elif is_printing %}
    {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
    {% set idle_timeout = client.idle_timeout|default(0)|int %}
    {% set extruder = printer.toolhead.extruder|default("")|string %}
    {% set target = printer[extruder].target|float if extruder else 0.0 %}
    {% set restore = true if extruder else false %}

    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': target}}"
    {% if idle_timeout > 0 %}
      SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
      SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    {% endif %}

    PAUSE_BASE
    {% if printer["gcode_macro _SET_LED_STATUS_PAUSE"] is defined %}
      _SET_LED_STATUS_PAUSE
    {% endif %}
    {% if printer["gcode_macro _CLIENT_RETRACT"] is defined %}
      _CLIENT_RETRACT
    {% endif %}
    M117 Tool crash - inspect printer
    RESPOND TYPE=error MSG="Tool crash detected; print paused without XYZ parking. Inspect and secure the tool before RESUME or CANCEL_PRINT"
  {% else %}
    M117 Tool crash detected
    RESPOND TYPE=error MSG="Tool crash detected outside an active print; no shutdown or motion was requested"
  {% endif %}
