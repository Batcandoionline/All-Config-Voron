# ========================================================================
# Tool Crash Detection Plugin - Tool Detection Pin Configuration
# Repository: https://github.com/cekim-git/tool_crash (Alpha)
# Use when Cartographer is the main probe and each tool has a detection_pin.
# ========================================================================

# -------------------------------------------------------------------------
# [tool_crash] Plugin Configuration
# -------------------------------------------------------------------------
# IMPORTANT: include this file after all toolchanger sections are included.
# configs ([tool], [tool_probe], toolchanger-include.cfg, v.v.)

[tool_crash]
# === Watchdog: periodically check tool state ===
watchdog_interval: 0.5           # Check every 0.5 s; faster: 0.2-0.3 s, slower: 1.0 s
watchdog_threshold: 2            # Require 2 consecutive failures before reporting to avoid false positives

# === Probing: ignore events while homing ===
# For TAP probe setups: during G28 Z, TAP force sensing may trigger automatically.
# With this Cartographer + tool detection pin setup, probing events are still ignored defensively.
ignore_events: probing            # Upstream "all" is only an alias for "probing"; it does not disable detection

# === Homing timeblock: suppress reports just after homing ===
home_timeblock: 1.0               # 1 second after homing: do not report an immediate crash

# === Safe pause instead of Klipper shutdown ===
# Without crash_gcode, tool_crash calls printer.invoke_shutdown() and the print
# cannot be resumed. This handler pauses virtual_sdcard, retracts only E, and
# deliberately makes no XYZ park move because the tool may be detached or skewed.
# Custom gcode still waits behind already queued motion; this is an upstream
# limitation. A short callback delay reduces extra latency but cannot remove it.
crash_gcode:
    _TOOL_CRASH_SAFE_PAUSE
crash_mintime: 0.1

# -------------------------------------------------------------------------
# Sensor notes:
# -------------------
# - Tool presence sensors: detection_pin in each [tool] section.
#   => tool_crash automatically parses this from the [tool] sections.
# - Cartographer V3 is the main probe and is not used by tool_crash.
#   It is skipped because it is the probe_in_use for bed mesh, not tool detection.

# -------------------------------------------------------------------------
# PRINT_START / PRINT_END Integration
# -------------------------------------------
# Current integration:
# - PRINT_START calls STOP_CRASH_DETECTION before homing, cleaning, QGL, mesh,
#   and prime lines to avoid false positives during intentional tool/probe moves.
# - PRINT_START calls START_CRASH_DETECTION only after PRIME_LINES is complete
#   and the initial printing tool is mounted.
# - dropoff_gcode calls STOP_CRASH_DETECTION while docking.
# - after_change_gcode calls START_CRASH_DETECTION again after a toolchange only
#   when _PRINT_STATE == "printing".
# - PRINT_END and cancel cleanup call STOP_CRASH_DETECTION before parking/tool swaps.
#
# Macro START_CRASH_DETECTION from crash_detection_override.cfg calls
#   START_TOOL_CRASH_DETECTION instead of START_TOOL_PROBE_CRASH_DETECTION.


# -------------------------------------------------------------------------
# Safe crash pause handler
# ------------------------
# Mirrors the state-saving parts of the Mainsail PAUSE macro, but intentionally
# skips _TOOLHEAD_PARK_PAUSE_CANCEL so no X/Y/Z recovery move can worsen damage.
# _CLIENT_RETRACT is retained because RESUME performs the matching unretract.

[gcode_macro _TOOL_CRASH_SAFE_PAUSE]
description: Pause a print after tool crash detection without moving XYZ
gcode:
    {% set is_paused = printer.pause_resume.is_paused|default(false) %}
    {% set is_printing = printer.print_stats.state|default("")|lower == "printing" %}

    {% if is_paused %}
        M117 Tool crash - inspect printer
        RESPOND TYPE=error MSG="Tool crash detected while already paused; inspect and secure the tool before RESUME or CANCEL_PRINT"
    {% elif is_printing %}
        {% set client = printer["gcode_macro _CLIENT_VARIABLE"]|default({}) %}
        {% set idle_timeout = client.idle_timeout|default(0)|int %}
        {% set extruder = printer.toolhead.extruder|default("")|string %}
        {% set target = printer[extruder].target|float if extruder else 0.0 %}
        {% set restore = true if extruder else false %}

        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=last_extruder_temp VALUE="{{'restore': restore, 'temp': target}}"
        {% if idle_timeout > 0 %}
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=restore_idle_timeout VALUE={printer.configfile.settings.idle_timeout.timeout}
            SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
        {% endif %}

        PAUSE_BASE
        {% if printer["gcode_macro _SET_LED_STATUS_PAUSE"] is defined %}
            _SET_LED_STATUS_PAUSE
        {% endif %}
        {% if printer["gcode_macro _CLIENT_RETRACT"] is defined %}
            _CLIENT_RETRACT
        {% endif %}
        M117 Tool crash - inspect printer
        RESPOND TYPE=error MSG="Tool crash detected; print paused without XYZ parking. Inspect and secure the tool before RESUME or CANCEL_PRINT"
    {% else %}
        M117 Tool crash detected
        RESPOND TYPE=error MSG="Tool crash detected outside an active virtual_sdcard print; no shutdown or motion was requested"
    {% endif %}
