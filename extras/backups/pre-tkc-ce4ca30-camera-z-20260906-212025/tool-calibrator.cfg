# Tool-Klipper-Calibration machine integration.
# Source is managed at ~/Tool-Klipper-Calibration and remains unmodified.

[tool_calibrator]
service_url: http://127.0.0.1:8090
camera_stream_url: http://127.0.0.1:8080/snapshot.jpg
offsets_config_path: /home/voron/printer_data/config/Printer-Setup/tool_offsets.cfg
reference_tool: 0
tools: 0,1,2,3,4
safe_z: 40
camera_target_z: 40

# Values follow the upstream documented mm/min convention. The TKC navigator
# normalizes values above 500 to Klipper's internal mm/s units.
travel_speed: 1800
approach_speed: 600
z_speed: 600
wiggle_on_failure: false

# Keep Z actions unavailable until the Cartographer sequence has a supervised
# hardware validation on this machine.
z_backend: cartographer
touch_home_gcode: _TKC_Z_DISABLED
touch_probe_gcode: _TKC_Z_DISABLED

nozzle_led_macro_off: _TKC_NOZZLE_LED_OFF
nozzle_led_macro_on: _TKC_NOZZLE_LED_KEEP_OFF
before_pickup_gcode:
    _TKC_SAFE_TOOLCHANGE

[gcode_macro _TKC_Z_DISABLED]
gcode:
    {action_raise_error("TKC Z calibration is disabled pending physical validation")}

[gcode_macro _TKC_SAFE_TOOLCHANGE]
gcode:
    {% if printer.toolhead.homed_axes != 'xyz' %}
        {action_raise_error("Home XYZ before TKC tool changes")}
    {% endif %}
    {% if printer.toolchanger.status != 'ready' or printer.toolchanger.tool_number|int != printer.toolchanger.detected_tool_number|int %}
        {action_raise_error("Active and detected tool must match")}
    {% endif %}
    G90
    {% if printer.toolhead.position.z|float < 40.0 %}
        {% set clearance = printer.gcode_move.gcode_position.z|float + 40.0 - printer.toolhead.position.z|float %}
        G0 Z{clearance} F600
    {% endif %}
    M400

[gcode_macro _TKC_NOZZLE_LED_OFF]
gcode:
    {% for tool in printer.toolchanger.tool_numbers %}
        SET_LED LED=T{tool}_LED RED=0 GREEN=0 BLUE=0 TRANSMIT=1
    {% endfor %}

[gcode_macro _TKC_NOZZLE_LED_KEEP_OFF]
gcode:
    # Keep tool LEDs off between frames; use the camera illumination.
