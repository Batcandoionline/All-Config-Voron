[gcode_macro _TOOL_VISION_UI_RESULTS]
gcode:
  {% set tv = printer.tool_vision %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% else %}
    {% set mode = tv.last_result_mode|default('', true)|upper %}
    {% set method = "Physical switch" if tv.last_result_method == "switch" else ("Cartographer Touch" if tv.last_result_method == "cartographer_touch" else "Camera XY") %}
    {% set verdict = "Completed - thresholds not configured" if tv.last_session_classification == "COMPLETED_NO_THRESHOLDS" else ("Valid" if tv.last_session_status == "PASS" else ("Needs review" if tv.last_session_status == "WARNING" else "Invalid")) %}
    {% set batch = tv.last_batch %}
    RESPOND TYPE=command MSG="action:prompt_begin Latest result"
    {% if tv.last_result_mode %}
      RESPOND TYPE=command MSG="action:prompt_text {verdict} | NOT APPLIED"
      {% if batch.valid_count is defined %}
        RESPOND TYPE=command MSG="action:prompt_text {mode} | {method} | Batch {batch.valid_count}/{batch.attempted_count}/{batch.requested_attempts} valid/attempted/planned | Candidate {batch.candidate_statistic}"
      {% elif batch.requested_attempts is defined %}
        RESPOND TYPE=command MSG="action:prompt_text {mode} | {method} | Stopped {batch.attempt_index}/{batch.requested_attempts}; no aggregate candidate"
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_text {mode} | {method} | Single measurement"
      {% endif %}
      {% if tv.last_result_primary_error|default('', true) %}
        RESPOND TYPE=command MSG="action:prompt_text Error: {tv.last_result_primary_error}"
      {% else %}
        RESPOND TYPE=command MSG="action:prompt_text T{tv.reference_tool} drift XY {(('%.4f'|format(tv.reference_xy_drift)) ~ ' mm') if tv.reference_xy_drift is not none else 'n/a'} | Z {(('%+.4f'|format(tv.reference_z_drift)) ~ ' mm') if tv.reference_z_drift is not none else 'n/a'} | Compare {tv.last_production_comparison.assessment|default('NOT_EVALUATED')}"
      {% endif %}
      {% if tv.result_tool_numbers|length > 0 %}
        RESPOND TYPE=command MSG="action:prompt_button Tool values|_TOOL_VISION_UI_RESULTS_TOOLS|primary"
      {% endif %}
      {% if batch.statistics is defined %}
        RESPOND TYPE=command MSG="action:prompt_button Batch statistics|_TOOL_VISION_UI_RESULTS_BATCH|info"
      {% endif %}
      RESPOND TYPE=command MSG="action:prompt_button Diagnostics|_TOOL_VISION_UI_RESULTS_DIAGNOSTICS|info"
      RESPOND TYPE=command MSG="action:prompt_button Console history|_TOOL_VISION_UI_RUN ACTION=HISTORY|info"
    {% else %}
      RESPOND TYPE=command MSG="action:prompt_text No persisted ToolVision result is available."
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_button Close|_TOOL_VISION_UI_CLOSE|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _TOOL_VISION_UI_RESULTS_TOOLS]
gcode:
  {% set tv = printer.tool_vision %}
  {% set mode = tv.last_result_mode|default('', true)|upper %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% elif tv.result_tool_numbers|length == 0 %}
    RESPOND TYPE=echo MSG="No tool measurement completed. Open Diagnostics or Console history."
  {% elif mode == "Z" %}
    _TOOL_VISION_UI_RESULTS_TOOLS_AXIS AXIS=Z
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Tool values"
    RESPOND TYPE=command MSG="action:prompt_text Select one axis. Candidate values remain NOT APPLIED."
    RESPOND TYPE=command MSG="action:prompt_button X values|_TOOL_VISION_UI_RESULTS_TOOLS_AXIS AXIS=X|primary"
    RESPOND TYPE=command MSG="action:prompt_button Y values|_TOOL_VISION_UI_RESULTS_TOOLS_AXIS AXIS=Y|primary"
    {% if mode == "XYZ" %}
      RESPOND TYPE=command MSG="action:prompt_button Z values|_TOOL_VISION_UI_RESULTS_TOOLS_AXIS AXIS=Z|primary"
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_RESULTS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

[gcode_macro _TOOL_VISION_UI_RESULTS_TOOLS_AXIS]
gcode:
  {% set tv = printer.tool_vision %}
  {% set axis = params.AXIS|default('')|upper %}
  {% set mode = tv.last_result_mode|default('', true)|upper %}
  {% set comparison = tv.last_production_comparison %}
  {% set print_state = printer.print_stats.state|default('unknown')|lower %}
  RESPOND TYPE=command MSG="action:prompt_end"
  {% if print_state in ["printing", "paused"] %}
    RESPOND TYPE=echo MSG="ToolVision panel is unavailable while the printer is {print_state}."
  {% elif tv.busy %}
    RESPOND TYPE=echo MSG="ToolVision is busy; wait for the current operation or use Close."
  {% elif axis not in ["X", "Y", "Z"] or tv.result_tool_numbers|length == 0 or (mode == "Z" and axis != "Z") or (mode == "XY" and axis == "Z") %}
    RESPOND TYPE=echo MSG="No matching tool-axis values are available."
  {% else %}
    RESPOND TYPE=command MSG="action:prompt_begin Tool {axis} values"
    RESPOND TYPE=command MSG="action:prompt_text M=measured | U=used | D=difference | NOT APPLIED"
    {% for number in tv.result_tool_numbers %}
      {% set result = tv.results.get(number|string) %}
      {% set compare = comparison.tools.get(number|string, {}) if comparison.tools is defined else {} %}
      {% set current = compare.get('configured_relative', {}) %}
      {% set difference = compare.get('difference', {}) %}
      {% if result %}
        {% set measured_value = result.get(axis|lower) %}
        {% set current_value = current.get(axis|lower) %}
        {% set difference_value = difference.get(axis|lower) %}
        RESPOND TYPE=command MSG="action:prompt_text T{number} | M {('%+.4f'|format(measured_value)) if measured_value is not none else '-'} | U {('%+.4f'|format(current_value)) if current_value is not none else '-'} | D {('%+.4f'|format(difference_value)) if difference_value is not none else '-'} | {compare.assessment|default('NOT_EVALUATED')}"
      {% endif %}
    {% endfor %}
    RESPOND TYPE=command MSG="action:prompt_footer_button Back|_TOOL_VISION_UI_RESULTS_TOOLS|info"
    RESPOND TYPE=command MSG="action:prompt_show"
  {% endif %}

