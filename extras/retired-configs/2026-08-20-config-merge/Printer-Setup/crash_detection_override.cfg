# CRASH-DETECTION-OVERRIDE.CFG - Override START/STOP_CRASH_DETECTION
# Include after readonly-configs/crash-detection.cfg so Klipper merges the same-named sections.
# Supports both the newer tool_crash plugin and the older tool_probe_endstop fallback.

# -------------------------------------------------------------------------
# Override: STOP_CRASH_DETECTION
# -------------------------------------------------------------------------
# Original macro from readonly-configs/crash-detection.cfg:
# [gcode_macro STOP_CRASH_DETECTION]
#     gcode:
#         {% if printer["tool_probe_endstop"] is defined %}
#             STOP_TOOL_PROBE_CRASH_DETECTION
#         {% endif %}
#
# Patch: add support for the tool_crash plugin (Cartographer + SexBall).
# -------------------------------------------------------------------------

[gcode_macro STOP_CRASH_DETECTION]
gcode:
    # Tool Crash Detection Plugin (cekim-git/tool_crash)
    # Use this when the [tool_crash] section is included in printer.cfg.
    {% if "tool_crash" in printer.configfile.config %}
        STOP_TOOL_CRASH_DETECTION
    # Fallback: old tool_probe_endstop configuration from the [tool_probe] section.
    {% elif printer["tool_probe_endstop"] is defined  %}
        STOP_TOOL_PROBE_CRASH_DETECTION
    {% endif %}


# -------------------------------------------------------------------------
# Override: START_CRASH_DETECTION
# -------------------------------------------------------------------------
# Original macro from readonly-configs/crash-detection.cfg:
# [gcode_macro START_CRASH_DETECTION]
#     gcode:
#         {% if printer["tool_probe_endstop"] is defined %}
#             START_TOOL_PROBE_CRASH_DETECTION
#         {% endif %}
#
# Patch: add support for the tool_crash plugin (Cartographer + SexBall).
# -------------------------------------------------------------------------

[gcode_macro START_CRASH_DETECTION]
gcode:
    # Tool Crash Detection Plugin (cekim-git/tool_crash)
    # Use this when the [tool_crash] section is included in printer.cfg.
    {% if "tool_crash" in printer.configfile.config %}
        START_TOOL_CRASH_DETECTION
    # Fallback: old tool_probe_endstop configuration from the [tool_probe] section.
    {% elif printer["tool_probe_endstop"] is defined  %}
        START_TOOL_PROBE_CRASH_DETECTION
    {% endif %}


# -------------------------------------------------------------------------
# Notes:
# -------------------------------------------------------------------------
# 1. This file is included after readonly-configs/crash-detection.cfg.
#    The [gcode_macro ...] sections override the original definitions through Klipper/Jinja merge behavior.
#
# 2. Automatic selection logic:
#    - If [tool_crash] is configured, call START_TOOL_CRASH_DETECTION.
#      Use the newer plugin.
#    - Otherwise, fall back to START_TOOL_PROBE_CRASH_DETECTION, the older path.
#
# 3. Runtime behavior:
#    - PRINT_START calls START_CRASH_DETECTION, this macro.
#    - The macro selects and sends the correct command.
#    - The plugin or the older configuration handles the result.
#
# 4. To completely disable crash detection:
#    - Remove every START_CRASH_DETECTION call, or keep the detector stopped with
#      STOP_CRASH_DETECTION. Removing [tool_crash] alone enables the legacy
#      tool_probe_endstop fallback when that object exists.
#    - Do not use "ignore_events: all" for this purpose. In upstream tool_crash,
#      "all" is only an alias for ignoring probing events.
