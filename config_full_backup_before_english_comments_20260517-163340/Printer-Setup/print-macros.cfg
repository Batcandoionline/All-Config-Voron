############################################################################
# PRINT-MACROS.CFG — Macro in ấn chính
# Voron 2.4 StealthChanger — KTC-Easy / OrcaSlicer Multi-Color
#
# PRINT_START nhận đủ tham số từ OrcaSlicer:
#   TOOL_TEMP  — nhiệt độ lớp đầu của tool đang in
#   T0_TEMP    — nhiệt độ lớp đầu T0 (chỉ gửi nếu T0 được dùng)
#   T1_TEMP    — nhiệt độ lớp đầu T1 (chỉ gửi nếu T1 được dùng)
#   ...T4_TEMP
#   BED_TEMP   — nhiệt độ bàn lớp đầu
#   TOOL       — tool số đầu tiên được in
#
# OrcaSlicer Start G-code (dán vào Machine G-code → Machine start G-code):
#   PRINT_START TOOL_TEMP={first_layer_temperature[initial_tool]}
#     {if is_extruder_used[0]}T0_TEMP={first_layer_temperature[0]}{endif}
#     {if is_extruder_used[1]}T1_TEMP={first_layer_temperature[1]}{endif}
#     {if is_extruder_used[2]}T2_TEMP={first_layer_temperature[2]}{endif}
#     {if is_extruder_used[3]}T3_TEMP={first_layer_temperature[3]}{endif}
#     {if is_extruder_used[4]}T4_TEMP={first_layer_temperature[4]}{endif}
#     BED_TEMP=[first_layer_bed_temperature] TOOL=[initial_tool]
############################################################################

#####################################################################
# Cài đặt hệ thống
#####################################################################

[idle_timeout]
timeout: 1800

[exclude_object]

#####################################################################
# Macros
#####################################################################

[gcode_macro G32]
description: Home toàn bộ + cân bằng gantry
gcode:
    _SET_LED_STATUS_LEVELING
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    # BUG-01 FIX: QGL wrapper đã bao gồm G28 Z — bỏ G28 Z thừa (~30s)
    G0 X180 Y180 Z30 F3600
    _SET_LED_STATUS_READY


# BUG-06 FIX: Bỏ wrapper BED_MESH_CALIBRATE tắt M140
# M140 S0 trong khi scan KHÔNG cần thiết cho Cartographer — bàn nhiệt không gây
# nhiễu cho eddy current scan. Việc tắt/bật gây bàn nguội nhẹ → offset sai.
# Cartographer docs không yêu cầu tắt bed heater khi scan.
#
# [gcode_macro BED_MESH_CALIBRATE]  ← ĐÃ XÓA WRAPPER NÀY
# Dùng _BED_MESH_CALIBRATE trực tiếp (rename_existing đã bỏ)


[gcode_macro QUAD_GANTRY_LEVEL]
description: Cân bằng gantry (QGL)
rename_existing: _QUAD_GANTRY_LEVEL
gcode:
    _SET_LED_STATUS_LEVELING
    SAVE_GCODE_STATE NAME=STATE_QGL
    BED_MESH_CLEAR
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
    {% if not printer.quad_gantry_level.applied %}
        _QUAD_GANTRY_LEVEL horizontal_move_z=10 retry_tolerance=1
    {% endif %}
    _QUAD_GANTRY_LEVEL horizontal_move_z=2
    G28 Z
    RESTORE_GCODE_STATE NAME=STATE_QGL
    _SET_LED_STATUS_READY


[quad_gantry_level]
gantry_corners:
    -10, -10
    353, 350
points:
    20, 0
    20, 280
    330, 280
    330, 0
speed: 200
horizontal_move_z: 10
retries: 5
retry_tolerance: 0.0050
max_adjust: 10

############################################################################
# PRIME LINE
############################################################################

[gcode_macro _PRIME_LINE]
description: Vẽ đường prime
gcode:
    {% set prime_length   = 150 %}
    {% set prime_x_start  = 100 %}
    {% set prime_y        = 0 %}
    {% set prime_z        = 0.28 %}
    {% set prime_extrude  = 25 %}
    {% set prime_feedrate = 1200 %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=error MSG="_PRIME_LINE can XYZ homed; bo qua prime de tranh move sai toa do"
    {% else %}
    G90
    G92 E0
    G0 Z5 F3000
    G0 X{prime_x_start} Y{prime_y} F6000
    G0 Z{prime_z} F300
    G1 X{prime_x_start + prime_length} Y{prime_y} E{prime_extrude} F{prime_feedrate}
    G92 E0
    G1 Z2.0 F3000
    G1 X{prime_x_start + prime_length + 10} F6000
    # BUG-C FIX: Retract nhẹ sau prime line — tránh dây nhựa khi travel đến điểm in
    G1 E-0.5 F3600
    G92 E0
    {% endif %}


[gcode_macro _PRINT_START_SELECT_T0]
description: Select T0 during PRINT_START after full homing
gcode:
    {% if printer.toolchanger.tool_number|default(-1)|int != 0 %}
        M117 Gan T0 sau full home
        T0
    {% endif %}

############################################################################
# PRINT START - StealthChanger / Cartographer safe-homing flow
#
# Rule quan trong: khong toolchange, khong dock, khong park bucket truoc full G28.
# Neu may dang giu T1/T2/T3/T4, dropoff path can Z hop le; vi vay PRINT_START
# phai G28 day du truoc, nang Z an toan, sau do moi chuyen ve T0.
#
# Flow:
#   1. Validate + init + stop crash detection
#   2. Start bed/T0/first-tool heat async, full G28 ngay dau macro, raise Z safe
#   3. Only heat tools that are needed: T0 for clean/touch-home, first print tool for print
#   4. Select T0 after full home, park bucket, wait bed/soak
#   5. Clean T0 at 150C, re-home Z, QGL
#   6. Touch home with T0 at <=150C
#   7. Switch to first print tool, adaptive mesh while heating, wait temp, prime
############################################################################
[gcode_macro PRINT_START]
description: Bat dau in - safe homing first cho StealthChanger
gcode:
    {% set TOOL       = params.TOOL|default(0)|int %}
    {% set TOOL_TEMP  = params.TOOL_TEMP|default(0)|int %}
    {% set BED_TEMP   = params.BED_TEMP|default(0)|int %}
    {% set SOAK_TIME  = params.SOAK|default(0)|int %}
    {% set PROBE_TEMP = 150 %}
    {% set SAFE_Z     = 10 %}
    {% set START_TEMP_KEY = "T" ~ TOOL ~ "_TEMP" %}
    {% set START_TOOL_TEMP = params[START_TEMP_KEY]|int if START_TEMP_KEY in params else TOOL_TEMP %}
    {% set FIRST_TOOL_STANDBY = [START_TOOL_TEMP, 170]|min %}
    {% set bed_start = printer.heater_bed.temperature|default(0)|float %}

    {% if TOOL not in printer.toolchanger.tool_numbers %}
        RESPOND TYPE=error MSG="PRINT_START sai TOOL={TOOL}; tool khong ton tai"
        CANCEL_PRINT
    {% elif START_TOOL_TEMP <= 0 or BED_TEMP <= 0 %}
        RESPOND TYPE=error MSG="PRINT_START thieu nhiet: T{TOOL}={START_TOOL_TEMP} BED={BED_TEMP}; kiem tra Orca Start G-code"
        CANCEL_PRINT
    {% else %}

    # 1) Init only. Tuyet doi khong toolchange khi Z chua homed.
    CLEAR_PAUSE
    BED_MESH_CLEAR
    SET_GCODE_OFFSET X=0 Y=0 Z=0
    G90
    M83
    INITIALIZE_TOOLCHANGER
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'starting'"
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}
    _SET_LED_STATUS_LEVELING

    # 2) Heat async truoc G28 de tiet kiem thoi gian.
    # Cartographer gan co dinh tren shuttle, nen G28/QGL khong phu thuoc dang cam tool nao.
    # Chi preheat T0 va tool in dau tien; cac tool khac tat de tranh lang phi/ooze.
    _SET_LED_STATUS_HEATING
    M117 Heat async bed/T0/T{TOOL}
    M140 S{BED_TEMP}
    {% for tn in printer.toolchanger.tool_numbers %}
        {% if tn == 0 %}
            M104 T0 S{PROBE_TEMP}
        {% elif tn == TOOL %}
            M104 T{tn} S{FIRST_TOOL_STANDBY}
        {% else %}
            M104 T{tn} S0
        {% endif %}
    {% endfor %}

    _SET_LED_STATUS_LEVELING
    M117 Full G28 bang Cartographer shuttle

    # 3) Full home first. Neu may dang giu T1/T2/T3/T4, van homing/QGL bang Cartographer tren shuttle.
    G28
    G90
    G0 Z{SAFE_Z} F3000

    # 4) Sau full G28 moi duoc doi ve T0 de clean/touch-home.
    _PRINT_START_SELECT_T0
    G90
    G0 Z{SAFE_Z} F3000
    _CLEAN_NOZZLE_PARK

    # 5) Wait bed + soak. Nozzle da o bucket, T0 standby 150C.
    {% if bed_start < BED_TEMP %}
        M117 Nung ban {BED_TEMP}C
        M190 S{BED_TEMP}
    {% else %}
        M117 Ban da du nhiet
        RESPOND TYPE=echo MSG="Bed {bed_start|int}C >= target {BED_TEMP}C; khong cho nguoi"
    {% endif %}
    BED_FAN_ON SPEED=0.5

    {% if SOAK_TIME > 0 %}
        M117 Ngam nhiet {SOAK_TIME}s
        G4 P{SOAK_TIME * 1000}
    {% elif BED_TEMP >= 90 and (BED_TEMP - bed_start) > 10 %}
        M117 Ngam nhiet 100s
        G4 P100000
    {% endif %}

    # Tool in dau tien len full temp trong luc clean/QGL/touch-home de giam thoi gian cho cuoi macro.
    {% if TOOL != 0 %}
        M104 T{TOOL} S{START_TOOL_TEMP}
    {% endif %}

    # 6) Clean T0 tai 150C, sau do re-home Z bang nozzle sach.
    _SET_LED_STATUS_CLEANING
    M117 Clean T0
    M109 T0 S{PROBE_TEMP}
    CLEAN_NOZZLE TEMP={PROBE_TEMP} WIPES=5

    _SET_LED_STATUS_LEVELING
    M117 Re-home Z sau clean
    G28 Z
    G0 Z{SAFE_Z} F3000

    # 7) QGL bang Cartographer tren shuttle; tool in dau tien dang len nhiet song song neu khong phai T0.
    {% if TOOL != 0 %}
        M104 T{TOOL} S{START_TOOL_TEMP}
    {% endif %}

    M117 QGL
    QUAD_GANTRY_LEVEL
    G0 Z{SAFE_Z} F3000

    # 8) Touch home bat buoc bang T0/extruder <=150C.
    M104 T0 S{PROBE_TEMP}
    M109 T0 S{PROBE_TEMP}
    M117 Cartographer touch home
    CARTOGRAPHER_TOUCH_HOME
    G0 Z{SAFE_Z} F3000

    # 9) Switch sang tool in. Neu T0 khong nam trong job thi tat, neu co thi giu 150C de tranh ooze.
    {% if TOOL != 0 %}
        {% if "T0_TEMP" in params and params.T0_TEMP|int > 0 %}
            M104 T0 S{PROBE_TEMP}
        {% else %}
            M104 T0 S0
        {% endif %}
        M117 Gan T{TOOL}
        T{TOOL}
    {% endif %}

    # 10) Heat active print tool explicitly, mesh trong luc nozzle dang len nhiet.
    _SET_LED_STATUS_HEATING
    M117 Nung T{TOOL} {START_TOOL_TEMP}C
    M104 T{TOOL} S{START_TOOL_TEMP}

    _SET_LED_STATUS_LEVELING
    M117 Bed mesh adaptive
    BED_MESH_CALIBRATE ADAPTIVE=1
    M400

    _SET_LED_STATUS_HEATING
    M117 Cho T{TOOL} {START_TOOL_TEMP}C
    M109 T{TOOL} S{START_TOOL_TEMP}
    G4 P5000

    # 11) Prime va bat dau in.
    M117 Prime line
    _PRIME_LINE
    {% if printer["gcode_macro START_CRASH_DETECTION"] is defined %}
        START_CRASH_DETECTION
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'printing'"
    _SET_LED_STATUS_PRINTING
    M117 Dang in

    {% endif %} ; end validate params
############################################################################
# PRINT END — StealthChanger KTC-Easy
############################################################################

[gcode_macro PRINT_END]
description: Kết thúc in
gcode:
    # ====== RESET PRINT STATE (trước mọi thứ) ======
    SET_GCODE_VARIABLE MACRO=_PRINT_STATE VARIABLE=state VALUE="'idle'"

    # ====== BƯỚC 1: VỊ TRÍ AN TOÀN ======
    {% set th = printer.toolhead %}
    # BUG-D FIX: Nâng Z tối thiểu 10mm hoặc đến Z=50 — tránh crash khi toolchange ở lớp thấp
    # Cũ: z + 2 → khi in layer 1 (Z=0.28) → z_safe chỉ = 2.28mm → quá thấp
    {% set z_safe = [[th.position.z + 10, 50]|max, th.axis_maximum.z]|min %}

    # ====== BƯỚC 2: RESET TỐC ĐỘ VÀ FLOW ======
    M220 S100
    M221 S100
    SET_PRESSURE_ADVANCE ADVANCE=0
    {% if printer["gcode_macro STOP_CRASH_DETECTION"] is defined %}
        STOP_CRASH_DETECTION
    {% endif %}

    {% set xyz_homed = "xyz" in th.homed_axes %}
    {% if xyz_homed %}
    # ====== BƯỚC 3: RETRACT + NÂNG Z ======
    # BUG-08 FIX: printer.extruder luôn = T0 (extruder) — phải dùng active extruder
    # printer[printer.toolhead.extruder] trả về extruder đang active (T0 hoặc T1)
    # Kỹ thuật 2 giai đoạn từ bản Voron 2.4 đơn đầu:
    #   Giai đoạn 1: -2mm ngay lập tức → giảm áp suất buồng nung
    #   Giai đoạn 2: -8mm kết hợp nâng Z 5mm ở tốc độ cao → ngắt sợi nhựa sạch (tổng -10mm)
    {% if printer[printer.toolhead.extruder].can_extrude %}
        G92 E0
        G91
        G1 E-2.0 F2700              ; Rút nhanh 2mm — giải áp suất
        G1 Z5 E-8.0 F12000          ; Nâng Z 5mm + rút 8mm đồng thời — ngắt sợi nhựa
        G90
    {% endif %}
    M400
    # BUG-09 FIX: Nâng Z lên z_safe TRƯỚC toolswap
    # Cũ: Z chỉ nâng 1mm trong dropoff_gcode → nếu Z=0.28 (layer 1) → dock ở Z=1.28 → crash
    # Mới: Z lên min 50mm trước khi swap → dock approach an toàn
    G90
    G0 Z{z_safe} F3000

    # ====== BƯỚC 4: CHUYỂN VỀ T0 ======
    # Tắt heater TẤT CẢ tool (kể cả T0) TRƯỚC toolswap
    # → pickup_gcode có M109 S{target} — nếu T0 target > 0 thì chờ nhiệt khi dock
    # → Set 0 trước → pickup instant, không chờ
    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
    {% endfor %}
    # Chỉ gọi T0 nếu chưa active — tránh "already selected" từ KTC
    {% if printer.toolchanger.tool_number|default(-1)|int != 0 %}
        T0
    {% endif %}

    # ====== BƯỚC 5: PARK — PHÍA SAU BÀN IN ======
    # Sau Z raise + T0 swap, head đã xa bản in → đi thẳng park, bỏ jog trung gian
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F9000
    {% else %}
        RESPOND TYPE=echo MSG="[PRINT_END] Chua home XYZ - bo qua retract/Z-hop/toolchange/park"
    {% endif %}

    # ====== BƯỚC 6: RESET OFFSET ======
    SET_GCODE_OFFSET X=0.0 Y=0.0 Z=0.0

    # ====== BƯỚC 7: TẮT HEATER / FAN / STEPPER ======
    {% for tn in printer.toolchanger.tool_numbers %}
        M104 S0 T{tn}
        {% set fan_section = "fan_generic T" ~ tn|string ~ "_part_fan" %}
        {% if fan_section in printer.configfile.config %}
            SET_FAN_SPEED FAN=T{tn}_part_fan SPEED=0
        {% endif %}
        {% set ext_name = "extruder" if tn == 0 else "extruder" ~ tn|string %}
        SET_STEPPER_ENABLE STEPPER={ext_name} ENABLE=0
    {% endfor %}
    M140 S0

    # Hẹn giờ tắt quạt tuần hoàn sau 3 phút (tương tự Nevermore filter)
    UPDATE_DELAYED_GCODE ID=bed_fan_off_delay DURATION=180

    # ====== BƯỚC 8: DỌN DẸP ======
    BED_MESH_CLEAR
    CLEAR_PAUSE

    # ====== BƯỚC 9: DONE — xanh lá sau cùng (gọi AFTER T0 để không bị clobber) ======
    _SET_LED_STATUS_COMPLETE
    M117 Hoàn tất

############################################################################
# FILAMENT RUNOUT HANDLER
############################################################################

[gcode_macro _FILAMENT_RUNOUT_HANDLE]
description: Xử lý hết nhựa (debounce)
gcode:
    {% set T = params.T|int %}
    {% set sensor_name = "filament_sensor_T" ~ T %}

    {% if not printer["filament_switch_sensor " ~ sensor_name].filament_detected %}

        # BUG-07 FIX: Dùng printer.toolchanger.tool_number thay vì variable_active
        # KTC-Easy track active tool qua printer.toolchanger.tool_number
        # variable_active trong gcode_macro T0/T1 không được KTC-Easy cập nhật tự động
        {% set active_tool_number = printer.toolchanger.tool_number|default(-1)|int %}

        {% if active_tool_number == T %}
            RESPOND PREFIX="⚠️ HẾT NHỰA" MSG="T{T}: xác nhận sau debounce — đang dừng in"
            _FILAMENT_RUNOUT_PAUSE T={T}
        {% else %}
            RESPOND PREFIX="⚠️ CẢNH BÁO" MSG="T{T}: hết nhựa (parked) — tool đang in là T{active_tool_number} — không dừng"
        {% endif %}

    {% else %}
        RESPOND MSG="[T{T}] Nhiễu lọc thành công — cảm biến bình thường"
    {% endif %}


[gcode_macro _FILAMENT_RUNOUT_PAUSE]
description: Tạm dừng khi hết nhựa
gcode:
    {% set T = params.T|int %}
    _SET_LED_STATUS_PAUSE
    PAUSE X=180 Y=10 Z_MIN=30
    M117 T{T}: Hết nhựa! Nạp nhựa rồi nhấn RESUME
