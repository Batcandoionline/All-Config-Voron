# Tool Vision - Unified XYZ Tool Alignment for Klipper
# Combines kTAMV (XY camera) + Axiscope (Z switch) into one module
#
# All speeds use mm/s (converted to mm/min internally for G1 F)
#
# GCode Commands:
#   TV_CALIBRATE_ALL           Full XYZ calibration for all tools
#   TV_CALIBRATE_ALL_Z         Z-only calibration for all tools
#   TV_CALIBRATE_ALL_XY        XY-only calibration for all tools
#   TV_CALIB_CAMERA            Calibrate camera mm/pixel ratio
#   TV_FIND_NOZZLE_CENTER      Center nozzle in camera view
#   TV_SET_ORIGIN              Save position as reference
#   TV_GET_OFFSET              Get XY offset from reference
#   TV_SIMPLE_NOZZLE_POSITION  Check if nozzle visible
#   TV_SEND_SERVER_CFG         Send camera config to server
#   TV_START_PREVIEW           Start camera preview
#   TV_STOP_PREVIEW            Stop camera preview
#   TV_MOVE_TO_ZSWITCH         Move above Z switch
#   TV_PROBE_ZSWITCH           Probe Z switch
#   TV_SET_ENDSTOP_POSITION    Set endstop position
#   TV_SAVE_TOOL_OFFSET        Save offsets to config file
#   TV_SAVE_MULTIPLE_TOOL_OFFSETS  Save multiple offsets

[tool_vision]
# ─── Z Switch (from Axiscope) ─────────────────────────────────
pin: ^PF2                    # Endstop pin (BTT Manta M8P V2.0)
zswitch_x_pos: 68.0          # X position of Z switch (mm)
zswitch_y_pos: -10.0          # Y position of Z switch (mm)
zswitch_z_pos: 7.0            # Z position above switch (mm)
lift_z: 1.0                   # Z lift before XY moves (mm)
travel_speed: 100             # XY travel speed to Z switch (mm/s)
z_move_speed: 10              # Z probing speed (mm/s)
samples: 10                   # Number of Z probe samples

# ─── Camera (from kTAMV) ──────────────────────────────────────
nozzle_cam_url: http://127.0.0.1:8080/?action=stream
server_url: http://127.0.0.1:8085
move_speed: 50                # Camera calibration move speed (mm/s)
detection_tolerance: 0        # Nozzle detection pixel tolerance
send_frame_to_cloud: false    # Upload frames to cloud (optional)

# ─── Config File for Saving Offsets ───────────────────────────
config_file_path: ~/printer_data/config/tool_vision.offsets

# ─── Custom GCode Templates (optional) ────────────────────────
# Uncomment and edit to run custom macros during calibration.
# Available context: tool, toolchanger, tool_vision
#
# start_gcode:
#     G28
#     G0 Z20 F600
#
# before_pickup_gcode:
#     G0 Z30 F600
#
# after_pickup_gcode:
#     G4 P500
#
# finish_gcode:
#     G0 X0 Y0 F3000
#     M118 Tool Vision: Calibration done!
