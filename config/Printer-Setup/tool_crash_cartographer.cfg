# ========================================================================
# Tool Crash Detection Plugin - Tool Detection Pin Configuration
# Repository: https://github.com/cekim-git/tool_crash (Alpha)
# Use when Cartographer is the main probe and each tool has a detection_pin.
# ========================================================================

# -------------------------------------------------------------------------
# [tool_crash] Plugin Configuration
# -------------------------------------------------------------------------
# IMPORTANT: include this file after all toolchanger sections are included.
# configs ([tool], [tool_probe], toolchanger-include.cfg, v.v.)

[tool_crash]
# === Watchdog: periodically check tool state ===
watchdog_interval: 0.5           # Check every 0.5 s; faster: 0.2-0.3 s, slower: 1.0 s
watchdog_threshold: 2            # Require 2 consecutive failures before reporting to avoid false positives

# === Probing: ignore events while homing ===
# For TAP probe setups: during G28 Z, TAP force sensing may trigger automatically.
# With this Cartographer + tool detection pin setup, probing events are still ignored defensively.
ignore_events: probing            # Change to "all" or "" if false positives occur

# === Homing timeblock: suppress reports just after homing ===
home_timeblock: 1.0               # 1 second after homing: do not report an immediate crash

# === Custom crash gcode (note) ===
# crash_gcode: CUSTOM_CRASH_HANDLER    # Not used by default; M112 shuts the machine down immediately
# WARNING: custom crash_gcode delays reaction from a few ms to a few seconds,
#          depending on the g-code queue. Removing this line gives the fastest reaction.

# === Optional crash mintime values; default is 0.5 s ===
# crash_mintime: 0.5

# -------------------------------------------------------------------------
# Sensor notes:
# -------------------
# - Tool presence sensors: detection_pin in each [tool] section.
#   => tool_crash automatically parses this from the [tool] sections.
# - Cartographer V3 is the main probe and is not used by tool_crash.
#   It is skipped because it is the probe_in_use for bed mesh, not tool detection.

# -------------------------------------------------------------------------
# PRINT_START / PRINT_END Integration
# -------------------------------------------
# Current integration:
# - PRINT_START calls STOP_CRASH_DETECTION before homing, cleaning, QGL, mesh,
#   and prime lines to avoid false positives during intentional tool/probe moves.
# - PRINT_START calls START_CRASH_DETECTION only after PRIME_LINES is complete
#   and the initial printing tool is mounted.
# - dropoff_gcode calls STOP_CRASH_DETECTION while docking.
# - after_change_gcode calls START_CRASH_DETECTION again after a toolchange only
#   when _PRINT_STATE == "printing".
# - PRINT_END and cancel cleanup call STOP_CRASH_DETECTION before parking/tool swaps.
#
# Macro START_CRASH_DETECTION from crash_detection_override.cfg calls
#   START_TOOL_CRASH_DETECTION instead of START_TOOL_PROBE_CRASH_DETECTION.
